name: Verify CSharp source handoff for Potato

on:
  push:
    branches:
      - entrega/potato-bunny-original-com-csharp-20261018
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copy-into-clean-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout CSharp handoff source
        uses: actions/checkout@v4
        with:
          path: bunny-csharp-entrega
          ref: entrega/potato-bunny-original-com-csharp-20261018
          persist-credentials: false

      - name: Checkout exact original Bunny Loader base
        uses: actions/checkout@v4
        with:
          repository: JonataOliveiraa/Bunny-Loader
          ref: a370a664aa3b808c87e4e4f570b27504d20df723
          path: bunny-original
          persist-credentials: false

      - name: Check importer Python syntax
        run: python3 -m py_compile bunny-csharp-entrega/tools/importar_fonte_csharp_no_bunny.py

      - name: Check public Mono patch and ARM64 build script
        shell: bash
        run: |
          set -euo pipefail
          bash -n bunny-csharp-entrega/tools/mono/build_patched_mono_arm64.sh
          bash -n bunny-csharp-entrega/tools/mono/install_patched_mono_arm64.sh
          (cd bunny-csharp-entrega/tools/mono/prebuilt/arm64-v8a && sha256sum -c libmonosgen-2.0.so.sha256)
          python3 -m py_compile bunny-csharp-entrega/tools/mono/patch_mono_android_signals.py
          python3 -m py_compile bunny-csharp-entrega/tests/test_mono_android_signals_patch.py
          grep -q 'mono_threads_suspend_search_alternative_signal' bunny-csharp-entrega/tools/mono/patch_mono_android_signals.py
          grep -q 'mono_bunny_android_signal_policy_v1' bunny-csharp-entrega/tools/mono/patch_mono_android_signals.py
          grep -q 'v8.0.23' bunny-csharp-entrega/tools/mono/build_patched_mono_arm64.sh
          test -s bunny-csharp-entrega/tools/mono/README.md

      - name: Confirm delivery label and latest editable ExampleMod source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          root = Path("bunny-csharp-entrega")
          assert 'versionName = "1.0"' in (root / "app/build.gradle.kts").read_text()
          mod = json.loads((root / "samples/ExampleModCSharp/Playable/manifest.json").read_text())
          assert mod["version"] == "0.1.56", mod
          assert (root / "samples/ExampleModCSharp/Playable/content/Content/Items/Weapons/Ranged/ExampleGun.cs").is_file()
          assert (root / "samples/ExampleModCSharp/Playable/content/Assets/Sounds/Items/Guns/ExampleGun.ogg").is_file()
          assert (root / "experiments/csharp/BunnyCsSdk/BunnySoundStyle.cs").is_file()
          assert (root / "app/src/main/cpp/experiments/csharp/NativeUseSounds.h").is_file()
          for name in ("README.md","POTATO-C-SHARP-HANDOFF.md","IMPORTAR-NO-GITHUB-DO-POTATO.md"):
              text=(root/name).read_text().lower()
              assert "tlpro" not in text and "terlauncher" not in text, name
          print("LATEST_BUNNY_EXAMPLEMOD_DELIVERY=PASS")
          PY

      - name: Prepare upstream feature branch
        run: git -C bunny-original switch -c feature/csharp-import-verification

      - name: Verify dry-run is really read-only
        shell: bash
        run: |
          set -euo pipefail
          python3 bunny-csharp-entrega/tools/importar_fonte_csharp_no_bunny.py --destino bunny-original
          test -z "$(git -C bunny-original status --porcelain)"

      - name: Import complete tracked source
        shell: bash
        run: |
          set -euo pipefail
          python3 bunny-csharp-entrega/tools/importar_fonte_csharp_no_bunny.py --destino bunny-original --aplicar
          test -n "$(git -C bunny-original status --porcelain)"
          cmp bunny-csharp-entrega/app/src/main/cpp/CMakeLists.txt bunny-original/app/src/main/cpp/CMakeLists.txt
          cmp bunny-csharp-entrega/experiments/csharp/BunnySourceSdk/BunnySourceSdk.csproj bunny-original/experiments/csharp/BunnySourceSdk/BunnySourceSdk.csproj
          cmp bunny-csharp-entrega/README.md bunny-original/README.md
          cmp bunny-csharp-entrega/README-BUNNY-ORIGINAL.md bunny-original/README-BUNNY-ORIGINAL.md
          git -C bunny-original show a370a664aa3b808c87e4e4f570b27504d20df723:README.md > "$RUNNER_TEMP/upstream-readme.md"
          cmp "$RUNNER_TEMP/upstream-readme.md" bunny-original/README-BUNNY-ORIGINAL.md
          test -s bunny-original/POTATO-C-SHARP-HANDOFF.md
          test -s bunny-original/docs/POTATO-UPSTREAM-FILE-MAP.json
          (
            cd bunny-original
            bash tools/mono/install_patched_mono_arm64.sh
            cmp tools/mono/prebuilt/arm64-v8a/libmonosgen-2.0.so app/src/main/jniLibs/arm64-v8a/libmonosgen-2.0.so
          )

      - name: Check source and imported file manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          a=Path("bunny-csharp-entrega")
          b=Path("bunny-original")
          tracked=subprocess.check_output(["git","-C",str(a),"ls-files","-z"])
          paths=[x.decode() for x in tracked.split(b"\0") if x]
          import hashlib
          for name in paths:
              original=a/name
              imported=b/name
              assert original.is_file() and imported.is_file(), name
              assert hashlib.sha256(original.read_bytes()).digest() == hashlib.sha256(imported.read_bytes()).digest(), name
          assert len(paths)>2700, len(paths)
          print(f"POTATO_IMPORTED_SOURCE_BYTES_MATCH=PASS files={len(paths)}")
          PY
