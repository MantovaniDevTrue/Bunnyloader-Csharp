name: CSharp Localization Core

on:
  push:
    branches:
      - feat/csharp-content-localization-loader-20261019
    paths:
      - 'Split/Bunny-Loader/experiments/csharp/BunnyCsSdk/BunnyLocalization.cs'
      - 'Split/Bunny-Loader/experiments/csharp/BunnySourceSdk/BunnySourceSdk.csproj'
      - 'Split/Bunny-Loader/docs/generated/sdk_public_reference.json'
      - 'Split/Bunny-Loader/docs/generated/sdk_public_reference.md'
      - 'Split/Bunny-Loader/experiments/csharp/BunnySourceCompiler/CompiledAssemblyProbe.cs'
      - 'Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/NativeLocalizationRuntime.*'
      - 'Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/SourceLoader.cpp'
      - 'Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/AutoSourceRuntime.cpp'
      - 'Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/ManagedRuntime.cpp'
      - 'Split/Bunny-Loader/tests/localization_loader/**'
      - '.github/workflows/check-csharp-localization.yml'
  pull_request:
    paths:
      - 'Split/Bunny-Loader/experiments/csharp/BunnyCsSdk/BunnyLocalization.cs'
      - 'Split/Bunny-Loader/experiments/csharp/BunnySourceSdk/BunnySourceSdk.csproj'
      - 'Split/Bunny-Loader/docs/generated/sdk_public_reference.json'
      - 'Split/Bunny-Loader/docs/generated/sdk_public_reference.md'
      - 'Split/Bunny-Loader/experiments/csharp/BunnySourceCompiler/CompiledAssemblyProbe.cs'
      - 'Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/NativeLocalizationRuntime.*'
      - 'Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/SourceLoader.cpp'
      - 'Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/AutoSourceRuntime.cpp'
      - 'Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/ManagedRuntime.cpp'
      - 'Split/Bunny-Loader/tests/localization_loader/**'
      - '.github/workflows/check-csharp-localization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  managed-localization:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile and run managed localization contract suite
        run: dotnet run --project Split/Bunny-Loader/tests/localization_loader/LocalizationLoader.csproj --configuration Release
      - name: Check generated public SDK reference
        working-directory: Split/Bunny-Loader
        run: dotnet run --project tools/sdk_reference/SdkReference.csproj --configuration Release -- --check
      - name: Syntax-check native language publisher
        working-directory: Split/Bunny-Loader
        run: g++ -std=c++20 -Wall -Wextra -Werror -fsyntax-only -Iapp/src/main/cpp app/src/main/cpp/experiments/csharp/NativeLocalizationRuntime.cpp
      - name: Test native locale wire without Android or APK
        working-directory: Split/Bunny-Loader
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -ffunction-sections -fdata-sections -Wl,--gc-sections \
            -Iapp/src/main/cpp app/src/main/cpp/experiments/csharp/NativeLocalizationRuntime.cpp \
            tests/localization_loader/native_wire_test.cpp -o /tmp/bunny-native-localization-test
          /tmp/bunny-native-localization-test
