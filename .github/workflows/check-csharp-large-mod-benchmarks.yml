name: Check scalable CSharp mod compilation
on:
  workflow_dispatch:
  push:
    branches:
      - codex/integrate-csharp-sdk-lot-a-20261015
    paths:
      - 'Split/Bunny-Loader/tests/csharp_scale/**'
      - 'Split/Bunny-Loader/experiments/csharp/BunnySourceCompiler/Compiler.cs'
      - 'Split/Bunny-Loader/experiments/csharp/BunnySourceCompiler/CompiledAssemblyProbe.cs'
      - '.github/workflows/check-csharp-large-mod-benchmarks.yml'

jobs:
  benchmark:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify consistent mobile resource budgets
        working-directory: Split/Bunny-Loader
        run: python3 tests/csharp_scale/check_limits.py
      - name: Verify native parser handles 1200 CSharp types
        working-directory: Split/Bunny-Loader
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -I app/src/main/cpp \
            tests/csharp_scale/large_parser.cpp \
            app/src/main/cpp/experiments/csharp/SourceParser.cpp \
            -o "$RUNNER_TEMP/bunny-large-csharp-parser"
          "$RUNNER_TEMP/bunny-large-csharp-parser"
      - name: Compile real 100 300 600 1000 class mods and recheck cached assemblies
        working-directory: Split/Bunny-Loader
        run: |
          dotnet run --project tests/csharp_scale/Scale.csproj -c Release -- \
            100 300 600 1000 | tee "$RUNNER_TEMP/csharp-large-mod-benchmarks.jsonl"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: csharp-large-mod-benchmarks
          path: ${{ runner.temp }}/csharp-large-mod-benchmarks.jsonl
          if-no-files-found: ignore
