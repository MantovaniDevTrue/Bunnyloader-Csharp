name: CommandLoader CSharp host tests (no APK)

on:
  push:
    branches:
      - feat/csharp-command-loader-20261020
      - qa/csharp-world-tree-gore-apk-20261024
    paths:
      - experiments/csharp/BunnyCsSdk/BunnyCommand.cs
      - experiments/csharp/BunnyCsSdk/BunnyCommandWorker.cs
      - samples/ExampleModCSharp/Experimental/CommandLoader/**
      - samples/ExampleModCSharp/Playable/content/Common/Commands/**
      - experiments/csharp/BunnySourceSdk/BunnySourceSdk.csproj
      - tests/commands/**
      - experiments/csharp/BunnySourceCompiler/**
      - app/src/main/cpp/experiments/csharp/SourceParser.cpp
      - app/src/main/cpp/experiments/csharp/SourceLoader.cpp
      - app/src/main/cpp/experiments/csharp/SourceLoader.h
      - app/src/main/cpp/experiments/csharp/ManagedSourceClassCount.h
      - .github/workflows/command-loader-host-tests.yml
  pull_request:
    paths:
      - experiments/csharp/BunnyCsSdk/BunnyCommand.cs
      - experiments/csharp/BunnySourceSdk/BunnySourceSdk.csproj
      - tests/commands/**
      - .github/workflows/command-loader-host-tests.yml

permissions:
  contents: read

jobs:
  managed-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Compile SDK and execute CSharp command tests
        run: dotnet run --project tests/commands/Commands.HostTests.csproj -c Release
      - name: Verify Roslyn command descriptors and command-only assemblies
        run: dotnet run --project tests/commands/CommandManifest.HostTests.csproj -c Release
      - name: Verify native game action semantics in original Bunny CSharp examples
        run: dotnet run --project tests/commands/Actions.HostTests.csproj -c Release
