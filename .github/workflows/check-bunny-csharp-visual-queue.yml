name: Check Bunny CSharp Visual Queue

on:
  push:
    branches:
      - feat/csharp-native-recipe-groups-v89
      - feat/csharp-loader-foundation-v91
      - feat/csharp-owned-recipe-loader-v92
      - feat/csharp-94-owned-summon-damage-lot
      - feat/csharp-owned-loaders-v93
      - feat/csharp-summon-lifecycle-v95
      - feat/csharp-buff-recipes-v90
      - fix/csharp-90-2-recipegroup-real-instance-abi
      - fix/csharp-90-3-recipegroup-return-contract
      - fix/csharp-88-8-lights-review
      - codex/lot-a-complete-v90-29
      - codex/example-completion-v90-28
      - codex/native-equips-fix-v90-27-6
      - csharp-visual-effects-v90-27-wip
      - codex/csharp-lights-fidelity-v90-29-88
      - codex/csharp-lights-night-hotfix
      - codex/csharp-lights-sdk-settings-split
  pull_request:
    paths:
      - 'Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/**'
      - 'Split/Bunny-Loader/app/src/main/cpp/script/js/mod/Loaders/PlayerDrawHooks.js'
      - 'Split/Bunny-Loader/app/src/main/cpp/script/js/mod/Loaders/EquipLoader.js'
      - 'Split/Bunny-Loader/tests/**'
      - '.github/workflows/check-bunny-csharp-visual-queue.yml'
  workflow_dispatch:

jobs:
  managed-visual-queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Check visual command queue
        run: dotnet run --project Split/Bunny-Loader/tests/visual_queue/VisualQueueTests.csproj -c Release
      - name: Check compiled BunnySourceSdk visual API
        run: dotnet run --project Split/Bunny-Loader/tests/visual_queue/VisualSdkCompile.csproj -c Release
      - name: Compile and test real CSharp visual accessories
        run: dotnet run --project Split/Bunny-Loader/tests/visual_queue/VisualAccessories.csproj -c Release
      - name: Verify Bunny player draw layer syntax
        run: node --check Split/Bunny-Loader/app/src/main/cpp/script/js/mod/Loaders/PlayerDrawHooks.js
      - name: Verify real CSharp visual geometry
        run: node Split/Bunny-Loader/tests/csharp_visual_draw_geometry_test.js Split/Bunny-Loader/tests/fixtures/legacy_csharp_policies/PlayerVisualRenderer.js
      - name: Verify Bunny CSharp native shoe and shield equip slots
        run: node Split/Bunny-Loader/tests/csharp_native_equips_test.js Split/Bunny-Loader/app/src/main/cpp/script/js/mod/Loaders/EquipLoader.js
      - name: Verify native EquipLoader syntax
        run: node --check Split/Bunny-Loader/app/src/main/cpp/script/js/mod/Loaders/EquipLoader.js


