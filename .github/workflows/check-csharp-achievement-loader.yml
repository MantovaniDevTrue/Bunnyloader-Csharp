name: AchievementLoader CSharp host
on:
  push:
    paths:
      - experiments/csharp/BunnyCsSdk/BunnyAchievement.cs
      - experiments/csharp/BunnySourceSdk/BunnySourceSdk.csproj
      - tests/achievement_loader/**
      - .github/workflows/check-csharp-achievement-loader.yml
  pull_request:
    paths:
      - experiments/csharp/BunnyCsSdk/BunnyAchievement.cs
      - experiments/csharp/BunnySourceSdk/BunnySourceSdk.csproj
      - tests/achievement_loader/**
      - .github/workflows/check-csharp-achievement-loader.yml
permissions:
  contents: write
jobs:
  achievement-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet run --project tests/achievement_loader/AchievementLoader.csproj -c Release
      - name: Refresh public SDK reference on isolated branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/csharp-achievement-loader-pr141-20261023'
        run: |
          dotnet run --project tools/sdk_reference/SdkReference.csproj -c Release -- --write
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/generated/sdk_public_reference.json docs/generated/sdk_public_reference.md
          if ! git diff --cached --quiet; then
            git commit -m "docs(csharp): regenerate public SDK reference for achievements"
            git push origin HEAD:feat/csharp-achievement-loader-pr141-20261023
          fi
