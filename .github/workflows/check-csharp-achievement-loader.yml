name: AchievementLoader CSharp host
on:
  push:
    paths:
      - experiments/csharp/BunnyCsSdk/BunnyAchievement.cs
      - experiments/csharp/BunnyCsSdk/BunnyAchievementWorker.cs
      - experiments/csharp/BunnyCsSdk/BunnyRecipeCallbacks.cs
      - experiments/csharp/BunnySourceSdk/BunnySourceSdk.csproj
      - app/src/main/cpp/experiments/csharp/NativeAchievementMailbox.h
      - docs/generated/sdk_public_reference.json
      - docs/generated/sdk_public_reference.md
      - tests/achievement_loader/**
      - .github/workflows/check-csharp-achievement-loader.yml
  pull_request:
    paths:
      - experiments/csharp/BunnyCsSdk/BunnyAchievement.cs
      - experiments/csharp/BunnyCsSdk/BunnyAchievementWorker.cs
      - experiments/csharp/BunnyCsSdk/BunnyRecipeCallbacks.cs
      - experiments/csharp/BunnySourceSdk/BunnySourceSdk.csproj
      - app/src/main/cpp/experiments/csharp/NativeAchievementMailbox.h
      - docs/generated/sdk_public_reference.json
      - docs/generated/sdk_public_reference.md
      - tests/achievement_loader/**
      - .github/workflows/check-csharp-achievement-loader.yml
permissions:
  contents: read
jobs:
  achievement-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet run --project tests/achievement_loader/AchievementLoader.csproj -c Release
      - run: dotnet run --project tools/sdk_reference/SdkReference.csproj -c Release -- --check
      - name: Test owner-safe native event mailbox
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pthread \
            -Iapp/src/main/cpp \
            tests/achievement_loader/native_mailbox_test.cpp \
            -o /tmp/bunny-achievement-mailbox
          /tmp/bunny-achievement-mailbox
