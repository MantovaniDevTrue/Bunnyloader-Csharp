name: Verify preintegrated Bunny CSharp Gradle runtime

on:
  workflow_dispatch:
  push:
    branches:
      - entrega/potato-bunny-original-com-csharp-20261018
    paths:
      - .github/workflows/verify-ready-csharp-gradle.yml
      - app/build.gradle.kts

permissions:
  contents: read

jobs:
  verify-bundled-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout complete preintegrated Bunny source
        uses: actions/checkout@v4
        with:
          ref: entrega/potato-bunny-original-com-csharp-20261018
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Check preinstalled CSharp runtime and Kotlin build contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.bunnyloader"' app/build.gradle.kts
          test -s app/src/main/assets/managed/framework.sha256
          test -s app/src/main/jniLibs/arm64-v8a/libmonosgen-2.0.so
          gradle :app:verifyBundledCSharpRuntime --stacktrace --no-daemon \
            -Pbl.nativeBuild=false -Pbl.uiOnly=true
      - name: Build launcher without proprietary Terraria game binaries
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon \
            -Pbl.nativeBuild=false -Pbl.uiOnly=true
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo "BUNNY_CSHARP_SOURCE_LAUNCHER_BUILD=PASS"
