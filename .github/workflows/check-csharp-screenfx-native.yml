name: CSharp Native ScreenFx

on:
  pull_request:
    paths:
      - 'Split/Bunny-Loader/app/src/main/cpp/graphics/**'
      - 'Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/SourceLoader.*'
      - 'Split/Bunny-Loader/tests/*screenfx*'
      - 'Split/Bunny-Loader/tests/screenfx_stubs/**'
      - '.github/workflows/check-csharp-screenfx-native.yml'
  workflow_dispatch:

jobs:
  screenfx-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run native ScreenFx tests
        run: bash Split/Bunny-Loader/tests/screenfx_native_test.sh
