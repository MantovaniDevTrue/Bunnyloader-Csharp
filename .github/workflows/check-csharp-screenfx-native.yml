name: CSharp Native ScreenFx

on:
  push:
    branches:
      - codex/csharp-screenfx-v90-29-86
      - codex/csharp-lights-native-graph-v90-29-87
      - codex/csharp-lights-fidelity-v90-29-88
      - codex/csharp-lights-night-hotfix
      - codex/csharp-lights-sdk-settings-split
      - codex/csharp-lights-88-3-prewarm-scene-fidelity
      - integration/jonata-oct15-csharp-88-4-build
      - hotfix/csharp-88-5-sigabrt-logcat-tail
      - perf/csharp-88-7-lights-invisible-ray-fastpath
  pull_request:
    paths:
      - 'Split/Bunny-Loader/app/src/main/cpp/graphics/**'
      - 'Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/SourceLoader.*'
      - 'Split/Bunny-Loader/tests/*screenfx*'
      - 'Split/Bunny-Loader/tests/lights_pc_shader_test.py'
      - 'Split/Bunny-Loader/samples/LightsAndShadowsCSharp/**'
      - 'Split/Bunny-Loader/tests/screenfx_stubs/**'
      - 'Split/Bunny-Loader/tests/screenfx_probe/**'
      - 'Split/Bunny-Loader/samples/ScreenFxProbeCSharp/**'
      - 'Split/Bunny-Loader/samples/LightsAndShadowsCSharp/**'
      - '.github/workflows/check-csharp-screenfx-native.yml'
  workflow_dispatch:

jobs:
  screenfx-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run native ScreenFx tests
        run: |
          bash Split/Bunny-Loader/tests/screenfx_native_test.sh
          python3 Split/Bunny-Loader/tests/lights_pc_shader_test.py
          python3 Split/Bunny-Loader/tests/quickjs_settings_location_test.py

  screenfx-managed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Execute ScreenFx MonoVM contract probe
        run: dotnet run --project Split/Bunny-Loader/tests/screenfx_probe/ScreenFxProbe.Tests.csproj -c Release
