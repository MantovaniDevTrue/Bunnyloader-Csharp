name: CSharp Native ScreenFx

on:
  push:
    branches:
      - feat/csharp-native-recipe-groups-v89
      - feat/csharp-loader-foundation-v91
      - feat/csharp-owned-recipe-loader-v92
      - feat/csharp-94-owned-summon-damage-lot
      - feat/csharp-owned-loaders-v93
      - feat/csharp-summon-lifecycle-v95
      - feat/csharp-buff-recipes-v90
      - fix/csharp-90-1-static-recipegroup-register
      - fix/csharp-90-2-recipegroup-real-instance-abi
      - fix/csharp-90-3-recipegroup-return-contract
      - fix/csharp-88-8-lights-review
      - codex/csharp-screenfx-v90-29-86
      - codex/csharp-lights-native-graph-v90-29-87
      - codex/csharp-lights-fidelity-v90-29-88
      - codex/csharp-lights-night-hotfix
      - codex/csharp-lights-sdk-settings-split
      - codex/csharp-lights-88-3-prewarm-scene-fidelity
      - integration/jonata-oct15-csharp-88-4-build
      - hotfix/csharp-88-5-sigabrt-logcat-tail
      - perf/csharp-88-7-lights-invisible-ray-fastpath
  pull_request:
    paths:
      - 'Split/Bunny-Loader/app/src/main/cpp/graphics/**'
      - 'Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/SourceLoader.*'
      - 'Split/Bunny-Loader/tests/*screenfx*'
      - 'Split/Bunny-Loader/tests/lights_pc_shader_test.py'
      - 'Split/Bunny-Loader/samples/LightsAndShadowsCSharp/**'
      - 'Split/Bunny-Loader/tests/screenfx_stubs/**'
      - 'Split/Bunny-Loader/tests/screenfx_probe/**'
      - 'Split/Bunny-Loader/samples/ScreenFxProbeCSharp/**'
      - 'Split/Bunny-Loader/samples/LightsAndShadowsCSharp/**'
      - '.github/workflows/check-csharp-screenfx-native.yml'
  workflow_dispatch:

jobs:
  screenfx-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate APK workflow YAML syntax
        run: ruby -ryaml -e 'YAML.parse_file(ARGV.fetch(0)); puts "BUNNY_APK_WORKFLOW_YAML=PASS"' .github/workflows/build-bunny-csharp-source-loader.yml
      - name: Compile and run native ScreenFx tests
        run: |
          bash Split/Bunny-Loader/tests/screenfx_native_test.sh
          python3 Split/Bunny-Loader/tests/lights_pc_shader_test.py
          python3 Split/Bunny-Loader/tests/quickjs_settings_location_test.py
      - name: Package optimized Lights CSharp source mod
        run: |
          set -euo pipefail
          python3 Split/Bunny-Loader/samples/LightsAndShadowsCSharp/package_mod.py "$RUNNER_TEMP/LightsAndShadowsCSharp-v0.4.2.3.bmod"
          python3 - "$RUNNER_TEMP/LightsAndShadowsCSharp-v0.4.2.3.bmod" <<'PYLIGHTS'
          import json, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              manifest = json.loads(z.read("manifest.json"))
              assert manifest["version"] == "0.4.2.3"
              assert manifest["id"] == "lightsandshadowscsharp"
              for variant in ("Lights.screenfx", "Lights_Alternate.screenfx"):
                  assert z.read("content/Effects/" + variant).count(b"PASS|") == 9
              for shader in ("ShadowMask.frag", "ShadowRays.frag", "LightCompose.frag"):
                  assert b"uSunEnabled <= 0.0" in z.read("content/Effects/" + shader)
              assert all("content/Assets/" + n in z.namelist() for n in ("ColorTex.png", "ColorTex2.png", "ColorTex_Alt.png"))
              assert not any(n.endswith((".dll", ".so", ".js")) for n in z.namelist())
          print("LIGHTS_CSHARP_SOURCE_ONLY_0423=PASS")
          PYLIGHTS
      - name: Export optimized Lights CSharp package
        uses: actions/upload-artifact@v4
        with:
          name: LightsAndShadowsCSharp-v0.4.2.3
          path: ${{ runner.temp }}/LightsAndShadowsCSharp-v0.4.2.3.bmod
          if-no-files-found: error
          retention-days: 14

  screenfx-managed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Execute ScreenFx MonoVM contract probe
        run: dotnet run --project Split/Bunny-Loader/tests/screenfx_probe/ScreenFxProbe.Tests.csproj -c Release
