name: ExampleMod CSharp mount authoring contracts (no APK)
on:
  push:
    branches: [qa/csharp-world-tree-gore-apk-20261024]
    paths:
      - 'experiments/csharp/BunnyCsSdk/BunnyMount.cs'
      - 'app/src/main/cpp/experiments/csharp/NativeMountPolicy.h'
      - 'experiments/csharp/BunnySourceSdk/BunnySourceSdk.csproj'
      - 'tests/examplemod_mount_qa/**'
      - '.github/workflows/check-examplemod-mount-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile and compare both original Bunny mount policies
        run: dotnet run --project tests/examplemod_mount_qa/ExampleModMountQa.csproj --configuration Release
      - name: Validate native M1 policy parser without QuickJS
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -I app/src/main/cpp tests/examplemod_mount_qa/native_mount_policy_test.cpp -o /tmp/bunny-mount-policy-test
          /tmp/bunny-mount-policy-test
      - name: Verify regenerated SDK public reference
        run: dotnet run --project tools/sdk_reference -c Release -- --check
