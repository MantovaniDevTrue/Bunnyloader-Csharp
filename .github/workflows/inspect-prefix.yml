name: Inspect bundled prefix implementation
on:
  push:
    branches: [codex/prefix-restore-fix]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x
      - name: Inspect runtime locally on private runner job
        env:
          GH_TOKEN: ${{ secrets.BUNNY_PRIVATE_BUILD_TOKEN }}
        run: |
          set -eu
          test "$(gh api repos/MantovaniDevTrue/Bunnyloader-Csharp-Builds --jq .private)" = true
          mkdir -p runtime dumper output
          gh release download bunny-private-build-inputs-v1 --repo MantovaniDevTrue/Bunnyloader-Csharp-Builds --pattern BunnyRuntime_Terraria_1.4.5.8.6.zip --dir runtime
          unzip -q runtime/*.zip -d runtime/extracted
          gh release download v6.7.46 --repo Perfare/Il2CppDumper --pattern Il2CppDumper-net6-v6.7.46.zip --dir dumper
          unzip -q dumper/*.zip -d dumper/bin
          LIB="$(find runtime/extracted -name libil2cpp.so | head -1)"
          META="$(find runtime/extracted -name global-metadata.dat | head -1)"
          dotnet dumper/bin/Il2CppDumper.dll "$LIB" "$META" output </dev/null > output/dumper.log 2>&1 || true
          test -f output/script.json || { cat output/dumper.log; exit 1; }
          python3 -m pip -q install capstone pyelftools
          python3 - "$LIB" <<'PY'
          import sys,json
          from elftools.elf.elffile import ELFFile
          from capstone import Cs, CS_ARCH_ARM64, CS_MODE_ARM
          methods=json.load(open('output/script.json'))['ScriptMethod']
          targets=[m for m in methods if m['Name'].startswith('Terraria.Item$$') and any(m['Name'].split('$$')[-1]==n for n in ['Prefix','GetRollablePrefixes','RollAPrefix','CanRollPrefix','TryGetPrefixStatMultipliersForItem'])]
          print('TARGETS',json.dumps(targets))
          addresses=sorted(set(m['Address'] for m in methods))
          symbols={m['Address']:m['Name'] for m in methods}
          with open(sys.argv[1],'rb') as f:
              elf=ELFFile(f)
              for m in targets:
                  start=m['Address']; end=next((x for x in addresses if x>start),start+4096)
                  end=min(end,start+16000)
                  for seg in elf.iter_segments():
                      if seg['p_type']=='PT_LOAD' and seg['p_vaddr']<=start<seg['p_vaddr']+seg['p_filesz']:
                          f.seek(seg['p_offset']+start-seg['p_vaddr']); code=f.read(end-start); break
                  print('METHOD',m['Name'],m['Signature'])
                  for ins in Cs(CS_ARCH_ARM64,CS_MODE_ARM).disasm(code,start):
                      label=''
                      if ins.mnemonic in ('bl','b') and ins.op_str.startswith('#'):
                          label=symbols.get(int(ins.op_str[1:],16),'')
                      print(hex(ins.address),ins.mnemonic,ins.op_str,label)
          PY
