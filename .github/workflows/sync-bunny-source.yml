name: Compare Bunny upstream source (read only)
on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Jonata Bunny-Loader branch, tag or commit to compare
        required: true
        default: main
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: JonataOliveiraa/Bunny-Loader
          ref: ${{ inputs.upstream_ref }}
          path: .upstream-bunny
          persist-credentials: false
      - name: Compare tracked source trees without replacing CSharp
        run: python3 tools/compare_bunny_upstream.py .upstream-bunny --output build/upstream-comparison
      - uses: actions/upload-artifact@v4
        with:
          name: Bunny-upstream-comparison
          path: build/upstream-comparison/
          retention-days: 14
