name: Sync Bunny Loader Source
# manual sync refresh 2026-10-01

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-bunny-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Split workspace
        uses: actions/checkout@v4

      - name: Fetch Bunny Loader
        shell: bash
        run: |
          rm -rf Split/Bunny-Loader
          git clone --depth 1 https://github.com/JonataOliveiraa/Bunny-Loader.git Split/Bunny-Loader
          rm -rf Split/Bunny-Loader/.git

      - name: Commit Bunny Loader source
        shell: bash
        run: |
          git config user.name "Split Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add Split/Bunny-Loader
          if git diff --cached --quiet; then
            echo "Bunny Loader source already synchronized."
          else
            git commit -m "Sync Bunny Loader source"
            git push origin main
          fi
