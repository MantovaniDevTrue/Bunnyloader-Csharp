name: Prepare CSharp runtime inside Bunny original source

on:
  workflow_dispatch:
  push:
    branches:
      - entrega/potato-bunny-original-com-csharp-20261018
    paths:
      - .github/workflows/prepare-integrated-csharp-runtime.yml

permissions:
  contents: write

jobs:
  stage-complete-managed-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout complete source
        uses: actions/checkout@v4
        with:
          ref: entrega/potato-bunny-original-com-csharp-20261018
          persist-credentials: true

      - name: Install .NET SDK for build runner
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Stage official Mono Android runtime assemblies and native dependencies
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 \
            https://api.nuget.org/v3-flatcontainer/microsoft.netcore.app.runtime.mono.android-arm64/8.0.23/microsoft.netcore.app.runtime.mono.android-arm64.8.0.23.nupkg \
            -o "$RUNNER_TEMP/android-mono-8.0.23.nupkg"
          python3 tools/stage_mono_runtime.py \
            "$RUNNER_TEMP/android-mono-8.0.23.nupkg" \
            app/src/main/jniLibs/arm64-v8a \
            app/src/main/assets/managed
          bash tools/mono/install_patched_mono_arm64.sh
          test -s app/src/main/jniLibs/arm64-v8a/libSystem.Native.so
          readelf -Ws app/src/main/jniLibs/arm64-v8a/libmonosgen-2.0.so |
            grep mono_bunny_android_signal_policy_v1

      - name: Compile all CSharp source assemblies and Roslyn dependencies
        shell: bash
        run: |
          set -euo pipefail
          ROOT=experiments/csharp
          DEST=app/src/main/assets/managed
          for project in BunnyManagedProbe BunnyVmBenchmark67 BunnyVmGameplay69 BunnySourceSdk BunnySourceCompiler; do
            dotnet build "$ROOT/$project/$project.csproj" -c Release --nologo
            test -s "$ROOT/$project/bin/Release/net8.0/$project.dll"
            cp "$ROOT/$project/bin/Release/net8.0/$project.dll" "$DEST/"
          done
          for assembly in Microsoft.CodeAnalysis.dll Microsoft.CodeAnalysis.CSharp.dll; do
            test -s "$ROOT/BunnySourceCompiler/bin/Release/net8.0/$assembly"
            cp "$ROOT/BunnySourceCompiler/bin/Release/net8.0/$assembly" "$DEST/"
          done
          test -s "$DEST/System.Private.CoreLib.dll"
          test -s "$DEST/System.Runtime.dll"
          test -s "$DEST/BunnyManagedProbe.dll"
          test -s "$DEST/BunnySourceSdk.dll"
          test -s "$DEST/BunnySourceCompiler.dll"
          test -s "$DEST/Microsoft.CodeAnalysis.dll"
          test -s "$DEST/Microsoft.CodeAnalysis.CSharp.dll"
          grep -a -q MoveSpeedPercent "$DEST/BunnySourceSdk.dll"

      - name: Verify all preinstalled assets and generate exact APK manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path("app/src/main/assets/managed")
          files = sorted(root.glob("*.dll"))
          required = {
              "System.Private.CoreLib.dll", "System.Runtime.dll",
              "BunnyManagedProbe.dll", "BunnySourceSdk.dll",
              "BunnySourceCompiler.dll", "BunnyVmBenchmark67.dll",
              "BunnyVmGameplay69.dll", "Microsoft.CodeAnalysis.dll",
              "Microsoft.CodeAnalysis.CSharp.dll",
          }
          assert required.issubset({p.name for p in files}), sorted(required - {p.name for p in files})
          assert len(files) >= 12, len(files)
          manifest = ''.join(
              f'{p.name}\t{hashlib.sha256(p.read_bytes()).hexdigest()}\n'
              for p in files
          )
          (root / "framework.sha256").write_text(manifest, encoding="utf-8")
          assert len(manifest.splitlines()) == len(files)
          lib = Path("app/src/main/jniLibs/arm64-v8a/libmonosgen-2.0.so")
          prebuilt = Path("tools/mono/prebuilt/arm64-v8a/libmonosgen-2.0.so")
          assert lib.read_bytes() == prebuilt.read_bytes()
          print(f"BUNNY_CSHARP_READY_IN_REPO=YES assemblies={len(files)}")
          PY

      - name: Commit all shareable ready-to-build CSharp runtime assets to source
        shell: bash
        run: |
          set -euo pipefail
          git add app/src/main/assets/managed
          for lib in app/src/main/jniLibs/arm64-v8a/*.so; do
            case "$lib" in
              */libil2cpp.so|*/libunity.so|*/libmain.so|*/libc++_shared.so)
                echo "Forbidden proprietary game library: $lib" >&2
                exit 1;;
            esac
            git add -f "$lib"
          done
          test -z "$(git diff --cached --name-only | grep -E 'libil2cpp|libunity|libmain|libc\+\+_shared|keystore|\.apk$' || true)"
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "BUNNY_CSHARP_RUNTIME_ALREADY_PREINSTALLED=YES"
          else
            git commit -m "runtime: preinstall complete Mono ARM64 and compiled CSharp Roslyn assemblies"
            git push origin HEAD:refs/heads/entrega/potato-bunny-original-com-csharp-20261018
            echo "BUNNY_CSHARP_RUNTIME_COMMITTED=YES"
          fi
