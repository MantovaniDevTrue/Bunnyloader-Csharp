          python3 - "$PACK" "$PACK.catalog.json" "$CROSS_DIR" <<'PY'
          import base64,hashlib,json,sys,zipfile
          from pathlib import Path
          package,metadata,destination=map(Path,sys.argv[1:])
          catalog=json.loads(metadata.read_text())
          assert catalog['packageHashAlgorithm']=='SHA512'
          assert hashlib.sha512(package.read_bytes()).digest()==base64.b64decode(catalog['packageHash'],validate=True)
          with zipfile.ZipFile(package) as archive:
              assert all('..' not in Path(name).parts and not name.startswith('/') for name in archive.namelist())
              archive.extractall(destination)
          for tool in destination.rglob('mono-aot-cross'):
              tool.chmod(0o755)
