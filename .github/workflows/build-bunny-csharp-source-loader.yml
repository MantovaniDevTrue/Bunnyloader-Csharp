    paths:
      - ".github/workflows/build-bunny-csharp-source-loader.yml"
      - "Split/Bunny-Loader/**"

permissions:
  contents: write

concurrency:
  group: bunny-csharp-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      RUNTIME_TAG: runtime-1.4.5.8.6
      RUNTIME_ASSET: BunnyRuntime_Terraria_1.4.5.8.6.zip
      RUNTIME_SHA256: 2eb8d02dea144cb2fff6a27b94cc371e50ffd9aa44ba4dcd123337691a54c0ab

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install Android toolchain
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;30.0.16248370" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Ensure QuickJS
        shell: bash
        run: |
          rm -rf Split/Bunny-Loader/app/src/main/cpp/third_party/quickjs
          git clone --depth 1 --branch v0.17.0 https://github.com/quickjs-ng/quickjs.git Split/Bunny-Loader/app/src/main/cpp/third_party/quickjs

      - name: Configure Maven mirror
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("Split/Bunny-Loader/settings.gradle.kts")
          s = p.read_text()
          s = s.replace("mavenCentral()", 'maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2") }')
          p.write_text(s)
          PY

      - name: Restore existing stable signing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DIR="$RUNNER_TEMP/bunny-signing"
          mkdir -p "$DIR"
          gh release download bunny-signing-key-v1 --repo "${{ github.repository }}" --pattern "bunny-release.jks" --dir "$DIR"
          PASS="$(python3 - <<'PY'
          import re
          from pathlib import Path
          s = Path(".github/workflows/build-split-full.yml").read_text()
          m = re.search(r'PASS="([^"]+)"', s)
          if not m:
              raise SystemExit("signing password not found")
          print(m.group(1))
          PY
          )"
          echo "BUNNY_SIGNING_STORE=$DIR/bunny-release.jks" >> "$GITHUB_ENV"
          echo "BUNNY_SIGNING_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "BUNNY_SIGNING_ALIAS=bunnyrelease" >> "$GITHUB_ENV"

      - name: Verify game-process abort instrumentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          cpp = Path("Split/Bunny-Loader/app/src/main/cpp")
          api = (cpp / "script/api/CSharpPrototypeApi.cpp").read_text()
          native = (cpp / "experiments/csharp/NativeAbortProbe.cpp").read_text()
          assert "native-game-abort-trace.txt" in api
          assert "gameNativePrevious" in api
          assert 'rearmNativeAbortProbe("after-game-mono-probe")' in api
          assert "gameMutexTraceInstalled" in api
          assert "native-game-abort-previous.txt" in native
          assert "std::rename(file.c_str(), previous.c_str())" in native
          print("CSHARP_GAME_CRASH_TRACE_WIRING=PASS")
          PY

      - name: Verify retained crash session diagnostics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("Split/Bunny-Loader")
          boot = (root / "app/src/main/kotlin/dev/bunnyloader/game/BootLog.kt").read_text()
          native = (root / "app/src/main/cpp/experiments/csharp/NativeAbortProbe.cpp").read_text()
          assert "rotateLogcat(ctx)" in boot
          assert "for (generation in 3 downTo 1)" in boot
          assert "for (generation in 0..3)" in boot
          assert "native-game-abort-previous.txt" in boot
          assert "private fun gameCrashTraces(" in boot
          assert "emitAbortHeader();" in native
          assert "NATIVE_ABORT_SIGNAL pid=" in native
          print("CSHARP_CRASH_SESSION_RETENTION=PASS")
          PY

      - name: Verify isolated MonoVM modes and early SIGABRT capture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("Split/Bunny-Loader")
          api = (root / "app/src/main/cpp/script/api/CSharpPrototypeApi.cpp").read_text()
          native = (root / "app/src/main/cpp/experiments/csharp/NativeAbortProbe.cpp").read_text()
          log = (root / "app/src/main/kotlin/dev/bunnyloader/game/BootLog.kt").read_text()
          assert all(mode in api for mode in ("MONO_ONLY", "ABORT_ONLY", "FULL_DIAGNOSTICS"))
          assert 'selectedMode != "MONO_ONLY" && selectedMode != "NO_MONO"' in api
          assert 'selectedMode != "PINNED_MONO" && selectedMode != "LIBRARY_ONLY"' in api
          assert 'selectedMode == "FULL_DIAGNOSTICS"' in api
          assert 'gameProbeMode' in api and 'gameModuleMaps' in api
          assert 'ABORT_CRITICAL_V2 pid=' in native
          assert 'emitCriticalAbortSnapshot(signal, info, raw);' in native
          assert 'persistGameNativeModuleMaps' in native
          assert 'native-game-module-maps.txt' in log
          print("CSHARP_MONO_ISOLATION_AND_CRASH_CONTEXT=PASS")
          PY

      - name: Validate 25k managed callback limit and FIFO64
        shell: bash
        run: |
          python3 Split/Bunny-Loader/tests/run_managed_live_queue.py
          python3 - <<'PY'
          from pathlib import Path
          root = Path("Split/Bunny-Loader/app/src/main/cpp")
          runtime = (root / "experiments/csharp/ManagedRuntime.cpp").read_text()
          header = (root / "experiments/csharp/ManagedLiveEventQueue.h").read_text()
          status = (root / "experiments/csharp/ManagedRuntime.h").read_text()
          api = (root / "script/api/CSharpPrototypeApi.cpp").read_text()
          assert "kEventLimit = 25000" in header
          assert "kCapacity = 64" in header
          assert "g_liveHitQueue.pop(&event)" in runtime
          assert "g_liveHitQueue.push({" in runtime
          assert "g_liveHitQueue.clear();" in runtime
          assert "g_liveHitInFlight" in runtime
          assert "std::unique_lock<std::mutex> lock(g_pinnedMutex, std::defer_lock)" in runtime
          assert "attempt < 3 && !lock.owns_lock()" in runtime
          assert "lock.try_lock()" in runtime
          assert "g_liveHitLockDrops.fetch_add" in runtime
          assert "status.dropped += status.lockDrops" in runtime
          assert "ManagedLiveEventQueue::kEventLimit" in runtime
          assert 'g_liveHitStatus.phase = "draining"' in runtime
          assert 'g_liveHitStatus.phase = "limit-reached"' in runtime
          assert "g_liveHitStatus.queued >= 512" not in runtime
          assert "tick > 512" not in runtime
          for name in ["queueDepth", "maxQueueDepth", "queueCapacity", "eventLimit", "lockDrops", "inFlight"]:
              assert name in status and f'"{name}"' in api
          print("BUNNY_CSHARP_MANAGED_LIVE_QUEUE_LIMITS=PASS")
          PY

      - name: Validate opt-in 25k MonoVM benchmark guards
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path("Split/Bunny-Loader/app/src/main/cpp")
          runtime=(root/"experiments/csharp/ManagedRuntime.cpp").read_text()
          header=(root/"experiments/csharp/ManagedRuntime.h").read_text()
          api=(root/"script/api/CSharpPrototypeApi.cpp").read_text()
          for token in [
              "managedBenchmarkProducer", "startManagedLiveBenchmark",
              "managedLiveBenchmarkStatus", "stopManagedLiveBenchmark",
              "g_liveHitQueue.push({tick, 18, (tick & 1) == 0})",
              "g_liveHitStatus.processed == ManagedLiveEventQueue::kEventLimit",
              "kBenchmarkTimeout = std::chrono::seconds(120)",
              "kBenchmarkInterval = std::chrono::microseconds(400)",
              "g_liveHitGeneration", "finishBenchmarkErrorLocked",
              'g_liveBenchmark.phase = "completed"',
              '"benchmark-timeout"', '"benchmark-cancelled"',
              "g_liveBenchmarkAttempted"
          ]:
              assert token in runtime, token
          assert "struct ManagedLiveBenchmarkStatus" in header
          assert "CONFIRM_25000_CSHARP_CALLBACKS" in api
          for function in [
              "sourceLiveBenchmarkStart", "sourceLiveBenchmarkStatus",
              "sourceLiveBenchmarkStop"
          ]:
              assert f'"{function}"' in api
          assert "mod.applied && mod.worldReady && mod.netMode == 0" in api
          print("BUNNY_CSHARP_REAL_MANAGED_BENCHMARK_GUARDS=PASS")
          PY

      - name: Verify opt-in gameplay performance telemetry
        shell: bash
        run: |
          python3 Split/Bunny-Loader/tests/run_managed_live_queue.py
          python3 - <<'PY'
          from pathlib import Path
          root=Path("Split/Bunny-Loader/app/src/main/cpp")
          runtime=(root/"experiments/csharp/ManagedRuntime.cpp").read_text()
          header=(root/"experiments/csharp/ManagedRuntime.h").read_text()
          queue=(root/"experiments/csharp/ManagedLiveEventQueue.h").read_text()
          cheats=(root/"menu/Cheats.cpp").read_text()
          api=(root/"script/api/CSharpPrototypeApi.cpp").read_text()
          for token in [
              "g_perfState", "g_perfUpdateBins", "g_perfQueueTotalUs",
              "g_perfCallbackTotalUs", "g_perfLockDropBaseline",
              "noteManagedLivePerfUpdate", "startManagedLivePerf",
              "managedLivePerfStatus", "stopManagedLivePerf",
              "kPerfDurationNs = 15000000000LL",
              "g_perfState.store(1, std::memory_order_release)",
              "g_perfCallbacks.fetch_add(1",
              "const std::string& modId = g_liveHitStatus.modId",
              "const std::string& dll = g_liveHitAssembly",
              "g_liveHitInFlight = true",
              "g_liveHitInFlight = false"
          ]:
              assert token in runtime, token
          assert "struct ManagedLivePerfStatus" in header
          assert "uint64_t enqueuedAtNs = 0" in queue
          assert "bl::csharp::noteManagedLivePerfUpdate();" in cheats
          for function in ("sourcePerfStart","sourcePerfStatus","sourcePerfStop"):
              assert f'"{function}"' in api
          assert "mod.applied && mod.worldReady && mod.netMode == 0" in api
          assert "g_liveHitType.load(std::memory_order_acquire)" in runtime
          assert "std::unique_lock<std::mutex> lock(g_pinnedMutex, std::defer_lock)" in runtime
          assert "attempt < 3 && !lock.owns_lock()" in runtime
          assert "lock.try_lock()" in runtime
          print("CSHARP_GAMEPLAY_PROFILER_AND_LOCK_GUARDS=PASS")
          PY

      - name: Verify identical QuickJS and MonoVM math benchmark
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path("Split/Bunny-Loader")
          cpp=(root/"app/src/main/cpp/experiments/csharp/ManagedRuntime.cpp").read_text()
          api=(root/"app/src/main/cpp/script/api/CSharpPrototypeApi.cpp").read_text()
          h=(root/"app/src/main/cpp/experiments/csharp/ManagedRuntime.h").read_text()
          cs=(root/"experiments/csharp/BunnyVmBenchmark67/Kernel.cs").read_text()
          for t in ["0xA5A5A5A5","0x9E3779B9","0x85EBCA6B"]:
              assert t in api and t.lower() in cs.lower(), t
          for t in ["BunnyVmBenchmark67.dll", "g_vmComparePending", "runVmCompareMono",
                    "compareThreadCpuNs", "compareRssKb", "beginVmCompare",
                    "vmCompareStatus", "g_pinnedWake.notify_one()"]:
              assert t in cpp, t
          for t in ["JS_Call(ctx, routine", "JS_ToInt32(ctx, &sample.jsResult",
                    "vmCompareJsThreadCpuNs", "vmCompareProcessRssKb",
                    "vmCompareStart", "vmCompareStatus"]:
              assert t in api, t
          assert "struct VmCompareStatus" in h
          assert 'image, "BunnyLoader.VmBenchmark67", "Kernel"' in cpp
          assert '"Execute", 2' in cpp
          assert "g_vmCompare.monoResult" in cpp
          assert "done.result == g_vmCompare.jsResult" in cpp
          assert "JS_EVAL_TYPE_GLOBAL" in api
          assert "mod.applied && mod.worldReady && mod.netMode == 0" in api
          print("BUNNY_CSHARP_QUICKJS_MONOVM_MATCHED_MATH_GUARDS=PASS")
          PY

      - name: Verify distinct versioned benchmark source binding
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path("Split/Bunny-Loader")
          native=(root/"app/src/main/cpp/experiments/csharp/ManagedRuntime.cpp").read_text()
          kernel=(root/"experiments/csharp/BunnyVmBenchmark67/Kernel.cs").read_text()
          project=(root/"experiments/csharp/BunnyVmBenchmark67/BunnyVmBenchmark67.csproj").read_text()
          for constant in ("0xA5A5A5A5", "0x9E3779B9", "0x85EBCA6B"):
              assert constant in kernel and constant in (
                  root/"app/src/main/cpp/script/api/CSharpPrototypeApi.cpp").read_text()
          assert '"BunnyVmBenchmark67.dll"' in native
          assert '"BunnyLoader.VmBenchmark67", "Kernel"' in native
          assert '"Execute", 2' in native
          assert "AssemblyName>BunnyVmBenchmark67</AssemblyName" in project
          assert "public static int Execute(int iterations, int seed)" in kernel
          assert "result == g_vmCompare.jsResult" in native or "done.result == g_vmCompare.jsResult" in native
          print("BUNNY_BENCHMARK67_UNIQUE_MANAGED_ASSEMBLY_SOURCE=PASS")
          PY

      - name: Verify benchmark assembly extracted before game core loads
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path("Split/Bunny-Loader/app/src/main/kotlin/dev/bunnyloader/GameActivity.kt").read_text()
          worker = Path("Split/Bunny-Loader/app/src/main/kotlin/dev/bunnyloader/csharp/ManagedProbeService.kt").read_text()
          required = [
              'ensureVmBenchmarkAssembly()',
              'assets.open("managed/framework.sha256")',
              'assets.open("managed/$name")',
              'val name = "BunnyVmBenchmark67.dll"',
              'val dir = File(filesDir, "bunny-csharp")',
              'sha256(temporary) == expected',
              'sha256(target) == expected',
              'temporary.renameTo(target)',
              '"$name.game.tmp"',
          ]
          for token in required:
              assert token in src, token
          assert src.index('runCatching { ensureVmBenchmarkAssembly() }') < src.index('startNativeCore() else')
          assert 'private fun installManagedFramework(dir: File)' in worker
          assert 'assets.list("managed")' in worker
          print("BUNNY_CSHARP_GAME_ASSEMBLY_EXTRACTION_GUARDS=PASS")
          PY

      - name: Verify native MonoVM owner controls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("Split/Bunny-Loader/app/src/main/cpp")
          api = (root / "script/api/CSharpPrototypeApi.cpp").read_text()
          runtime = (root / "experiments/csharp/ManagedRuntime.cpp").read_text()
          header = (root / "experiments/csharp/ManagedRuntime.h").read_text()
          assert "NO_MONO" in api and "PINNED_MONO" in api
          assert 'result.phase = "no-mono-control"' in api
          assert "probeManagedRuntimePinnedThread(assembly, selectedMode)" in api
          assert "pinnedOwnerTid" in api
          assert "pthread_create(&thread" in runtime
          assert "pthread_detach(thread)" in runtime
          assert "g_pinnedWake.wait" in runtime
          assert "probeManagedRuntime(assembly)" in runtime
          assert "probeManagedRuntimePinnedThread" in header
          print("MONOVM_PINNED_THREAD_CONTROL_CHECK=PASS")
          PY

      - name: Verify staged MonoVM startup isolation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          cpp = Path("Split/Bunny-Loader/app/src/main/cpp")
          api = (cpp / "script/api/CSharpPrototypeApi.cpp").read_text()
          runtime = (cpp / "experiments/csharp/ManagedRuntime.cpp").read_text()
          header = (cpp / "experiments/csharp/ManagedRuntime.h").read_text()
          for mode in ("LIBRARY_ONLY", "DOMAIN_ONLY", "ATTACH_ONLY", "PINNED_MONO", "NO_MONO"):
              assert mode in api
          assert "probeManagedRuntimeStartupStage(assembly, stage)" in runtime
          assert "trace(\"library-only-verified\")" in runtime
          assert "trace(\"domain-only-verified\")" in runtime
          assert "trace(\"attach-only-verified\")" in runtime
          assert "g_pinnedStage = stage;" in runtime
          assert "probeManagedRuntimePinnedThread" in header
          assert 'selectedMode != "ATTACH_ONLY"' in api
          print("MONOVM_STARTUP_STAGE_ISOLATION=PASS")
          PY

      - name: Verify pre-domain MonoVM controls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("Split/Bunny-Loader/app/src/main/cpp")
          runtime = (root / "experiments/csharp/ManagedRuntime.cpp").read_text()
          api = (root / "script/api/CSharpPrototypeApi.cpp").read_text()
          for name in ("PATH_ONLY", "SYSTEM_NATIVE_ONLY", "LIBRARY_ONLY", "DOMAIN_ONLY", "ATTACH_ONLY"):
              assert name in runtime and name in api
          pre = runtime.split("ManagedRuntimeStatus probeManagedRuntimeStartupStage(", 2)[-1].split("ManagedRuntimeStatus probeManagedRuntimePinnedThread(", 1)[0]
          assert pre.index('trace("path-only-verified")') < pre.index('trace("stage-checking-system-native")')
