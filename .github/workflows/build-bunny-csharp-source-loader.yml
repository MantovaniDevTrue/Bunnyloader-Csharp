name: Build Bunny CSharp Source Files Prototype

on:
  push:
    branches:
      - bunny-csharp-nativeaot-prototype
      - bunny-csharp-nativeaot-0.1.10.1
      - bunny-csharp-nativeaot-0.1.10.2
      - bunny-csharp-nativeaot-0.1.10.3
      - bunny-csharp-nativeaot-0.1.10.4
      - bunny-csharp-nativeaot-0.1.10.5
      - bunny-csharp-source-0.1.10.11-interpreter
      - bunny-csharp-source-0.1.10.12-managed-runtime
      - bunny-csharp-source-0.1.10.12.1-staged-probe
      - bunny-csharp-source-0.1.10.12.2-crash-checkpoint
      - bunny-csharp-source-0.1.10.12.3-isolated-mono
      - bunny-csharp-source-0.1.10.12.4-runtime-dependencies
      - bunny-csharp-source-0.1.10.13-inprocess-gate
      - bunny-csharp-source-0.1.10.14-callback-probe
      - bunny-csharp-source-0.1.10.15-live-projectile-ai
      - bunny-csharp-source-0.1.10.15.1-status-diagnostics
      - bunny-csharp-source-0.1.10.15.2-source-uid-lookup
      - bunny-csharp-source-0.1.10.16-roslyn-worker
      - bunny-csharp-source-0.1.10.16.1-roslyn-checkpoints
      - bunny-csharp-source-0.1.10.16.5-portable-sha256
      - bunny-csharp-source-0.1.10.16.5-serial-emit
      - bunny-csharp-source-0.1.10.16.5-nondeterministic-emit
      - bunny-csharp-source-0.1.10.16.5-reference-trim
      - bunny-csharp-source-0.1.10.16.6-roslyn-minimal-probe
      - bunny-csharp-source-0.1.10.16.7-semantic-exit-probe
      - bunny-csharp-source-0.1.10.16.8-native-exit-metadata
      - bunny-csharp-source-0.1.10.16.9-native-tombstone
      - bunny-csharp-source-0.1.10.16.10-signal-stack
      - bunny-csharp-source-0.1.10.16.11-signal-rearm
      - bunny-csharp-source-0.1.10.16.12-sigaction-watch
      - bunny-csharp-source-0.1.10.16.13-mutex-caller-trace
      - bunny-csharp-source-0.1.10.16.14-mutex-map-trace
      - bunny-csharp-source-0.1.10.16.15-exit-order
      - bunny-csharp-source-0.1.10.16.16-exit-caller
      - bunny-csharp-source-0.1.10.16.17-sigsegv-origin
      - bunny-csharp-source-0.1.10.16.18-crypto-jni-init
    paths:
      - ".github/workflows/build-bunny-csharp-source-loader.yml"
      - "Split/Bunny-Loader/**"

permissions:
  contents: write

concurrency:
  group: bunny-csharp-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUNTIME_TAG: runtime-1.4.5.8.6
      RUNTIME_ASSET: BunnyRuntime_Terraria_1.4.5.8.6.zip
      RUNTIME_SHA256: 2eb8d02dea144cb2fff6a27b94cc371e50ffd9aa44ba4dcd123337691a54c0ab

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install Android toolchain
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;30.0.16248370" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Ensure QuickJS
        shell: bash
        run: |
          rm -rf Split/Bunny-Loader/app/src/main/cpp/third_party/quickjs
          git clone --depth 1 --branch v0.17.0 https://github.com/quickjs-ng/quickjs.git Split/Bunny-Loader/app/src/main/cpp/third_party/quickjs

      - name: Configure Maven mirror
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("Split/Bunny-Loader/settings.gradle.kts")
          s = p.read_text()
          s = s.replace("mavenCentral()", 'maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2") }')
          p.write_text(s)
          PY

      - name: Restore existing stable signing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DIR="$RUNNER_TEMP/bunny-signing"
          mkdir -p "$DIR"
          gh release download bunny-signing-key-v1 --repo "${{ github.repository }}" --pattern "bunny-release.jks" --dir "$DIR"
          PASS="$(python3 - <<'PY'
          import re
          from pathlib import Path
          s = Path(".github/workflows/build-split-full.yml").read_text()
          m = re.search(r'PASS="([^"]+)"', s)
          if not m:
              raise SystemExit("signing password not found")
          print(m.group(1))
          PY
          )"
          echo "BUNNY_SIGNING_STORE=$DIR/bunny-release.jks" >> "$GITHUB_ENV"
          echo "BUNNY_SIGNING_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "BUNNY_SIGNING_ALIAS=bunnyrelease" >> "$GITHUB_ENV"

      - name: Build CSharp NativeAOT library
        shell: bash
        run: |
          NDK="$ANDROID_HOME/ndk/30.0.16248370"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export ANDROID_NDK_ROOT="$NDK"
          export ANDROID_NDK_HOME="$NDK"
          export PATH="$TOOLCHAIN:$PATH"

          PROJECT="Split/Bunny-Loader/experiments/csharp/BunnyCsPrototype/BunnyCsPrototype.csproj"
          dotnet publish "$PROJECT"             -c Release             -r linux-bionic-arm64             -p:PublishAot=true             -p:PublishAotUsingRuntimePack=true             -p:DisableUnsupportedError=true

          PUB="$(find Split/Bunny-Loader/experiments/csharp/BunnyCsPrototype/bin/Release -type d -path '*linux-bionic-arm64/publish' | head -n 1)"
          test -n "$PUB"
          echo "NativeAOT publish: $PUB"
          find "$PUB" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

          CSO="$(find "$PUB" -maxdepth 1 -type f -name 'bunnycs.so' -o -name 'libbunnycs.so' | head -n 1)"
          if [ -z "$CSO" ]; then
            CSO="$(find "$PUB" -maxdepth 1 -type f -name '*.so' | head -n 1)"
          fi
          test -n "$CSO"
          readelf -Ws "$CSO" | grep -q bunnycs_version
          readelf -Ws "$CSO" | grep -q bunnycs_host_api_version
          readelf -Ws "$CSO" | grep -q bunnycs_add
          readelf -Ws "$CSO" | grep -q bunnycs_checksum
          readelf -Ws "$CSO" | grep -q bunnycs_player_sample
          readelf -Ws "$CSO" | grep -q bunnycs_math_batch
          readelf -Ws "$CSO" | grep -q bunnycs_projectile_batch
          readelf -Ws "$CSO" | grep -q bunnycs_npc_scan
          readelf -Ws "$CSO" | grep -q bunnycs_projectile_scan
          readelf -Ws "$CSO" | grep -q bunnycs_host_projectile_tick

          JNI="Split/Bunny-Loader/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$JNI"
          cp "$CSO" "$JNI/libbunnycs.so"
          file "$JNI/libbunnycs.so"
          sha256sum "$JNI/libbunnycs.so"


      - name: Build and validate source-only CSharp mod
        shell: bash
        run: |
          set -euo pipefail
          ROOT="Split/Bunny-Loader"
          CPP="$ROOT/app/src/main/cpp"
          TEST="$RUNNER_TEMP/bunny-csharp-source-parser-test"
          dotnet build "$ROOT/experiments/csharp/SourceCSharpSyntaxCheck/SourceCSharpSyntaxCheck.csproj" \
            -c Release --nologo
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -I"$CPP" \
            "$CPP/experiments/csharp/SourceParser.cpp" \
            "$ROOT/tests/source_parser_smoke.cpp" -o "$TEST"
          "$TEST" "$ROOT/samples/SourceCSharpMod/content/main.cs" \
            "$ROOT/samples/SourceCSharpMod/content/Content/Items/Weapons/SourceWand.cs"
          PKG="$ROOT/samples/SourceCSharpMod"
          test ! -d "$PKG/native"
          test -z "$(find "$PKG" -type f \( -name '*.js' -o -name '*.so' \) -print -quit)"
          python3 "$ROOT/tools/mods/pack.py" "$PKG"
          PACK="$ROOT/build/mods-packs/sourcecsharp-0.1.0.bl"
          test -f "$PACK"
          cp "$PACK" "$RUNNER_TEMP/SourceCSharpMod-v0.1.0.bmod"
          python3 - "$RUNNER_TEMP/SourceCSharpMod-v0.1.0.bmod" <<'PY'
          import json,sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              names=z.namelist()
              manifest=json.loads(z.read("manifest.json"))
              assert manifest["entry"]=="main.cs"
              assert "content/main.cs" in names
              assert "content/Content/Items/Weapons/SourceWand.cs" in names
              assert len([n for n in names if n.endswith(".png")])==2
              assert len([n for n in names if n.endswith(".cs")])==2
              assert not any(n.endswith((".js",".so",".dll")) for n in names)
              print("CSHARP_SOURCE_ONLY_PACKAGE=YES")
          PY
          sha256sum "$RUNNER_TEMP/SourceCSharpMod-v0.1.0.bmod" > "$RUNNER_TEMP/SourceCSharpMod-v0.1.0.bmod.sha256"

      - name: Stage experimental MonoVM and managed probe
        shell: bash
        run: |
          set -euo pipefail
          ROOT="Split/Bunny-Loader"
          PACK="$RUNNER_TEMP/mono-android-arm64-8.0.23.nupkg"
          curl -fLsS --retry 3 \
            "https://api.nuget.org/v3-flatcontainer/microsoft.netcore.app.runtime.mono.android-arm64/8.0.23/microsoft.netcore.app.runtime.mono.android-arm64.8.0.23.nupkg" \
            -o "$PACK"
          JNI="$ROOT/app/src/main/jniLibs/arm64-v8a"
          ASSETS="$ROOT/app/src/main/assets/managed"
          python3 "$ROOT/tools/stage_mono_runtime.py" "$PACK" "$JNI" "$ASSETS"
          file "$JNI/libmonosgen-2.0.so"
          file "$JNI/libSystem.Native.so"
          readelf -Ws "$JNI/libmonosgen-2.0.so" | grep -q 'mono_jit_init' || {
            echo "MonoVM sem Mono Embedding API esperada" >&2
            exit 1
          }
          dotnet build "$ROOT/experiments/csharp/BunnyManagedProbe/BunnyManagedProbe.csproj" \
            -c Release --nologo
          cp "$ROOT/experiments/csharp/BunnyManagedProbe/bin/Release/net8.0/BunnyManagedProbe.dll" \
            "$ASSETS/BunnyManagedProbe.dll"
          test -s "$ASSETS/System.Private.CoreLib.dll"
          test -s "$ASSETS/BunnyManagedProbe.dll"
          echo "MONO_LIBRARY_BUNDLED=YES"
          dotnet build "$ROOT/experiments/csharp/BunnySourceSdk/BunnySourceSdk.csproj" -c Release --nologo
          dotnet build "$ROOT/experiments/csharp/BunnySourceCompiler/BunnySourceCompiler.csproj" -c Release --nologo
          cp "$ROOT/experiments/csharp/BunnySourceSdk/bin/Release/net8.0/BunnySourceSdk.dll" "$ASSETS/"
          cp "$ROOT/experiments/csharp/BunnySourceCompiler/bin/Release/net8.0/BunnySourceCompiler.dll" "$ASSETS/"
          cp "$ROOT/experiments/csharp/BunnySourceCompiler/bin/Release/net8.0/Microsoft.CodeAnalysis.dll" "$ASSETS/"
          cp "$ROOT/experiments/csharp/BunnySourceCompiler/bin/Release/net8.0/Microsoft.CodeAnalysis.CSharp.dll" "$ASSETS/"
          dotnet run --project "$ROOT/experiments/csharp/BunnySourceCompiler.Smoke/BunnySourceCompiler.Smoke.csproj" -c Release -- "$ROOT/samples/SourceCSharpMod" "$ASSETS"
          test -s "$ASSETS/BunnySourceCompiler.dll"
          test -s "$ASSETS/BunnySourceSdk.dll"
          test -s "$ASSETS/Microsoft.CodeAnalysis.dll"
          test -s "$ASSETS/Microsoft.CodeAnalysis.CSharp.dll"
          echo "BUNNY_ROSLYN_IN_APK=YES"
          echo "MANAGED_ASSEMBLY_BUNDLED=YES"

      - name: Integrate Terraria runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/runtime"
          gh release download "$RUNTIME_TAG" --repo "${{ github.repository }}" --pattern "$RUNTIME_ASSET" --dir "$RUNNER_TEMP/runtime"
          cd "$RUNNER_TEMP/runtime"
          echo "$RUNTIME_SHA256  $RUNTIME_ASSET" | sha256sum -c -
          mkdir -p extracted
          unzip -q "$RUNTIME_ASSET" -d extracted
          cd "$GITHUB_WORKSPACE"
          JNI="Split/Bunny-Loader/app/src/main/jniLibs/arm64-v8a"
          ASSETS="Split/Bunny-Loader/terraria1456_assets/src/main/assets"
          mkdir -p "$JNI" "$ASSETS/bin"
          cp "$RUNNER_TEMP/runtime/extracted/lib/arm64-v8a/libil2cpp.so" "$JNI/"
          cp "$RUNNER_TEMP/runtime/extracted/lib/arm64-v8a/libunity.so" "$JNI/"
          cp "$RUNNER_TEMP/runtime/extracted/lib/arm64-v8a/libmain.so" "$JNI/"
          cp "$RUNNER_TEMP/runtime/extracted/lib/arm64-v8a/libc++_shared.so" "$JNI/"
          rm -rf "$ASSETS/bin/Data"
          cp -a "$RUNNER_TEMP/runtime/extracted/assets/bin/Data" "$ASSETS/bin/Data"

      - name: Restore stable sprite pack
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/stable-apk"
          gh release download bunny-music-prewarm-v1 --repo "${{ github.repository }}" --pattern "BunnyLoader-v0.1.9.1-MusicPrewarm.apk" --dir "$RUNNER_TEMP/stable-apk"
          mkdir -p "$RUNNER_TEMP/stable-sprites"
          unzip -q "$RUNNER_TEMP/stable-apk/BunnyLoader-v0.1.9.1-MusicPrewarm.apk" "assets/sprites/*" -d "$RUNNER_TEMP/stable-sprites"
          ROOT="Split/Bunny-Loader/_sprites"
          rm -rf "$ROOT/item" "$ROOT/npc" "$ROOT/buff"
          mkdir -p "$ROOT"
          cp -a "$RUNNER_TEMP/stable-sprites/assets/sprites/item" "$ROOT/"
          cp -a "$RUNNER_TEMP/stable-sprites/assets/sprites/npc" "$ROOT/"
          cp -a "$RUNNER_TEMP/stable-sprites/assets/sprites/buff" "$ROOT/"

      - name: Rebuild CheatBridge dex
        working-directory: Split/Bunny-Loader
        shell: bash
        run: |
          OUT=".cheatbridge"
          AJAR="$ANDROID_HOME/platforms/android-34/android.jar"
          D8="$ANDROID_HOME/build-tools/34.0.0/d8"
          rm -rf "$OUT"
          mkdir -p "$OUT/classes"
          javac -source 8 -target 8 -nowarn -encoding UTF-8 -classpath "$AJAR" -d "$OUT/classes"             tools/cheatbridge/bunny/CheatBridge.java             tools/cheatbridge/bunny/CheatData.java             tools/cheatbridge/bunny/DevTools.java
          mapfile -t CLASSES < <(find "$OUT/classes" -name "*.class" -type f)
          "$D8" --release --min-api 26 --lib "$AJAR" --output "$OUT" "${CLASSES[@]}"
          python3 tools/bin2header.py "$OUT/classes.dex" bl_cheatbridge_dex > app/src/main/cpp/menu/CheatBridgeDex.h

      - name: Build APK
        working-directory: Split/Bunny-Loader
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Validate APK
        shell: bash
        run: |
          APK="Split/Bunny-Loader/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep -q "package: name='com.bunnyloader.csharptest'"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep -q "application-label:'Bunny Loader C# Test'"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libbunny.so"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libbunnycs.so"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libmonosgen-2.0.so"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libSystem.Native.so"
          unzip -l "$APK" | grep -q "assets/managed/System.Runtime.dll"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libbunnymonoprobe.so"
          unzip -l "$APK" | grep -q "assets/managed/BunnyManagedProbe.dll"
          unzip -l "$APK" | grep -q "assets/managed/BunnySourceCompiler.dll"
          unzip -l "$APK" | grep -q "assets/managed/BunnySourceSdk.dll"
          unzip -l "$APK" | grep -q "assets/managed/Microsoft.CodeAnalysis.CSharp.dll"
          unzip -l "$APK" | grep -q "assets/managed/System.Private.CoreLib.dll"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libil2cpp.so"
          unzip -l "$APK" | grep -q "assets/bin/Data/Managed/Metadata/global-metadata.dat"

      - name: Export source-loader test artifacts
        shell: bash
        run: |
          OUT="BunnyLoader-CSharp-Test-v0.1.10.16.18-CryptoJniInit.apk"
          cp "Split/Bunny-Loader/app/build/outputs/apk/debug/app-debug.apk" "$RUNNER_TEMP/$OUT"
          sha256sum "$RUNNER_TEMP/$OUT" > "$RUNNER_TEMP/$OUT.sha256"
          test -f "$RUNNER_TEMP/SourceCSharpMod-v0.1.0.bmod"
          test -f "$RUNNER_TEMP/SourceCSharpMod-v0.1.0.bmod.sha256"

      - name: Publish signed APK as GitHub Release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="bunny-csharp-managed-runtime-0.1.10.16.18"
          FALLBACK="bunny-csharp-native-armor-combat-v1"
          APK="$RUNNER_TEMP/BunnyLoader-CSharp-Test-v0.1.10.16.18-CryptoJniInit.apk"
          test -s "$APK"
          test -s "$APK.sha256"
          test -s "$RUNNER_TEMP/SourceCSharpMod-v0.1.0.bmod"
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "${{ github.repository }}" \
              --target "$GITHUB_SHA" \
              --title "Bunny Loader C# v0.1.10.16.18 — Mono Crypto JNI Initialization Fix" \
              --notes "Experimental fix for MonoVM Roslyn Android worker: load System.Security.Cryptography.Native.Android via Android Java System.loadLibrary before Mono compilation, triggering its required JNI_OnLoad to initialize JavaVM and cached JNI classes; include the exact upstream DotnetProxyTrustManager helper source (without comments). Keep native SIGSEGV/exit diagnostics and existing FORTIFY behavior. NativeAOT and JavaScript game runtime unchanged. Android device validation required." \
              --prerelease || true
          fi
          DEST="$TAG"
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            DEST="$FALLBACK"
            echo "New release creation unavailable; publishing extra v0.1.10.16.5 assets into existing private test release."
          fi
          gh release upload "$DEST" \
            "$APK" "$APK.sha256" \
            "$RUNNER_TEMP/SourceCSharpMod-v0.1.0.bmod" \
            "$RUNNER_TEMP/SourceCSharpMod-v0.1.0.bmod.sha256" \
            --repo "${{ github.repository }}" --clobber
          echo "MANAGED_RUNTIME_RELEASE_TAG=$DEST"

      - name: Publish prototype APK
        if: ${{ false }}

        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="bunny-csharp-source-interpreter-v1"
          OUT="BunnyLoader-CSharp-Test-v0.1.10.16.18-CryptoJniInit.apk"
          APK="Split/Bunny-Loader/app/build/outputs/apk/debug/app-debug.apk"
          cp "$APK" "$RUNNER_TEMP/$OUT"
          cp "Split/Bunny-Loader/app/src/main/jniLibs/arm64-v8a/libbunnycs.so" "$RUNNER_TEMP/libbunnycs.so"
          sha256sum "$RUNNER_TEMP/$OUT" > "$RUNNER_TEMP/$OUT.sha256"
          MOD="$RUNNER_TEMP/SourceCSharpMod-v0.1.0.bmod"
          MODSHA="$RUNNER_TEMP/SourceCSharpMod-v0.1.0.bmod.sha256"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/$OUT" "$RUNNER_TEMP/$OUT.sha256" "$RUNNER_TEMP/libbunnycs.so" "$MOD" "$MODSHA" --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" \
              "$RUNNER_TEMP/$OUT#$OUT" \
              "$RUNNER_TEMP/$OUT.sha256#APK SHA-256" \
              "$RUNNER_TEMP/libbunnycs.so#libbunnycs.so" \
              "$MOD#Source C# Mod 0.1.0" \
              "$MODSHA#Example C# Mod SHA-256" \
              --repo "${{ github.repository }}" \
              --target "$GITHUB_SHA" \
              --title "Bunny Loader C# Test v0.1.10.11 — Source Files Prototype" \
              --notes "Experimental source-only C# mod format: imports main.cs and SourceWand.cs with no JS, DLL, or SO inside the mod. A constrained C# SetDefaults literals interpreter reads source and registers weapon/projectile directly with native host. NOT full C#/.NET execution. Preserves working JS and NativeAOT pathways. Requires Android testing." \
              --prerelease
          fi
