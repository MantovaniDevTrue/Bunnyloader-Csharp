          }
          dotnet build "$ROOT/experiments/csharp/BunnyManagedProbe/BunnyManagedProbe.csproj" \
            -c Release --nologo
          cp "$ROOT/experiments/csharp/BunnyManagedProbe/bin/Release/net8.0/BunnyManagedProbe.dll" \
            "$ASSETS/BunnyManagedProbe.dll"
          dotnet build "$ROOT/experiments/csharp/BunnyVmBenchmark67/BunnyVmBenchmark67.csproj" \
            -c Release --nologo
          cp "$ROOT/experiments/csharp/BunnyVmBenchmark67/bin/Release/net8.0/BunnyVmBenchmark67.dll" \
            "$ASSETS/BunnyVmBenchmark67.dll"
          dotnet build "$ROOT/experiments/csharp/BunnyVmGameplay69/BunnyVmGameplay69.csproj" \
            -c Release --nologo
          cp "$ROOT/experiments/csharp/BunnyVmGameplay69/bin/Release/net8.0/BunnyVmGameplay69.dll" \
            "$ASSETS/BunnyVmGameplay69.dll"
          VERIFIER="$RUNNER_TEMP/bunny-managed-benchmark-verify"
          mkdir -p "$VERIFIER"
          cat > "$VERIFIER/Verify.csproj" <<'CSHTML'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
            </PropertyGroup>
          </Project>
          CSHTML
          cat > "$VERIFIER/Program.cs" <<'CSCODE'
          using System;
          using System.IO;
          using System.Reflection;
          var path = Path.GetFullPath(args[0]);
          var asm = Assembly.LoadFrom(path);
          var type = asm.GetType("BunnyLoader.VmBenchmark67.Kernel", throwOnError: true)!;
          var method = type.GetMethod("Execute",
              BindingFlags.Public | BindingFlags.Static,
              binder: null, types: new[] {typeof(int), typeof(int)}, modifiers: null);
          if (method == null) throw new Exception("Kernel.Execute(int,int) is absent in bundled binary");
          var value = (int)method.Invoke(null, new object[] {1000000, 0x12345678})!;
          if (value != 1336190628)
              throw new Exception("Managed binary checksum mismatch: " + value);
          Console.WriteLine("BUNNY_MANAGED_BENCHMARK_DLL_INVOKE=PASS value=" + value);
          CSCODE
          dotnet run --project "$VERIFIER/Verify.csproj" --configuration Release \
            -- "$ASSETS/BunnyVmBenchmark67.dll"
          test -s "$ASSETS/BunnyVmBenchmark67.dll"
          python3 - <<'PY'
          from pathlib import Path
          import os, json, re
          cpp = Path("Split/Bunny-Loader/app/src/main/cpp/script/api/CSharpPrototypeApi.cpp").read_text()
          found = {}
          for name in ("kVmProjectileJs", "kVmNpcJs"):
              m = re.search(r'constexpr char ' + name + r'\[\] = R"JS\(\n(.*?)\n\)JS";', cpp, re.S)
              assert m, name
              found[name] = m.group(1)
          Path(os.environ["RUNNER_TEMP"], "vm-ai-kernels-69.json").write_text(json.dumps(found))
          print("BUNNY_AI_JS_KERNELS_EXTRACTED=PASS")
          PY
          node - <<'NODE'
          const fs = require("fs");
          const path = process.env.RUNNER_TEMP;
          const source = JSON.parse(fs.readFileSync(path + "/vm-ai-kernels-69.json", "utf8"));
          const rows = [];
          for (const [key, method] of [["kVmProjectileJs", "Projectile"], ["kVmNpcJs", "Npc"]]) {
              const routine = eval(source[key]);
              for (const ticks of [64, 512, 2000]) {
                  const checksum = routine(ticks, 0x12345678);
                  if (!Number.isInteger(checksum)) throw new Error("invalid JS checksum");
                  rows.push([method, ticks, checksum].join("\t"));
              }
          }
          fs.writeFileSync(path + "/vm-ai-expected-69.tsv", rows.join("\n") + "\n");
          console.log("BUNNY_AI_JAVASCRIPT_CHECKSUMS=PASS\n" + rows.join("\n"));
          NODE
          AIVERIFIER="$RUNNER_TEMP/bunny-managed-ai-verify"
          mkdir -p "$AIVERIFIER"
          cp "$VERIFIER/Verify.csproj" "$AIVERIFIER/Verify.csproj"
          cat > "$AIVERIFIER/Program.cs" <<'CSCODE'
          using System;
          using System.IO;
          using System.Reflection;
          var assembly = Assembly.LoadFrom(Path.GetFullPath(args[0]));
          var type = assembly.GetType("BunnyLoader.VmGameplay69.Kernel", true)!;
          int checkedCount = 0;
          foreach (var line in File.ReadLines(args[1]))
          {
              var cells = line.Split('\t');
              var method = type.GetMethod(cells[0], BindingFlags.Public | BindingFlags.Static,
                  null, new[] {typeof(int), typeof(int)}, null);
              if (method == null) throw new Exception("Missing managed " + cells[0]);
              int ticks = int.Parse(cells[1]);
              int expected = int.Parse(cells[2]);
              int actual = (int)method.Invoke(null, new object[] {ticks, 0x12345678})!;
              if (actual != expected)
                  throw new Exception("AI mismatch " + cells[0] + " ticks=" + ticks +
                      " JS=" + expected + " Mono=" + actual);
              checkedCount++;
          }
          if (checkedCount != 6) throw new Exception("Expected 6 parity cases, got " + checkedCount);
          Console.WriteLine("BUNNY_AI_MANAGED_JS_CHECKSUM_MATCH=PASS cases=" + checkedCount);
          CSCODE
          dotnet run --project "$AIVERIFIER/Verify.csproj" -c Release -- \
            "$ASSETS/BunnyVmGameplay69.dll" "$RUNNER_TEMP/vm-ai-expected-69.tsv"
          test -s "$ASSETS/BunnyVmGameplay69.dll"
          test -s "$ASSETS/System.Private.CoreLib.dll"
          test -s "$ASSETS/BunnyManagedProbe.dll"
          echo "MONO_LIBRARY_BUNDLED=YES"
          dotnet build "$ROOT/experiments/csharp/BunnySourceSdk/BunnySourceSdk.csproj" -c Release --nologo
          dotnet build "$ROOT/experiments/csharp/BunnySourceCompiler/BunnySourceCompiler.csproj" -c Release --nologo
          cp "$ROOT/experiments/csharp/BunnySourceSdk/bin/Release/net8.0/BunnySourceSdk.dll" "$ASSETS/"
          cp "$ROOT/experiments/csharp/BunnySourceCompiler/bin/Release/net8.0/BunnySourceCompiler.dll" "$ASSETS/"
          cp "$ROOT/experiments/csharp/BunnySourceCompiler/bin/Release/net8.0/Microsoft.CodeAnalysis.dll" "$ASSETS/"
          cp "$ROOT/experiments/csharp/BunnySourceCompiler/bin/Release/net8.0/Microsoft.CodeAnalysis.CSharp.dll" "$ASSETS/"
          dotnet run --project "$ROOT/experiments/csharp/BunnySourceCompiler.Smoke/BunnySourceCompiler.Smoke.csproj" -c Release -- "$ROOT/samples/SourceCSharpMod" "$ASSETS" \
            "$ROOT/samples/SecondExampleModCSharp/Playable"
          test -s "$ASSETS/BunnySourceCompiler.dll"
          test -s "$ASSETS/BunnySourceSdk.dll"
          python3 - "$ASSETS/BunnySourceSdk.dll" <<'PY'
          from pathlib import Path
          import sys
          sdk = Path(sys.argv[1]).read_bytes()
          assert b"MoveSpeedPercent" in sdk, "Embarcado BunnySourceSdk sem MoveSpeedPercent"
          print("BUNNY_CSHARP_ANDROID_SDK_MOVESPEED=PASS")
          PY
          test -s "$ASSETS/Microsoft.CodeAnalysis.dll"
          test -s "$ASSETS/Microsoft.CodeAnalysis.CSharp.dll"
          echo "BUNNY_ROSLYN_IN_APK=YES"
          echo "MANAGED_ASSEMBLY_BUNDLED=YES"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path("Split/Bunny-Loader/app/src/main/assets/managed")
          libraries = sorted(root.glob("*.dll"))
          assert libraries, "No managed assemblies for manifest"
          manifest = "".join(
              f"{file.name}\t{hashlib.sha256(file.read_bytes()).hexdigest()}\n"
              for file in libraries
          )
          (root / "framework.sha256").write_text(manifest, encoding="utf-8")
          print(f"MANAGED_FRAMEWORK_FINGERPRINT_READY=YES files={len(libraries)}")
          PY

