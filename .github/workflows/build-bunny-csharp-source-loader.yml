      - bunny-csharp-source-0.1.10.16.5-reference-trim
      - bunny-csharp-source-0.1.10.16.6-roslyn-minimal-probe
      - bunny-csharp-source-0.1.10.16.7-semantic-exit-probe
      - bunny-csharp-source-0.1.10.16.8-native-exit-metadata
      - bunny-csharp-source-0.1.10.16.9-native-tombstone
      - bunny-csharp-source-0.1.10.16.10-signal-stack
