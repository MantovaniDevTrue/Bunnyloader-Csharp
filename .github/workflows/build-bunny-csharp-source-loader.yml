            --framework "$ROOT/app/src/main/assets/managed" --cross "$CROSS" \
            --clang "$CLANG" --mono "$JNI/libmonosgen-2.0.so" \
            --output "$JNI/libbunnycompileraot.so" --work "$ROOT/build/compiler-aot"
          readelf -h "$JNI/libbunnycompileraot.so" | grep AArch64
