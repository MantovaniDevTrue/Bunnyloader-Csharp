      - name: Build APK with isolated v3 signing secrets
        working-directory: Split/Bunny-Loader
        shell: bash
        env:
          BUNNY_KEYSTORE_B64: ${{ secrets.BUNNY_KEYSTORE_B64 }}
          BUNNY_SIGNING_PASSWORD: ${{ secrets.BUNNY_SIGNING_PASSWORD }}
          BUNNY_SIGNING_ALIAS: ${{ secrets.BUNNY_SIGNING_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${BUNNY_KEYSTORE_B64:-}" ] || [ -z "${BUNNY_SIGNING_PASSWORD:-}" ] || [ -z "${BUNNY_SIGNING_ALIAS:-}" ]; then
            echo "Missing Bunny signing secrets. Configure BUNNY_KEYSTORE_B64, BUNNY_SIGNING_PASSWORD and BUNNY_SIGNING_ALIAS." >&2
            exit 1
          fi
          umask 077
          SIGNING_DIR="$RUNNER_TEMP/bunny-signing-v3"
          mkdir -p "$SIGNING_DIR"
          export BUNNY_SIGNING_STORE="$SIGNING_DIR/bunny-v3.jks"
          trap 'rm -f "$BUNNY_SIGNING_STORE"' EXIT
          printf '%s' "$BUNNY_KEYSTORE_B64" | base64 --decode > "$BUNNY_SIGNING_STORE"
          test -s "$BUNNY_SIGNING_STORE"
          keytool -list -keystore "$BUNNY_SIGNING_STORE" -storepass:env BUNNY_SIGNING_PASSWORD -alias "$BUNNY_SIGNING_ALIAS" >/dev/null
          unset BUNNY_KEYSTORE_B64
          echo 'BUNNY_V3_SECRET_KEYSTORE_VALIDATED=YES'
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Validate APK
        shell: bash
        run: |
          APK="Split/Bunny-Loader/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.bunnyloader.csharptest'"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep -F "application-label:'Bunny Loader C# Test'"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libbunny.so"
          python3 - "$APK" <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import sys
          with ZipFile(sys.argv[1]) as package:
              native = package.read("lib/arm64-v8a/libbunny.so")
          for marker in (b"nCSharpHookCounters", b"editorCsharpMode",
                         b"Hooks C#: aguardando evento de dano", b"MissingHand",
                         b"AnimationConstructor3Failed", b"ColorChannelLayoutUnavailable",
                         b"WorldItemActiveGetterContract"):
              assert marker in native, "Embedded CSharp editor dex missing: " + marker.decode()
          print("BUNNY_CSHARP_VISIBLE_HOOK_EDITOR_EMBEDDED_DEX=PASS")
          PY
          python3 - "$APK" <<'PY'
          import sys
          import zipfile
          with zipfile.ZipFile(sys.argv[1]) as package:
              dex = [package.read(name) for name in package.namelist()
                     if name.startswith("classes") and name.endswith(".dex")]
              assert dex, "No Android DEX found in APK"
              for item in ("Lcom/unity3d/player/UnityPlayer;",
                           "Lcom/unity3d/player/NativeLoader;",
                           "Lcom/unity3d/player/IUnityPlayerLifecycleEvents;"):
                  assert any(item.encode() in content for content in dex), "Unity class absent from APK: " + item
              print("BUNNY_CLEAN_UNITY_PLAYER_IN_APK=PASS")
          PY
          if unzip -Z1 "$APK" | grep -Fx "lib/arm64-v8a/libbunnycs.so"; then
            echo "NativeAOT prototype was unexpectedly bundled in projectile-profiler APK" >&2
            exit 1
          fi
          echo "BUNNY_MANAGED_DEFAULT_NO_NATIVEAOT_PROTOTYPE=PASS"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libmonosgen-2.0.so"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libSystem.Native.so"
          unzip -l "$APK" | grep -F "assets/managed/System.Runtime.dll"
