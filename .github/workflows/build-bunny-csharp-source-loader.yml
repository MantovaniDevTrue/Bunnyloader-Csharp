      - bunny-csharp-source-0.1.10.16.23-helper-class-fix
      - bunny-csharp-source-0.1.10.16.24-homing-policy
      - bunny-csharp-source-0.1.10.16.25-npc-ref-hotfix
      - bunny-csharp-source-0.1.10.16.26-local-player-fallback
      - bunny-csharp-source-0.1.10.16.27-onhit-buff
      - bunny-csharp-source-0.1.10.16.28-onhit-precise
      - bunny-csharp-source-0.1.10.16.29-roslyn-memory
      - bunny-csharp-source-0.1.10.16.30-onkill-burn
      - bunny-csharp-source-0.1.10.16.31-multi-content
      - bunny-csharp-source-0.1.10.16.32-multicontent-homing
      - bunny-csharp-source-0.1.10.16.33-spark-ai
      - bunny-csharp-source-0.1.10.16.34-generic-projectile-ai
      - bunny-csharp-source-0.1.10.16.35-examplemod-independent
      - bunny-csharp-source-0.1.10.16.36-auto-loader
      - bunny-csharp-source-0.1.10.16.37-auto-loader-polish
      - bunny-csharp-source-0.1.10.16.38-auto-arm-fix
      - bunny-csharp-source-0.1.10.16.39-menu-field-optional
      - bunny-csharp-source-0.1.10.16.40-auto-combat
      - bunny-csharp-source-0.1.10.16.41-buff
      - bunny-csharp-source-0.1.10.16.42-player-accessory
      - bunny-csharp-source-0.1.10.16.43-npc
      - bunny-csharp-source-0.1.10.16.45-live-runtime
      - bunny-csharp-source-0.1.10.16.46-live-npc-ai
      - bunny-csharp-source-0.1.10.16.47-live-npc-syntax
      - bunny-csharp-source-0.1.10.16.48-async-npc-ai
      - bunny-csharp-source-0.1.10.16.49-mono-thread-lifecycle
    paths:
      - ".github/workflows/build-bunny-csharp-source-loader.yml"
      - "Split/Bunny-Loader/**"

permissions:
  contents: write

concurrency:
  group: bunny-csharp-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUNTIME_TAG: runtime-1.4.5.8.6
      RUNTIME_ASSET: BunnyRuntime_Terraria_1.4.5.8.6.zip
      RUNTIME_SHA256: 2eb8d02dea144cb2fff6a27b94cc371e50ffd9aa44ba4dcd123337691a54c0ab

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install Android toolchain
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;30.0.16248370" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Ensure QuickJS
        shell: bash
        run: |
          rm -rf Split/Bunny-Loader/app/src/main/cpp/third_party/quickjs
          git clone --depth 1 --branch v0.17.0 https://github.com/quickjs-ng/quickjs.git Split/Bunny-Loader/app/src/main/cpp/third_party/quickjs

      - name: Configure Maven mirror
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("Split/Bunny-Loader/settings.gradle.kts")
          s = p.read_text()
          s = s.replace("mavenCentral()", 'maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2") }')
          p.write_text(s)
          PY

      - name: Restore existing stable signing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DIR="$RUNNER_TEMP/bunny-signing"
          mkdir -p "$DIR"
          gh release download bunny-signing-key-v1 --repo "${{ github.repository }}" --pattern "bunny-release.jks" --dir "$DIR"
          PASS="$(python3 - <<'PY'
          import re
          from pathlib import Path
          s = Path(".github/workflows/build-split-full.yml").read_text()
          m = re.search(r'PASS="([^"]+)"', s)
          if not m:
              raise SystemExit("signing password not found")
          print(m.group(1))
          PY
          )"
          echo "BUNNY_SIGNING_STORE=$DIR/bunny-release.jks" >> "$GITHUB_ENV"
          echo "BUNNY_SIGNING_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "BUNNY_SIGNING_ALIAS=bunnyrelease" >> "$GITHUB_ENV"

      - name: Build CSharp NativeAOT library
        shell: bash
        run: |
          NDK="$ANDROID_HOME/ndk/30.0.16248370"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export ANDROID_NDK_ROOT="$NDK"
          export ANDROID_NDK_HOME="$NDK"
          export PATH="$TOOLCHAIN:$PATH"

          PROJECT="Split/Bunny-Loader/experiments/csharp/BunnyCsPrototype/BunnyCsPrototype.csproj"
          dotnet publish "$PROJECT"             -c Release             -r linux-bionic-arm64             -p:PublishAot=true             -p:PublishAotUsingRuntimePack=true             -p:DisableUnsupportedError=true

          PUB="$(find Split/Bunny-Loader/experiments/csharp/BunnyCsPrototype/bin/Release -type d -path '*linux-bionic-arm64/publish' | head -n 1)"
          test -n "$PUB"
          echo "NativeAOT publish: $PUB"
          find "$PUB" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

          CSO="$(find "$PUB" -maxdepth 1 -type f -name 'bunnycs.so' -o -name 'libbunnycs.so' | head -n 1)"
          if [ -z "$CSO" ]; then
            CSO="$(find "$PUB" -maxdepth 1 -type f -name '*.so' | head -n 1)"
          fi
          test -n "$CSO"
          readelf -Ws "$CSO" | grep -q bunnycs_version
          readelf -Ws "$CSO" | grep -q bunnycs_host_api_version
          readelf -Ws "$CSO" | grep -q bunnycs_add
          readelf -Ws "$CSO" | grep -q bunnycs_checksum
          readelf -Ws "$CSO" | grep -q bunnycs_player_sample
          readelf -Ws "$CSO" | grep -q bunnycs_math_batch
          readelf -Ws "$CSO" | grep -q bunnycs_projectile_batch
          readelf -Ws "$CSO" | grep -q bunnycs_npc_scan
          readelf -Ws "$CSO" | grep -q bunnycs_projectile_scan
          readelf -Ws "$CSO" | grep -q bunnycs_host_projectile_tick

          JNI="Split/Bunny-Loader/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$JNI"
          cp "$CSO" "$JNI/libbunnycs.so"
          file "$JNI/libbunnycs.so"
          sha256sum "$JNI/libbunnycs.so"


      - name: Build and validate source-only CSharp mod
        shell: bash
        run: |
          set -euo pipefail
          ROOT="Split/Bunny-Loader"
          CPP="$ROOT/app/src/main/cpp"
          TEST="$RUNNER_TEMP/bunny-csharp-source-parser-test"
          dotnet build "$ROOT/experiments/csharp/SourceCSharpSyntaxCheck/SourceCSharpSyntaxCheck.csproj" \
            -c Release --nologo
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -I"$CPP" \
            "$CPP/experiments/csharp/SourceParser.cpp" \
            "$ROOT/tests/source_parser_smoke.cpp" -o "$TEST"
          python3 - "$CPP/script/api/CSharpPrototypeApi.cpp" <<'PY'
          import pathlib, sys
          content = pathlib.Path(sys.argv[1]).read_text()
          assert 'mod.sourceFiles == 3' not in content, "Legacy 3-file homing gate"
          assert 'mod.registeredTypes.contains("SourceBolt")' in content, "Homing must verify SourceBolt"
          print("CSHARP_MULTI_CONTENT_HOMING_GUARD=PASS")
          PY
          "$TEST" "$ROOT/samples/SourceCSharpMod/content/main.cs" \
            "$ROOT/samples/SourceCSharpMod/content/Content/Items/Weapons/SourceWand.cs" \
            "$ROOT/samples/SourceCSharpMod/content/Content/Projectiles/SourceSpark.cs" \
            "$ROOT/samples/SourceCSharpMod/content/Content/Items/Weapons/SourceStaff.cs" \
            "$ROOT/samples/SourceCSharpMod/content/SourceBoltMotion.cs" \
            "$ROOT/samples/ExampleModCSharp/Playable/content/Common/Live/ExampleLiveNpcAI.cs"
          PKG="$ROOT/samples/SourceCSharpMod"
          test ! -d "$PKG/native"
          test -z "$(find "$PKG" -type f \( -name '*.js' -o -name '*.so' \) -print -quit)"
          python3 "$ROOT/tools/mods/pack.py" "$PKG"
          PACK="$ROOT/build/mods-packs/sourcecsharp-0.1.5.bl"
          test -f "$PACK"
          cp "$PACK" "$RUNNER_TEMP/SourceCSharpMod-v0.1.5.bmod"
          python3 - "$RUNNER_TEMP/SourceCSharpMod-v0.1.5.bmod" <<'PY'
          import json,sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              names=z.namelist()
              manifest=json.loads(z.read("manifest.json"))
              assert manifest["entry"]=="main.cs"
              assert "content/main.cs" in names
              assert "content/Content/Items/Weapons/SourceWand.cs" in names
              assert "content/Content/Items/Weapons/SourceStaff.cs" in names
              assert "content/Content/Projectiles/SourceSpark.cs" in names
              assert "content/SourceSparkMotion.cs" in names
              assert len([n for n in names if n.endswith(".png")])==2
              assert "content/SourceBoltMotion.cs" in names
              assert len([n for n in names if n.endswith(".cs")])==6
              assert not any(n.endswith((".js",".so",".dll")) for n in names)
              print("CSHARP_SOURCE_ONLY_PACKAGE=YES")
          PY
          sha256sum "$RUNNER_TEMP/SourceCSharpMod-v0.1.5.bmod" > "$RUNNER_TEMP/SourceCSharpMod-v0.1.5.bmod.sha256"

      - name: Package independent ExampleMod CSharp 0.1.6
        shell: bash
        run: |
          set -euo pipefail
          ROOT="Split/Bunny-Loader"
          PKG="$ROOT/samples/ExampleModCSharp/Playable"
          python3 "$ROOT/samples/ExampleModCSharp/Tests/check_examples.py"
          mkdir -p "$PKG/content/Content/Projectiles" "$PKG/content/Content/Items/Weapons" \
            "$PKG/content/Content/Buffs" "$PKG/content/Content/Items/Consumables" \
            "$PKG/content/Content/Items/Accessories" "$PKG/content/Content/NPCs"
          cp "$ROOT/samples/SourceCSharpMod/content/Content/Projectiles/SourceBolt.png" \
            "$PKG/content/Content/Projectiles/SourceBolt.png"
          cp "$ROOT/samples/SourceCSharpMod/content/Content/Items/Weapons/SourceWand.png" \
            "$PKG/content/Content/Items/Weapons/SourceWand.png"
          cp "$ROOT/samples/ExampleMod/content/Content/Buffs/ExampleDefenseBuff.png" \
            "$PKG/content/Content/Buffs/ExampleDefenseBuff.png"
          cp "$ROOT/samples/ExampleMod/content/Content/Items/Consumables/ExampleBuffPotion.png" \
            "$PKG/content/Content/Items/Consumables/ExampleBuffPotion.png"
          cp "$ROOT/samples/ExampleMod/content/Content/Items/Accessories/ExampleStatAccessory.png" \
            "$PKG/content/Content/Items/Accessories/ExampleFocusAccessory.png"
          cp "$ROOT/samples/ExampleMod/content/Content/NPCs/ExampleSlimeNPC.png" \
            "$PKG/content/Content/NPCs/ExampleSlimeNPC.png"
          test -z "$(find "$PKG" -type f \( -name '*.js' -o -name '*.so' -o -name '*.dll' \) -print -quit)"
          python3 "$ROOT/tools/mods/pack.py" "$PKG"
          SOURCE="$ROOT/build/mods-packs/examplemodcsharp-0.1.6.bl"
          test -s "$SOURCE"
          cp "$SOURCE" "$RUNNER_TEMP/ExampleModCSharp-v0.1.6.bmod"
          python3 - "$RUNNER_TEMP/ExampleModCSharp-v0.1.6.bmod" <<'PY'
          import json,sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              names=z.namelist()
              manifest=json.loads(z.read("manifest.json"))
              assert manifest["id"]=="examplemodcsharp"
              assert manifest["uid"]=="68c3115f-62f4-49f2-a56b-388256781d5f"
              assert manifest["entry"]=="main.cs"
              assert len([n for n in names if n.endswith(".cs")])==10
              assert "content/main.cs" in names
              assert "content/Content/Items/Weapons/ExampleWand.cs" in names
              assert "content/ExampleBoltMotion.cs" in names
              assert "content/Content/Buffs/ExampleDefenseBuff.cs" in names
              assert "content/Content/Items/Consumables/ExampleBuffPotion.cs" in names
              assert "content/Content/Buffs/ExampleDefenseBuff.png" in names
              assert "content/Content/Items/Consumables/ExampleBuffPotion.png" in names
              assert "content/Content/Items/Accessories/ExampleFocusAccessory.cs" in names
              assert "content/Common/Players/ExampleFocusPlayer.cs" in names
              assert "content/Content/Items/Accessories/ExampleFocusAccessory.png" in names
              assert "content/Content/NPCs/ExampleSlimeNPC.cs" in names
              assert "content/Content/NPCs/ExampleSlimeNPC.png" in names
              assert "content/Common/Live/ExampleLiveRuntime.cs" in names
              assert "content/Common/Live/ExampleLiveNpcAI.cs" in names
              assert len([n for n in names if n.endswith(".png")])==6
              assert not any(n.endswith((".dll",".so",".js")) for n in names)
              print("EXAMPLEMOD_CSHARP_INDEPENDENT_BMOD=PASS")
          PY
          sha256sum "$RUNNER_TEMP/ExampleModCSharp-v0.1.6.bmod" > \
            "$RUNNER_TEMP/ExampleModCSharp-v0.1.6.bmod.sha256"

      - name: Validate generic C# projectile policy integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path("Split/Bunny-Loader")
          compiler=(root/"experiments/csharp/BunnySourceCompiler/CompiledAssemblyProbe.cs").read_text()
          native=(root/"app/src/main/cpp/experiments/csharp/ManagedProjectileHook.cpp").read_text()
          api=(root/"app/src/main/cpp/script/api/CSharpPrototypeApi.cpp").read_text()
          smoke=(root/"experiments/csharp/BunnySourceCompiler.Smoke/Program.cs").read_text()
          assert "BUNNY_PROJECTILE_TURNS_V1" in compiler
          assert "managedProjectileCurveStatus" in native
          assert "g_curveByType" in native
          assert "sourceEnableProjectileAI" in api
          assert "sourcePauseProjectileAI" in api
          assert "BUNNY_CSHARP_GENERIC_PROJECTILE_POLICIES=PASS" in smoke
          print("CSHARP_GENERIC_PROJECTILE_AI_INTEGRATION=PASS")
          PY

      - name: Check automatic CSharp integration and cache guards
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path("Split/Bunny-Loader/app/src/main/cpp")
          native=(root/"experiments/csharp/AutoSourceRuntime.cpp").read_text()
          probe=(root/"boot/Probe.cpp").read_text()
          api=(root/"script/api/CSharpPrototypeApi.cpp").read_text()
          build=(root/"CMakeLists.txt").read_text()
          header=(root/"experiments/csharp/AutoSourceRuntime.h").read_text()
          assert "file(GLOB_RECURSE BL_SOURCES CONFIGURE_DEPENDS" in build
          assert "csharp::startAutoSourceRuntime();" in probe
          assert probe.index("mods::loadBuiltins();") < probe.index("csharp::startAutoSourceRuntime();")
          assert probe.index("prepareModNpcs();") < probe.index("csharp::startAutoSourceRuntime();")
          assert "ch == '_'" in native
          assert "if (depth > 7" in native
          assert "std::istringstream lengths(counts)" in native
          assert "combatSize" in native
          assert "std::thread(run).detach()" in native
          assert "readActivationContext()" in native
          assert "if (context.netMode < 0)" in native
          assert "context.gameMenu < 0" not in native
          assert "gameMenu=%d (opcional)" in native
          assert "curve.turns, &error, true" in native
          assert "while (!canActivateCurves())" not in native
          assert "state.netMode = context.netMode" in native
          assert "state.gameMenu = context.gameMenu" in native
          assert "status.netMode" in api and "status.gameMenu" in api
          projectileHook=(root/"experiments/csharp/ManagedProjectileHook.cpp").read_text()
          projectileHeader=(root/"experiments/csharp/ManagedProjectileHook.h").read_text()
          assert "menu && !allowInMenu" in projectileHook
          assert "bool allowInMenu = false" in projectileHeader
          assert "sourceAutoStatus" in api
          assert "std::mutex g_lock" in native
          assert "modProjectilesSettled()" in native
          assert "kFixtureId" in native
          assert "source-compile-status.txt" in native
          assert "modId=" in native and "executedTypes=" in native
          assert "BUNNY_AUTO_SOURCE_V1_0_1_10_16_49" in native
          assert "requestIsolatedMonoCompile(root, id, *error)" in native
          assert "applyManagedSourceDefaults(mod.id, defaults" in native
          assert "enableManagedProjectileCurve(" in native
          assert "autoSourceStatuses" in header
          compiler=(Path("Split/Bunny-Loader/experiments/csharp/BunnySourceCompiler/CompiledAssemblyProbe.cs")).read_text()
          hit=(root/"experiments/csharp/ManagedHitHook.cpp").read_text()
          kill=(root/"experiments/csharp/ManagedKillHook.cpp").read_text()
          smoke=(Path("Split/Bunny-Loader/experiments/csharp/BunnySourceCompiler.Smoke/Program.cs")).read_text()
          assert "BUNNY_COMBAT_POLICIES_V1" in compiler
          assert "source-combat-policies.txt" in compiler
          assert "source-combat-policies.txt" in native
          assert "BUNNY_AUTO_SOURCE_V1_0_1_10_16_49" in native
          assert "enableAutoProjectileOnHit(" in native
          assert "enableAutoProjectileOnKill(" in native
          assert "autoProjectileHitStatus(" in hit
          assert "autoProjectileKillStatus(" in kill
          assert "BUNNY_CSHARP_AUTO_COMBAT_INDEPENDENT=PASS" in smoke
          assert "BUNNY_CSHARP_AUTO_COMBAT_FIXTURE=PASS" in smoke
          assert "status.hitPolicies" in api and "status.killPolicies" in api
          sdk=(Path("Split/Bunny-Loader/experiments/csharp/BunnyCsSdk/BunnySourceScriptApi.cs")).read_text()
          source=(root/"experiments/csharp/SourceLoader.cpp").read_text()
          parser=(root/"experiments/csharp/SourceParser.cpp").read_text()
          nativeContent=(root/"experiments/csharp/NativeContent.cpp").read_text()
          assert "public abstract class BunnyBuff" in sdk
          assert "public abstract class BunnyBuffPotion" in sdk
          assert 'base == "BunnyBuff"' in parser
          assert 'base == "BunnyBuffPotion"' in parser
          assert "NativeBuffPotion" in source
          assert "applyManagedNativeBuffDefaultsBatch" in source
          assert "mod.items + mod.projectiles + mod.buffs" in native
          assert "BUNNY_CSHARP_MANAGED_BUFF_POTION=PASS" in smoke
          assert "g_buffs.find(typeValues[slot])" in nativeContent
          assert "BUNNY_CSHARP_MANAGED_PLAYER_ACCESSORY=PASS" in smoke
          assert "BunnyPlayer" in sdk and "BunnyAccessory" in sdk
          assert "applyManagedNativePlayerDefaultsBatch" in source
          assert "applyManagedNativePlayerDefaultsBatch" in nativeContent
          assert "mod.players" in native
          print("CSHARP_BUNNYPLAYER_EQUIPMENT_STATIC_CHECK=PASS")
          assert "BUNNY_CSHARP_MANAGED_NPC_SLIME=PASS" in smoke
          assert "public abstract class BunnyNPC" in sdk
          assert 'base == "BunnyNPC"' in parser
          assert "NativeNpc" in source
          assert "applyManagedNativeNpcDefaultsBatch" in source
          assert "applyManagedNativeNpcDefaultsBatch" in nativeContent
          assert "mod.npcs" in native
          print("CSHARP_BUNNYNPC_SLIME_STATIC_CHECK=PASS")
          worker=(Path("Split/Bunny-Loader/app/src/main/kotlin/dev/bunnyloader/csharp/ManagedProbeService.kt")).read_text()
          mono=(root/"experiments/csharp/ManagedRuntime.cpp").read_text()
          assert 'val output = File(outputDir, "$compileModId.dll")' in worker
          assert "g_sourceLiveEntries" in mono
          assert "invokeLiveSourceTick(" in mono
          assert '"BunnyLiveEntry"' in mono
          assert '"Tick", 2' in mono
          assert "sourceLiveTick" in api and "sourceLiveStatus" in api
          assert "BUNNY_CSHARP_LIVE_STATEFUL_CALLBACK=PASS" in smoke
          assert "sourcecsharp.dll" not in worker
          print("CSHARP_LIVE_RUNTIME_PROTOTYPE_STATIC_CHECK=PASS")
          npcHost=(root/"experiments/csharp/NpcAiHost.cpp").read_text()
          npcHeader=(root/"experiments/csharp/NpcAiHost.h").read_text()
          assert "BUNNY_CSHARP_LIVE_NPC_AI_CALLBACK=PASS" in smoke
          assert "BunnyLiveNpc" in mono and "invokeLiveSourceNpcAi" in mono
          assert "invokeLiveSourceNpcAi(" in npcHost
          assert "runLiveNpcAi(npc);" in npcHost
          assert "kLiveNpcMaxCalls = 24" in npcHost
          assert "kLiveNpcSampleInterval = 12" in npcHost
          assert "pthread_create(&worker, nullptr" in npcHost
          assert "pthread_detach(worker)" in npcHost
          assert "std::condition_variable g_liveDispatchCv" in npcHost
          assert "g_liveHasCompletion" in npcHost
          assert "paused-world-transition" in npcHost
          assert 'g_api.invoke(entry.npcAiMethod' in mono
          assert "workerPending" in api and "discarded" in api
          assert "installNpcAiHost" in npcHost
          assert "liveNpcAiStatus" in npcHeader
          assert "sourceLiveNpcEnable" in api and "sourceLiveNpcPause" in api
          print("CSHARP_LIVE_NPC_AI_INTEGRATION_STATIC_CHECK=PASS")
          assert 'resolve<CurrentThreadFn>("mono_thread_current")' in mono
          assert 'resolve<DetachFn>("mono_thread_detach")' in mono
          assert "ScopedNativeMonoThread" in mono
          assert "++status.npcThreadDetaches;" in mono
          assert "++status.npcThreadAttaches;" in mono
          assert "npcThreadDetaches" in api and "npcThreadAttaches" in api
          print("CSHARP_LIVE_NPC_MONO_DETACH_GUARD=PASS")
          assert "CSHARP_LIVE_NPC_SOURCE_PARSER_PASS=YES" in (Path("Split/Bunny-Loader/tests/source_parser_smoke.cpp")).read_text()
          assert "std::string(\"{}()[]=;:.,-*+/%<>!&|?~^\")" in parser
          print("CSHARP_LIVE_NPC_SOURCE_SYNTAX_REGRESSION_GUARD=PASS")
          print("CSHARP_MANAGED_BUFF_POTION_STATIC_CHECK=PASS")
          print("CSHARP_AUTOMATIC_COMBAT_STATIC_CHECK=PASS")
          print("CSHARP_AUTOMATIC_LOADER_STATIC_CHECK=PASS")
          PY

      - name: Stage experimental MonoVM and managed probe
        shell: bash
        run: |
          set -euo pipefail
          ROOT="Split/Bunny-Loader"
          PACK="$RUNNER_TEMP/mono-android-arm64-8.0.23.nupkg"
          curl -fLsS --retry 3 \
            "https://api.nuget.org/v3-flatcontainer/microsoft.netcore.app.runtime.mono.android-arm64/8.0.23/microsoft.netcore.app.runtime.mono.android-arm64.8.0.23.nupkg" \
            -o "$PACK"
          JNI="$ROOT/app/src/main/jniLibs/arm64-v8a"
          ASSETS="$ROOT/app/src/main/assets/managed"
          python3 "$ROOT/tools/stage_mono_runtime.py" "$PACK" "$JNI" "$ASSETS"
          file "$JNI/libmonosgen-2.0.so"
          file "$JNI/libSystem.Native.so"
          readelf -Ws "$JNI/libmonosgen-2.0.so" | grep -q 'mono_jit_init' || {
            echo "MonoVM sem Mono Embedding API esperada" >&2
            exit 1
          }
          dotnet build "$ROOT/experiments/csharp/BunnyManagedProbe/BunnyManagedProbe.csproj" \
            -c Release --nologo
          cp "$ROOT/experiments/csharp/BunnyManagedProbe/bin/Release/net8.0/BunnyManagedProbe.dll" \
            "$ASSETS/BunnyManagedProbe.dll"
          test -s "$ASSETS/System.Private.CoreLib.dll"
          test -s "$ASSETS/BunnyManagedProbe.dll"
          echo "MONO_LIBRARY_BUNDLED=YES"
          dotnet build "$ROOT/experiments/csharp/BunnySourceSdk/BunnySourceSdk.csproj" -c Release --nologo
          dotnet build "$ROOT/experiments/csharp/BunnySourceCompiler/BunnySourceCompiler.csproj" -c Release --nologo
          cp "$ROOT/experiments/csharp/BunnySourceSdk/bin/Release/net8.0/BunnySourceSdk.dll" "$ASSETS/"
          cp "$ROOT/experiments/csharp/BunnySourceCompiler/bin/Release/net8.0/BunnySourceCompiler.dll" "$ASSETS/"
          cp "$ROOT/experiments/csharp/BunnySourceCompiler/bin/Release/net8.0/Microsoft.CodeAnalysis.dll" "$ASSETS/"
          cp "$ROOT/experiments/csharp/BunnySourceCompiler/bin/Release/net8.0/Microsoft.CodeAnalysis.CSharp.dll" "$ASSETS/"
          dotnet run --project "$ROOT/experiments/csharp/BunnySourceCompiler.Smoke/BunnySourceCompiler.Smoke.csproj" -c Release -- "$ROOT/samples/SourceCSharpMod" "$ASSETS"
          test -s "$ASSETS/BunnySourceCompiler.dll"
          test -s "$ASSETS/BunnySourceSdk.dll"
          test -s "$ASSETS/Microsoft.CodeAnalysis.dll"
          test -s "$ASSETS/Microsoft.CodeAnalysis.CSharp.dll"
          echo "BUNNY_ROSLYN_IN_APK=YES"
          echo "MANAGED_ASSEMBLY_BUNDLED=YES"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path("Split/Bunny-Loader/app/src/main/assets/managed")
          libraries = sorted(root.glob("*.dll"))
          assert libraries, "No managed assemblies for manifest"
          manifest = "".join(
              f"{file.name}\t{hashlib.sha256(file.read_bytes()).hexdigest()}\n"
              for file in libraries
          )
          (root / "framework.sha256").write_text(manifest, encoding="utf-8")
          print(f"MANAGED_FRAMEWORK_FINGERPRINT_READY=YES files={len(libraries)}")
          PY

      - name: Integrate Terraria runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/runtime"
          gh release download "$RUNTIME_TAG" --repo "${{ github.repository }}" --pattern "$RUNTIME_ASSET" --dir "$RUNNER_TEMP/runtime"
          cd "$RUNNER_TEMP/runtime"
          echo "$RUNTIME_SHA256  $RUNTIME_ASSET" | sha256sum -c -
          mkdir -p extracted
          unzip -q "$RUNTIME_ASSET" -d extracted
          cd "$GITHUB_WORKSPACE"
          JNI="Split/Bunny-Loader/app/src/main/jniLibs/arm64-v8a"
          ASSETS="Split/Bunny-Loader/terraria1456_assets/src/main/assets"
          mkdir -p "$JNI" "$ASSETS/bin"
          cp "$RUNNER_TEMP/runtime/extracted/lib/arm64-v8a/libil2cpp.so" "$JNI/"
          cp "$RUNNER_TEMP/runtime/extracted/lib/arm64-v8a/libunity.so" "$JNI/"
          cp "$RUNNER_TEMP/runtime/extracted/lib/arm64-v8a/libmain.so" "$JNI/"
          cp "$RUNNER_TEMP/runtime/extracted/lib/arm64-v8a/libc++_shared.so" "$JNI/"
          rm -rf "$ASSETS/bin/Data"
          cp -a "$RUNNER_TEMP/runtime/extracted/assets/bin/Data" "$ASSETS/bin/Data"

      - name: Restore stable sprite pack
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/stable-apk"
          gh release download bunny-music-prewarm-v1 --repo "${{ github.repository }}" --pattern "BunnyLoader-v0.1.9.1-MusicPrewarm.apk" --dir "$RUNNER_TEMP/stable-apk"
          mkdir -p "$RUNNER_TEMP/stable-sprites"
          unzip -q "$RUNNER_TEMP/stable-apk/BunnyLoader-v0.1.9.1-MusicPrewarm.apk" "assets/sprites/*" -d "$RUNNER_TEMP/stable-sprites"
          ROOT="Split/Bunny-Loader/_sprites"
          rm -rf "$ROOT/item" "$ROOT/npc" "$ROOT/buff"
          mkdir -p "$ROOT"
          cp -a "$RUNNER_TEMP/stable-sprites/assets/sprites/item" "$ROOT/"
          cp -a "$RUNNER_TEMP/stable-sprites/assets/sprites/npc" "$ROOT/"
          cp -a "$RUNNER_TEMP/stable-sprites/assets/sprites/buff" "$ROOT/"

      - name: Rebuild CheatBridge dex
        working-directory: Split/Bunny-Loader
        shell: bash
        run: |
          OUT=".cheatbridge"
          AJAR="$ANDROID_HOME/platforms/android-34/android.jar"
          D8="$ANDROID_HOME/build-tools/34.0.0/d8"
          rm -rf "$OUT"
          mkdir -p "$OUT/classes"
          javac -source 8 -target 8 -nowarn -encoding UTF-8 -classpath "$AJAR" -d "$OUT/classes"             tools/cheatbridge/bunny/CheatBridge.java             tools/cheatbridge/bunny/CheatData.java             tools/cheatbridge/bunny/DevTools.java
          mapfile -t CLASSES < <(find "$OUT/classes" -name "*.class" -type f)
          "$D8" --release --min-api 26 --lib "$AJAR" --output "$OUT" "${CLASSES[@]}"
          python3 tools/bin2header.py "$OUT/classes.dex" bl_cheatbridge_dex > app/src/main/cpp/menu/CheatBridgeDex.h

      - name: Build APK
        working-directory: Split/Bunny-Loader
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Validate APK
        shell: bash
        run: |
          APK="Split/Bunny-Loader/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep -q "package: name='com.bunnyloader.csharptest'"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep -q "application-label:'Bunny Loader C# Test'"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libbunny.so"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libbunnycs.so"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libmonosgen-2.0.so"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libSystem.Native.so"
          unzip -l "$APK" | grep -q "assets/managed/System.Runtime.dll"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libbunnymonoprobe.so"
          unzip -l "$APK" | grep -q "assets/managed/BunnyManagedProbe.dll"
          unzip -l "$APK" | grep -q "assets/managed/BunnySourceCompiler.dll"
          unzip -l "$APK" | grep -q "assets/managed/framework.sha256"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep -q "versionCode='74' versionName='0.1.10.16.49-csharp-npc-thread-lifecycle'"
          python3 - "$APK" <<'PY'
          import hashlib
          import sys
          import zipfile
          with zipfile.ZipFile(sys.argv[1]) as package:
              lines = package.read("assets/managed/framework.sha256").decode("utf-8").splitlines()
              assert lines, "Empty framework fingerprint"
              for line in lines:
                  name, checksum = line.split("\t", 1)
                  content = package.read("assets/managed/" + name)
                  assert hashlib.sha256(content).hexdigest() == checksum, name
              print(f"APK_MANAGED_DLL_SHA256_VALIDATED=YES files={len(lines)}")
          PY
          unzip -l "$APK" | grep -q "assets/managed/BunnySourceSdk.dll"
          unzip -l "$APK" | grep -q "assets/managed/Microsoft.CodeAnalysis.CSharp.dll"
          unzip -l "$APK" | grep -q "assets/managed/System.Private.CoreLib.dll"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libil2cpp.so"
          unzip -l "$APK" | grep -q "assets/bin/Data/Managed/Metadata/global-metadata.dat"

      - name: Export source-loader test artifacts
        shell: bash
        run: |
          OUT="BunnyLoader-CSharp-Test-v0.1.10.16.49-AutoSourceLoader.apk"
          cp "Split/Bunny-Loader/app/build/outputs/apk/debug/app-debug.apk" "$RUNNER_TEMP/$OUT"
          sha256sum "$RUNNER_TEMP/$OUT" > "$RUNNER_TEMP/$OUT.sha256"
          test -f "$RUNNER_TEMP/SourceCSharpMod-v0.1.5.bmod"
          test -f "$RUNNER_TEMP/SourceCSharpMod-v0.1.5.bmod.sha256"
          test -f "$RUNNER_TEMP/ExampleModCSharp-v0.1.6.bmod"
          test -f "$RUNNER_TEMP/ExampleModCSharp-v0.1.6.bmod.sha256"

      - name: Publish signed APK as GitHub Release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="bunny-csharp-managed-runtime-0.1.10.16.49"
          FALLBACK="bunny-csharp-native-armor-combat-v1"
          APK="$RUNNER_TEMP/BunnyLoader-CSharp-Test-v0.1.10.16.49-AutoSourceLoader.apk"
          test -s "$APK"
          test -s "$APK.sha256"
          test -s "$RUNNER_TEMP/SourceCSharpMod-v0.1.5.bmod"
          test -s "$RUNNER_TEMP/ExampleModCSharp-v0.1.6.bmod"
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "${{ github.repository }}" \
              --target "$GITHUB_SHA" \
              --title "Bunny Loader C# v0.1.10.16.49 — Automatic CSharp Source Loader" \
              --notes "Experimental automatic CSharp mod loading, v0.1.10.16.49 async managed NPC.AI crash isolation: enabled independent .bmod packages compile in an isolated MonoVM worker, apply verified BunnyWeapon/BunnyProjectile/BunnyBuff/BunnyBuffPotion defaults and enable validated projectile curves and OnHitNPC/OnKill damage-based OnFire effects automatically in singleplayer. Sequential background queue and source-content fingerprint cache avoid game-frame blocking and repeated Roslyn work. Source CSharp Test remains manual as a regression fixture. Experimental fix for recurring SIGABRT after live NPC AI: native NPC callback worker now checks existing managed thread state and calls mono_thread_detach after each MonoVM invocation, with attach/detach counters and abort-adjacent logging. Continues bounded async NPC AI with 24 spaced callbacks. Original SIGABRT cause is not proven without native tombstone. Includes ExampleModCSharp 0.1.6 with experimental BunnyLiveNpc.AI. Confirm managedGameProbe and sourceLiveTick, then explicitly enable sourceLiveNpcEnable; automatic safety pause after 24 NPC events, repeated callback errors, or slow callbacks. MonoVM in the Terraria game process remains experimental and requires Android device validation." \
              --prerelease || true
          fi
          DEST="$TAG"
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            DEST="$FALLBACK"
            echo "New release creation unavailable; publishing extra v0.1.10.16.5 assets into existing private test release."
          fi
          gh release upload "$DEST" \
            "$APK" "$APK.sha256" \
            "$RUNNER_TEMP/SourceCSharpMod-v0.1.5.bmod" \
            "$RUNNER_TEMP/SourceCSharpMod-v0.1.5.bmod.sha256" \
            "$RUNNER_TEMP/ExampleModCSharp-v0.1.6.bmod" \
            "$RUNNER_TEMP/ExampleModCSharp-v0.1.6.bmod.sha256" \
            --repo "${{ github.repository }}" --clobber
          echo "MANAGED_RUNTIME_RELEASE_TAG=$DEST"

      - name: Publish prototype APK
        if: ${{ false }}

        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="bunny-csharp-source-interpreter-v1"
          OUT="BunnyLoader-CSharp-Test-v0.1.10.16.49-AutoSourceLoader.apk"
          APK="Split/Bunny-Loader/app/build/outputs/apk/debug/app-debug.apk"
          cp "$APK" "$RUNNER_TEMP/$OUT"
          cp "Split/Bunny-Loader/app/src/main/jniLibs/arm64-v8a/libbunnycs.so" "$RUNNER_TEMP/libbunnycs.so"
          sha256sum "$RUNNER_TEMP/$OUT" > "$RUNNER_TEMP/$OUT.sha256"
          MOD="$RUNNER_TEMP/SourceCSharpMod-v0.1.5.bmod"
          MODSHA="$RUNNER_TEMP/SourceCSharpMod-v0.1.5.bmod.sha256"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/$OUT" "$RUNNER_TEMP/$OUT.sha256" "$RUNNER_TEMP/libbunnycs.so" "$MOD" "$MODSHA" --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" \
              "$RUNNER_TEMP/$OUT#$OUT" \
              "$RUNNER_TEMP/$OUT.sha256#APK SHA-256" \
              "$RUNNER_TEMP/libbunnycs.so#libbunnycs.so" \
              "$MOD#Source C# Mod 0.1.0" \
              "$MODSHA#Example C# Mod SHA-256" \
              --repo "${{ github.repository }}" \
              --target "$GITHUB_SHA" \
              --title "Bunny Loader C# Test v0.1.10.11 — Source Files Prototype" \
              --notes "Experimental source-only C# mod format: imports main.cs and SourceWand.cs with no JS, DLL, or SO inside the mod. A constrained C# SetDefaults literals interpreter reads source and registers weapon/projectile directly with native host. NOT full C#/.NET execution. Preserves working JS and NativeAOT pathways. Requires Android testing." \
              --prerelease
          fi
