permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: bunny-csharp-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    outputs:
      publish: ${{ steps.build_policy.outputs.publish }}
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["codex/csharp-lights-88-3-prewarm-scene-fidelity","codex/csharp-lights-fidelity-v90-29-88","codex/csharp-lights-native-graph-v90-29-87","codex/csharp-lights-night-hotfix","codex/csharp-lights-sdk-settings-split","codex/csharp-screenfx-v90-29-86","feat/csharp-buff-recipes-v90","feat/csharp-native-recipe-groups-v89","fix/csharp-88-8-lights-review","fix/csharp-90-1-static-recipegroup-register","fix/csharp-90-2-recipegroup-real-instance-abi","fix/csharp-90-3-recipegroup-return-contract","hotfix/csharp-88-5-sigabrt-logcat-tail","perf/csharp-88-7-lights-invisible-ray-fastpath","feat/csharp-loader-foundation-v91","feat/csharp-owned-recipe-loader-v92","feat/csharp-owned-loaders-v93","feat/csharp-summon-lifecycle-v95"]'), github.head_ref)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      RUNTIME_TAG: bunny-private-build-inputs-v1
      PRIVATE_INPUTS_REPO: MantovaniDevTrue/Bunnyloader-Csharp-Builds
      RUNTIME_ASSET: BunnyRuntime_Terraria_1.4.5.8.6.zip
      RUNTIME_SHA256: 2eb8d02dea144cb2fff6a27b94cc371e50ffd9aa44ba4dcd123337691a54c0ab

    steps:
      - uses: actions/checkout@v4

      - name: Resolve tested CSharp build policy
        id: build_policy
        run: |
          python3 Split/Bunny-Loader/tests/csharp_build_policy_test.py
          python3 Split/Bunny-Loader/tools/ci/csharp_build_policy.py

      - name: Announce CSharp .83 batch API build
        if: github.ref == 'refs/heads/codex/csharp-native-probe-optin-v90-29-83'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 62 --repo "$GITHUB_REPOSITORY" --body "Build CSharp .83 com 5 novas assinaturas e ExampleMod 0.1.42: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true
      - name: Announce integrated CSharp .82 APK build
        if: github.ref == 'refs/heads/codex/csharp-unified-example-v90-29-82'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 59 --repo "$GITHUB_REPOSITORY" --body "APK CSharp .82: inicio da compilacao e integracao ExampleMod CSharp 0.1.45. Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true
      - name: Announce experimental .71 APK build
        if: github.ref == 'refs/heads/codex/csharp-universal-intpair-v90-29-79'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${GH_TOKEN:-}" ]; then
            gh issue comment 59 --repo "$GITHUB_REPOSITORY" \
              --body "Compilacao APK .79 iniciada: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Commit ${GITHUB_SHA}. A publicacao privada sera confirmada somente apos assinatura e entrega." \
              || echo "::warning::Nao foi possivel avisar a PR sobre inicio da compilacao"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install Android toolchain
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;30.0.16248370" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Stage verified Unity 2021.3.56f2 Android player classes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BUNNY_PRIVATE_BUILD_TOKEN }}
        run: |
          bash Split/Bunny-Loader/tools/android/stage_unity_classes.sh

      - name: Ensure QuickJS
        shell: bash
        run: |
          rm -rf Split/Bunny-Loader/app/src/main/cpp/third_party/quickjs
          git clone --depth 1 --branch v0.17.0 https://github.com/quickjs-ng/quickjs.git Split/Bunny-Loader/app/src/main/cpp/third_party/quickjs

      - name: Configure Maven mirror
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("Split/Bunny-Loader/settings.gradle.kts")
          s = p.read_text()
          s = s.replace("mavenCentral()", 'maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2") }')
          p.write_text(s)
          PY

      - name: Verify signing secret integration contract
        shell: bash
        run: |
          set -euo pipefail
          test -f Split/Bunny-Loader/app/build.gradle.kts
          grep -q 'BUNNY_SIGNING_STORE' Split/Bunny-Loader/app/build.gradle.kts
          grep -q 'BUNNY_SIGNING_PASSWORD' Split/Bunny-Loader/app/build.gradle.kts
          grep -q 'BUNNY_SIGNING_ALIAS' Split/Bunny-Loader/app/build.gradle.kts
          echo 'BUNNY_SECRET_SIGNING_CONTRACT=PASS'

      - name: Verify game-process abort instrumentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          cpp = Path("Split/Bunny-Loader/app/src/main/cpp")
          api = (cpp / "script/api/CSharpPrototypeApi.cpp").read_text()
          native = (cpp / "experiments/csharp/NativeAbortProbe.cpp").read_text()
          assert "native-game-abort-trace.txt" in api
          assert "gameNativePrevious" in api
          assert 'rearmNativeAbortProbe("after-game-mono-probe")' in api
          assert "gameMutexTraceInstalled" in api
          assert "native-game-abort-previous.txt" in native
          assert "std::rename(file.c_str(), previous.c_str())" in native
          print("CSHARP_GAME_CRASH_TRACE_WIRING=PASS")
          PY

      - name: Verify retained crash session diagnostics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("Split/Bunny-Loader")
          boot = (root / "app/src/main/kotlin/dev/bunnyloader/game/BootLog.kt").read_text()
          native = (root / "app/src/main/cpp/experiments/csharp/NativeAbortProbe.cpp").read_text()
          assert "rotateLogcat(ctx)" in boot
          assert "for (generation in 3 downTo 1)" in boot
          assert "for (generation in 0..3)" in boot
          assert "native-game-abort-previous.txt" in boot
          assert "private fun gameCrashTraces(" in boot
          assert 'out.length() >= 120_000L' in boot
          assert 'takeLast(64_000)' in boot
          assert 'LOGCAT_TAIL_ROLLING' in boot
          assert 'out.length() < 60_000' not in boot
          assert 'ApplicationExitInfo.REASON_SIGNALED && info.status == 6' in boot
          assert "emitAbortHeader();" in native
          assert "NATIVE_ABORT_SIGNAL pid=" in native
          print("CSHARP_CRASH_SESSION_RETENTION=PASS")
          PY

      - name: Verify isolated MonoVM modes and early SIGABRT capture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("Split/Bunny-Loader")
          api = (root / "app/src/main/cpp/script/api/CSharpPrototypeApi.cpp").read_text()
          native = (root / "app/src/main/cpp/experiments/csharp/NativeAbortProbe.cpp").read_text()
          log = (root / "app/src/main/kotlin/dev/bunnyloader/game/BootLog.kt").read_text()
          assert all(mode in api for mode in ("MONO_ONLY", "ABORT_ONLY", "FULL_DIAGNOSTICS"))
          assert 'selectedMode != "MONO_ONLY" && selectedMode != "NO_MONO"' in api
          assert 'selectedMode != "PINNED_MONO" && selectedMode != "LIBRARY_ONLY"' in api
          assert 'selectedMode == "FULL_DIAGNOSTICS"' in api
          assert 'gameProbeMode' in api and 'gameModuleMaps' in api
          assert 'ABORT_CRITICAL_V2 pid=' in native
          assert 'emitCriticalAbortSnapshot(signal, info, raw);' in native
          assert 'persistGameNativeModuleMaps' in native
          assert 'native-game-module-maps.txt' in log
          print("CSHARP_MONO_ISOLATION_AND_CRASH_CONTEXT=PASS")
          PY

      - name: Stress test concurrent managed ingress queue
        shell: bash
        run: |
          c++ -std=c++20 -O2 -pthread \
            -I Split/Bunny-Loader/app/src/main/cpp \
            Split/Bunny-Loader/tests/managed_live_ingress_smoke.cpp \
            -o "$RUNNER_TEMP/managed_live_ingress_smoke"
          "$RUNNER_TEMP/managed_live_ingress_smoke"
          echo "CSHARP_MANAGED_INGRESS_FIFO25K_CONCURRENCY=PASS"

      - name: Validate 25k managed callback limit and FIFO64
        shell: bash
        run: |
          python3 Split/Bunny-Loader/tests/run_managed_live_queue.py
          python3 - <<'PY'
          from pathlib import Path
