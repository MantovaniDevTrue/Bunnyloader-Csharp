          found = {}
          for name in ("kVmProjectileJs", "kVmNpcJs"):
              m = re.search(r'constexpr char ' + name + r'\[\] = R"JS\(\n(.*?)\n\)JS";', cpp, re.S)
              assert m, name
              found[name] = m.group(1)
          Path(os.environ["RUNNER_TEMP"], "vm-ai-kernels-69.json").write_text(json.dumps(found))
          print("BUNNY_AI_JS_KERNELS_EXTRACTED=PASS")
          PY
          node - <<'NODE'
          const fs = require("fs");
          const path = process.env.RUNNER_TEMP;
          const source = JSON.parse(fs.readFileSync(path + "/vm-ai-kernels-69.json", "utf8"));
          const rows = [];
          for (const [key, method] of [["kVmProjectileJs", "Projectile"], ["kVmNpcJs", "Npc"]]) {
              const routine = eval(source[key]);
              for (const ticks of [64, 512, 2000]) {
                  const checksum = routine(ticks, 0x12345678);
                  if (!Number.isInteger(checksum)) throw new Error("invalid JS checksum");
                  rows.push([method, ticks, checksum].join("\t"));
              }
          }
          fs.writeFileSync(path + "/vm-ai-expected-69.tsv", rows.join("\n") + "\n");
          console.log("BUNNY_AI_JAVASCRIPT_CHECKSUMS=PASS\n" + rows.join("\n"));
          NODE
          AIVERIFIER="$RUNNER_TEMP/bunny-managed-ai-verify"
