name: Check CSharp RarityLoader Core
on:
  pull_request:
    paths:
      - 'Split/Bunny-Loader/experiments/csharp/BunnyCsSdk/BunnyRarity.cs'
      - 'Split/Bunny-Loader/experiments/csharp/BunnySourceSdk/BunnySourceSdk.csproj'
      - 'Split/Bunny-Loader/tests/rarity_loader/**'
      - 'Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/NativeRarityRegistry.h'
      - 'Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/SourceContentIdentity.h'
      - 'Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/SourceParser.cpp'
      - 'Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/SourceLoader.cpp'
      - 'Split/Bunny-Loader/experiments/csharp/BunnySourceCompiler/CompiledAssemblyProbe.cs'
      - '.github/workflows/check-csharp-rarity-loader.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rarity-host:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test CSharp rarity contracts without APK or game
        run: dotnet run --project Split/Bunny-Loader/tests/rarity_loader/RarityLoaderHost.csproj --configuration Release
      - name: Verify native rarity registry and parser without JS
        run: |
          cd Split/Bunny-Loader
          g++ -std=c++20 -Wall -Wextra -Werror -O2 -pthread -DBL_HAVE_QUICKJS=0 -I app/src/main/cpp \
            tests/rarity_loader/native_rarity_registry_test.cpp \
            app/src/main/cpp/experiments/csharp/SourceParser.cpp \
            -o /tmp/bunny-rarity-native
          /tmp/bunny-rarity-native
