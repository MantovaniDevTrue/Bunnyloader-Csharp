name: Check CSharp RarityLoader Core
on:
  push:
    branches:
      - feat/csharp-rarity-loader-core-20261019
    paths:
      - 'Split/Bunny-Loader/**'
      - '.github/workflows/check-csharp-rarity-loader.yml'
  pull_request:
    paths:
      - 'Split/Bunny-Loader/experiments/csharp/BunnyCsSdk/BunnyRarity.cs'
      - 'Split/Bunny-Loader/experiments/csharp/BunnyCsSdk/BunnyRarityRuntime.cs'
      - 'Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/NativeRarity*.h'
      - 'Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/NativeRarity*.cpp'
      - 'Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/ManagedRuntime.cpp'
      - 'Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/AutoSourceRuntime.cpp'
      - 'Split/Bunny-Loader/experiments/csharp/BunnySourceSdk/BunnySourceSdk.csproj'
      - 'Split/Bunny-Loader/tests/rarity_loader/**'
      - 'Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/NativeRarityRegistry.h'
      - 'Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/SourceContentIdentity.h'
      - 'Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/SourceParser.cpp'
      - 'Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/SourceLoader.cpp'
      - 'Split/Bunny-Loader/experiments/csharp/BunnySourceCompiler/CompiledAssemblyProbe.cs'
      - '.github/workflows/check-csharp-rarity-loader.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rarity-host:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test CSharp rarity contracts without APK or game
        run: dotnet run --project Split/Bunny-Loader/tests/rarity_loader/RarityLoaderHost.csproj --configuration Release
      - name: Verify native rarity registry and parser without JS
        run: |
          cd Split/Bunny-Loader
          g++ -std=c++20 -Wall -Wextra -Werror -O2 -pthread -DBL_HAVE_QUICKJS=0 -I app/src/main/cpp \
            tests/rarity_loader/native_rarity_registry_test.cpp \
            app/src/main/cpp/experiments/csharp/SourceParser.cpp \
            -o /tmp/bunny-rarity-native
          /tmp/bunny-rarity-native
          g++ -std=c++20 -Wall -Wextra -Werror -O2 -pthread -I app/src/main/cpp \
            tests/rarity_loader/native_rarity_color_test.cpp -o /tmp/bunny-rarity-color
          /tmp/bunny-rarity-color
      - name: Compile rarity native host integration and lifecycle regressions
        run: |
          cd Split/Bunny-Loader
          JAVA_INCLUDES="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")/include"
          g++ -std=c++20 -Wall -Wextra -Werror -DBL_HAVE_QUICKJS=0 \
            -I "$JAVA_INCLUDES" -I "$JAVA_INCLUDES/linux" \
            -I tests/basic_items/include -I app/src/main/cpp -fsyntax-only \
            app/src/main/cpp/experiments/csharp/SourceLoader.cpp
          g++ -std=c++20 -Wall -Wextra -Werror -DBL_HAVE_QUICKJS=0 \
            -I "$JAVA_INCLUDES" -I "$JAVA_INCLUDES/linux" \
            -I tests/basic_items/include -I app/src/main/cpp -fsyntax-only \
            app/src/main/cpp/experiments/csharp/AutoSourceRuntime.cpp
          g++ -std=c++20 -Wall -Wextra -Werror -DBL_HAVE_QUICKJS=0 \
            -I "$JAVA_INCLUDES" -I "$JAVA_INCLUDES/linux" \
            -I tests/basic_items/include -I app/src/main/cpp -fsyntax-only \
            app/src/main/cpp/experiments/csharp/NativeRarityGameplay.cpp
          python3 tests/run_managed_lifecycle_regressions.py
      - name: Commit compiled public SDK reference
        if: github.event_name == 'push' && success()
        run: |
          cd Split/Bunny-Loader
          dotnet run --project tools/sdk_reference/SdkReference.csproj --configuration Release -- --write
          cd ../..
          git add Split/Bunny-Loader/docs/generated/sdk_public_reference.json Split/Bunny-Loader/docs/generated/sdk_public_reference.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(csharp): regenerate public SDK reference from compiled rarity API"
            REMOTE_HEAD="$(git ls-remote origin refs/heads/feat/csharp-rarity-loader-core-20261019 | cut -f1)"
            if [ "$REMOTE_HEAD" != "$GITHUB_SHA" ]; then
              echo "SDK_REFERENCE_SYNC_SKIPPED newer-source-commit-on-branch"
            elif ! git push origin "HEAD:refs/heads/feat/csharp-rarity-loader-core-20261019"; then
              echo "SDK_REFERENCE_SYNC_SKIPPED parallel-newer-commit"
            fi
          fi
