name: Check Mono pinned worker GC transitions
on:
  push:
    branches: [fix/csharp-88-8-lights-review, codex/lot-a-complete-v90-29, codex/csharp-screenfx-v90-29-86, codex/csharp-lights-native-graph-v90-29-87, codex/csharp-lights-fidelity-v90-29-88, codex/csharp-lights-night-hotfix, codex/csharp-lights-sdk-settings-split]
  pull_request:
    paths:
      - 'Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/ManagedRuntime.*'
      - 'Split/Bunny-Loader/tests/managed_pinned_gc_*'
      - 'Split/Bunny-Loader/tests/run_managed_pinned_gc.py'
      - '.github/workflows/check-mono-pinned-gc.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Exercise native Mono owner wait/resume states
        run: python3 Split/Bunny-Loader/tests/run_managed_pinned_gc.py

