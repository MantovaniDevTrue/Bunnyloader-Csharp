name: Check CSharp combat batch
on:
  push:
    branches: [feat/csharp-summon-lifecycle-v95, feat/csharp-94-owned-summon-damage-lot, feat/csharp-owned-loaders-v93, feat/csharp-owned-recipe-loader-v92, feat/csharp-loader-foundation-v91, feat/csharp-buff-recipes-v90, fix/csharp-90-1-static-recipegroup-register, fix/csharp-90-2-recipegroup-real-instance-abi, fix/csharp-90-3-recipegroup-return-contract, feat/csharp-native-recipe-groups-v89, fix/csharp-88-8-lights-review, codex/lot-a-complete-v90-29, codex/combat-batch-v90-25, codex/csharp-lights-fidelity-v90-29-88, codex/csharp-lights-night-hotfix, codex/csharp-lights-sdk-settings-split]
  pull_request:
    paths:
      - 'Split/Bunny-Loader/experiments/csharp/**'
      - 'Split/Bunny-Loader/tests/combat_batch/**'
      - 'Split/Bunny-Loader/samples/ExampleModCSharp/**'
      - '.github/workflows/check-combat-batch.yml'
permissions:
  contents: read
jobs:
  combat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate source package
        working-directory: Split/Bunny-Loader
        run: python3 tests/combat_batch/check_package.py
      - name: Execute recipes, boundary cases and intentional failures
        working-directory: Split/Bunny-Loader
        run: dotnet run --project tests/combat_batch/CombatBatch.csproj -c Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Bunny-CSharp-Combat-Batch-Results
          path: Split/Bunny-Loader/build/combat-batch-results.json
          if-no-files-found: warn

