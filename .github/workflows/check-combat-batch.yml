name: Check CSharp combat batch
on:
  push:
    branches: [codex/combat-batch-v90-25]
  pull_request:
    paths:
      - 'Split/Bunny-Loader/experiments/csharp/**'
      - 'Split/Bunny-Loader/tests/combat_batch/**'
      - 'Split/Bunny-Loader/samples/ExampleModCSharp/**'
      - '.github/workflows/check-combat-batch.yml'
permissions:
  contents: read
jobs:
  combat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate source package
        working-directory: Split/Bunny-Loader
        run: python3 tests/combat_batch/check_package.py
      - name: Execute recipes, boundary cases and intentional failures
        working-directory: Split/Bunny-Loader
        run: dotnet run --project tests/combat_batch/CombatBatch.csproj -c Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Bunny-CSharp-Combat-Batch-Results
          path: Split/Bunny-Loader/build/combat-batch-results.json
          if-no-files-found: warn
