name: CSharp tModLoader loader core (NO APK)
on:
  push:
    branches: [feat/csharp-content-loader-no-apk-20261022]
  pull_request:
    paths:
      - 'Split/Bunny-Loader/experiments/csharp/BunnyCsSdk/**'
      - 'Split/Bunny-Loader/experiments/csharp/BunnySourceSdk/**'
      - 'Split/Bunny-Loader/experiments/csharp/BunnySourceCompiler/**'
      - 'Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/**'
      - 'Split/Bunny-Loader/app/src/main/cpp/boot/jni_entry.cpp'
      - 'Split/Bunny-Loader/app/src/main/kotlin/dev/bunnyloader/GameActivity.kt'
      - 'Split/Bunny-Loader/app/src/main/kotlin/dev/bunnyloader/nativebridge/NativeBridge.kt'
      - 'Split/Bunny-Loader/tests/auto_source_startup.cpp'
      - 'Split/Bunny-Loader/tests/sdk_foundation/**'
      - 'Split/Bunny-Loader/tests/content_loader/**'
      - 'Split/Bunny-Loader/samples/ContentLoaderCSharp/**'
      - 'Split/Bunny-Loader/docs/generated/sdk_public_reference.*'
      - '.github/workflows/check-csharp-content-loader.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  managed-loader-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - dotnet: '8.0.x'
            framework: net8.0
          - dotnet: '10.0.x'
            framework: net10.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}
      - name: Verify pinned upstream test sources
        run: python3 Split/Bunny-Loader/tests/content_loader/check_upstream.py
      - name: Run full SDK and differential loader tests
        run: |
          dotnet build Split/Bunny-Loader/tests/content_loader/ContentLoaderTests.csproj -c Release -p:BunnyTargetFramework=${{ matrix.framework }}
          dotnet Split/Bunny-Loader/tests/content_loader/bin/Release/${{ matrix.framework }}/ContentLoaderTests.dll
      - name: Run documented example
        run: |
          dotnet build Split/Bunny-Loader/samples/ContentLoaderCSharp/ContentLoaderExample.csproj -c Release -p:BunnyTargetFramework=${{ matrix.framework }}
          dotnet Split/Bunny-Loader/samples/ContentLoaderCSharp/bin/Release/${{ matrix.framework }}/ContentLoaderExample.dll
      - name: Check compiled public reference
        if: matrix.framework == 'net8.0'
        working-directory: Split/Bunny-Loader
        run: dotnet run --project tools/sdk_reference -c Release -- --check
      - name: Refuse any generated Android package
        if: always()
        run: |
          if find . -type f -name '*.apk' -print -quit | grep -q .; then
            echo 'APK forbidden for this batch'
            exit 1
          fi

  native-content-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Execute production native queue, source loader and world gate tests
        run: python3 Split/Bunny-Loader/tests/content_loader/run_native.py
      - name: Compile JNI entrypoints against real JNI headers
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -fsyntax-only \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            -ISplit/Bunny-Loader/tests/basic_items/include -ISplit/Bunny-Loader/app/src/main/cpp \
            Split/Bunny-Loader/app/src/main/cpp/boot/jni_entry.cpp \
            Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/MonoWorkerJni.cpp
  android-arm64-objects:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compile integration sources to Android ARM64 objects only
        shell: bash
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ ! -x "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" ]; then
            sdkmanager 'ndk;30.0.16248370'
            ndk="$ANDROID_HOME/ndk/30.0.16248370"
          fi
          cxx="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++"
          mkdir -p /tmp/bunny-content-arm64
          for file in experiments/csharp/ManagedRuntime.cpp experiments/csharp/SourceLoader.cpp experiments/csharp/AutoSourceRuntime.cpp experiments/csharp/MonoWorkerJni.cpp boot/jni_entry.cpp; do
            "$cxx" -std=c++20 -fno-exceptions -fno-rtti -Wall -Wextra -Werror \
              -ISplit/Bunny-Loader/app/src/main/cpp -c "Split/Bunny-Loader/app/src/main/cpp/$file" \
              -o "/tmp/bunny-content-arm64/$(basename "$file").o"
          done
          for object in /tmp/bunny-content-arm64/*.o; do
            readelf -h "$object" | grep -q 'Machine:.*AArch64'
          done
          if find . -type f -name '*.apk' -print -quit | grep -q .; then exit 1; fi
