name: Validate Bunny Roslyn Source Compiler

on:
  push:
    branches:
      - bunny-csharp-source-0.1.10.16-roslyn-worker
      - bunny-csharp-source-0.1.10.16.1-roslyn-checkpoints
      - bunny-csharp-source-0.1.10.16.2-portable-sha256
      - bunny-csharp-source-0.1.10.16.3-serial-emit
      - bunny-csharp-source-0.1.10.16.4-nondeterministic-emit
      - bunny-csharp-source-0.1.10.16.5-reference-trim
      - bunny-csharp-source-0.1.10.16.6-roslyn-minimal-probe
      - bunny-csharp-source-0.1.10.16.7-semantic-exit-probe
      - bunny-csharp-source-0.1.10.16.8-native-exit-metadata
      - bunny-csharp-source-0.1.10.16.9-native-tombstone
      - bunny-csharp-source-0.1.10.16.10-signal-stack
      - bunny-csharp-source-0.1.10.16.11-signal-rearm
    paths:
      - ".github/workflows/check-bunny-csharp-roslyn-compiler.yml"
      - "Split/Bunny-Loader/experiments/csharp/BunnySourceSdk/**"
      - "Split/Bunny-Loader/experiments/csharp/BunnySourceCompiler/**"
      - "Split/Bunny-Loader/experiments/csharp/BunnySourceCompiler.Smoke/**"
      - "Split/Bunny-Loader/experiments/csharp/BunnyCsSdk/BunnySourceScriptApi.cs"
      - "Split/Bunny-Loader/samples/SourceCSharpMod/content/**"

jobs:
  compiler-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build SDK and compiler
        shell: bash
        run: |
          set -euo pipefail
          ROOT="Split/Bunny-Loader"
          dotnet build "$ROOT/experiments/csharp/BunnySourceSdk/BunnySourceSdk.csproj" -c Release --nologo
          dotnet build "$ROOT/experiments/csharp/BunnySourceCompiler/BunnySourceCompiler.csproj" -c Release --nologo
          mkdir -p "$RUNNER_TEMP/managed"
          curl -fLsS --retry 3 "https://api.nuget.org/v3-flatcontainer/microsoft.netcore.app.runtime.mono.android-arm64/8.0.23/microsoft.netcore.app.runtime.mono.android-arm64.8.0.23.nupkg" -o "$RUNNER_TEMP/mono.nupkg"
          python3 "$ROOT/tools/stage_mono_runtime.py" "$RUNNER_TEMP/mono.nupkg" "$RUNNER_TEMP/native" "$RUNNER_TEMP/managed"
          cp "$ROOT/experiments/csharp/BunnySourceSdk/bin/Release/net8.0/BunnySourceSdk.dll" "$RUNNER_TEMP/managed/"
      - name: Run host-side Roslyn smoke
        shell: bash
        run: |
          dotnet run --project Split/Bunny-Loader/experiments/csharp/BunnySourceCompiler.Smoke/BunnySourceCompiler.Smoke.csproj -c Release -- "Split/Bunny-Loader/samples/SourceCSharpMod" "$RUNNER_TEMP/managed"
