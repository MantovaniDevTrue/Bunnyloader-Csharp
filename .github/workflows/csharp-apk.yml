# APK de teste do Bunny Loader (o do Jonata) com o C# deste branch, mais os
# mods de teste empacotados. So no fork: fica fora do PR.
#
# Sai como "Bunny Loader C#" (com.bunnyloader.cs), ao lado do oficial, e
# assinado com a chave dos segredos BUNNY_* (atualiza por cima nos proximos).
# O runtime do Terraria vem da release privada; o unity-classes.jar, do pacote
# oficial da Unity (app/libs/README.md).
name: C# test APK

on:
  push:
    branches:
      - "feat/csharp-*"
      - "fix/*"
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: csharp-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      RUNTIME_TAG: bunny-private-build-inputs-v1
      RUNTIME_ASSET: BunnyRuntime_Terraria_1.4.5.8.6.zip
      RUNTIME_SHA256: 2eb8d02dea144cb2fff6a27b94cc371e50ffd9aa44ba4dcd123337691a54c0ab
      UNITY_PKG_URL: https://download.unity3d.com/download_unity/667925324b48/MacEditorTargetInstaller/UnitySetup-Android-Support-for-Editor-2021.3.56f2.pkg
      LOG: ${{ github.workspace }}/../csharp-apk.log

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            10.0.x

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Android SDK, NDK and CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;30.0.16248370" "cmake;3.22.1" >/dev/null

      - name: QuickJS
        run: git clone -q --depth 1 --branch v0.17.0 https://github.com/quickjs-ng/quickjs.git app/src/main/cpp/third_party/quickjs

      - name: Terraria runtime (private release)
        env:
          GH_TOKEN: ${{ secrets.BUNNY_PRIVATE_BUILD_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/MantovaniDevTrue/Bunnyloader-Csharp-Builds" --jq '.private')" = "true"
          mkdir -p "$RUNNER_TEMP/rt"
          gh release download "$RUNTIME_TAG" --repo MantovaniDevTrue/Bunnyloader-Csharp-Builds \
            --pattern "$RUNTIME_ASSET" --dir "$RUNNER_TEMP/rt"
          cd "$RUNNER_TEMP/rt"
          echo "$RUNTIME_SHA256  $RUNTIME_ASSET" | sha256sum -c -
          unzip -q "$RUNTIME_ASSET" -d x
          JNI="$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          ASSETS="$GITHUB_WORKSPACE/terraria1456_assets/src/main/assets"
          mkdir -p "$JNI" "$ASSETS/bin"
          cp x/lib/arm64-v8a/libil2cpp.so x/lib/arm64-v8a/libunity.so x/lib/arm64-v8a/libmain.so x/lib/arm64-v8a/libc++_shared.so "$JNI/"
          rm -rf "$ASSETS/bin/Data"
          cp -a x/assets/bin/Data "$ASSETS/bin/Data"
          test -f "$ASSETS/bin/Data/Managed/Metadata/global-metadata.dat"
          mkdir -p "$GITHUB_WORKSPACE/refs"
          cp x/lib/arm64-v8a/libil2cpp.so x/assets/bin/Data/Managed/Metadata/global-metadata.dat "$GITHUB_WORKSPACE/refs/"

      - name: Dump the game (Il2CppDumper, for the C# proxies)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dumper"
          gh release download v6.7.46 --repo Perfare/Il2CppDumper --pattern "Il2CppDumper-net6-v*.zip" --dir "$RUNNER_TEMP/dumper"
          cd "$RUNNER_TEMP/dumper"
          unzip -q -o ./*.zip
          dll="$(find . -name Il2CppDumper.dll | head -1)"
          cd "$GITHUB_WORKSPACE/refs"
          dotnet "$RUNNER_TEMP/dumper/$dll" libil2cpp.so global-metadata.dat . < /dev/null || true
          test -f DummyDll/Assembly-CSharp.dll

      - name: Cache Unity Android player package
        uses: actions/cache@v4
        with:
          path: ~/unity-pkg
          key: unity-android-2021.3.56f2-pkg

      - name: unity-classes.jar (Unity 2021.3.56f2, il2cpp/Release)
        run: |
          set -euo pipefail
          mkdir -p ~/unity-pkg
          pkg=~/unity-pkg/android.pkg
          [ -s "$pkg" ] || curl -fsSL -o "$pkg" "$UNITY_PKG_URL"
          work="$RUNNER_TEMP/unity"
          rm -rf "$work" && mkdir -p "$work" && cd "$work"
          7z x -y "$pkg" >/dev/null
          payload="$(find . -name 'Payload*' -type f | head -1)"
          test -n "$payload"
          if file "$payload" | grep -qi gzip; then gunzip -c "$payload"; else cat "$payload"; fi \
            | cpio -i -d --quiet '*Variations/il2cpp/Release/Classes/classes.jar'
          jar="$(find . -path '*Variations/il2cpp/Release/Classes/classes.jar' | head -1)"
          test -n "$jar"
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          cp "$jar" "$GITHUB_WORKSPACE/app/libs/unity-classes.jar"
          unzip -l "$GITHUB_WORKSPACE/app/libs/unity-classes.jar" | grep -q "com/unity3d/player/UnityPlayer.class"

      - name: Test package id (side by side with the official app)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          def edit(path, old, new):
              p = Path(path); s = p.read_text()
              assert old in s, (path, old)
              p.write_text(s.replace(old, new))
          edit("app/build.gradle.kts", 'applicationId = "com.bunnyloader"', 'applicationId = "com.bunnyloader.cs"')
          edit("app/build.gradle.kts", 'else "@string/app_name"', 'else "Bunny Loader C#"')
          edit("app/src/main/AndroidManifest.xml", 'android:authorities="com.bunnyloader.documents"', 'android:authorities="com.bunnyloader.cs.documents"')
          edit("app/src/main/kotlin/dev/bunnyloader/mods/ModSourcesDocumentsProvider.kt", '"com.bunnyloader.documents"', '"com.bunnyloader.cs.documents"')
          p = Path("settings.gradle.kts"); s = p.read_text()
          p.write_text(s.replace("mavenCentral()", 'maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2") }\n        mavenCentral()'))
          PY

      - name: Rebuild the CheatBridge dex (when its Java changed)
        run: |
          set -euo pipefail
          base="$(git merge-base HEAD origin/main 2>/dev/null || git rev-list --max-parents=0 HEAD | tail -n 1)"
          if git diff --quiet "$base" HEAD -- tools/cheatbridge app/src/main/java/bunny; then
            echo "CheatBridge Java unchanged"
          else
            bash tools/build-cheatbridge-dex.sh
            git diff --stat -- app/src/main/cpp/menu/CheatBridgeDex.h || true
          fi

      - name: Match the hand-written ItemID.Sets to this dump
        run: |
          set -euo pipefail
          f=app/src/main/csharp/BunnyLoader/Terraria/ID/ItemID.Sets.cs
          if [ -f "$f" ] && grep -q "public static partial class Sets" "$f"; then
            sed -i 's/public static partial class Sets/public readonly unsafe partial struct Sets/' "$f"
            echo "ItemID.Sets declared as a struct for this dump"
          fi

      - name: Build the APK
        env:
          BUNNY_KEYSTORE_B64: ${{ secrets.BUNNY_KEYSTORE_B64 }}
          BUNNY_SIGNING_PASSWORD: ${{ secrets.BUNNY_SIGNING_PASSWORD }}
          BUNNY_SIGNING_ALIAS: ${{ secrets.BUNNY_SIGNING_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          export BL_RELEASE_STORE_FILE="$RUNNER_TEMP/sign/key.jks"
          mkdir -p "$(dirname "$BL_RELEASE_STORE_FILE")"
          printf '%s' "$BUNNY_KEYSTORE_B64" | base64 --decode > "$BL_RELEASE_STORE_FILE"
          export BL_RELEASE_STORE_PASSWORD="$BUNNY_SIGNING_PASSWORD"
          export BL_RELEASE_KEY_PASSWORD="$BUNNY_SIGNING_PASSWORD"
          export BL_RELEASE_KEY_ALIAS="$BUNNY_SIGNING_ALIAS"
          unset BUNNY_KEYSTORE_B64
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee "$LOG" | grep -E "^> Task|FAIL|error:|BUILD" || true
          rm -f "$BL_RELEASE_STORE_FILE"
          apk="$(find app/build/outputs/apk/debug -name '*.apk' | head -1)"
          test -n "$apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify "$apk"
          for lib in libbunny.so libil2cpp.so libmonosgen-2.0.so; do unzip -l "$apk" | grep -q "lib/arm64-v8a/$lib"; done
          mkdir -p "$RUNNER_TEMP/out"
          cp "$apk" "$RUNNER_TEMP/out/BunnyLoader-CSharp-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}.apk"

      - name: Test mods (.bl)
        run: |
          set -euo pipefail
          packs="samples/ExampleModCSharp"
          for t in csitems csdamageclass csrarity cstooltip; do
            [ -d "tools/tests/$t" ] || continue
            bash tools/tests/build-cs.sh "$t"
            stage="$RUNNER_TEMP/stage/$t"
            mkdir -p "$stage"
            cp "tools/tests/$t/manifest.json" "$stage/"
            cp -r "tools/tests/$t/content" "$stage/"
            packs="$packs $stage"
          done
          python3 tools/mods/pack.py $packs
          cp build/mods-packs/*.bl "$RUNNER_TEMP/out/"
          ls -la "$RUNNER_TEMP/out"

      - uses: actions/upload-artifact@v4
        with:
          name: bunny-loader-csharp-test
          path: ${{ runner.temp }}/out/
          retention-days: 14

      - name: Publish the log to ci/csharp-build-logs
        if: always()
        run: |
          set -euo pipefail
          [ -f "$LOG" ] || echo "no gradle log (an earlier step failed)" > "$LOG"
          name="apk_$(echo "$GITHUB_REF_NAME" | tr '/' '_').txt"
          dir="$RUNNER_TEMP/logs"
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"
          url="https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3; do
            rm -rf "$dir"
            git clone -q --depth 1 --branch ci/csharp-build-logs "$url" "$dir"
            cd "$dir"
            mkdir -p logs
            { echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"; echo "status: ${{ job.status }}"
              grep -E "error|FAIL|BUILD|What went wrong|Exception|^e: " "$LOG" | tail -150 || true; } > "logs/$name"
            if ! git -C "$GITHUB_WORKSPACE" diff --quiet -- app/src/main/cpp/menu/CheatBridgeDex.h; then
              cp "$GITHUB_WORKSPACE/app/src/main/cpp/menu/CheatBridgeDex.h" "logs/${name%.txt}.CheatBridgeDex.h"
            fi
            git add logs
            git commit -q -m "apk log: ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}" || exit 0
            git push -q origin HEAD:ci/csharp-build-logs && exit 0
            cd - >/dev/null; sleep 5
          done
