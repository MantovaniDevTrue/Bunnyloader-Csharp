name: Build Split Bunny Full Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-split-full.yml"
      - "Split/Bunny-Loader/**"
      - "Split/patches/**"
      - "Split/mod/**"
      - "Split/runtime/**"

permissions:
  contents: read

jobs:
  build-full:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      RUNTIME_TAG: runtime-1.4.5.8.6
      RUNTIME_ASSET: BunnyRuntime_Terraria_1.4.5.8.6.zip
      RUNTIME_SHA256: 2eb8d02dea144cb2fff6a27b94cc371e50ffd9aa44ba4dcd123337691a54c0ab

    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android toolchain
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;30.0.16248370" "cmake;3.22.1"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Ensure QuickJS
        shell: bash
        run: |
          rm -rf Split/Bunny-Loader/app/src/main/cpp/third_party/quickjs
          git clone --depth 1 --branch v0.17.0 https://github.com/quickjs-ng/quickjs.git Split/Bunny-Loader/app/src/main/cpp/third_party/quickjs

      - name: Configure Maven Central mirror
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("Split/Bunny-Loader/settings.gradle.kts")
          s = p.read_text()
          s = s.replace("mavenCentral()", 'maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2") }')
          p.write_text(s)
          PY

      - name: Download private Terraria runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/bunny-runtime"
          gh release download "$RUNTIME_TAG"             --repo "${{ github.repository }}"             --pattern "$RUNTIME_ASSET"             --dir "$RUNNER_TEMP/bunny-runtime"

          cd "$RUNNER_TEMP/bunny-runtime"
          echo "$RUNTIME_SHA256  $RUNTIME_ASSET" | sha256sum -c -

      - name: Integrate runtime
        shell: bash
        run: |
          RUNTIME="$RUNNER_TEMP/bunny-runtime/$RUNTIME_ASSET"
          TMP="$RUNNER_TEMP/bunny-runtime/extracted"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$RUNTIME" -d "$TMP"

          JNI="Split/Bunny-Loader/app/src/main/jniLibs/arm64-v8a"
          ASSETS="Split/Bunny-Loader/terraria1456_assets/src/main/assets"

          mkdir -p "$JNI" "$ASSETS/bin"
          cp "$TMP/lib/arm64-v8a/libil2cpp.so" "$JNI/"
          cp "$TMP/lib/arm64-v8a/libunity.so" "$JNI/"
          cp "$TMP/lib/arm64-v8a/libmain.so" "$JNI/"
          cp "$TMP/lib/arm64-v8a/libc++_shared.so" "$JNI/"

          rm -rf "$ASSETS/bin/Data"
          cp -a "$TMP/assets/bin/Data" "$ASSETS/bin/Data"

          test -f "$JNI/libil2cpp.so"
          test -f "$JNI/libunity.so"
          test -f "$ASSETS/bin/Data/Managed/Metadata/global-metadata.dat"

      - name: Build full Bunny APK
        working-directory: Split/Bunny-Loader
        shell: bash
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p Split/build/output
          cp Split/Bunny-Loader/app/build/outputs/apk/debug/app-debug.apk             Split/build/output/Split-BunnyLoader-full-debug.apk
          sha256sum Split/build/output/Split-BunnyLoader-full-debug.apk             > Split/build/output/Split-BunnyLoader-full-debug.apk.sha256

      - name: Upload full APK
        uses: actions/upload-artifact@v4
        with:
          name: Split-BunnyLoader-full-debug
          path: |
            Split/build/output/Split-BunnyLoader-full-debug.apk
            Split/build/output/Split-BunnyLoader-full-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
