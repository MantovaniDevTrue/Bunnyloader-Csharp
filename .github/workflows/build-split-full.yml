name: Build Split Bunny Full Runtime

on:
  push:
    branches:
      - bunny-ui-tileentity-phase1
      - bunny-upstream-2026-10-01
    paths:
      - ".github/workflows/build-split-full.yml"
      - "Split/Bunny-Loader/**"
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build-full:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.release.tag_name == 'runtime-1.4.5.8.6'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      RUNTIME_TAG: runtime-1.4.5.8.6
      RUNTIME_ASSET: BunnyRuntime_Terraria_1.4.5.8.6.zip
      RUNTIME_SHA256: 2eb8d02dea144cb2fff6a27b94cc371e50ffd9aa44ba4dcd123337691a54c0ab

    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: bunny-loader-debug-signing-v1

      - name: Install Android toolchain
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;30.0.16248370" "cmake;3.22.1"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Ensure QuickJS
        shell: bash
        run: |
          rm -rf Split/Bunny-Loader/app/src/main/cpp/third_party/quickjs
          git clone --depth 1 --branch v0.17.0 https://github.com/quickjs-ng/quickjs.git Split/Bunny-Loader/app/src/main/cpp/third_party/quickjs

      - name: Configure Maven Central mirror
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("Split/Bunny-Loader/settings.gradle.kts")
          s = p.read_text()
          s = s.replace("mavenCentral()", 'maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2") }')
          p.write_text(s)
          PY

      - name: Setup persistent APK signing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="bunny-signing-key-v1"
          ASSET="bunny-release.jks"
          DIR="$RUNNER_TEMP/bunny-signing"
          KEY="$DIR/$ASSET"
          PASS="BunnyLoaderStable2026"
          ALIAS="bunnyrelease"
          mkdir -p "$DIR"

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release download "$TAG" --repo "${{ github.repository }}" --pattern "$ASSET" --dir "$DIR"
          else
            keytool -genkeypair -noprompt \
              -keystore "$KEY" \
              -storepass "$PASS" \
              -keypass "$PASS" \
              -alias "$ALIAS" \
              -keyalg RSA \
              -keysize 4096 \
              -validity 36500 \
              -dname "CN=Bunny Loader Update Key,O=MantovaniDevTrue"
            gh release create "$TAG" "$KEY#$ASSET" \
              --repo "${{ github.repository }}" \
              --title "Bunny Loader signing key v1" \
              --notes "Private APK update signing key. Keep this repository private." \
              --prerelease
          fi

          echo "BUNNY_SIGNING_STORE=$KEY" >> "$GITHUB_ENV"
          echo "BUNNY_SIGNING_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "BUNNY_SIGNING_ALIAS=$ALIAS" >> "$GITHUB_ENV"

      - name: Download private Terraria runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/bunny-runtime"
          gh release download "$RUNTIME_TAG"             --repo "${{ github.repository }}"             --pattern "$RUNTIME_ASSET"             --dir "$RUNNER_TEMP/bunny-runtime"

          cd "$RUNNER_TEMP/bunny-runtime"
          echo "$RUNTIME_SHA256  $RUNTIME_ASSET" | sha256sum -c -

      - name: Integrate runtime
        shell: bash
        run: |
          RUNTIME="$RUNNER_TEMP/bunny-runtime/$RUNTIME_ASSET"
          TMP="$RUNNER_TEMP/bunny-runtime/extracted"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$RUNTIME" -d "$TMP"

          JNI="Split/Bunny-Loader/app/src/main/jniLibs/arm64-v8a"
          ASSETS="Split/Bunny-Loader/terraria1456_assets/src/main/assets"

          mkdir -p "$JNI" "$ASSETS/bin"
          cp "$TMP/lib/arm64-v8a/libil2cpp.so" "$JNI/"
          cp "$TMP/lib/arm64-v8a/libunity.so" "$JNI/"
          cp "$TMP/lib/arm64-v8a/libmain.so" "$JNI/"
          cp "$TMP/lib/arm64-v8a/libc++_shared.so" "$JNI/"

          rm -rf "$ASSETS/bin/Data"
          cp -a "$TMP/assets/bin/Data" "$ASSETS/bin/Data"

          test -f "$JNI/libil2cpp.so"
          test -f "$JNI/libunity.so"
          test -f "$ASSETS/bin/Data/Managed/Metadata/global-metadata.dat"

      - name: Restore vanilla cheat sprites
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check --quiet requests beautifulsoup4 pillow

          ROOT="Split/Bunny-Loader/_sprites"
          rm -rf "$ROOT/item" "$ROOT/npc" "$ROOT/buff"
          mkdir -p "$ROOT/item" "$ROOT/npc" "$ROOT/buff"

          SRC="$RUNNER_TEMP/terraria-legacy-sprites"
          rm -rf "$SRC"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/JevonLee/Stardew.git "$SRC"
          git -C "$SRC" sparse-checkout set Art/Terraria/images

          python3 - <<'PY'
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from io import BytesIO
          from urllib.parse import unquote
          import os
          import re
          import unicodedata

          import requests
          from bs4 import BeautifulSoup
          from PIL import Image

          root = Path("Split/Bunny-Loader/_sprites")
          item_out = root / "item"
          npc_out = root / "npc"
          buff_out = root / "buff"
          old = Path(os.environ["RUNNER_TEMP"]) / "terraria-legacy-sprites" / "Art" / "Terraria" / "images"

          for prefix, out, minimum, maximum in (
              ("Item", item_out, 1, 6195),
              ("NPC", npc_out, 0, 696),
              ("Buff", buff_out, 1, 400),
          ):
              for src in old.glob(f"{prefix}_*.png"):
                  match = re.fullmatch(rf"{prefix}_(\d+)\.png", src.name)
                  if not match:
                      continue
                  content_id = int(match.group(1))
                  if minimum <= content_id <= maximum:
                      (out / f"{content_id}.png").write_bytes(src.read_bytes())

          session = requests.Session()
          session.headers.update({
              "User-Agent": "BunnyLoaderSpriteBuilder/0.1 (+https://github.com/JonataOliveiraa/Bunny-Loader)"
          })

          page = session.get("https://terraria.wiki.gg/wiki/List_of_item_sprite_sizes", timeout=60)
          page.raise_for_status()
          soup = BeautifulSoup(page.text, "html.parser")

          names = {}
          for tr in soup.find_all("tr"):
              cells = tr.find_all(["td", "th"])
              if len(cells) < 2:
                  continue
              match = re.fullmatch(r"(\d+)", cells[0].get_text(" ", strip=True))
              if not match:
                  continue
              item_id = int(match.group(1))
              if 1 <= item_id <= 6195:
                  names[item_id] = cells[1].get_text(" ", strip=True)

          params = {
              "action": "query",
              "generator": "categorymembers",
              "gcmtitle": "Category:Item images",
              "gcmtype": "file",
              "gcmlimit": "500",
              "prop": "imageinfo",
              "iiprop": "url",
              "format": "json",
              "formatversion": "2",
          }

          files = {}
          while True:
              response = session.get("https://terraria.wiki.gg/api.php", params=params, timeout=60)
              response.raise_for_status()
              data = response.json()
              for page_info in data.get("query", {}).get("pages", []):
                  title = page_info.get("title", "")
                  info = page_info.get("imageinfo") or []
                  if not title.startswith("File:") or not info:
                      continue
                  filename = title[5:]
                  stem = filename.rsplit(".", 1)[0]
                  url = info[0].get("url")
                  if url:
                      files.setdefault(stem, url)
              cont = data.get("continue")
              if not cont:
                  break
              params.update(cont)

          def norm(value):
              value = unicodedata.normalize("NFKD", value).casefold()
              value = value.replace("’", "'").replace("‘", "'")
              return "".join(ch for ch in value if ch.isalnum())

          by_norm = {}
          for stem, url in files.items():
              by_norm.setdefault(norm(stem), []).append((stem, url))

          def find_item_url(name):
              for candidate in (name, name + " (item)", name + " item"):
                  values = by_norm.get(norm(candidate))
                  if values:
                      return values[0][1]
              base = norm(name)
              candidates = []
              for key, values in by_norm.items():
                  suffix = key[len(base):] if key.startswith(base) else ""
                  if suffix in ("item", "inventory", "animated"):
                      candidates.extend(values)
              return candidates[0][1] if len(candidates) == 1 else None

          missing_items = [item_id for item_id in sorted(names) if not (item_out / f"{item_id}.png").is_file()]

          def fetch_item(item_id):
              name = names[item_id]
              url = find_item_url(name)
              if not url:
                  return item_id, name, "sem URL"
              try:
                  response = requests.get(url, timeout=45, headers={"User-Agent": session.headers["User-Agent"]})
                  response.raise_for_status()
                  with Image.open(BytesIO(response.content)) as image:
                      image.seek(0)
                      image.convert("RGBA").save(item_out / f"{item_id}.png", "PNG", optimize=True)
                  return item_id, name, None
              except Exception as exc:
                  return item_id, name, str(exc)

          item_failures = []
          with ThreadPoolExecutor(max_workers=16) as pool:
              futures = [pool.submit(fetch_item, item_id) for item_id in missing_items]
              for future in as_completed(futures):
                  item_id, name, error = future.result()
                  if error:
                      item_failures.append((item_id, name, error))

          def table_file_titles(url, minimum, maximum):
              response = session.get(url, timeout=60)
              response.raise_for_status()
              page_soup = BeautifulSoup(response.text, "html.parser")
              result = {}
              for tr in page_soup.find_all("tr"):
                  cells = tr.find_all(["td", "th"])
                  if not cells:
                      continue
                  match = re.fullmatch(r"(-?\d+)", cells[0].get_text(" ", strip=True))
                  if not match:
                      continue
                  content_id = int(match.group(1))
                  if content_id < minimum or content_id > maximum:
                      continue
                  link = tr.find("a", href=lambda value: value and "/wiki/File:" in value)
                  if not link:
                      continue
                  href = link.get("href", "")
                  title = unquote(href.split("/wiki/", 1)[1]).replace("_", " ")
                  result[content_id] = title
              return result

          def file_url(title):
              response = session.get(
                  "https://terraria.wiki.gg/api.php",
                  params={
                      "action": "query",
                      "titles": title,
                      "prop": "imageinfo",
                      "iiprop": "url",
                      "format": "json",
                      "formatversion": "2",
                  },
                  timeout=60,
              )
              response.raise_for_status()
              pages = response.json().get("query", {}).get("pages", [])
              if not pages:
                  return None
              info = pages[0].get("imageinfo") or []
              return info[0].get("url") if info else None

          def fetch_table_images(page_url, out, minimum, maximum):
              titles = table_file_titles(page_url, minimum, maximum)
              failures = []
              for content_id in range(minimum, maximum + 1):
                  dest = out / f"{content_id}.png"
                  if dest.is_file():
                      continue
                  title = titles.get(content_id)
                  if not title:
                      failures.append((content_id, "sem arquivo na tabela"))
                      continue
                  try:
                      url = file_url(title)
                      if not url:
                          raise RuntimeError("sem URL")
                      response = session.get(url, timeout=45)
                      response.raise_for_status()
                      with Image.open(BytesIO(response.content)) as image:
                          image.seek(0)
                          image.convert("RGBA").save(dest, "PNG", optimize=True)
                  except Exception as exc:
                      failures.append((content_id, str(exc)))
              return failures

          npc_failures = fetch_table_images(
              "https://terraria.wiki.gg/wiki/NPC_IDs",
              npc_out,
              688,
              696,
          )
          buff_failures = fetch_table_images(
              "https://terraria.wiki.gg/wiki/Buff_IDs",
              buff_out,
              355,
              400,
          )

          item_count = len(list(item_out.glob("*.png")))
          npc_count = len(list(npc_out.glob("*.png")))
          buff_count = len(list(buff_out.glob("*.png")))
          print(f"sprites vanilla: item={item_count} npc={npc_count} buff={buff_count}")

          for label, failures in (
              ("item", item_failures),
              ("npc", npc_failures),
              ("buff", buff_failures),
          ):
              if failures:
                  print(f"falhas {label}: {len(failures)}")
                  for failure in failures[:80]:
                      print(" ", failure)

          if item_count < 6100:
              raise SystemExit(f"pacote de itens incompleto: {item_count}")
          if npc_count < 697:
              raise SystemExit(f"pacote de NPCs incompleto: {npc_count}")
          if buff_count < 400:
              raise SystemExit(f"pacote de buffs incompleto: {buff_count}")
          PY

      - name: Rebuild CheatBridge dex
        working-directory: Split/Bunny-Loader
        shell: bash
        run: |
          OUT=".cheatbridge"
          AJAR="$ANDROID_HOME/platforms/android-34/android.jar"
          D8="$ANDROID_HOME/build-tools/34.0.0/d8"
          rm -rf "$OUT"
          mkdir -p "$OUT/classes"

          javac -source 8 -target 8 -nowarn -encoding UTF-8 \
            -classpath "$AJAR" \
            -d "$OUT/classes" \
            tools/cheatbridge/bunny/CheatBridge.java \
            tools/cheatbridge/bunny/CheatData.java \
            tools/cheatbridge/bunny/DevTools.java

          mapfile -t CLASSES < <(find "$OUT/classes" -name "*.class" -type f)
          "$D8" --release --min-api 26 --lib "$AJAR" --output "$OUT" "${CLASSES[@]}"

          python3 tools/bin2header.py "$OUT/classes.dex" bl_cheatbridge_dex \
            > app/src/main/cpp/menu/CheatBridgeDex.h

          test -s app/src/main/cpp/menu/CheatBridgeDex.h
          echo "CheatBridge rebuilt: $(stat -c%s "$OUT/classes.dex") bytes"

      - name: Build full Bunny APK
        working-directory: Split/Bunny-Loader
        shell: bash
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Validate APK
        shell: bash
        run: |
          APK="Split/Bunny-Loader/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -c -v 4 "$APK"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libbunny.so"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libil2cpp.so"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libunity.so"
          unzip -l "$APK" | grep -q "assets/bin/Data/Managed/Metadata/global-metadata.dat"
          ITEM_SPRITES="$(unzip -l "$APK" | grep -Ec 'assets/sprites/item/[0-9]+[.]png
      - name: Collect APK
        shell: bash
        run: |
          mkdir -p Split/build/output
          cp Split/Bunny-Loader/app/build/outputs/apk/debug/app-debug.apk             Split/build/output/Split-BunnyLoader-full-debug.apk
          sha256sum Split/build/output/Split-BunnyLoader-full-debug.apk             > Split/build/output/Split-BunnyLoader-full-debug.apk.sha256

      - name: Upload full APK
        uses: actions/upload-artifact@v4
        with:
          name: Split-BunnyLoader-full-debug
          path: |
            Split/build/output/Split-BunnyLoader-full-debug.apk
            Split/build/output/Split-BunnyLoader-full-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
)"
          NPC_SPRITES="$(unzip -l "$APK" | grep -Ec 'assets/sprites/npc/[0-9]+[.]png
      - name: Collect APK
        shell: bash
        run: |
          mkdir -p Split/build/output
          cp Split/Bunny-Loader/app/build/outputs/apk/debug/app-debug.apk             Split/build/output/Split-BunnyLoader-full-debug.apk
          sha256sum Split/build/output/Split-BunnyLoader-full-debug.apk             > Split/build/output/Split-BunnyLoader-full-debug.apk.sha256

      - name: Upload full APK
        uses: actions/upload-artifact@v4
        with:
          name: Split-BunnyLoader-full-debug
          path: |
            Split/build/output/Split-BunnyLoader-full-debug.apk
            Split/build/output/Split-BunnyLoader-full-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
)"
          BUFF_SPRITES="$(unzip -l "$APK" | grep -Ec 'assets/sprites/buff/[0-9]+[.]png
      - name: Collect APK
        shell: bash
        run: |
          mkdir -p Split/build/output
          cp Split/Bunny-Loader/app/build/outputs/apk/debug/app-debug.apk             Split/build/output/Split-BunnyLoader-full-debug.apk
          sha256sum Split/build/output/Split-BunnyLoader-full-debug.apk             > Split/build/output/Split-BunnyLoader-full-debug.apk.sha256

      - name: Upload full APK
        uses: actions/upload-artifact@v4
        with:
          name: Split-BunnyLoader-full-debug
          path: |
            Split/build/output/Split-BunnyLoader-full-debug.apk
            Split/build/output/Split-BunnyLoader-full-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
)"
          test "$ITEM_SPRITES" -ge 6100
          test "$NPC_SPRITES" -ge 697
          test "$BUFF_SPRITES" -ge 400
          echo "Vanilla cheat sprites in APK: item=$ITEM_SPRITES npc=$NPC_SPRITES buff=$BUFF_SPRITES"

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p Split/build/output
          cp Split/Bunny-Loader/app/build/outputs/apk/debug/app-debug.apk             Split/build/output/Split-BunnyLoader-full-debug.apk
          sha256sum Split/build/output/Split-BunnyLoader-full-debug.apk             > Split/build/output/Split-BunnyLoader-full-debug.apk.sha256

      - name: Upload full APK
        uses: actions/upload-artifact@v4
        with:
          name: Split-BunnyLoader-full-debug
          path: |
            Split/build/output/Split-BunnyLoader-full-debug.apk
            Split/build/output/Split-BunnyLoader-full-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
