name: Build Bunny CSharp 1.0.11 — ExampleMod Android QA
'on':
  push:
    branches:
    - integration/ready-prs-source-fixes-20261020
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ready-prs-${{ github.ref }}
  cancel-in-progress: false
env:
  PRIVATE_INPUTS_REPO: MantovaniDevTrue/Bunnyloader-Csharp-Builds
  RUNTIME_TAG: bunny-private-build-inputs-v1
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - &id001
      uses: actions/checkout@v4
    - &id002
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x

          10.0.x'
    - &id003
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Compile all playable CSharp example sources with the current SDK
      run: dotnet build tests/ready_prs/FullExampleManaged.csproj -c Release --nologo
    - name: Run full ExampleMod through real Roslyn and DLL verifier
      run: dotnet run --project tests/ready_prs/FullExampleRuntime/FullExampleRuntime.csproj -c Release -- samples/ExampleModCSharp/Playable
    - name: Verify conservative ExampleMod coverage
      run: python3 tools/examplemod_coverage.py --check
    - name: Run combined PR contracts and integration tests
      run: python3 tools/ci/test_ready_prs.py
    - name: Run core regressions and editable ExampleMod compilation
      run: 'dotnet run --project tests/basic_items/ItemBatch.csproj -c Release

        python3 tests/basic_items/check_full_wire.py build/basic-items/full-source-runtime-values.txt

        python3 tests/basic_items/package_assets_test.py

        bash tests/world_loaders/run.sh

        DOTNET=dotnet bash tests/shooting/run.sh

        bash tests/summon_lifecycle/run.sh

        bash tests/recipe_callbacks/run.sh

        bash tests/projectile_policy/run.sh

        dotnet run --project tests/entity_source/EntitySource.csproj -c Release

        dotnet run --project tests/combat_batch/CombatBatch.csproj -c Release

        bash tests/ready_prs/run.sh'
  android:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - *id001
    - name: Require completed ExampleMod port and loaders before APK
      run: python3 tools/ci/check_examplemod_apk_readiness.py
    - *id002
    - *id003
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'
    - name: Install Android build tools
      run: 'yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;30.0.16248370" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"'
    - name: Rebuild bundled SDK, compiler and exact framework manifest
      run: bash tools/ci/stage_ready_managed.sh
    - name: Stage verified private Terraria, Unity classes and sprites
      env:
        GH_TOKEN: ${{ secrets.BUNNY_PRIVATE_BUILD_TOKEN }}
      run: bash tools/ci/ready_private_inputs.sh
    - name: Build normal mixed compiler AOT (editable mod sources remain JIT)
      run: bash tools/ci/ready_compiler_aot.sh
    - name: Rebuild menu DEX
      run: 'mkdir -p .cheatbridge/classes

        AJAR="$ANDROID_HOME/platforms/android-34/android.jar"

        javac -source 8 -target 8 -nowarn -encoding UTF-8 -classpath "$AJAR" -d .cheatbridge/classes app/src/main/java/bunny/TranslationCatalog.java app/src/main/java/bunny/MenuLocalization.java tools/cheatbridge/bunny/CheatBridge.java tools/cheatbridge/bunny/CheatData.java tools/cheatbridge/bunny/DevTools.java

        mapfile -t CLASSES < <(find .cheatbridge/classes -type f -name ''*.class'')

        "$ANDROID_HOME/build-tools/34.0.0/d8" --release --min-api 26 --lib "$AJAR" --output .cheatbridge "${CLASSES[@]}"

        python3 tools/bin2header.py .cheatbridge/classes.dex bl_cheatbridge_dex > app/src/main/cpp/menu/CheatBridgeDex.h'
    - name: Build complete experimental APK with existing V3 signing key
      env:
        BUNNY_KEYSTORE_B64: ${{ secrets.BUNNY_KEYSTORE_B64 }}
        BUNNY_SIGNING_PASSWORD: ${{ secrets.BUNNY_SIGNING_PASSWORD }}
        BUNNY_SIGNING_ALIAS: ${{ secrets.BUNNY_SIGNING_ALIAS }}
      run: 'set -euo pipefail

        umask 077

        export BUNNY_SIGNING_STORE="$RUNNER_TEMP/ready-preview.jks"

        trap ''rm -f "$BUNNY_SIGNING_STORE"'' EXIT

        printf ''%s'' "$BUNNY_KEYSTORE_B64" | base64 --decode > "$BUNNY_SIGNING_STORE"

        unset BUNNY_KEYSTORE_B64

        keytool -list -keystore "$BUNNY_SIGNING_STORE" -storepass:env BUNNY_SIGNING_PASSWORD -alias "$BUNNY_SIGNING_ALIAS" >/dev/null

        gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace -Pbl.readyPrPreview=true -Pbl.dustPreview=true'
    - name: Re-run host acceptance and publish privately
      env:
        GH_TOKEN: ${{ secrets.BUNNY_PRIVATE_BUILD_TOKEN }}
      run: 'python3 tools/ci/test_ready_prs.py

        bash tools/ci/publish_ready_preview.sh'
