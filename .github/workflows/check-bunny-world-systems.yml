name: Bunny Engine world systems

on:
  pull_request:
    paths:
      - 'experiments/csharp/BunnyCsSdk/**'
      - 'experiments/csharp/BunnyWorldSystemsSmoke/**'
      - 'experiments/csharp/BunnySourceSdk/BunnySourceSdk.csproj'
      - 'app/src/main/cpp/experiments/csharp/SourceParser.cpp'
      - 'app/src/main/cpp/experiments/csharp/SourceLoader.*'
      - 'app/src/main/cpp/experiments/csharp/SourceContentIdentity.h'
      - 'app/src/main/cpp/experiments/csharp/AutoSourceRuntime.cpp'
      - 'app/src/main/cpp/experiments/csharp/NativeWorldSystemPersistence.*'
      - 'app/src/main/cpp/experiments/csharp/NativeInvasionPersistence.cpp'
      - 'app/src/main/cpp/experiments/csharp/NativeInvasionWorldPath.cpp'
      - 'app/src/main/cpp/experiments/csharp/WorldSystemSaveFile.h'
      - 'app/src/main/cpp/experiments/csharp/WorldNetProtocol.h'
      - 'app/src/main/cpp/experiments/csharp/NativeInvasionNetwork.cpp'
      - 'app/src/main/cpp/experiments/csharp/NativeInvasionNetwork.h'
      - '.github/workflows/check-bunny-world-systems.yml'
  workflow_dispatch:

jobs:
  world-systems:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: C++ parser and identity checks
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra -Iapp/src/main/cpp app/src/main/cpp/experiments/csharp/SourceParser.cpp experiments/csharp/BunnyWorldSystemsSmoke/SourceParserSmoke.cpp -o /tmp/bunny-world-parser
          /tmp/bunny-world-parser
      - name: Native world persistence checks
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra -Iapp/src/main/cpp experiments/csharp/BunnyWorldSystemsSmoke/WorldPersistenceSmoke.cpp -o /tmp/bunny-world-save
          /tmp/bunny-world-save
          c++ -std=c++20 -Wall -Wextra -fPIC -Iapp/src/main/cpp -c app/src/main/cpp/experiments/csharp/NativeWorldSystemPersistence.cpp -o /tmp/bunny-world-native.o
      - name: Native world network protocol
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -Iapp/src/main/cpp experiments/csharp/BunnyWorldSystemsSmoke/WorldNetProtocolSmoke.cpp -o /tmp/bunny-world-net
          /tmp/bunny-world-net
      - name: Production SDK compatibility
        run: dotnet build experiments/csharp/BunnySourceSdk/BunnySourceSdk.csproj -c Release
      - name: SDK and lifecycle checks
        run: dotnet run --project experiments/csharp/BunnyWorldSystemsSmoke/BunnyWorldSystemsSmoke.csproj -c Release
