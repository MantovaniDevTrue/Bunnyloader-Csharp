name: CSharp golf ball source and native projectile tables (no APK)
on:
  push:
    paths:
      - 'experiments/csharp/**'
      - 'app/src/main/cpp/experiments/csharp/NativeDefaults.h'
      - 'app/src/main/cpp/experiments/csharp/NativeContent.cpp'
      - 'app/src/main/cpp/experiments/csharp/AutoSourceRuntime.cpp'
      - 'samples/ExampleModCSharp/Playable/**'
      - 'tests/golf_ball/**'
      - '.github/workflows/check-csharp-golf-ball.yml'
  pull_request:
    paths:
      - 'experiments/csharp/**'
      - 'app/src/main/cpp/experiments/csharp/NativeDefaults.h'
      - 'app/src/main/cpp/experiments/csharp/NativeContent.cpp'
      - 'app/src/main/cpp/experiments/csharp/AutoSourceRuntime.cpp'
      - 'samples/ExampleModCSharp/Playable/**'
      - 'tests/golf_ball/**'
      - '.github/workflows/check-csharp-golf-ball.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile original examples and execute production native hook
        run: bash tests/golf_ball/run.sh
