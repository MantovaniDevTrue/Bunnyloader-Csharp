name: Check Bunny CSharp Random Compat (no APK)
on:
  push:
    branches: [main]
    paths:
      - "Split/Bunny-Loader/experiments/csharp/BunnyCsSdk/TerrariaRandomCompat.cs"
      - "Split/Bunny-Loader/experiments/csharp/BunnySourceSdk/BunnySourceSdk.csproj"
      - "Split/Bunny-Loader/tests/random_compat/**"
      - "Split/Bunny-Loader/tests/random_compat_android_probe/**"
      - "Split/Bunny-Loader/samples/RandomCompatCSharp/**"
      - "Split/Bunny-Loader/samples/RandomCompatSmokeCSharp/**"
      - "Split/Bunny-Loader/docs/generated/sdk_public_reference.*"
      - ".github/workflows/check-csharp-random-compat.yml"
  pull_request:
    paths:
      - "Split/Bunny-Loader/experiments/csharp/BunnyCsSdk/TerrariaRandomCompat.cs"
      - "Split/Bunny-Loader/experiments/csharp/BunnySourceSdk/BunnySourceSdk.csproj"
      - "Split/Bunny-Loader/tests/random_compat/**"
      - "Split/Bunny-Loader/tests/random_compat_android_probe/**"
      - "Split/Bunny-Loader/samples/RandomCompatCSharp/**"
      - "Split/Bunny-Loader/samples/RandomCompatSmokeCSharp/**"
      - "Split/Bunny-Loader/docs/generated/sdk_public_reference.*"
      - ".github/workflows/check-csharp-random-compat.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  random-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile and test random API
        run: |
          dotnet run --project Split/Bunny-Loader/tests/random_compat/RandomCompat.csproj --configuration Release
          dotnet run --project Split/Bunny-Loader/tests/random_compat_android_probe/RandomCompatAndroidProbe.csproj --configuration Release
      - name: Package independent CSharp gameplay probe
        run: |
          set -euo pipefail
          python3 Split/Bunny-Loader/tools/mods/pack.py Split/Bunny-Loader/samples/RandomCompatSmokeCSharp/Playable
          cp Split/Bunny-Loader/build/mods-packs/randomcompatsmoke-0.1.0.bl RandomCompatSmokeCSharp-v0.1.0.bmod
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          p=Path("RandomCompatSmokeCSharp-v0.1.0.bmod")
          with ZipFile(p) as z:
              names=z.namelist()
              assert "manifest.json" in names
              assert "content/main.cs" in names
              assert "content/Common/Players/RandomCompatProbePlayer.cs" in names
              assert not any(x.endswith((".js",".dll",".so")) for x in names)
          print("BUNNY_CSHARP_RANDOM_QA_BMOD=PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: RandomCompatSmokeCSharp-v0.1.0
          path: RandomCompatSmokeCSharp-v0.1.0.bmod
          retention-days: 14
          if-no-files-found: error
