name: Check Bunny CSharp Random Compat (no APK)
on:
  push:
    branches: [main]
    paths:
      - "Split/Bunny-Loader/experiments/csharp/BunnyCsSdk/TerrariaRandomCompat.cs"
      - "Split/Bunny-Loader/experiments/csharp/BunnySourceSdk/BunnySourceSdk.csproj"
      - "Split/Bunny-Loader/tests/random_compat/**"
      - "Split/Bunny-Loader/tests/random_compat_android_probe/**"
      - "Split/Bunny-Loader/samples/RandomCompatCSharp/**"
      - "Split/Bunny-Loader/samples/RandomCompatSmokeCSharp/**"
      - "Split/Bunny-Loader/docs/generated/sdk_public_reference.*"
      - ".github/workflows/check-csharp-random-compat.yml"
  pull_request:
    paths:
      - "Split/Bunny-Loader/experiments/csharp/BunnyCsSdk/TerrariaRandomCompat.cs"
      - "Split/Bunny-Loader/experiments/csharp/BunnySourceSdk/BunnySourceSdk.csproj"
      - "Split/Bunny-Loader/tests/random_compat/**"
      - "Split/Bunny-Loader/tests/random_compat_android_probe/**"
      - "Split/Bunny-Loader/samples/RandomCompatCSharp/**"
      - "Split/Bunny-Loader/samples/RandomCompatSmokeCSharp/**"
      - "Split/Bunny-Loader/docs/generated/sdk_public_reference.*"
      - ".github/workflows/check-csharp-random-compat.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  random-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile and test random API
        run: |
          dotnet run --project Split/Bunny-Loader/tests/random_compat/RandomCompat.csproj --configuration Release
          dotnet run --project Split/Bunny-Loader/tests/random_compat_android_probe/RandomCompatAndroidProbe.csproj --configuration Release
