name: Check CSharp managed hit diagnostics v82

on:
  push:
    branches:
      - csharp-managed-hit-diagnostics-v82-experiment
  workflow_dispatch:

jobs:
  check-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile and test hit-index counters
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pthread \
            -I Split/Bunny-Loader/app/src/main/cpp \
            Split/Bunny-Loader/tests/test_managed_hit_context_v82.cpp \
            -o /tmp/bunny-managed-hit-diagnostics-v82
          /tmp/bunny-managed-hit-diagnostics-v82
      - name: Verify legacy and V2 dispatch through host MonoVM
        shell: bash
        run: |
          set -euo pipefail
          python3 Split/Bunny-Loader/tests/run_managed_lifecycle_regressions.py
      - name: Verify JS status and native dispatch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path("Split/Bunny-Loader/app/src/main/cpp")
          runtime = (root / "experiments/csharp/ManagedRuntime.cpp").read_text()
          header = (root / "experiments/csharp/ManagedRuntime.h").read_text()
          js = (root / "script/api/CSharpPrototypeApi.cpp").read_text()
          stats = (root / "experiments/csharp/ManagedHitContextStats.h").read_text()
          assert "result.usedV2 = useV2;" in runtime
          assert "callback.invoked" in runtime
          assert "g_liveHitStatus.hitContext.record(" in runtime
          assert "binding->hitContext.record(" in runtime
          assert "entry.hitContext = {};" in runtime
          assert "ManagedHitContextStats hitContext;" in header
          for name in ("v2Calls", "v2Successes", "v2Failures", "legacyCalls",
                       "legacyFailures", "lastNpcIndex", "minNpcIndex",
                       "maxNpcIndex", "uniqueNpcIndices", "invalidV2Indices"):
              assert name in stats and f'"{name}"' in js
          assert 'makeManagedHitContextStatus(ctx, status.hitContext)' in js
          assert 'makeManagedHitContextStatus(ctx, value.hitContext)' in js
          print("CSHARP_V82_HIT_DIAGNOSTICS_JS_AND_DISPATCH=PASS")
          PY
