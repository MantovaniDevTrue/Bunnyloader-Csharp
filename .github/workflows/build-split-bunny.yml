name: Build Split Bunny APK

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-split-bunny.yml"
      - "Split/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager             "platforms;android-34"             "build-tools;34.0.0"             "ndk;30.0.16248370"             "cmake;3.22.1"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Fetch Bunny Loader source
        shell: bash
        run: |
          rm -rf Split/Bunny-Loader
          git clone --depth 1 https://github.com/JonataOliveiraa/Bunny-Loader.git Split/Bunny-Loader

      - name: Fetch QuickJS
        shell: bash
        run: |
          git clone --depth 1 --branch v0.17.0             https://github.com/quickjs-ng/quickjs.git             Split/Bunny-Loader/app/src/main/cpp/third_party/quickjs

      - name: Build native UI-only APK
        working-directory: Split/Bunny-Loader
        shell: bash
        run: |
          gradle :app:assembleDebug             -Pbl.uiOnly=true             --stacktrace             --no-daemon

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p Split/build/output
          cp Split/Bunny-Loader/app/build/outputs/apk/debug/app-debug.apk             Split/build/output/Split-BunnyLoader-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Split-BunnyLoader-debug
          path: Split/build/output/Split-BunnyLoader-debug.apk
          if-no-files-found: error
          retention-days: 14
