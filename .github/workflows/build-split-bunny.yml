name: Build Split Bunny APK

on:
  push:
    branches:
      - main
      - bunny-ui-tileentity-phase1
    paths:
      - ".github/workflows/build-split-bunny.yml"
      - "Split/Bunny-Loader/**"
      - "Split/patches/**"
      - "Split/mod/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android toolchain
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;30.0.16248370" "cmake;3.22.1"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Ensure QuickJS
        shell: bash
        run: |
          rm -rf Split/Bunny-Loader/app/src/main/cpp/third_party/quickjs
          git clone --depth 1 --branch v0.17.0 https://github.com/quickjs-ng/quickjs.git Split/Bunny-Loader/app/src/main/cpp/third_party/quickjs

      - name: Configure Maven Central mirror
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("Split/Bunny-Loader/settings.gradle.kts")
          s = p.read_text()
          s = s.replace("mavenCentral()", 'maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2") }')
          p.write_text(s)
          PY

      - name: Build native UI-only APK
        working-directory: Split/Bunny-Loader
        shell: bash
        run: |
          gradle :app:assembleDebug -Pbl.uiOnly=true --stacktrace --no-daemon

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p Split/build/output
          cp Split/Bunny-Loader/app/build/outputs/apk/debug/app-debug.apk             Split/build/output/Split-BunnyLoader-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Split-BunnyLoader-debug
          path: Split/build/output/Split-BunnyLoader-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Record branch build status
        if: always() && github.ref_name == 'bunny-ui-tileentity-phase1'
        shell: bash
        run: |
          mkdir -p .ci
          printf '%s\n' "${{ job.status }}" > .ci/bunny-ui-tileentity-phase1.txt
          git config user.name "Split Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .ci/bunny-ui-tileentity-phase1.txt
          git commit -m "Record Bunny feature build status" || exit 0
          git push origin HEAD:bunny-ui-tileentity-phase1
