name: Diagnose Bunny CSharp 90.3.1 APK build

on:
  push:
    branches:
      - fix/csharp-90-3-recipegroup-return-contract
    paths:
      - .github/workflows/diagnose-csharp-90-3-1-build.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Identify failed APK build and post failing steps
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: fix/csharp-90-3-recipegroup-return-contract
          PREVIOUS_SHA: 87acda749ab0656a23d03a6a0905f69d60104ef9
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/runs?branch=$BRANCH&per_page=100" > "$RUNNER_TEMP/runs.json"
          python3 - "$RUNNER_TEMP/runs.json" "$RUNNER_TEMP/diagnosis.json" <<'PY'
          import json, sys
          runs = json.load(open(sys.argv[1])).get("workflow_runs", [])
          relevant = [r for r in runs if r.get("name") in (
              "Build Bunny CSharp Source Files Prototype",
              "Build Bunny CSharp 90 buffs and recipes"
          )]
          previous = [r for r in relevant if r.get("head_sha") == "87acda749ab0656a23d03a6a0905f69d60104ef9"]
          failed = [r for r in previous if r.get("conclusion") in ("failure", "cancelled", "timed_out", "action_required")]
          selected = (failed or previous or relevant)[:3]
          json.dump(selected, open(sys.argv[2], "w"))
          for run in selected:
              print("BUILD_RUN", run.get("id"), run.get("name"), run.get("status"), run.get("conclusion"), run.get("html_url"))
          if not selected:
              print("NO_BUILD_RUNS_FOUND_FOR_BRANCH")
          PY
          python3 - "$RUNNER_TEMP/diagnosis.json" "$RUNNER_TEMP/summary.md" <<'PY'
          import json, subprocess, sys
          runs = json.load(open(sys.argv[1]))
          report = ["### Diagnóstico automático da build Bunny C# .90.3.1", ""]
          if not runs:
              report.append("Nenhuma execução do workflow principal encontrada nessa branch. Possível falha de disparo ou validação do workflow.")
          for run in runs:
              report.extend([
                  f"**Build:** {run.get('name')} — {run.get('conclusion') or run.get('status')}",
                  f"Run: {run.get('html_url')}", f"Commit: `{run.get('head_sha')}`", ""
              ])
              job_data = subprocess.run(
                  ["gh", "api", f"repos/{run['repository']['full_name']}/actions/runs/{run['id']}/jobs?per_page=100"],
                  capture_output=True, text=True)
              if job_data.returncode:
                  report.append("Consulta de jobs falhou: " + job_data.stderr[:300])
                  continue
              jobs = json.loads(job_data.stdout).get("jobs", [])
              bad = [j for j in jobs if j.get("conclusion") in ("failure", "cancelled", "timed_out")]
              if not bad and run.get("conclusion") == "failure":
                  report.append("Workflow falhou sem job de execução: verificar erro de validação do YAML no link acima.")
              for job in bad:
                  report.append(f"- Job **{job.get('name')}**: {job.get('conclusion')}")
                  for step in job.get("steps", []):
                      if step.get("conclusion") in ("failure", "cancelled", "timed_out"):
                          report.append(f"  - Etapa **{step.get('name')}**: {step.get('conclusion')}")
              report.append("")
          open(sys.argv[2], "w").write("\n".join(report) + "\n")
          print("\n".join(report))
          PY
          gh issue comment 90 --repo "$REPO" --body-file "$RUNNER_TEMP/summary.md"
