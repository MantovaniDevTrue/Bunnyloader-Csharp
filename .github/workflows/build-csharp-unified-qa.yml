name: Bunny CSharp Unified Mobile — QA APK

on:
  push:
    branches: [integration/csharp-unified-20261024, qa/csharp-world-tree-gore-apk-20261024]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: csharp-unified-qa-${{ github.ref }}
  cancel-in-progress: true

env:
  PRIVATE_INPUTS_REPO: MantovaniDevTrue/Bunnyloader-Csharp-Builds
  RUNTIME_TAG: bunny-private-build-inputs-v1
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  contracts:
    if: github.ref == 'refs/heads/integration/csharp-unified-20261024' || github.ref == 'refs/heads/qa/csharp-world-tree-gore-apk-20261024'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify native summon speed contracts
        run: mkdir -p build/unified-speed && c++ -std=c++20 -Wall -Wextra -Werror -Iapp/src/main/cpp tests/csharp_unified/weapon_speed_test.cpp -o build/unified-speed/check && build/unified-speed/check
      - name: Verify tile draw coordinate height array bounds
        run: mkdir -p build/unified-tile-shapes && c++ -std=c++20 -Wall -Wextra -Werror -Iapp/src/main/cpp tests/csharp_unified/tile_draw_shape_bounds_test.cpp -o build/unified-tile-shapes/check && build/unified-tile-shapes/check
      - name: Verify world tick crash stage boundaries
        run: python3 tests/csharp_unified/check_world_crash_stages.py
      - name: Verify Android drink particle color jagged array ABI
        run: |
          mkdir -p build/unified-drink-colors
          c++ -std=c++20 -Wall -Wextra -Werror -Iapp/src/main/cpp tests/drink_colors/native_test.cpp -o build/unified-drink-colors/check
          build/unified-drink-colors/check
      - name: Verify vanilla Acorn and native tree drop binding
        run: |
          mkdir -p build/unified-tree-acorn
          c++ -std=c++20 -Wall -Wextra -Werror -Iapp/src/main/cpp tests/csharp_unified/tree_acorn_id_test.cpp -o build/unified-tree-acorn/check
          build/unified-tree-acorn/check
          python3 tests/csharp_unified/check_tree_drop_native_binding.py
      - name: Verify game-thread gore and tree texture publication
        run: python3 tests/csharp_unified/check_gore_tree_texture_thread.py
      - name: Verify game-thread mount texture publication
        run: python3 tests/csharp_unified/check_mount_texture_thread.py
      - name: Verify original vanilla minecart mount IDs
        run: mkdir -p build/unified-minecart-ids && c++ -std=c++20 -Wall -Wextra -Werror -Iapp/src/main/cpp tests/csharp_unified/vanilla_minecart_ids_test.cpp -o build/unified-minecart-ids/check && build/unified-minecart-ids/check
      - name: Verify original diamond mount dust ID
        run: mkdir -p build/unified-mount-dust && c++ -std=c++20 -Wall -Wextra -Werror -Iapp/src/main/cpp tests/csharp_unified/mount_dust_id_test.cpp -o build/unified-mount-dust/check && build/unified-mount-dust/check
      - name: Verify unified Dust Invasion Five Loaders and both CSharp examples
        run: |
          set -euo pipefail
          python3 -m pip install --quiet unicorn==2.1.4 pyelftools==0.33
          bash tools/five_loaders/check.sh
          python3 tests/invasion/check_item_use_contract.py
          python3 tests/csharp_unified/check_early_mono_crash_probe.py
          dotnet run --project experiments/csharp/BunnyWorldSystemsSmoke/BunnyWorldSystemsSmoke.csproj -c Release
          dotnet run --project tests/examplemod_pre_apk/ExampleModPreApk.csproj -c Release
          dotnet run --project tests/basic_items/ItemBatch.csproj -c Release
          python3 tests/basic_items/check_full_wire.py build/basic-items/full-source-runtime-values.txt
          bash tests/world_loaders/run.sh
          bash tests/ready_prs/run.sh
          dotnet run --project tests/shooting/Shooting.csproj -c Release
          dotnet run --project tools/sdk_reference/SdkReference.csproj -c Release -- --write
          dotnet run --project tools/sdk_reference/SdkReference.csproj -c Release -- --check
          dotnet build tests/five_loaders/QaMod.csproj -c Release --nologo -m:1
          dotnet run --project tests/five_loaders/Probe/Probe.csproj -c Release -- samples/FiveLoadersCSharp/Playable
          dotnet run --project tests/ready_prs/FullExampleRuntime/FullExampleRuntime.csproj -c Release -- samples/ExampleModCSharp/Playable
          python3 tools/ci/test_ready_prs.py
          python3 tools/mods/pack.py samples/FiveLoadersCSharp/Playable
          python3 tools/mods/pack.py samples/ExampleModCSharp/Playable
  android:
    needs: contracts
    if: github.ref == 'refs/heads/integration/csharp-unified-20261024' || github.ref == 'refs/heads/qa/csharp-world-tree-gore-apk-20261024'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install ARM64 toolchain
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;30.0.16248370" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"
      - name: Stage verified private Mobile inputs and rebuild Android SDK
        env:
          GH_TOKEN: ${{ secrets.BUNNY_PRIVATE_BUILD_TOKEN }}
        run: bash tools/five_loaders/stage_runtime.sh
      - name: Rebuild mixed JIT compiler accelerator
        run: bash tools/ci/ready_compiler_aot.sh
      - name: Rebuild menu DEX from the current sources
        run: |
          set -euo pipefail
          mkdir -p .cheatbridge/classes
          AJAR="$ANDROID_HOME/platforms/android-34/android.jar"
          javac -source 8 -target 8 -nowarn -encoding UTF-8 -classpath "$AJAR" -d .cheatbridge/classes app/src/main/java/bunny/TranslationCatalog.java app/src/main/java/bunny/MenuLocalization.java tools/cheatbridge/bunny/CheatBridge.java tools/cheatbridge/bunny/CheatData.java tools/cheatbridge/bunny/DevTools.java
          mapfile -t CLASSES < <(find .cheatbridge/classes -type f -name '*.class')
          "$ANDROID_HOME/build-tools/34.0.0/d8" --release --min-api 26 --lib "$AJAR" --output .cheatbridge "${CLASSES[@]}"
          python3 tools/bin2header.py .cheatbridge/classes.dex bl_cheatbridge_dex > app/src/main/cpp/menu/CheatBridgeDex.h
      - name: Build single unified CSharp Mobile QA APK with existing signing identity
        env:
          BUNNY_KEYSTORE_B64: ${{ secrets.BUNNY_KEYSTORE_B64 }}
          BUNNY_SIGNING_PASSWORD: ${{ secrets.BUNNY_SIGNING_PASSWORD }}
          BUNNY_SIGNING_ALIAS: ${{ secrets.BUNNY_SIGNING_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$BUNNY_KEYSTORE_B64"
          export BUNNY_SIGNING_STORE="$RUNNER_TEMP/five-qa.jks"
          trap 'rm -f "$BUNNY_SIGNING_STORE"' EXIT
          printf '%s' "$BUNNY_KEYSTORE_B64" | base64 --decode > "$BUNNY_SIGNING_STORE"
          unset BUNNY_KEYSTORE_B64
          keytool -list -keystore "$BUNNY_SIGNING_STORE" -storepass:env BUNNY_SIGNING_PASSWORD -alias "$BUNNY_SIGNING_ALIAS" >/dev/null
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon -Pbl.csharpUnifiedQa=true -Pbl.mountsQaDebug=true
      - name: Upload mount integration debug APK for Android QA
        uses: actions/upload-artifact@v4
        with:
          name: bunny-csharp-mounts-qa
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error
      - name: Verify exact APK contents, signers and publish privately with test mod
        env:
          GH_TOKEN: ${{ secrets.BUNNY_PRIVATE_BUILD_TOKEN }}
        run: bash tools/csharp_unified/publish.sh
