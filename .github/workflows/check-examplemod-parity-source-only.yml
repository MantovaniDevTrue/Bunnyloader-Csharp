name: ExampleMod CSharp source-only parity gate

on:
  push:
    branches:
      - feature/examplemod-csharp-parity-gate-20261022
    paths:
      - "tools/example_completion/release_gate.py"
      - "tools/example_completion/test_release_gate.py"
      - "tools/example_completion/stage_tile_assets.py"
      - "tools/example_completion/check_assets.py"
      - "tools/example_completion/current_upstream.json"
      - "samples/ExampleModCSharp/Playable/content/**"
      - "samples/ExampleModCSharp/Porting/**"
      - "tests/basic_items/**"
      - "samples/ExampleModCSharp/Playable/content/Content/Tiles/ExampleTile.cs"
      - "samples/ExampleModCSharp/Playable/content/Content/Items/Placeable/ExampleTileItem.cs"
      - "experiments/csharp/BunnyCsSdk/BunnyTile.cs"
      - "experiments/csharp/BunnySourceCompiler/TileWriter.cs"
      - "app/src/main/cpp/experiments/csharp/NativeContent.cpp"
      - "app/src/main/cpp/experiments/csharp/SourceLoader.cpp"
      - ".github/workflows/check-examplemod-parity-source-only.yml"
  pull_request:
    paths:
      - "tools/example_completion/release_gate.py"
      - "tools/example_completion/test_release_gate.py"
      - ".github/workflows/check-examplemod-parity-source-only.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate-tests:
    name: Test evidence policy (NO APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python source syntax
        run: python3 -m py_compile tools/example_completion/release_gate.py tools/example_completion/test_release_gate.py
      - name: Verify all deny and allow cases using isolated source fixtures
        run: python3 tools/example_completion/test_release_gate.py -v
      - name: Stage original sprite bytes (no APK)
        run: python3 tools/example_completion/stage_tile_assets.py --copy
      - name: Validate every original binary and localization asset
        run: python3 tools/example_completion/check_assets.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check all new tile flag paths
        run: python3 tests/basic_items/tile_parity/check_native_tile_flags.py
      - name: Run established Bunny CSharp item regression suite
        run: dotnet run --project tests/basic_items/ItemBatch.csproj -c Release
      - name: Compile and test original CSharp tile + placeable item
        run: dotnet run --project tests/basic_items/tile_parity/TileParity.csproj -c Release
      - name: Verify staged CSharp placeables without loading incomplete tiles
        run: dotnet run --project tests/basic_items/placeable_stage/PlaceableStage.csproj -c Release

