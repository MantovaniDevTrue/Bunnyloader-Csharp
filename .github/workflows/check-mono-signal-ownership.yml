name: Check Mono Android signal ownership
on:
  push:
    branches: [feat/csharp-summon-lifecycle-v95, feat/csharp-94-owned-summon-damage-lot, feat/csharp-owned-loaders-v93, feat/csharp-owned-recipe-loader-v92, feat/csharp-loader-foundation-v91,feat/csharp-90-5-native-minion-targeting-lot, feat/csharp-90-4-projectile-minion-contract, feat/csharp-buff-recipes-v90, fix/csharp-90-1-static-recipegroup-register, fix/csharp-90-2-recipegroup-real-instance-abi, fix/csharp-90-3-recipegroup-return-contract, feat/csharp-native-recipe-groups-v89, fix/csharp-88-8-lights-review, codex/lot-a-complete-v90-29, codex/csharp-screenfx-v90-29-86, codex/csharp-lights-native-graph-v90-29-87, codex/csharp-lights-fidelity-v90-29-88, codex/csharp-lights-night-hotfix, codex/csharp-lights-sdk-settings-split]
  pull_request:
    paths:
      - 'Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/ManagedRuntime.*'
      - 'Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/MonoSignalOwnership.h'
      - 'Split/Bunny-Loader/tests/managed_signal_*'
      - 'Split/Bunny-Loader/tests/run_managed_signal_ownership.py'
      - '.github/workflows/check-mono-signal-ownership.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signal-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify handlers are preserved before domain initialization
        run: python3 Split/Bunny-Loader/tests/run_managed_signal_ownership.py

