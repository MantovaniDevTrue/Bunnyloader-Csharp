name: Build Split Bunny Launcher

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-split-launcher.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-launcher:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK 34
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Fetch Bunny Loader source
        shell: bash
        run: |
          rm -rf Split/Bunny-Loader
          git clone --depth 1 https://github.com/JonataOliveiraa/Bunny-Loader.git Split/Bunny-Loader

      - name: Configure Maven Central mirror
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("Split/Bunny-Loader/settings.gradle.kts")
          s = p.read_text()
          s = s.replace("mavenCentral()", 'maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2") }')
          p.write_text(s)
          PY

      - name: Build launcher APK
        working-directory: Split/Bunny-Loader
        shell: bash
        run: |
          gradle :app:assembleDebug -Pbl.nativeBuild=false -Pbl.uiOnly=true --stacktrace --no-daemon

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p Split/build/output
          cp Split/Bunny-Loader/app/build/outputs/apk/debug/app-debug.apk Split/build/output/Split-BunnyLoader-launcher-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Split-BunnyLoader-launcher-debug
          path: Split/build/output/Split-BunnyLoader-launcher-debug.apk
          if-no-files-found: error
          retention-days: 14
