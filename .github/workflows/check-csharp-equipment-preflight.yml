name: Equipment CSharp preflight

on:
  push:
    branches:
      - feat/csharp-equipment-preflight-*
    paths:
      - Split/Bunny-Loader/tools/equipment_preflight.py
      - Split/Bunny-Loader/tools/equipment_contract_surface.py
      - Split/Bunny-Loader/tests/equipment_preflight_test.py
      - Split/Bunny-Loader/tests/equipment_contract_surface_test.py
      - docs/equipment-loader-preflight.md
      - .github/workflows/check-csharp-equipment-preflight.yml
  pull_request:
    paths:
      - Split/Bunny-Loader/tools/equipment_preflight.py
      - Split/Bunny-Loader/tests/equipment_preflight_test.py
      - docs/equipment-loader-preflight.md
      - Split/Bunny-Loader/app/src/main/cpp/script/js/mod/Loaders/**
      - Split/Bunny-Loader/samples/ExampleMod/**
      - Split/Bunny-Loader/samples/ExampleModCSharp/**
      - Split/Bunny-Loader/docs/generated/sdk_public_reference.json
      - docs/csharp-loader-batches.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  equipment-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify equipment preflight
        working-directory: Split/Bunny-Loader
        run: |
          python3 -m unittest discover -s tests -p equipment_preflight_test.py -v
          python3 -m unittest discover -s tests -p equipment_contract_surface_test.py -v
          mkdir -p build/equipment-preflight
          python3 tools/equipment_preflight.py --json --output build/equipment-preflight/sources.json
          python3 tools/equipment_contract_surface.py --json --output build/equipment-preflight/callbacks.json
          python3 tools/equipment_contract_surface.py --output build/equipment-preflight/callbacks.md
      - name: Retain equipment source and callback audit
        uses: actions/upload-artifact@v4
        with:
          name: bunny-csharp-equipment-audit
          path: Split/Bunny-Loader/build/equipment-preflight/
          retention-days: 30
