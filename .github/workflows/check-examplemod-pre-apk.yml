name: ExampleMod pre APK Random and collision QA (no APK)
on:
  push:
    branches: [qa/csharp-world-tree-gore-apk-20261024]
    paths:
      - 'samples/ExampleModCSharp/Playable/content/Common/Systems/**'
      - 'tests/examplemod_pre_apk/**'
      - 'tests/basic_items/**'
      - 'app/src/main/cpp/experiments/csharp/BasicItemPolicy.h'
      - 'app/src/main/cpp/experiments/csharp/NativeItemPolicies.*'
      - 'app/src/main/cpp/experiments/csharp/NativeContent.*'
      - 'experiments/csharp/BunnyCsSdk/BunnyItemBehavior.cs'
      - 'samples/ExampleModCSharp/Playable/content/Content/Items/Armor/ExampleCostume.cs'
      - 'docs/csharp/examplemod-evidence.json'
      - 'docs/csharp/EXAMPLEMOD_COVERAGE.json'
      - 'docs/csharp/EXAMPLEMOD_COVERAGE.md'
      - '.github/workflows/check-examplemod-pre-apk.yml'
  pull_request:
    paths:
      - 'experiments/csharp/**'
      - 'samples/ExampleModCSharp/**'
      - 'samples/RandomCompatCSharp/**'
      - 'tests/examplemod_pre_apk/**'
      - 'tests/random_compat/**'
      - '.github/workflows/check-examplemod-pre-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Random utility contracts
        run: dotnet run --project tests/random_compat/RandomCompat.csproj -c Release
      - name: Compile and execute shipped QA examples
        run: dotnet run --project tests/examplemod_pre_apk/ExampleModPreApk.csproj -c Release
      - name: Check conservative behavior coverage
        run: python3 tools/examplemod_coverage.py --check
      - name: Compile entire ExampleMod through production Roslyn
        run: dotnet run --project tests/basic_items/ItemBatch.csproj -c Release
      - name: Validate native costume and item policies without QuickJS
        run: python3 tests/run_native_item_policies.py build/basic-items/full-source-runtime-values.txt samples/ExampleModCSharp/Playable
      - name: Preserve WorldSystem and WorldNet lifecycle
        run: dotnet run --project experiments/csharp/BunnyWorldSystemsSmoke/BunnyWorldSystemsSmoke.csproj -c Release
      - name: Verify public SDK reference
        run: dotnet run --project tools/sdk_reference -c Release -- --check
