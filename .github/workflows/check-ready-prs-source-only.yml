name: CSharp combined source-only integration checks (no APK)
'on':
  push:
    branches:
      - integration/ready-prs-source-fixes-20261020
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  managed-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile combined SDK, compiler and all playable CSharp samples
        run: |
          dotnet build experiments/csharp/BunnySourceSdk/BunnySourceSdk.csproj -c Release --nologo
          dotnet build experiments/csharp/BunnySourceCompiler/BunnySourceCompiler.csproj -c Release --nologo
          dotnet build tests/ready_prs/FullExampleManaged.csproj -c Release --nologo
      - name: Run all playable source defaults with real managed compiler
        run: dotnet run --project tests/ready_prs/FullExampleRuntime/FullExampleRuntime.csproj -c Release -- samples/ExampleModCSharp/Playable
      - name: CommandLoader registration and action regressions
        run: |
          dotnet run --project tests/commands/Commands.HostTests.csproj -c Release
          dotnet run --project tests/commands/CommandManifest.HostTests.csproj -c Release
          dotnet run --project tests/commands/Actions.HostTests.csproj -c Release
      - name: Existing five-loader combined regression suite
        run: |
          python3 tools/ci/test_ready_prs.py
          bash tests/ready_prs/run.sh
  native-host:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Native SoundLoader and Bunny original sound router tests
        run: |
          set -euo pipefail
          g++ -std=c++20 -O1 -Wall -Wextra -pthread -Iapp/src/main/cpp -Itests/basic_items/include tests/summon_lifecycle/managed_sound_loader_test.cpp -o /tmp/bunny-managed-sound-test
          /tmp/bunny-managed-sound-test
          g++ -std=c++20 -O1 -Wall -Wextra -pthread -Iapp/src/main/cpp -Itests/basic_items/include tests/summon_lifecycle/sound_router_test.cpp -o /tmp/bunny-sound-router-test
          /tmp/bunny-sound-router-test
      - name: Native CommandLoader contracts and manifest
        run: |
          set -euo pipefail
          for entry in native_command_clock_test native_command_manifest_test native_command_result_test native_command_source_parser_test native_mailbox_test; do
            g++ -std=c++20 -O1 -Wall -Wextra -pthread -Iapp/src/main/cpp -Itests/basic_items/include "tests/commands/${entry}.cpp" -o "/tmp/${entry}"
            "/tmp/${entry}"
          done
      - name: Ensure source-only workflow never produces an APK
        run: |
          if find app/build -type f -name '*.apk' -print 2>/dev/null | grep -q .; then
            echo 'Unexpected APK in source-only build' >&2
            exit 1
          fi
