name: Stage Bunny Dust managed DLLs without APK

on:
  push:
    branches:
      - feat/csharp-dust-loader-20261019
    paths:
      - .github/workflows/stage-dust-managed-dlls.yml
      - experiments/csharp/BunnyCsSdk/**
      - experiments/csharp/BunnySourceSdk/**
      - experiments/csharp/BunnySourceCompiler/**
      - experiments/csharp/BunnyDustTests/**
      - experiments/csharp/BunnyDustCompilerSmoke/**

permissions:
  contents: write

concurrency:
  group: dust-managed-binaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  managed-dll-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install dotnet 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Compile and validate source SDK and compiler
        run: |
          set -euo pipefail
          dotnet build experiments/csharp/BunnySourceSdk/BunnySourceSdk.csproj -c Release --nologo
          dotnet build experiments/csharp/BunnySourceCompiler/BunnySourceCompiler.csproj -c Release --nologo
          dotnet run --project experiments/csharp/BunnyDustTests/BunnyDustTests.csproj -c Release
          dotnet run --project experiments/csharp/BunnyDustCompilerSmoke/BunnyDustCompilerSmoke.csproj -c Release
      - name: Stage only validated managed assemblies
        run: |
          set -euo pipefail
          cp experiments/csharp/BunnySourceSdk/bin/Release/net8.0/BunnySourceSdk.dll app/src/main/assets/managed/BunnySourceSdk.dll
          cp experiments/csharp/BunnySourceCompiler/bin/Release/net8.0/BunnySourceCompiler.dll app/src/main/assets/managed/BunnySourceCompiler.dll
          test -s app/src/main/assets/managed/BunnySourceSdk.dll
          test -s app/src/main/assets/managed/BunnySourceCompiler.dll
          if find . -type f -name '*.apk' -print -quit | grep -q .; then
            echo "FORBIDDEN: Android APK exists"
            exit 1
          fi
      - name: Commit DLLs to feature branch only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/managed/BunnySourceSdk.dll app/src/main/assets/managed/BunnySourceCompiler.dll
          if ! git diff --cached --quiet; then
            git commit -m "build(csharp): stage validated DustLoader managed assemblies only"
            git push origin HEAD:feat/csharp-dust-loader-20261019
          fi
          echo "DUST_MANAGED_DLLS_STAGED=PASS NO_APK=TRUE"
