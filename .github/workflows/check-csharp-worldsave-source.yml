name: Check CSharp WorldSave source only
on:
  push:
    branches:
      - feature/csharp-worldsave-source-only-20261020
    paths:
      - "Split/Bunny-Loader/experiments/csharp/BunnyCsSdk/BunnyWorldData.cs"
      - "Split/Bunny-Loader/experiments/csharp/BunnySourceSdk/BunnySourceSdk.csproj"
      - "Split/Bunny-Loader/tests/world_save/**"
      - ".github/workflows/check-csharp-worldsave-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  managed-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Compile the real source SDK without Android
        run: dotnet build Split/Bunny-Loader/experiments/csharp/BunnySourceSdk/BunnySourceSdk.csproj -c Release --nologo
      - name: Test deterministic world codec and rejection cases
        run: dotnet run --project Split/Bunny-Loader/tests/world_save/BunnyWorldData.Smoke.csproj -c Release --nologo
      - name: Generate BWC1 fixture from real CSharp SDK
        run: dotnet run --project Split/Bunny-Loader/tests/world_save/BunnyWorldData.Smoke.csproj -c Release -- --emit-fixture /tmp/bunny_worldsave_interop.bwc
      - name: Compile native store with strict diagnostics
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic -pthread \
            -I Split/Bunny-Loader/app/src/main/cpp \
            Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/NativeWorldStore.cpp \
            Split/Bunny-Loader/tests/world_save/native_world_store_test.cpp \
            -o /tmp/bunny_world_store_test
          /tmp/bunny_world_store_test /tmp/bunny_worldsave_interop.bwc
      - name: Native sanitizer regression (no APK)
        run: |
          g++ -std=c++20 -O1 -g -Wall -Wextra -Werror -pedantic -pthread \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I Split/Bunny-Loader/app/src/main/cpp \
            Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/NativeWorldStore.cpp \
            Split/Bunny-Loader/tests/world_save/native_world_store_test.cpp \
            -o /tmp/bunny_world_store_sanitized
          ASAN_OPTIONS=detect_leaks=1 /tmp/bunny_world_store_sanitized /tmp/bunny_worldsave_interop.bwc
      - name: Ensure native game lifecycle binds trusted world and epoch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("Split/Bunny-Loader/app/src/main/cpp")
          auto = (root / "experiments/csharp/AutoSourceRuntime.cpp").read_text()
          tile = (root / "content/tiles/ModTileSave.cpp").read_text()
          assert "noteAutoWorldTilesLoaded(path)" in tile
          assert "worldsave::activeWorldStore().beginWorld(" in auto
          assert "worldsave::activeWorldStore().endWorld(departingEpoch)" in auto
          assert "g_worldEpoch.fetch_add(1, std::memory_order_acq_rel) + 1" in auto
          assert 'if (world) bl::csharp::noteAutoWorldTilesLoaded(path);' in tile
          print("WORLD_TRUSTED_PATH_EPOCH_LIFECYCLE_PASS")
          PY
      - name: Keep this job host-only
        run: echo "SOURCE_ONLY_NO_ANDROID_PACKAGING"
