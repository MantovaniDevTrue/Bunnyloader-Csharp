name: Migrate Bunny build dependencies to private releases

on:
  push:
    branches:
      - csharp-public-release-cleanup-v1
    paths:
      - ".github/workflows/migrate-bunny-private-build-inputs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Download current build-only dependencies from public releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          INPUT_DIR="$RUNNER_TEMP/bunny-private-build-inputs"
          mkdir -p "$INPUT_DIR"
          gh release download runtime-1.4.5.8.6 \
            --repo "${{ github.repository }}" \
            --pattern "BunnyRuntime_Terraria_1.4.5.8.6.zip" --dir "$INPUT_DIR"
          gh release download bunny-music-prewarm-v1 \
            --repo "${{ github.repository }}" \
            --pattern "BunnyLoader-v0.1.9.1-MusicPrewarm.apk" --dir "$INPUT_DIR"
          gh release download bunny-csharp-managed-runtime-0.1.10.16.72-managed-ingress \
            --repo "${{ github.repository }}" \
            --pattern "BunnyLoader-CSharp-Test-v0.1.10.16.72-ManagedIngress.apk" --dir "$INPUT_DIR"
          printf '%s  %s\n' \
            "2eb8d02dea144cb2fff6a27b94cc371e50ffd9aa44ba4dcd123337691a54c0ab" \
            "$INPUT_DIR/BunnyRuntime_Terraria_1.4.5.8.6.zip" | sha256sum -c -
          printf '%s  %s\n' \
            "aaf7c46046e776a966122d7f4e26469ebb72ad2fc21f0c6e57f98189e0c93c00" \
            "$INPUT_DIR/BunnyLoader-v0.1.9.1-MusicPrewarm.apk" | sha256sum -c -
          printf '%s  %s\n' \
            "84dd410f1054690cfb4bf6a74078c0bd2c92c7ee0ab431b345e0d5c84f353feb" \
            "$INPUT_DIR/BunnyLoader-CSharp-Test-v0.1.10.16.72-ManagedIngress.apk" | sha256sum -c -
          echo "BUNNY_PRIVATE_INPUTS_SOURCE_HASHES=PASS"

      - name: Upload only essential build dependencies to verified private repository
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BUNNY_PRIVATE_BUILD_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}"
          PRIVATE_REPO="MantovaniDevTrue/Bunnyloader-Csharp-Builds"
          IS_PRIVATE="$(gh api "repos/$PRIVATE_REPO" --jq '.private')"
          if [ "$IS_PRIVATE" != "true" ]; then
            echo "Aborting: required build-input destination is not private" >&2
            exit 1
          fi
          INPUT_DIR="$RUNNER_TEMP/bunny-private-build-inputs"
          TAG="bunny-private-build-inputs-v1"
          if ! gh release view "$TAG" --repo "$PRIVATE_REPO" >/dev/null 2>&1; then
            gh release create "$TAG" \
              "$INPUT_DIR/BunnyRuntime_Terraria_1.4.5.8.6.zip" \
              "$INPUT_DIR/BunnyLoader-v0.1.9.1-MusicPrewarm.apk" \
              "$INPUT_DIR/BunnyLoader-CSharp-Test-v0.1.10.16.72-ManagedIngress.apk" \
              --repo "$PRIVATE_REPO" --target main \
              --title "Private Bunny build inputs v1" \
              --notes "Private build-only inputs migrated from former public releases. This release contains Terraria game binaries/assets: do not redistribute without authorization. Source code builds remain public; output APKs stay private." \
              --prerelease
          else
            gh release upload "$TAG" \
              "$INPUT_DIR/BunnyRuntime_Terraria_1.4.5.8.6.zip" \
              "$INPUT_DIR/BunnyLoader-v0.1.9.1-MusicPrewarm.apk" \
              "$INPUT_DIR/BunnyLoader-CSharp-Test-v0.1.10.16.72-ManagedIngress.apk" \
              --repo "$PRIVATE_REPO" --clobber
          fi
          for entry in \
            "BunnyRuntime_Terraria_1.4.5.8.6.zip:2eb8d02dea144cb2fff6a27b94cc371e50ffd9aa44ba4dcd123337691a54c0ab" \
            "BunnyLoader-v0.1.9.1-MusicPrewarm.apk:aaf7c46046e776a966122d7f4e26469ebb72ad2fc21f0c6e57f98189e0c93c00" \
            "BunnyLoader-CSharp-Test-v0.1.10.16.72-ManagedIngress.apk:84dd410f1054690cfb4bf6a74078c0bd2c92c7ee0ab431b345e0d5c84f353feb"; do
            FILE="${entry%%:*}"
            HASH="${entry#*:}"
            REMOTE_HASH="$(gh api "repos/$PRIVATE_REPO/releases/tags/$TAG" \
              --jq ".assets[] | select(.name == \"$FILE\") | .digest")"
            if [ "$REMOTE_HASH" != "sha256:$HASH" ]; then
              echo "Private asset digest differs from public source for $FILE" >&2
              exit 1
            fi
          done
          echo "BUNNY_PRIVATE_INPUTS_UPLOAD_VERIFIED=PASS"

      - name: Remove ephemeral unpacked inputs
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/bunny-private-build-inputs"
