name: Check CSharp native prefix gameplay v90

on:
  push:
    branches:
      - csharp-global-player-respawn-v90-17
      - csharp-shadow-tooltip-v90-16-2
      - csharp-accessory-tooltips-v90-16-1
      - csharp-bunnyplayer-hooks-v90-16
      - csharp-late-prefix-restore-v90-15
      - csharp-swift-sdk-verify-v90-14
      - csharp-player-movespeed-v90-13
      - csharp-prefix-tooltip-v90-12
      - codex/prefix-restore-fix
      - csharp-prefix-rehydrate-v90-10
      - csharp-prefix-overload-v90-9
      - csharp-prefix-forced-roll-v90-8
      - csharp-prefix-restoration-v90-7
      - csharp-prefix-firstlaunch-v90-6
      - csharp-prefix-eligibility-v90-5
      - csharp-prefix-persistence-v90-4
      - csharp-prefix-accessory-tooltip-v90-3
      - csharp-public-release-cleanup-v1
      - csharp-private-apk-delivery-v3
      - csharp-secure-signing-v3-public-safe
      - csharp-prefix-reforge-v90-2-hotfix
      - csharp-prefix-autoload-v90-1-hotfix
      - csharp-prefix-gameplay-v90-experiment
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prefix-gameplay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build CSharp managed prefix fixture
        working-directory: Split/Bunny-Loader
        run: dotnet build tests/prefix_v89/PrefixFixture/PrefixFixture.csproj -c Release -p:NuGetAudit=false
      - name: Execute MonoVM-compatible managed callbacks and descriptor tests
        working-directory: Split/Bunny-Loader
        run: |
          dotnet run --project tests/prefix_v89/PrefixContract.csproj -c Release -- \
            "$(pwd)/tests/prefix_v89/PrefixFixture/bin/Release/net8.0/PrefixFixture.dll"
      - name: Compile the complete ExampleModCSharp source package
        working-directory: Split/Bunny-Loader
        run: |
          dotnet build tests/prefix_v89/PlayableCompile.csproj -c Release -p:NuGetAudit=false
          python3 samples/ExampleModCSharp/Tests/check_examples.py
      - name: Compile new native hooks with C++20
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/headers/android"
          printf '#pragma once\n#define ANDROID_LOG_DEBUG 3\n#define ANDROID_LOG_INFO 4\n#define ANDROID_LOG_WARN 5\n#define ANDROID_LOG_ERROR 6\n' > "$RUNNER_TEMP/headers/android/log.h"
          g++ -std=c++20 -Wall -Wextra -Werror -fsyntax-only \
            -I "$RUNNER_TEMP/headers" \
            -I Split/Bunny-Loader/app/src/main/cpp \
            Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/ManagedPrefixBridge.cpp \
            Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/ManagedPrefixGameplay.cpp \
            Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/NativeContent.cpp \
            Split/Bunny-Loader/app/src/main/cpp/content/items/ModItemSave.cpp \
            Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/SourceLoader.cpp \
            Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/SourceParser.cpp
      - name: Restore prefixes before the first vanilla natural roll
        working-directory: Split/Bunny-Loader
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -ffunction-sections -fdata-sections \
            -I "$RUNNER_TEMP/headers" -I app/src/main/cpp \
            tests/managed_prefix_cold_tables.cpp -Wl,--gc-sections \
            -o "$RUNNER_TEMP/prefix-cold-tables"
          "$RUNNER_TEMP/prefix-cold-tables"
      - name: Regression for managed prefixes in automatic class count
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror \
            -I Split/Bunny-Loader/app/src/main/cpp \
            Split/Bunny-Loader/tests/managed_prefix_auto_count_v90_1.cpp \
            -o "$RUNNER_TEMP/prefix-auto-count"
          "$RUNNER_TEMP/prefix-auto-count"
          echo "BUNNY_CSHARP_PREFIX_AUTOLOAD_11_TYPES=PASS"
      - name: Validate native weighted prefix rolls against mobile JS reference
        working-directory: Split/Bunny-Loader
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror \
            -I app/src/main/cpp \
            tests/managed_prefix_roll_v90_2.cpp \
            -o "$RUNNER_TEMP/managed-prefix-roll"
          "$RUNNER_TEMP/managed-prefix-roll"
          python3 tests/prefix_v89/guard_reforge_v90_2.py
      - name: Guard native game hooks and source contracts
        working-directory: Split/Bunny-Loader
        run: |
          python3 tests/prefix_v89/guard_native_bridge.py
          python3 tests/prefix_v89/guard_gameplay_v90.py
          python3 tests/prefix_v89/guard_persistence_v90_4.py
          python3 - <<'PY'
          from pathlib import Path
          root = Path(".")
          sdk = (root/"experiments/csharp/BunnyCsSdk/BunnySourceScriptApi.cs").read_text()
          probe = (root/"experiments/csharp/BunnySourceCompiler/CompiledAssemblyProbe.cs").read_text()
          loader = (root/"app/src/main/cpp/experiments/csharp/SourceLoader.cpp").read_text()
          native = (root/"app/src/main/cpp/experiments/csharp/NativeContent.cpp").read_text()
          life = (root/"app/src/main/cpp/experiments/csharp/AutoSourceRuntime.cpp").read_text()
          sample = root/"samples/ExampleModCSharp/Playable/content"
          for method in ('OnEnterWorld()', 'UpdateMovement(bool accessoryEquipped)', 'FrameEffects(bool accessoryEquipped)'):
              assert method in sdk
          for name in ("ExampleWelcomePlayer", "ExampleMomentumPlayer", "ExampleShadowPlayer"):
              assert (sample/"Common/Players"/(name+".cs")).is_file()
          assert 'movement.Invoke(player, new object[] { false })' in probe
          assert 'frames.Invoke(player, new object[] { true })' in probe
          assert 'entering.Invoke(player, null)' in probe
          assert 'fields.size() == 8' in loader
          assert 'movementAcceleration += found->second.movementAccelerationPercent;' in native
          assert 'g_refs.playerFrameShadow' in native
          assert 'void NewText(string newText, byte R, byte G, byte B, bool onlyCurrentPlayer)' in native
          assert 'g_worldPlayerMessagesShown.store(false, std::memory_order_release)' in life
          assert 'showWorldPlayerMessagesWhenReady();' in life
          print("BUNNY_CSHARP_BUNNYPLAYER_BATCH_V90_16=PASS")
          sdk = (root/"experiments/csharp/BunnyCsSdk/BunnySourceScriptApi.cs").read_text()
          probe = (root/"experiments/csharp/BunnySourceCompiler/CompiledAssemblyProbe.cs").read_text()
          loader = (root/"app/src/main/cpp/experiments/csharp/SourceLoader.cpp").read_text()
          native = (root/"app/src/main/cpp/experiments/csharp/NativeContent.cpp").read_text()
          h = (root/"app/src/main/cpp/experiments/csharp/NativeContent.h").read_text()
          assert 'public string Tooltip { get; set; }' in sdk
          assert 'Value<string>(accessory, "Tooltip")' in probe
          assert 'tooltip.Any(char.IsControl)' in probe
          assert 'if (accessory && key == "Tooltip") continue;' in loader
          assert 'fields.size() == 3 || fields.size() == 4' in loader
          assert 'std::string tooltip;' in h
          assert 'setModItemTooltip(accessory.type,' in native
          for name in ("ExampleFocusAccessory", "ExampleSwiftAccessory",
                       "ExampleMomentumAccessory",
                       "ExampleShadowAccessory"):
              p = sample/"Content/Items/Accessories"/(name+".cs")
              assert 'Tooltip = "' in p.read_text()
          print("BUNNY_CSHARP_ACCESSORY_TOOLTIP_V90_16_1=PASS")
          assert 'setModItemTooltip(type, {{"", tooltip->second}});' in loader
          assert 'tooltip inicial registrado' in loader
          assert loader.index('setModItemTooltip(type,') < loader.index('for (const auto& def : defs) {\n        if (def.base != "BunnyPlayer") continue;')
          assert 'void SetArmorEffectVisuals(Player drawPlayer)' in native
          assert 'bl::hook::install(armorVisuals, hkSetArmorEffectVisuals' in native
          assert 'fieldOffset(player, "armorEffectDrawShadow")' in native
          assert 'fieldOffset(player, "armorEffectDrawOutlines")' in native
          assert 'if (!self || !managedShadowEquipped(drawPlayer ? drawPlayer : self))' in native
          assert 'armorEffectDrawShadowEOCShield' not in native
          assert 'g_originalHorizontalMovement(self, method);' in native
          assert 'maxSpeed *= factor;' in native
          print("BUNNY_CSHARP_SHADOW_TOOLTIP_V90_16_2=PASS")
          sdk = (root/"experiments/csharp/BunnyCsSdk/BunnySourceScriptApi.cs").read_text()
          probe = (root/"experiments/csharp/BunnySourceCompiler/CompiledAssemblyProbe.cs").read_text()
          loader = (root/"app/src/main/cpp/experiments/csharp/SourceLoader.cpp").read_text()
          native = (root/"app/src/main/cpp/experiments/csharp/NativeContent.cpp").read_text()
          example = (sample/"Common/Players/ExampleWelcomePlayer.cs").read_text()
          assert 'public virtual string OnRespawn()' in sdk
          assert 'globalPlayer ? "-" : accessoryName' in probe
          assert 'respawning.Invoke(player, null)' in probe
          assert '(fields.size() == 9)' in loader
          assert 'record.accessoryType = globalPlayer ? -1 : target->second;' in loader
          assert 'globalMessages[key] = player.worldJoinMessage;' in native
          assert 'g_respawnMessages[key] = message;' in native
          assert 'void Spawn(PlayerSpawnContext context)' in native
          assert 'if (who != localIndex) return;' in native
          assert 'if (!def.properties.empty())' in loader
          assert 'Accessory = ' not in example
          assert 'OnEnterWorld()' in example and 'OnRespawn()' in example
          assert not (sample/"Content/Items/Accessories/ExampleWelcomeAccessory.cs").exists()
          print("BUNNY_CSHARP_GLOBAL_PLAYER_RESPAWN_V90_17=PASS")
          PY

          python3 - <<'PY'
          from pathlib import Path
          root = Path("app/src/main/cpp/experiments/csharp")
          life = (root/"AutoSourceRuntime.cpp").read_text()
          game = (root/"ManagedPrefixGameplay.cpp").read_text()
          header = (root/"ManagedPrefixGameplay.h").read_text()
          assert "bool managedPrefixGameplayReady();" in header
          assert 'bool managedPrefixGameplayReady()' in game
          assert '!snapshotManagedPrefixes().empty()' in game
          assert 'g_worldPrefixesRestored.exchange(true, std::memory_order_acq_rel)' in life
          assert 'g_worldPrefixesRestored.store(false, std::memory_order_release);' in life
          assert life.count('g_worldPrefixesRestored.store(false, std::memory_order_release);') >= 2
          assert 'if (context.gameMenu != 1 && context.netMode == 0) {' in life
          assert 'retryWorldManagedPrefixesWhenReady();' in life
          assert 'csharp prefix: hooks e descritores prontos; iniciando restauracao tardia' in life
          assert 'bl::runtime::retryPendingManagedPrefixesOnWorldReady();' in life
          assert life.index("g_worldSessionReady.store(true, std::memory_order_release);") < life.rindex("retryWorldManagedPrefixesWhenReady();")
          print("BUNNY_CSHARP_LATE_PREFIX_AND_NATIVE_SPEED_V90_15=PASS")
          PY

          python3 - <<'PY'
          from pathlib import Path
          root = Path(".")
          kotlin = (root/"app/src/main/kotlin/dev/bunnyloader/csharp/ManagedProbeService.kt").read_text()
          sdk = (root/"experiments/csharp/BunnyCsSdk/BunnySourceScriptApi.cs").read_text()
          swift = (root/"samples/ExampleModCSharp/Playable/content/Common/Players/ExampleSwiftPlayer.cs").read_text()
          parser = (root/"app/src/main/cpp/experiments/csharp/SourceParser.cpp").read_text()
          assert 'public int MoveSpeedPercent { get; protected set; }' in sdk
          assert 'fun verifySourceSdk()' in kotlin
          assert 'contains("MoveSpeedPercent")' in kotlin
          assert 'verifySourceSdk()' in kotlin
          assert swift.index('void SetDefaults()') < swift.index('void UpdateEquips(')
          assert 'public int MoveSpeedPercent' not in swift
          assert 'MoveSpeedPercent = 8;' in swift
          assert 'membros externos a SetDefaults ainda nao suportados' in parser
          print("BUNNY_CSHARP_SWIFT_SDK_SYNC_V90_14=PASS")
          PY
          python3 - <<'PY'
          from pathlib import Path
          root = Path(".")
          native = (root / "app/src/main/cpp/experiments/csharp/NativeContent.cpp").read_text()
          loader = (root / "app/src/main/cpp/experiments/csharp/SourceLoader.cpp").read_text()
          sdk = (root / "experiments/csharp/BunnyCsSdk/BunnySourceScriptApi.cs").read_text()
          probe = (root / "experiments/csharp/BunnySourceCompiler/CompiledAssemblyProbe.cs").read_text()
          player = (root / "samples/ExampleModCSharp/Playable/content/Common/Players/ExampleSwiftPlayer.cs").read_text()
          js = (root / "samples/ExampleMod/content/Content/Items/Accessories/ExampleBoots.js").read_text()
          assert "public int MoveSpeedPercent { get; protected set; } = 0;" in sdk
          assert "MoveSpeedPercent = 0;" in sdk
          assert 'Value<int>(player, "MoveSpeedPercent")' in probe
          assert "player.moveSpeed += this.MoveSpeedBonus / 100" in js
          assert 'r.playerMoveSpeed = fieldOffset(player, "moveSpeed");' in native
          assert 'player, parseSignature("void HorizontalMovement()")' in native
          assert "bl::hook::install(runSpeeds, hkHorizontalMovement" in native
          assert 'fieldOffset(player, "maxRunSpeed")' in native
          assert 'fieldOffset(player, "runAcceleration")' in native
          assert "movementPercent += found->second.moveSpeedPercent;" in native
          assert "maxSpeed *= factor;" in native
          assert "acceleration *= factor;" in native
          assert "for (uintptr_t i = 3; i < 10; ++i)" in native
          assert "player.moveSpeedPercent < 0 || player.moveSpeedPercent > 50" in native
          assert "record.moveSpeedPercent" in loader
          assert "MoveSpeedPercent = 8;" in player
          assert "if (accessoryEquipped)" in player
          print("BUNNY_CSHARP_MOVESPEED_API_V90_13=PASS")
          PY
          python3 - <<'PY'
          from pathlib import Path
          c = Path("app/src/main/cpp/experiments/csharp/ManagedPrefixGameplay.cpp").read_text()
          native = Path("app/src/main/cpp/experiments/csharp/NativeContent.cpp").read_text()
          assert "MouseText_DrawItemTooltip_GetLinesInfo(Item item" in c
          assert "g_originalInventoryTooltip(" in c
          assert "managedNativeAccessoryDefense(itemType)" in c
          assert 'append(baseDefense, defenseSuffix, "base", false);' in c
          assert "append(prefixDefense, defenseSuffix, current->displayName.empty()" in c
          assert 'append(moveSpeed, accessoryMoveSpeedSuffix(), "base", false);' in c
          assert 'return accessoryStatSuffix(46, "% movement speed");' in c
          assert "api.gc_wbarrier_set_field(" in c
          assert "inventoryTooltip=%d" in c
          assert "int managedNativeAccessoryDefense(int type)" in native
          print("BUNNY_CSHARP_INVENTORY_PREFIX_TOOLTIP_V90_12=PASS")
          PY

          python3 - <<'PY'
          from pathlib import Path
          save = Path("app/src/main/cpp/content/items/ModItemSave.cpp").read_text()
          native = Path("app/src/main/cpp/experiments/csharp/NativeContent.cpp").read_text()
          header = Path("app/src/main/cpp/experiments/csharp/NativeContent.h").read_text()
          assert "int managedNativePrefixItemKind(int type)" in native
          assert "int managedNativePrefixItemKind(int type);" in header
          assert "g_weapons.contains(type)" in native
          assert "g_accessories.contains(type)" in native
          assert "bool rehydrateSavedManagedItem(" in save
          assert "const int keepStack =" in save
          assert "keepFavorited ? 1 : 0" in save
          assert "get_ActivePlayerFileData" in save
          assert "reidratacao tipo=" in save
          assert 'int[] GetRollablePrefixes()' in save
          assert "ready && restoreSavedPrefix(item, saved)" in save
          assert save.index("rehydrateSavedManagedItem(item, it->second.type, wanted)") < save.index("ready && restoreSavedPrefix(item, saved)")
          print("BUNNY_CSHARP_PREFIX_REHYDRATE_V90_10=PASS")
          PY

          python3 - <<'PY'
          from pathlib import Path
          save = Path("app/src/main/cpp/content/items/ModItemSave.cpp").read_text()
          game = Path("app/src/main/cpp/experiments/csharp/ManagedPrefixGameplay.cpp").read_text()
          assert 'bool Prefix(int prefixWeWant, out bool rolledPrefixIsTopTier)' in save
          assert 'void* directArguments[2] = {&prefix, &topTier};' in save
