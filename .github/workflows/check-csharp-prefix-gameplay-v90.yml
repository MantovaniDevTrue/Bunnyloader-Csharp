name: Check CSharp native prefix gameplay v90

on:
  push:
    branches:
      - codex/lot-a-complete-v90-29
      - codex/example-completion-v90-28
      - csharp-composite-accessories-v90-26
      - codex/combat-batch-v90-25
      - csharp-hurt-spatial-context-v90-24
      - csharp-hurt-attacker-array-fix-v90-23-1
      - csharp-hurt-attacker-context-v90-23
      - csharp-player-modify-hit-source-v90-22
      - csharp-player-hit-source-layout-v90-21-2
      - csharp-player-hit-source-diagnostics-v90-21-1
      - csharp-player-hit-source-v90-21
      - csharp-free-dodge-immunity-v90-20-1
      - csharp-player-free-dodge-v90-20
      - csharp-player-hurt-events-v90-19
      - csharp-player-regeneration-lifecycle-v90-18
      - csharp-respawn-local-player-v90-17-2
      - csharp-respawn-enum-hotfix-v90-17-1
      - csharp-global-player-respawn-v90-17
      - csharp-shadow-tooltip-v90-16-2
      - csharp-accessory-tooltips-v90-16-1
      - csharp-bunnyplayer-hooks-v90-16
      - csharp-late-prefix-restore-v90-15
      - csharp-swift-sdk-verify-v90-14
      - csharp-player-movespeed-v90-13
      - csharp-prefix-tooltip-v90-12
      - codex/prefix-restore-fix
      - csharp-prefix-rehydrate-v90-10
      - csharp-prefix-overload-v90-9
      - csharp-prefix-forced-roll-v90-8
      - csharp-prefix-restoration-v90-7
      - csharp-prefix-firstlaunch-v90-6
      - csharp-prefix-eligibility-v90-5
      - csharp-prefix-persistence-v90-4
      - csharp-prefix-accessory-tooltip-v90-3
      - csharp-public-release-cleanup-v1
      - csharp-private-apk-delivery-v3
      - csharp-secure-signing-v3-public-safe
      - csharp-prefix-reforge-v90-2-hotfix
      - csharp-prefix-autoload-v90-1-hotfix
      - csharp-prefix-gameplay-v90-experiment
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prefix-gameplay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build CSharp managed prefix fixture
        working-directory: Split/Bunny-Loader
        run: dotnet build tests/prefix_v89/PrefixFixture/PrefixFixture.csproj -c Release -p:NuGetAudit=false
      - name: Execute MonoVM-compatible managed callbacks and descriptor tests
        working-directory: Split/Bunny-Loader
        run: |
          dotnet run --project tests/prefix_v89/PrefixContract.csproj -c Release -- \
            "$(pwd)/tests/prefix_v89/PrefixFixture/bin/Release/net8.0/PrefixFixture.dll"
      - name: Compile the complete ExampleModCSharp source package
        working-directory: Split/Bunny-Loader
        run: |
          dotnet build tests/prefix_v89/PlayableCompile.csproj -c Release -p:NuGetAudit=false
          python3 samples/ExampleModCSharp/Tests/check_examples.py
      - name: Compile new native hooks with C++20
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/headers/android"
          printf '#pragma once\n#define ANDROID_LOG_DEBUG 3\n#define ANDROID_LOG_INFO 4\n#define ANDROID_LOG_WARN 5\n#define ANDROID_LOG_ERROR 6\n' > "$RUNNER_TEMP/headers/android/log.h"
          g++ -std=c++20 -Wall -Wextra -Werror -fsyntax-only \
            -I "$RUNNER_TEMP/headers" \
            -I Split/Bunny-Loader/app/src/main/cpp \
            Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/ManagedPrefixBridge.cpp \
            Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/ManagedPrefixGameplay.cpp \
            Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/NativeContent.cpp \
            Split/Bunny-Loader/app/src/main/cpp/content/items/ModItemSave.cpp \
            Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/SourceLoader.cpp \
            Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/SourceParser.cpp
      - name: Guard FreeDodge native immunity and life tracing
        working-directory: Split/Bunny-Loader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          native = Path("app/src/main/cpp/experiments/csharp/NativeContent.cpp").read_text()
          js = Path("app/src/main/cpp/script/js/mod/Loaders/PlayerLoader.js").read_text()
          part = native[native.index("double hkPlayerHurt("):native.index("int equippedRegeneration(")]
          assert 'r.playerImmune = fieldOffset(player, "immune");' in native
          assert 'r.playerImmuneTime = fieldOffset(player, "immuneTime");' in native
          assert 'r.playerHurtCooldowns = fieldOffset(player, "hurtCooldowns");' in native
          assert 'if (result.cancelled)' in part
          assert 'if (result.dodged)' in part
          dodge = part[part.index('if (result.cancelled)'):]
          assert 'field<uint8_t>(self, g_refs.playerImmune) = 1;' in dodge
          assert 'immunity = std::max(immunity, 40);' in dodge
          assert 'timers[i] = std::max(timers[i], 40);' in dodge
          assert 'return 0.0;' in dodge
          assert dodge.index('immunity = std::max(immunity, 40);') < dodge.index('return 0.0;')
          assert 'g_dodgePendingLife = lifeBeforeDodge;' in dodge
          assert 'csharp BunnyPlayer FreeDodge: vida apos Update=' in native
          assert 'if (applied > 0.0 && applied <= 1000000.0)' in part
          assert "PlayerLoader.First(self, 'FreeDodge'" in js
          print("BUNNY_CSHARP_FREE_DODGE_NATIVE_IMMUNITY_V90_20_1=PASS")
          PY
      - name: Guard CSharp hit source diagnostics in Bunny editor
        working-directory: Split/Bunny-Loader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          native = Path("app/src/main/cpp/experiments/csharp/NativeContent.cpp").read_text()
          worker = Path("app/src/main/cpp/experiments/csharp/ManagedRuntime.cpp").read_text()
          header = Path("app/src/main/cpp/experiments/csharp/ManagedRuntime.h").read_text()
          assert 'rawNpc=%d rawProjectile=%d npc=%d projectile=%d' in native
          assert 'evento OnHurt fila=%s npc=%d projectile=%d' in native
          assert 'setManagedHurtDiagnosticLogger(hurtDiagnosticToEditor);' in native
          assert 'BL_INFO("%s", line);' in native
          assert 'bool notifyManagedPlayerHurt(' in header
          assert 'bool notifyManagedPlayerHurt(' in worker
          assert 'return true;' in worker[worker.index('bool notifyManagedPlayerHurt('):worker.index('void setManagedCheckpointPath(')]
          assert 'g_hurtDiagnosticLogger.load(std::memory_order_acquire)' in worker
          assert 'MonoVM %s estado=%s instancias=%lld' in worker
          assert 'npcLogs{0}' in worker
          assert 'projectileLogs{0}' in worker
          assert 'otherLogs{0}' in worker
          assert 'logged < 8' in worker
          assert 'job.damage > 0' in worker
          assert 'job.after' in worker
          print("BUNNY_CSHARP_HIT_SOURCE_EDITOR_DIAG_V90_21_1=PASS")
          PY
      - name: Guard PlayerDeathReason reference offsets on ARM64
        working-directory: Split/Bunny-Loader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path("app/src/main/cpp/experiments/csharp/NativeContent.cpp").read_text()
          metadata = src[src.index('const MethodInfo* hurt = findMethodBySignature'):src.index('if (hurt && r.playerLife >= 0')]
          assert 'api().class_is_valuetype' in metadata
          assert 'const bool valueType = reason && api().class_is_valuetype(reason);' in metadata
          assert 'const size_t rawNpcOffset = api().field_get_offset(npc);' in metadata
          assert 'const size_t rawProjectileOffset = api().field_get_offset(projectile);' in metadata
          assert 'valueType\n                ? bl::script::structFieldOffset(reason, rawNpcOffset)\n                : rawNpcOffset;' in metadata
          assert 'valueType\n                ? bl::script::structFieldOffset(reason, rawProjectileOffset)\n                : rawProjectileOffset;' in metadata
          assert 'layout=%s size=%d' in metadata
          assert 'npcOffset != projectileOffset' in metadata
          assert 'sourceNpcOffset = static_cast<int>(npcOffset);' in metadata
          assert 'sourceProjectileOffset = static_cast<int>(projectileOffset);' in metadata
          assert 'rawNpc=%d rawProjectile=%d npc=%d projectile=%d' in src
          assert 'snapshotHurtSource(source, &npcSource, &projectileSource,' in src
          print("BUNNY_CSHARP_PLAYER_DEATH_REASON_LAYOUT_V90_21_2=PASS")
          PY
      - name: Guard Terraria NPC and projectile array lengths for C# hurt snapshots
        working-directory: Split/Bunny-Loader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path("app/src/main/cpp/experiments/csharp/NativeContent.cpp").read_text()
          npc = src[src.index("if (npcIndex >= 0 && npcIndex < 200 && g_mainNpcArrayField)"):
                    src.index("} else if (projectileIndex >= 0 && projectileIndex < 1000")]
          projectile = src[src.index("} else if (projectileIndex >= 0 && projectileIndex < 1000"):
                           src.index("    return snapshot;")]
          js = Path("app/src/main/cpp/script/api/Npcs.cpp").read_text()
          assert 'Main.npc tem 201' in js
          assert 'array->length <= 201' in npc and 'array->length <= 200' not in npc
          assert 'array->length <= 1001' in projectile and 'array->length <= 1000' not in projectile
          assert 'static_cast<uintptr_t>(npcIndex) < array->length' in npc
          assert 'static_cast<uintptr_t>(projectileIndex) < array->length' in projectile
          assert 'Main.npc tamanho=%zu' in npc
          assert 'Main.projectile tamanho=%zu' in projectile
          assert (201 <= 201 and 4 < 201 and 6 < 201)
          assert (1001 <= 1001 and 0 < 1001 and 999 < 1001)
          print("BUNNY_CSHARP_HURT_ATTACKER_ARRAY_BOUNDS_V90_23_1=PASS")
          PY
      - name: Guard attacker spatial snapshots and MonoVM pre/post ABI
        working-directory: Split/Bunny-Loader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          native = Path("app/src/main/cpp/experiments/csharp/NativeContent.cpp").read_text()
          sdk = Path("experiments/csharp/BunnyCsSdk/BunnySourceScriptApi.cs").read_text()
          runtime = Path("app/src/main/cpp/experiments/csharp/ManagedRuntime.cpp").read_text()
          dispatcher = Path("experiments/csharp/BunnyCsSdk/BunnyPlayerHurtDispatcher.cs").read_text()
          example = Path("samples/ExampleModCSharp/Playable/content/Common/Players/ExampleVitalPlayer.cs").read_text()
          for field in ("AttackerX", "AttackerY", "AttackerVelocityX",
                        "AttackerVelocityY", "AttackerAngle", "AttackerDistance"):
              assert sdk.count("public float " + field) == 2, field
              assert field + " = " in dispatcher, field
              assert "Last" + field in example, field
          assert 'fieldOffset(player, "position")' in native
          assert 'fieldOffset(npc, "position")' in native
          assert 'fieldOffset(projectile, "position")' in native
          assert 'fieldOffset(npc, "velocity")' in native
          assert 'fieldOffset(projectile, "velocity")' in native
          assert "std::hypot(dx, dy)" in native
          assert "std::atan2(dy, dx)" in native
          assert "snapshotHurtAttacker(npcSource, projectileSource, self)" in native
          assert 'findMethod(cls, "Modify", 21)' in runtime
          assert 'findMethod(cls, "After", 21)' in runtime
          assert "attackerDistance" in runtime
          assert "spatialNpcLogs++ < 8" in native
          assert "spatialProjectileLogs++ < 8" in native
          print("BUNNY_CSHARP_SPATIAL_CONTEXT_V90_24=PASS")
          PY
      - name: Restore prefixes before the first vanilla natural roll
        working-directory: Split/Bunny-Loader
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -ffunction-sections -fdata-sections \
            -I "$RUNNER_TEMP/headers" -I app/src/main/cpp \
            tests/managed_prefix_cold_tables.cpp -Wl,--gc-sections \
            -o "$RUNNER_TEMP/prefix-cold-tables"
          "$RUNNER_TEMP/prefix-cold-tables"
      - name: Regression for managed prefixes in automatic class count
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror \
            -I Split/Bunny-Loader/app/src/main/cpp \
            Split/Bunny-Loader/tests/managed_prefix_auto_count_v90_1.cpp \
            -o "$RUNNER_TEMP/prefix-auto-count"
          "$RUNNER_TEMP/prefix-auto-count"
          echo "BUNNY_CSHARP_PREFIX_AUTOLOAD_11_TYPES=PASS"
      - name: Validate native weighted prefix rolls against mobile JS reference
        working-directory: Split/Bunny-Loader
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror \
            -I app/src/main/cpp \
            tests/managed_prefix_roll_v90_2.cpp \
            -o "$RUNNER_TEMP/managed-prefix-roll"
          "$RUNNER_TEMP/managed-prefix-roll"
          python3 tests/prefix_v89/guard_reforge_v90_2.py
      - name: Guard native game hooks and source contracts
        working-directory: Split/Bunny-Loader
        run: |
          python3 tests/prefix_v89/guard_native_bridge.py
          python3 tests/prefix_v89/guard_gameplay_v90.py
          python3 tests/prefix_v89/guard_persistence_v90_4.py
          python3 - <<'PY'
          from pathlib import Path
          root = Path(".")
          sdk = (root/"experiments/csharp/BunnyCsSdk/BunnySourceScriptApi.cs").read_text()
          probe = (root/"experiments/csharp/BunnySourceCompiler/CompiledAssemblyProbe.cs").read_text()
          loader = (root/"app/src/main/cpp/experiments/csharp/SourceLoader.cpp").read_text()
          native = (root/"app/src/main/cpp/experiments/csharp/NativeContent.cpp").read_text()
          life = (root/"app/src/main/cpp/experiments/csharp/AutoSourceRuntime.cpp").read_text()
          sample = root/"samples/ExampleModCSharp/Playable/content"
          for method in ('OnEnterWorld()', 'UpdateMovement(bool accessoryEquipped)', 'FrameEffects(bool accessoryEquipped)'):
              assert method in sdk
          for name in ("ExampleWelcomePlayer", "ExampleMomentumPlayer", "ExampleShadowPlayer"):
              assert (sample/"Common/Players"/(name+".cs")).is_file()
          assert 'movement.Invoke(player, new object[] { false })' in probe
