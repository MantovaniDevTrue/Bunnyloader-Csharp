          assert 'Accessory = ' not in example
          assert 'OnEnterWorld()' in example and 'OnRespawn()' in example
          assert not (sample/"Content/Items/Accessories/ExampleWelcomeAccessory.cs").exists()
          print("BUNNY_CSHARP_GLOBAL_PLAYER_RESPAWN_V90_17=PASS")
          assert 'constexpr int g_reviveSpawnContext = 0;' in native
          assert 'void Spawn(PlayerSpawnContext context)' in native
          assert 'void Spawn(PlayerSpawnContext)' in native
          assert 'context != g_reviveSpawnContext' in native
          assert 'g_originalPlayerSpawn(self, context, method);' in native
          assert 'csharp BunnyPlayer Spawn: context=%d revive=%d' in native
          assert 'ReviveFromDeath")' not in native
          assert 'if (!localMatch) return;' in native
          assert 'if (sendPlayerLifecycleMessage(message)) ++count;' in native
          print("BUNNY_CSHARP_RESPAWN_ENUM_FIX_V90_17_1=PASS")
          assert 'runtime.class_get_method_from_name(main, "get_LocalPlayer", 0)' in native
          assert 'runtime.runtime_invoke(getter, nullptr, nullptr, &error)' in native
          assert 'self == localPlayer' in native
