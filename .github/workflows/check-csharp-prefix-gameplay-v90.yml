name: Check CSharp native prefix gameplay v90

on:
  push:
    branches:
      - codex/prefix-restore-fix
      - csharp-prefix-rehydrate-v90-10
      - csharp-prefix-overload-v90-9
      - csharp-prefix-forced-roll-v90-8
      - csharp-prefix-restoration-v90-7
      - csharp-prefix-firstlaunch-v90-6
      - csharp-prefix-eligibility-v90-5
      - csharp-prefix-persistence-v90-4
      - csharp-prefix-accessory-tooltip-v90-3
      - csharp-public-release-cleanup-v1
      - csharp-private-apk-delivery-v3
      - csharp-secure-signing-v3-public-safe
      - csharp-prefix-reforge-v90-2-hotfix
      - csharp-prefix-autoload-v90-1-hotfix
      - csharp-prefix-gameplay-v90-experiment
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prefix-gameplay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build CSharp managed prefix fixture
        working-directory: Split/Bunny-Loader
        run: dotnet build tests/prefix_v89/PrefixFixture/PrefixFixture.csproj -c Release -p:NuGetAudit=false
      - name: Execute MonoVM-compatible managed callbacks and descriptor tests
        working-directory: Split/Bunny-Loader
        run: |
          dotnet run --project tests/prefix_v89/PrefixContract.csproj -c Release -- \
            "$(pwd)/tests/prefix_v89/PrefixFixture/bin/Release/net8.0/PrefixFixture.dll"
      - name: Compile the complete ExampleModCSharp source package
        working-directory: Split/Bunny-Loader
        run: |
          dotnet build tests/prefix_v89/PlayableCompile.csproj -c Release -p:NuGetAudit=false
          python3 samples/ExampleModCSharp/Tests/check_examples.py
      - name: Compile new native hooks with C++20
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/headers/android"
          printf '#pragma once\n#define ANDROID_LOG_DEBUG 3\n#define ANDROID_LOG_INFO 4\n#define ANDROID_LOG_WARN 5\n#define ANDROID_LOG_ERROR 6\n' > "$RUNNER_TEMP/headers/android/log.h"
          g++ -std=c++20 -Wall -Wextra -Werror -fsyntax-only \
            -I "$RUNNER_TEMP/headers" \
            -I Split/Bunny-Loader/app/src/main/cpp \
            Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/ManagedPrefixBridge.cpp \
            Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/ManagedPrefixGameplay.cpp \
            Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/NativeContent.cpp \
            Split/Bunny-Loader/app/src/main/cpp/content/items/ModItemSave.cpp \
            Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/SourceLoader.cpp \
            Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/SourceParser.cpp
      - name: Restore prefixes before the first vanilla natural roll
        working-directory: Split/Bunny-Loader
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -ffunction-sections -fdata-sections \
            -I "$RUNNER_TEMP/headers" -I app/src/main/cpp \
            tests/managed_prefix_cold_tables.cpp -Wl,--gc-sections \
            -o "$RUNNER_TEMP/prefix-cold-tables"
          "$RUNNER_TEMP/prefix-cold-tables"
      - name: Regression for managed prefixes in automatic class count
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror \
            -I Split/Bunny-Loader/app/src/main/cpp \
            Split/Bunny-Loader/tests/managed_prefix_auto_count_v90_1.cpp \
            -o "$RUNNER_TEMP/prefix-auto-count"
          "$RUNNER_TEMP/prefix-auto-count"
          echo "BUNNY_CSHARP_PREFIX_AUTOLOAD_11_TYPES=PASS"
      - name: Validate native weighted prefix rolls against mobile JS reference
        working-directory: Split/Bunny-Loader
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror \
            -I app/src/main/cpp \
            tests/managed_prefix_roll_v90_2.cpp \
            -o "$RUNNER_TEMP/managed-prefix-roll"
          "$RUNNER_TEMP/managed-prefix-roll"
          python3 tests/prefix_v89/guard_reforge_v90_2.py
      - name: Guard native game hooks and source contracts
        working-directory: Split/Bunny-Loader
        run: |
          python3 tests/prefix_v89/guard_native_bridge.py
          python3 tests/prefix_v89/guard_gameplay_v90.py
          python3 tests/prefix_v89/guard_persistence_v90_4.py
          python3 - <<'PY'
          from pathlib import Path
          save = Path("app/src/main/cpp/content/items/ModItemSave.cpp").read_text()
          native = Path("app/src/main/cpp/experiments/csharp/NativeContent.cpp").read_text()
          header = Path("app/src/main/cpp/experiments/csharp/NativeContent.h").read_text()
          assert "int managedNativePrefixItemKind(int type)" in native
          assert "int managedNativePrefixItemKind(int type);" in header
          assert "g_weapons.contains(type)" in native
          assert "g_accessories.contains(type)" in native
          assert "bool rehydrateSavedManagedItem(" in save
          assert "const int keepStack =" in save
          assert "keepFavorited ? 1 : 0" in save
          assert "get_ActivePlayerFileData" in save
          assert "reidratacao tipo=" in save
          assert 'int[] GetRollablePrefixes()' in save
          assert "ready && restoreSavedPrefix(item, saved)" in save
          assert save.index("rehydrateSavedManagedItem(item, it->second.type, wanted)") < save.index("ready && restoreSavedPrefix(item, saved)")
          print("BUNNY_CSHARP_PREFIX_REHYDRATE_V90_10=PASS")
          PY

          python3 - <<'PY'
          from pathlib import Path
          save = Path("app/src/main/cpp/content/items/ModItemSave.cpp").read_text()
          game = Path("app/src/main/cpp/experiments/csharp/ManagedPrefixGameplay.cpp").read_text()
          assert 'bool Prefix(int prefixWeWant, out bool rolledPrefixIsTopTier)' in save
          assert 'void* directArguments[2] = {&prefix, &topTier};' in save
          assert 'const bool detailed = method == r.applyPrefixDetailed;' in save
          assert 'item, wanted, r.applyPrefixDetailed, &forcedRollReached' in save
          assert 'void* arguments[2] = {&request, &topTier};' in game
          assert 'if (!pendingKey.empty()) it.prefixKey = pendingKey;' in save
          assert 'if (!restored && managed && r.resetPrefix &&' in save
          print("BUNNY_CSHARP_PREFIX_OVERLOAD_V90_9=PASS")
          PY

          python3 - <<'PY'
          from pathlib import Path
          c = Path("app/src/main/cpp/experiments/csharp/ManagedPrefixGameplay.cpp").read_text()
          h = Path("app/src/main/cpp/experiments/csharp/ManagedPrefixGameplay.h").read_text()
          save = Path("app/src/main/cpp/content/items/ModItemSave.cpp").read_text()
          assert "thread_local RestoreRoll g_restoreRoll" in c
          assert "g_restoreRoll.item == item" in c
          assert "g_restoreRoll.used = true" in c
          assert "g_restoreRoll = previous;" in c
          assert "const RestoreRoll previous = g_restoreRoll;" in c
          assert "int32_t request = -2;" in c
          assert "bool applyManagedPrefixViaNativeRoll(" in c
          assert "bool applyManagedPrefixViaNativeRoll(" in h
          assert "bl::csharp::applyManagedPrefixViaNativeRoll(" in save
          assert "forcedRollReached" in save
          print("BUNNY_CSHARP_PREFIX_FORCED_ROLL_V90_8=PASS")
          PY

          python3 - <<'PY'
          from pathlib import Path
          source = Path("app/src/main/cpp/content/items/ModItemSave.cpp").read_text()
          lifecycle = Path("app/src/main/cpp/experiments/csharp/AutoSourceRuntime.cpp").read_text()
          assert "void retryPendingManagedPrefixesOnWorldReady()" in source
          assert "get_ActivePlayerFileData" in source
          assert "ready && restoreSavedPrefix(item, saved)" in source
          assert "original->second.key == current->second.key" in source
          assert "csharp prefix restore: chave=" in source
          assert "bl::runtime::retryPendingManagedPrefixesOnWorldReady();" in lifecycle
          assert lifecycle.index("refreshManagedPrefixEligibilityOnWorldReady();") < lifecycle.index("retryPendingManagedPrefixesOnWorldReady();")
          print("BUNNY_CSHARP_PREFIX_RESTORE_V90_7=PASS")
          PY

          python3 - <<'PY'
          from pathlib import Path
          root = Path("app/src/main/cpp/experiments/csharp")
          native = (root / "NativeContent.cpp").read_text()
          lifecycle = (root / "AutoSourceRuntime.cpp").read_text()
          header = (root / "NativeContent.h").read_text()
          assert "void refreshManagedPrefixEligibilityOnWorldReady();" in header
          assert "void refreshManagedPrefixEligibilityOnWorldReady()" in native
          assert "for (const auto& weapon : g_weapons)" in native
          assert "for (const auto& accessory : g_accessories)" in native
          assert "if (!entries || static_cast<uintptr_t>(type) >= entries->length)" in native
          assert "refreshManagedPrefixEligibilityOnWorldReady();" in lifecycle
          assert lifecycle.index('g_worldSessionReady.store(true, std::memory_order_release)') < lifecycle.index('refreshManagedPrefixEligibilityOnWorldReady();')
          assert lifecycle.index('refreshManagedPrefixEligibilityOnWorldReady();') < lifecycle.index('scheduleAutoLiveBindings();', lifecycle.index('refreshManagedPrefixEligibilityOnWorldReady();'))
          print("BUNNY_CSHARP_PREFIX_FIRST_WORLD_ELIGIBILITY_V90_6=PASS")
          PY
          python3 - <<'PY'
          from pathlib import Path
          source = Path("app/src/main/cpp/experiments/csharp/NativeContent.cpp").read_text()
          assert 'findField(sets, "CanGetPrefixes")' in source
          assert 'static_cast<uintptr_t>(type) >= entries->length' in source
          assert 'enableManagedPrefixEligibility(type);' in source
          assert 'enableManagedPrefixEligibility(item.first);' in source
          assert 'enableManagedPrefixEligibility(type);' in source
          print("BUNNY_CSHARP_PREFIX_ELIGIBILITY_V90_5=PASS")
          PY
      - name: Reject not-yet-supported CSharp prefix tooltips
        working-directory: Split/Bunny-Loader
        run: |
          python3 tools/csharp_api_negative_compile.py --prepare
          python3 tools/csharp_api_negative_compile.py --build
          python3 tools/csharp_api_negative_compile.py --check
