name: Bunny BannerLoader CSharp source-only contracts

on:
  push:
    branches:
      - feat/csharp-bannerloader-source-only-20261022
    paths:
      - experiments/csharp/BunnyCsSdk/**
      - experiments/csharp/BunnySourceSdk/**
      - experiments/csharp/BunnySourceCompiler/**
      - app/src/main/cpp/experiments/csharp/ManagedBannerRegistry.h
      - app/src/main/cpp/experiments/csharp/ManagedBannerLookupHooks.h
      - app/src/main/cpp/experiments/csharp/ManagedBannerWorldState.h
      - app/src/main/cpp/experiments/csharp/ManagedBannerNearbyPolicy.h
      - app/src/main/cpp/experiments/csharp/ManagedBannerMetrics.h
      - app/src/main/cpp/experiments/csharp/ManagedBannerStrength.h
      - app/src/main/cpp/experiments/csharp/ManagedBannerAnchors.h
      - app/src/main/cpp/experiments/csharp/ManagedBannerWorldFile.h
      - app/src/main/cpp/experiments/csharp/ManagedBannerWorldSession.h
      - app/src/main/cpp/experiments/csharp/ManagedBannerSaveHooks.h
      - app/src/main/cpp/experiments/csharp/ManagedBannerSaveDispatch.h
      - app/src/main/cpp/experiments/csharp/NativeInvasionWorldPath.cpp
      - app/src/main/cpp/experiments/csharp/NativeContent.cpp
      - app/src/main/cpp/experiments/csharp/NativeBasicItems.cpp
      - app/src/main/cpp/experiments/csharp/NativeBasicItems.h
      - app/src/main/cpp/experiments/csharp/NativeTilePolicy.h
      - app/src/main/cpp/experiments/csharp/NativeTileGameplay.cpp
      - experiments/csharp/BunnySourceCompiler/TileWriter.cs
      - samples/ExampleModCSharp/Playable/content/Content/Tiles/**
      - samples/ExampleMod/content/Content/Tiles/Banners/**
      - samples/ExampleMod/content/Content/Items/Placeable/Banners/**
      - app/src/main/cpp/experiments/csharp/ManagedBannerGameCounters.h
      - app/src/main/cpp/experiments/csharp/AutoSourceRuntime.cpp
      - app/src/main/cpp/experiments/csharp/ManagedBannerArrayBridge.h
      - app/src/main/cpp/experiments/csharp/SourceLoader.cpp
      - app/src/main/cpp/experiments/csharp/SourceParser.cpp
      - samples/ExampleModCSharp/Examples/Banners/**
      - samples/ExampleModCSharp/Playable/content/Content/NPCs/**
      - samples/ExampleModCSharp/Playable/content/Content/Items/Placeable/Banners/**
      - tests/banners/**
      - .github/workflows/check-csharp-bannerloader-source-only.yml
  pull_request:
    paths:
      - experiments/csharp/BunnyCsSdk/**
      - experiments/csharp/BunnySourceSdk/**
      - experiments/csharp/BunnySourceCompiler/**
      - app/src/main/cpp/experiments/csharp/ManagedBannerRegistry.h
      - app/src/main/cpp/experiments/csharp/ManagedBannerLookupHooks.h
      - app/src/main/cpp/experiments/csharp/ManagedBannerWorldState.h
      - app/src/main/cpp/experiments/csharp/ManagedBannerNearbyPolicy.h
      - app/src/main/cpp/experiments/csharp/ManagedBannerMetrics.h
      - app/src/main/cpp/experiments/csharp/ManagedBannerStrength.h
      - app/src/main/cpp/experiments/csharp/ManagedBannerWorldFile.h
      - app/src/main/cpp/experiments/csharp/ManagedBannerWorldSession.h
      - app/src/main/cpp/experiments/csharp/ManagedBannerSaveHooks.h
      - app/src/main/cpp/experiments/csharp/ManagedBannerSaveDispatch.h
      - app/src/main/cpp/experiments/csharp/NativeInvasionWorldPath.cpp
      - app/src/main/cpp/experiments/csharp/NativeContent.cpp
      - app/src/main/cpp/experiments/csharp/NativeBasicItems.cpp
      - app/src/main/cpp/experiments/csharp/NativeBasicItems.h
      - app/src/main/cpp/experiments/csharp/NativeTilePolicy.h
      - app/src/main/cpp/experiments/csharp/NativeTileGameplay.cpp
      - experiments/csharp/BunnySourceCompiler/TileWriter.cs
      - samples/ExampleModCSharp/Playable/content/Content/Tiles/**
      - samples/ExampleMod/content/Content/Tiles/Banners/**
      - samples/ExampleMod/content/Content/Items/Placeable/Banners/**
      - app/src/main/cpp/experiments/csharp/ManagedBannerGameCounters.h
      - app/src/main/cpp/experiments/csharp/AutoSourceRuntime.cpp
      - app/src/main/cpp/experiments/csharp/ManagedBannerArrayBridge.h
      - app/src/main/cpp/experiments/csharp/SourceLoader.cpp
      - samples/ExampleModCSharp/Playable/content/Content/NPCs/**
      - samples/ExampleModCSharp/Playable/content/Content/Items/Placeable/Banners/**
      - tests/banners/**
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: banner-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  banner-source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Compile actual CSharp SDK and Roslyn compiler
        run: |
          dotnet build experiments/csharp/BunnyCsSdk/BunnyCsSdk.csproj -c Release --nologo
          dotnet build experiments/csharp/BunnySourceSdk/BunnySourceSdk.csproj -c Release --nologo
          dotnet build experiments/csharp/BunnySourceCompiler/BunnySourceCompiler.csproj -c Release --nologo
      - name: Execute banner registry and persistence contracts
        run: dotnet run --project tests/banners/Banners.HostTests.csproj -c Release --no-launch-profile
      - name: Compile complete editable ExampleMod and run real managed defaults
        run: |
          dotnet build tests/ready_prs/FullExampleManaged.csproj -c Release --nologo
          dotnet run --project tests/ready_prs/FullExampleRuntime/FullExampleRuntime.csproj -c Release -- samples/ExampleModCSharp/Playable
      - name: Compile and run native banner registry tests
        run: |
          c++ -std=c++20 -O1 -Wall -Wextra -Werror -pthread \
            -Iapp/src/main/cpp tests/banners/native_registry.cpp -o /tmp/bunny-banner-registry
          /tmp/bunny-banner-registry
      - name: Compile and run native BannerSystem lookup dispatch tests
        run: |
          c++ -std=c++20 -O1 -Wall -Wextra -Werror -pthread \
            -Iapp/src/main/cpp -Itests/basic_items/include -Itests/startup/include \
            tests/banners/native_lookups.cpp -o /tmp/bunny-banner-lookups
          /tmp/bunny-banner-lookups
      - name: Test world save sidecar codec and transactional restoration
        run: |
          c++ -std=c++20 -O1 -Wall -Wextra -Werror -pthread \
            -Iapp/src/main/cpp tests/banners/native_world_state.cpp \
            -o /tmp/bunny-banner-world-state
          /tmp/bunny-banner-world-state
      - name: Test real banner world sidecars and world-session isolation
        run: |
          c++ -std=c++20 -O1 -Wall -Wextra -Werror -pthread \
            -Iapp/src/main/cpp tests/banners/native_world_disk.cpp \
            -o /tmp/bunny-banner-world-disk
          /tmp/bunny-banner-world-disk
          c++ -std=c++20 -O1 -Wall -Wextra -Werror -pthread \
            -Iapp/src/main/cpp tests/banners/native_world_session.cpp \
            -o /tmp/bunny-banner-world-session
          /tmp/bunny-banner-world-session
      - name: Verify native world-save versus network dispatch and world isolation
        run: |
          c++ -std=c++20 -O1 -Wall -Wextra -Werror -pthread \
            -Iapp/src/main/cpp tests/banners/native_save_dispatch.cpp \
            -o /tmp/bunny-banner-save-dispatch
          /tmp/bunny-banner-save-dispatch
      - name: Validate native banner tile style, drops and bounds
        run: |
          c++ -std=c++20 -O1 -Wall -Wextra -Werror \
            -Iapp/src/main/cpp tests/banners/native_tile_style.cpp \
            -o /tmp/bunny-banner-tile-style
          /tmp/bunny-banner-tile-style
      - name: Validate bounded world-scoped banner proximity cache
        run: |
          c++ -std=c++20 -O1 -Wall -Wextra -Werror -pthread \
            -Iapp/src/main/cpp tests/banners/native_nearby.cpp \
            -o /tmp/bunny-banner-nearby
          /tmp/bunny-banner-nearby
      - name: Validate BannerStrength does not touch vanilla item range
        run: |
          c++ -std=c++20 -O1 -Wall -Wextra -Werror -pthread \
            -Iapp/src/main/cpp -Itests/basic_items/include -Itests/startup/include \
            tests/banners/native_strength_policy.cpp \
            -o /tmp/bunny-banner-strength
          /tmp/bunny-banner-strength
      - name: Test bounded BannerSystem array planner
        run: |
          c++ -std=c++20 -O1 -Wall -Wextra -Werror -pthread \
            -Iapp/src/main/cpp tests/banners/native_array_plan.cpp \
            -o /tmp/bunny-banner-array-plan
          /tmp/bunny-banner-array-plan
      - name: Compile and run actual early CSharp parser tests
        run: |
          c++ -std=c++20 -O1 -Wall -Wextra -Werror \
            -Iapp/src/main/cpp tests/banners/native_parser.cpp \
            app/src/main/cpp/experiments/csharp/SourceParser.cpp -o /tmp/bunny-banner-parser
          /tmp/bunny-banner-parser
      - name: Compile the actual SourceLoader integration without linking or packaging
        run: |
          c++ -std=c++20 -Wall -Wextra -Werror -fsyntax-only \
            -Iapp/src/main/cpp -Itests/basic_items/include -Itests/startup/include \
            app/src/main/cpp/experiments/csharp/SourceLoader.cpp \
            app/src/main/cpp/experiments/csharp/NativeInvasionWorldPath.cpp \
            app/src/main/cpp/experiments/csharp/AutoSourceRuntime.cpp \
            app/src/main/cpp/experiments/csharp/NativeContent.cpp \
            app/src/main/cpp/experiments/csharp/NativeTileGameplay.cpp \
            app/src/main/cpp/experiments/csharp/NativeBasicItems.cpp
      - name: Verify banner artwork is byte-for-byte identical to ExampleModBunny
        run: |
          cmp samples/ExampleMod/content/Content/Tiles/Banners/ExampleEnemyBannerTile.png \
              samples/ExampleModCSharp/Playable/content/Content/Tiles/Banners/ExampleEnemyBannerTile.png
          cmp samples/ExampleMod/content/Content/Items/Placeable/Banners/ExampleSlimeBanner.png \
              samples/ExampleModCSharp/Playable/content/Content/Items/Placeable/Banners/ExampleSlimeBanner.png
      - name: Verify APK gate remains closed
        shell: bash
        run: |
          if find . -type f -name '*.apk' -print -quit | grep -q .; then
            echo 'APK forbidden: BannerLoader runtime is incomplete' >&2
            exit 1
          fi
