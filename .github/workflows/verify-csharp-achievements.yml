name: Verify CSharp Achievements Core

on:
  push:
    branches:
      - feat/csharp-achievement-loader-20261021
    paths:
      - experiments/csharp/BunnyCsSdk/BunnyAchievement.cs
      - experiments/csharp/BunnyCsSdk/BunnyAchievementRuntime.cs
      - experiments/csharp/BunnyCsSdk/BunnyAchievementStore.cs
      - experiments/csharp/BunnySourceSdk/BunnySourceSdk.csproj
      - experiments/csharp/BunnySourceCompiler/CompiledAssemblyProbe.cs
      - app/src/main/cpp/experiments/csharp/SourceParser.cpp
      - app/src/main/cpp/experiments/csharp/SourceContentIdentity.h
      - app/src/main/cpp/experiments/csharp/SourceLoader.cpp
      - app/src/main/cpp/experiments/csharp/SourceLoader.h
      - app/src/main/cpp/experiments/csharp/ManagedRuntime.cpp
      - app/src/main/cpp/experiments/csharp/ManagedRuntime.h
      - app/src/main/cpp/experiments/csharp/ManagedAchievementTransport.h
      - app/src/main/cpp/experiments/csharp/ManagedAchievementMetadata.h
      - app/src/main/cpp/experiments/csharp/NativeAchievementRegistry.h
      - app/src/main/cpp/experiments/csharp/NativeAchievementRegistry.cpp
      - app/src/main/cpp/experiments/csharp/NativeAchievementVisualHooks.h
      - app/src/main/cpp/experiments/csharp/NativeAchievementVisualHooks.cpp
      - app/src/main/cpp/experiments/csharp/NativeAchievementProgress.h
      - app/src/main/cpp/experiments/csharp/NativeAchievementHooks.h
      - app/src/main/cpp/experiments/csharp/NativeAchievementHooks.cpp
      - app/src/main/cpp/experiments/csharp/AutoSourceRuntime.cpp
      - tests/achievements_csharp/**
      - samples/ExampleModCSharp/Examples/Achievements/**
      - samples/ExampleModCSharp/Playable/content/Content/Achievements/**
      - .github/workflows/verify-csharp-achievements.yml
  workflow_dispatch:

jobs:
  managed-core-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test native CSharp source parsing without Android
        run: |
          g++ -std=c++20 -O2 -Iapp/src/main/cpp             tests/achievements_csharp/source_parser_test.cpp             app/src/main/cpp/experiments/csharp/SourceParser.cpp             -o /tmp/csharp-achievement-source-parser
          /tmp/csharp-achievement-source-parser
      - name: Test bounded MonoVM achievement transport without Android
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -Iapp/src/main/cpp \
            tests/achievements_csharp/transport_test.cpp \
            -o /tmp/csharp-achievement-transport
          /tmp/csharp-achievement-transport
      - name: Test strict native metadata protocol
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -Iapp/src/main/cpp \
            tests/achievements_csharp/metadata_test.cpp \
            -o /tmp/csharp-achievement-metadata
          /tmp/csharp-achievement-metadata
      - name: Test native achievement progress conversion
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -Iapp/src/main/cpp \
            tests/achievements_csharp/native_progress_test.cpp \
            -o /tmp/csharp-achievement-progress
          /tmp/csharp-achievement-progress
      - name: Syntax-check actual native MonoVM integration without APK
        run: |
          g++ -std=c++20 -O0 -fsyntax-only -Itests/basic_items/include -Iapp/src/main/cpp \
            app/src/main/cpp/experiments/csharp/ManagedRuntime.cpp
          g++ -std=c++20 -O0 -fsyntax-only -Itests/basic_items/include -Iapp/src/main/cpp \
            app/src/main/cpp/experiments/csharp/NativeAchievementHooks.cpp
          g++ -std=c++20 -O0 -fsyntax-only -Itests/basic_items/include -Iapp/src/main/cpp \
            app/src/main/cpp/experiments/csharp/NativeAchievementRegistry.cpp
          g++ -std=c++20 -O0 -fsyntax-only -Itests/basic_items/include -Iapp/src/main/cpp \
            app/src/main/cpp/experiments/csharp/NativeAchievementVisualHooks.cpp
          g++ -std=c++20 -O0 -fsyntax-only -Itests/basic_items/include \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            -Iapp/src/main/cpp \
            app/src/main/cpp/experiments/csharp/AutoSourceRuntime.cpp
      - name: Test achievements without Android or APK
        run: dotnet run --configuration Release --project tests/achievements_csharp/AchievementCoreTests.csproj
