# TEMPORARIO (remover antes do merge): resume no PR #182 os erros dos passos
# que falham, porque os logs de Actions nao abrem na sessao de desenvolvimento.
name: TEMP diagnose PR 182
on:
  push:
    branches: [feat/globalitem-content-20261027]
permissions:
  contents: read
  pull-requests: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run failing commands and summarize
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          report=/tmp/report.md
          echo "Diagnostico temporario (commit ${GITHUB_SHA:0:8})" > $report
          run() {
            local label="$1"; shift
            "$@" > "/tmp/$label.log" 2>&1
            local rc=$?
            echo "" >> $report
            echo "### $label rc=$rc" >> $report
            if [ $rc -ne 0 ]; then
              echo '```' >> $report
              grep -v "warning CS\|warning NETSDK\|^\s*$" "/tmp/$label.log" | grep -i -B2 -A3 "error\|undefined\|fail\|exception\|assert" | head -n 50 | cut -c1-400 >> $report
              echo '--- fim ---' >> $report
              grep -v "warning CS\|warning NETSDK\|^\s*$" "/tmp/$label.log" | tail -n 12 | cut -c1-400 >> $report
              echo '```' >> $report
            fi
          }
          run three-loaders bash tests/three_loaders/run.sh
          run golf-ball bash tests/golf_ball/run.sh
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;30.0.16248370" "cmake;3.22.1" "platforms;android-34" >/dev/null
          run gradle-native gradle :app:externalNativeBuildDebug --no-daemon -Pbl.uiOnly=true
          gh pr comment 182 --repo "$GITHUB_REPOSITORY" --body-file $report
          exit 0
