name: CSharp DustLoader source contracts

on:
  push:
    branches:
      - feat/csharp-dust-loader-20261019
    paths:
      - experiments/csharp/BunnyCsSdk/BunnyDust.cs
      - experiments/csharp/BunnySourceSdk/**
      - experiments/csharp/BunnyDustTests/**
      - app/src/main/cpp/experiments/csharp/ManagedDustContract.h
      - tests/csharp/native_dust_contract.cpp
      - tests/csharp/native_dust_parser.cpp
      - app/src/main/cpp/experiments/csharp/SourceParser.cpp
      - app/src/main/cpp/experiments/csharp/SourceContentIdentity.h
      - experiments/csharp/BunnySourceCompiler/CompiledAssemblyProbe.cs
      - .github/workflows/check-csharp-dust.yml
  pull_request:
    paths:
      - experiments/csharp/BunnyCsSdk/BunnyDust.cs
      - experiments/csharp/BunnySourceSdk/**
      - experiments/csharp/BunnyDustTests/**
      - app/src/main/cpp/experiments/csharp/ManagedDustContract.h
      - tests/csharp/native_dust_contract.cpp

permissions:
  contents: read

jobs:
  dust-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Compile and run managed DustLoader contracts
        run: dotnet run --project experiments/csharp/BunnyDustTests/BunnyDustTests.csproj -c Release
      - name: Compile and run C++ DustLoader ABI contracts
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Iapp/src/main/cpp tests/csharp/native_dust_contract.cpp -o "$RUNNER_TEMP/dust_contract"
          "$RUNNER_TEMP/dust_contract"
      - name: Verify Roslyn source compiler assembly
        run: dotnet build experiments/csharp/BunnySourceCompiler/BunnySourceCompiler.csproj -c Release --nologo
      - name: Verify DustLoader source parser
        run: |
          c++ -std=c++20 -Wall -Wextra -Werror -Iapp/src/main/cpp             tests/csharp/native_dust_parser.cpp             app/src/main/cpp/experiments/csharp/SourceParser.cpp             -o "$RUNNER_TEMP/dust_parser"
          "$RUNNER_TEMP/dust_parser"
