name: CSharp collision native Android compile (no APK)

on:
  push:
    paths:
      - 'app/src/main/cpp/experiments/csharp/ManagedProjectileHook.cpp'
      - 'app/src/main/cpp/experiments/csharp/ManagedRuntime.cpp'
      - 'app/src/main/cpp/experiments/csharp/ManagedRuntime.h'
      - 'app/src/main/cpp/experiments/csharp/ManagedProjectileHook.h'
      - 'app/src/main/cpp/experiments/csharp/ManagedTileCollisionPolicy.h'
      - 'app/src/main/cpp/experiments/csharp/ProjectilePolicy.h'
      - 'app/src/main/cpp/experiments/csharp/NativeContent.cpp'
      - 'app/src/main/cpp/experiments/csharp/NativeContent.h'
      - 'app/src/main/cpp/experiments/csharp/SourceLoader.cpp'
      - '.github/workflows/check-csharp-native-collision.yml'
  pull_request:
    paths:
      - 'app/src/main/cpp/experiments/csharp/ManagedProjectileHook.cpp'
      - 'app/src/main/cpp/experiments/csharp/ManagedRuntime.cpp'
      - 'app/src/main/cpp/experiments/csharp/ManagedRuntime.h'
      - 'app/src/main/cpp/experiments/csharp/ManagedProjectileHook.h'
      - 'app/src/main/cpp/experiments/csharp/ManagedTileCollisionPolicy.h'
      - 'app/src/main/cpp/experiments/csharp/ProjectilePolicy.h'
      - 'app/src/main/cpp/experiments/csharp/NativeContent.cpp'
      - 'app/src/main/cpp/experiments/csharp/NativeContent.h'
      - 'app/src/main/cpp/experiments/csharp/SourceLoader.cpp'
      - '.github/workflows/check-csharp-native-collision.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-native-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android ARM64 native dependencies
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/cpp/third_party/quickjs/quickjs.c
          test -s app/src/main/cpp/third_party/quickjs/quickjs.h
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;30.0.16248370" "cmake;3.22.1" "platforms;android-34"
      - name: Compile Android native code without assembling any APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:externalNativeBuildDebug --stacktrace --no-daemon -Pbl.uiOnly=true
          find app -type f -name 'libbunny.so' -print -quit | grep -q libbunny.so
          test ! -e app/build/outputs/apk/debug/app-debug.apk
          echo "BUNNY_CSHARP_TILE_COLLISION_NATIVE_ARM64_COMPILE=PASS"
