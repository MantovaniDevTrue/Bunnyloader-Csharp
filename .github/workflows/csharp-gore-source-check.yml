name: CSharp Gore Source Validation

on:
  push:
    branches:
      - feature/csharp-gore-loader
  pull_request:
    paths:
      - 'app/src/main/cpp/experiments/csharp/ManagedGoreDiscovery.*'
      - 'tests/csharp_gore_discovery_test.cpp'
      - '.github/workflows/csharp-gore-source-check.yml'

jobs:
  native-gore-discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test source discovery only (no APK)
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic \
            -Iapp/src/main/cpp \
            tests/csharp_gore_discovery_test.cpp \
            app/src/main/cpp/experiments/csharp/ManagedGoreDiscovery.cpp \
            -o /tmp/bunny_gore_discovery_test
          /tmp/bunny_gore_discovery_test
          test ! -f app/build/outputs/apk/debug/app-debug.apk
