name: CSharp Gore Source Validation

on:
  push:
    branches:
      - feature/csharp-gore-loader
  pull_request:
    paths:
      - 'app/src/main/cpp/experiments/csharp/ManagedGoreDiscovery.*'
      - 'tests/csharp_gore_discovery_test.cpp'
      - 'tests/csharp_gore_catalog_test.cpp'
      - 'app/src/main/cpp/experiments/csharp/ManagedGoreCatalog.h'
      - 'app/src/main/cpp/experiments/csharp/ManagedGoreRuntime.*'
      - 'app/src/main/cpp/experiments/csharp/SourceLoader.cpp'
      - 'app/src/main/cpp/experiments/csharp/AutoSourceRuntime.cpp'
      - 'experiments/csharp/BunnyCsSdk/BunnyGore.cs'
      - 'experiments/csharp/BunnySourceSdk/BunnySourceSdk.csproj'
      - 'samples/ExampleModCSharp/Playable/content/Content/NPCs/ExampleSlimeNPC.cs'
      - 'samples/ExampleModCSharp/Playable/content/Content/Projectiles/ExampleWaveBolt.cs'
      - 'tests/stubs/android/log.h'
      - 'tests/csharp_gore_examples/GoreExamples.csproj'
      - '.github/workflows/csharp-gore-source-check.yml'

jobs:
  native-gore-discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test discovery, catalog and runtime syntax (no APK)
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic \
            -Iapp/src/main/cpp \
            tests/csharp_gore_discovery_test.cpp \
            app/src/main/cpp/experiments/csharp/ManagedGoreDiscovery.cpp \
            -o /tmp/bunny_gore_discovery_test
          /tmp/bunny_gore_discovery_test
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic \
            -Iapp/src/main/cpp \
            tests/csharp_gore_catalog_test.cpp \
            -o /tmp/bunny_gore_catalog_test
          /tmp/bunny_gore_catalog_test
          c++ -std=c++20 -fsyntax-only -Wall -Wextra -Werror \
            -Itests/stubs -Iapp/src/main/cpp \
            app/src/main/cpp/experiments/csharp/ManagedGoreRuntime.cpp
          test ! -f app/build/outputs/apk/debug/app-debug.apk

      - name: Compile the native Gore integration for Android ARM64 without linking or APK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          MANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          test -x "$MANAGER"
          echo y | "$MANAGER" --licenses >/dev/null || true
          "$MANAGER" --install "ndk;27.2.12479018" >/dev/null
          NDK="$SDK/ndk/27.2.12479018"
          CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"
          test -x "$CXX"
          mkdir -p /tmp/bunny-gore-android-objects
          for file in \
            app/src/main/cpp/experiments/csharp/ManagedGoreDiscovery.cpp \
            app/src/main/cpp/experiments/csharp/ManagedGoreRuntime.cpp \
            app/src/main/cpp/experiments/csharp/SourceLoader.cpp \
            app/src/main/cpp/experiments/csharp/AutoSourceRuntime.cpp
          do
            "$CXX" -std=c++20 -O2 -fno-exceptions -fno-rtti -fPIC \
              -DANDROID -Iapp/src/main/cpp \
              -c "$file" -o "/tmp/bunny-gore-android-objects/$(basename "$file").o"
          done
          test "$(find /tmp/bunny-gore-android-objects -name '*.o' | wc -l)" -eq 4
          test ! -d app/build/outputs/apk

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile BunnySourceSdk pure CSharp (no APK)
        run: |
          dotnet build experiments/csharp/BunnySourceSdk/BunnySourceSdk.csproj --configuration Release --nologo
          dotnet build tests/csharp_gore_examples/GoreExamples.csproj --configuration Release --nologo
