name: Check CSharp managed player and NPC context v84

on:
  push:
    branches:
      - csharp-managed-player-npc-context-v84-experiment
  workflow_dispatch:

jobs:
  check-player-npc-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate player NPC snapshot FIFO and fallback
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pthread \
            -I Split/Bunny-Loader/app/src/main/cpp \
            Split/Bunny-Loader/tests/test_managed_hit_context_v84.cpp \
            -o /tmp/bunny-player-npc-v84
          /tmp/bunny-player-npc-v84
      - name: Validate MonoVM 12-parameter V4 and existing callbacks
        run: |
          set -euo pipefail
          python3 Split/Bunny-Loader/tests/run_managed_lifecycle_regressions.py
      - name: Check hook capture and CSharp sample coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("Split/Bunny-Loader/app/src/main/cpp")
          hook = (root / "experiments/csharp/ManagedHitHook.cpp").read_text()
          runtime = (root / "experiments/csharp/ManagedRuntime.cpp").read_text()
          queue = (root / "experiments/csharp/ManagedLiveEventQueue.h").read_text()
          sample = Path("Split/Bunny-Loader/samples/ExampleModCSharp/Playable/content/Common/Live/ExampleWaveBoltLiveEvents.cs").read_text()
          js = (root / "script/api/CSharpPrototypeApi.cpp").read_text()
          assert 'il2cpp::findField(main, "player")' in hook
          assert 'il2cpp::fieldOffset(playerClass, "statLife")' in hook
          assert 'game.proj.owner' in hook
          assert 'queueManagedLiveHit(type, damage, index, snapshot, playerSnapshot)' in hook
          assert "ManagedPlayerSnapshot player{};" in queue
          assert "event.npc, event.player, callbackClass" in runtime
          assert 'g_api.findMethod(klass, "OnHitNPCV4", 12)' in runtime
          assert "useV4 ? argsV4 : useV3 ? argsV3" in runtime
          assert "OnHitNPCV4(int call, int damage, int npcIndex, int npcType," in sample
          for name in ("v4Calls", "v4Successes", "v4Failures", "lastPlayerIndex",
                       "lastPlayerLife", "lastPlayerLifeMax", "lastPlayerX", "lastPlayerY"):
              assert f'"{name}"' in js
          print("CSHARP_V84_PLAYER_NPC_SAFE_CONTEXT=PASS")
          PY
