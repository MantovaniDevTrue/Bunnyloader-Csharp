name: Check CSharp managed hit context v81

on:
  push:
    branches:
      - csharp-managed-event-context-v81-experiment
  workflow_dispatch:

jobs:
  check-context:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile and exercise FIFO64 target slot regression
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pthread \
            -I Split/Bunny-Loader/app/src/main/cpp \
            Split/Bunny-Loader/tests/test_managed_hit_context_v81.cpp \
            -o /tmp/bunny-managed-hit-context-v81
          /tmp/bunny-managed-hit-context-v81
      - name: Verify native to MonoVM dispatch and legacy fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path("Split/Bunny-Loader/app/src/main/cpp/experiments/csharp")
          header = (root / "ManagedLiveEventQueue.h").read_text()
          runtime = (root / "ManagedRuntime.cpp").read_text()
          hit = (root / "ManagedHitHook.cpp").read_text()
          kill = (root / "ManagedKillHook.cpp").read_text()
          assert "int npcIndex = -1;" in header
          sample = Path("Split/Bunny-Loader/samples/ExampleModCSharp/Playable/content/Common/Live/ExampleWaveBoltLiveEvents.cs").read_text()
          assert "queueManagedLiveHit(int projectileType, int damage, int npcIndex)" in runtime
          assert "queueManagedLiveKill(int projectileType, int damage)" in runtime
          assert "queueManagedLiveHit(type, damage, index);" in hit
          assert "queueManagedLiveKill(type, damage);" in kill
          assert "event.damage, event.npcIndex, callbackClass" in runtime
          assert 'g_api.findMethod(klass, "OnHitNPCV2", 3)' in runtime
          assert 'g_api.findMethod(klass, "OnHitNPC", 2)' in runtime
          assert 'g_api.findMethod(klass, "OnKill", 2)' in runtime
          assert "useV2 ? argsV2 : argsLegacy" in runtime
          assert "(isKill && npcIndex != -1)" in runtime
          assert "int npcIndex = -1;" in header
          assert "OnHitNPCV2(int call, int damage, int npcIndex)" in sample
          print("CSHARP_V81_EVENT_CONTEXT_BRIDGE=PASS")
          PY
