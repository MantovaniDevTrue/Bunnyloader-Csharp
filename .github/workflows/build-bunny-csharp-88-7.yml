          var asm = Assembly.LoadFrom(path);
          var type = asm.GetType("BunnyLoader.VmBenchmark67.Kernel", throwOnError: true)!;
          var method = type.GetMethod("Execute",
              BindingFlags.Public | BindingFlags.Static,
              binder: null, types: new[] {typeof(int), typeof(int)}, modifiers: null);
          if (method == null) throw new Exception("Kernel.Execute(int,int) is absent in bundled binary");
          var value = (int)method.Invoke(null, new object[] {1000000, 0x12345678})!;
          if (value != 1336190628)
              throw new Exception("Managed binary checksum mismatch: " + value);
          Console.WriteLine("BUNNY_MANAGED_BENCHMARK_DLL_INVOKE=PASS value=" + value);
          CSCODE
          dotnet run --project "$VERIFIER/Verify.csproj" --configuration Release \
            -- "$ASSETS/BunnyVmBenchmark67.dll"
          test -s "$ASSETS/BunnyVmBenchmark67.dll"
          python3 - <<'PY'
          from pathlib import Path
          import os, json, re
          cpp = Path("Split/Bunny-Loader/app/src/main/cpp/script/api/CSharpPrototypeApi.cpp").read_text()
          found = {}
          for name in ("kVmProjectileJs", "kVmNpcJs"):
              m = re.search(r'constexpr char ' + name + r'\[\] = R"JS\(\n(.*?)\n\)JS";', cpp, re.S)
              assert m, name
              found[name] = m.group(1)
          Path(os.environ["RUNNER_TEMP"], "vm-ai-kernels-69.json").write_text(json.dumps(found))
          print("BUNNY_AI_JS_KERNELS_EXTRACTED=PASS")
          PY
          node - <<'NODE'
          const fs = require("fs");
          const path = process.env.RUNNER_TEMP;
          const source = JSON.parse(fs.readFileSync(path + "/vm-ai-kernels-69.json", "utf8"));
          const rows = [];
          for (const [key, method] of [["kVmProjectileJs", "Projectile"], ["kVmNpcJs", "Npc"]]) {
              const routine = eval(source[key]);
              for (const ticks of [64, 512, 2000]) {
                  const checksum = routine(ticks, 0x12345678);
                  if (!Number.isInteger(checksum)) throw new Error("invalid JS checksum");
                  rows.push([method, ticks, checksum].join("\t"));
              }
          }
          fs.writeFileSync(path + "/vm-ai-expected-69.tsv", rows.join("\n") + "\n");
          console.log("BUNNY_AI_JAVASCRIPT_CHECKSUMS=PASS\n" + rows.join("\n"));
          NODE
          AIVERIFIER="$RUNNER_TEMP/bunny-managed-ai-verify"
          mkdir -p "$AIVERIFIER"
          cp "$VERIFIER/Verify.csproj" "$AIVERIFIER/Verify.csproj"
          cat > "$AIVERIFIER/Program.cs" <<'CSCODE'
          using System;
          using System.IO;
          using System.Reflection;
          var assembly = Assembly.LoadFrom(Path.GetFullPath(args[0]));
          var type = assembly.GetType("BunnyLoader.VmGameplay69.Kernel", true)!;
          int checkedCount = 0;
          foreach (var line in File.ReadLines(args[1]))
          {
              var cells = line.Split('\t');
              var method = type.GetMethod(cells[0], BindingFlags.Public | BindingFlags.Static,
                  null, new[] {typeof(int), typeof(int)}, null);
              if (method == null) throw new Exception("Missing managed " + cells[0]);
              int ticks = int.Parse(cells[1]);
              int expected = int.Parse(cells[2]);
              int actual = (int)method.Invoke(null, new object[] {ticks, 0x12345678})!;
              if (actual != expected)
                  throw new Exception("AI mismatch " + cells[0] + " ticks=" + ticks +
                      " JS=" + expected + " Mono=" + actual);
              checkedCount++;
          }
