          cp -a "$RUNNER_TEMP/stable-sprites/assets/sprites/buff" "$ROOT/"

      - name: Rebuild CheatBridge dex
        working-directory: Split/Bunny-Loader
        shell: bash
        run: |
          OUT=".cheatbridge"
          AJAR="$ANDROID_HOME/platforms/android-34/android.jar"
          D8="$ANDROID_HOME/build-tools/34.0.0/d8"
          rm -rf "$OUT"
          mkdir -p "$OUT/classes"
          javac -source 8 -target 8 -nowarn -encoding UTF-8 -classpath "$AJAR" -d "$OUT/classes" \
            app/src/main/java/bunny/TranslationCatalog.java \
            app/src/main/java/bunny/MenuLocalization.java \
            tools/cheatbridge/bunny/CheatBridge.java \
            tools/cheatbridge/bunny/CheatData.java \
            tools/cheatbridge/bunny/DevTools.java
          mapfile -t CLASSES < <(find "$OUT/classes" -name "*.class" -type f)
          "$D8" --release --min-api 26 --lib "$AJAR" --output "$OUT" "${CLASSES[@]}"
          python3 tools/bin2header.py "$OUT/classes.dex" bl_cheatbridge_dex > app/src/main/cpp/menu/CheatBridgeDex.h

      - name: Build APK with isolated v3 signing secrets
        working-directory: Split/Bunny-Loader
        shell: bash
        env:
          BUNNY_KEYSTORE_B64: ${{ secrets.BUNNY_KEYSTORE_B64 }}
          BUNNY_SIGNING_PASSWORD: ${{ secrets.BUNNY_SIGNING_PASSWORD }}
          BUNNY_SIGNING_ALIAS: ${{ secrets.BUNNY_SIGNING_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${BUNNY_KEYSTORE_B64:-}" ] || [ -z "${BUNNY_SIGNING_PASSWORD:-}" ] || [ -z "${BUNNY_SIGNING_ALIAS:-}" ]; then
            echo "Missing Bunny signing secrets. Configure BUNNY_KEYSTORE_B64, BUNNY_SIGNING_PASSWORD and BUNNY_SIGNING_ALIAS." >&2
            exit 1
          fi
          umask 077
          SIGNING_DIR="$RUNNER_TEMP/bunny-signing-v3"
          mkdir -p "$SIGNING_DIR"
          export BUNNY_SIGNING_STORE="$SIGNING_DIR/bunny-v3.jks"
          trap 'rm -f "$BUNNY_SIGNING_STORE"' EXIT
          printf '%s' "$BUNNY_KEYSTORE_B64" | base64 --decode > "$BUNNY_SIGNING_STORE"
          test -s "$BUNNY_SIGNING_STORE"
          keytool -list -keystore "$BUNNY_SIGNING_STORE" -storepass:env BUNNY_SIGNING_PASSWORD -alias "$BUNNY_SIGNING_ALIAS" >/dev/null
          unset BUNNY_KEYSTORE_B64
          echo 'BUNNY_V3_SECRET_KEYSTORE_VALIDATED=YES'
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon

      - name: Validate APK
        shell: bash
        run: |
          APK="Split/Bunny-Loader/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.bunnyloader.csharptest'"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep -F "application-label:'Bunny Loader C# Test'"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libbunny.so"
          python3 - "$APK" <<'PY'
          import hashlib,json,sys,zipfile
          from pathlib import Path
          root=Path('Split/Bunny-Loader')
          report=root/'build/compiler-aot/compiler-aot-build.json'
          if report.is_file():
              expected=json.loads(report.read_text())
              with zipfile.ZipFile(sys.argv[1]) as package:
                  for name in ('libmonosgen-2.0.so','libbunnycompileraot.so'):
                      embedded=package.read('lib/arm64-v8a/'+name)
                      assert embedded==(root/'app/src/main/jniLibs/arm64-v8a'/name).read_bytes(), name+' modified during packaging'
                  for module in expected['modules']:
                      data=package.read('assets/managed/'+module['assembly'])
                      assert hashlib.sha256(data).hexdigest()==module['sha256'], module['assembly']
              print('COMPILER_AOT_APK_BINARY_AND_ASSEMBLY_IDENTITY=PASS')
          PY
          python3 - "$APK" <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import sys
          with ZipFile(sys.argv[1]) as package:
              native = package.read("lib/arm64-v8a/libbunny.so")
          for marker in (b"nCSharpHookCounters", b"editorCsharpMode",
                         b"Hooks C#: aguardando evento de dano", b"MissingHand",
                         b"AnimationConstructor3Failed", b"ColorChannelLayoutUnavailable",
                         b"WorldItemActiveGetterContract"):
              assert marker in native, "Embedded CSharp editor dex missing: " + marker.decode()
          print("BUNNY_CSHARP_VISIBLE_HOOK_EDITOR_EMBEDDED_DEX=PASS")
          PY
          python3 - "$APK" <<'PY'
          import sys
          import zipfile
          with zipfile.ZipFile(sys.argv[1]) as package:
              dex = [package.read(name) for name in package.namelist()
                     if name.startswith("classes") and name.endswith(".dex")]
              assert dex, "No Android DEX found in APK"
              for item in ("Lcom/unity3d/player/UnityPlayer;",
                           "Lcom/unity3d/player/NativeLoader;",
                           "Lcom/unity3d/player/IUnityPlayerLifecycleEvents;"):
                  assert any(item.encode() in content for content in dex), "Unity class absent from APK: " + item
              print("BUNNY_CLEAN_UNITY_PLAYER_IN_APK=PASS")
          PY
          if unzip -Z1 "$APK" | grep -Fx "lib/arm64-v8a/libbunnycs.so"; then
            echo "NativeAOT prototype was unexpectedly bundled in projectile-profiler APK" >&2
            exit 1
          fi
          echo "BUNNY_MANAGED_DEFAULT_NO_NATIVEAOT_PROTOTYPE=PASS"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libmonosgen-2.0.so"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libSystem.Native.so"
          unzip -l "$APK" | grep -F "assets/managed/System.Runtime.dll"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libbunnymonoprobe.so"
          unzip -l "$APK" | grep -F "assets/managed/BunnyManagedProbe.dll"
          unzip -l "$APK" | grep -F "assets/managed/BunnyVmBenchmark67.dll"
          unzip -l "$APK" | grep -F "assets/managed/BunnyVmGameplay69.dll"
          unzip -l "$APK" | grep -F "assets/managed/BunnySourceCompiler.dll"
          unzip -l "$APK" | grep -F "assets/managed/framework.sha256"
          VERSION="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' Split/Bunny-Loader/app/build.gradle.kts | head -n 1)"
          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*/\1/p' Split/Bunny-Loader/app/build.gradle.kts | head -n 1)"
          test -n "$VERSION" && test -n "$VERSION_CODE"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep -F "versionCode='${VERSION_CODE}' versionName='${VERSION}'"
          python3 - "$APK" <<'PY'
          import hashlib
          import sys
          import zipfile
          with zipfile.ZipFile(sys.argv[1]) as package:
              lines = package.read("assets/managed/framework.sha256").decode("utf-8").splitlines()
              assert lines, "Empty framework fingerprint"
              for line in lines:
                  name, checksum = line.split("\t", 1)
                  content = package.read("assets/managed/" + name)
                  assert hashlib.sha256(content).hexdigest() == checksum, name
              print(f"APK_MANAGED_DLL_SHA256_VALIDATED=YES files={len(lines)}")
              native = package.read("lib/arm64-v8a/libbunny.so")
              for symbol in (b"bunny_native_open", b"bunny_native_call", b"bunny_native_read_batch",
                             b"bunny_native_read_batch_invoke", b"bunny_native_access_stat"):
                  assert symbol in native, "Missing native access export: " + symbol.decode()
              sdk = package.read("assets/managed/BunnySourceSdk.dll")
              for name in (b"BunnyNativeScope", b"BunnyNativeBatch", b"BunnyNativeObject", b"BunnyValue"):
                  assert name in sdk, "Missing SDK type: " + name.decode()
              print("APK_NATIVE_ACCESS_BRIDGE_AND_SDK=PASS")
          PY
          unzip -l "$APK" | grep -F "assets/managed/BunnySourceSdk.dll"
          unzip -l "$APK" | grep -F "assets/managed/Microsoft.CodeAnalysis.CSharp.dll"
          unzip -l "$APK" | grep -F "assets/managed/System.Private.CoreLib.dll"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libil2cpp.so"
          unzip -l "$APK" | grep -F "assets/bin/Data/Managed/Metadata/global-metadata.dat"

      - name: Guard world-lifecycle boot and preserve legacy external loader
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path("Split/Bunny-Loader/app/src/main/cpp")
          entry = (root / "boot/Entry.cpp").read_text()
          mod = (root / "experiments/csharp/CSharpModLoader.cpp").read_text()
