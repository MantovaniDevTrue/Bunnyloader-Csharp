          python3 "$ROOT/tests/run_compiler_aot_loader.py"
          python3 "$ROOT/tests/compiler_delivery.py"
          PACKAGE_ID="microsoft.netcore.app.runtime.aot.linux-x64.cross.android-arm64"
          PACK="$RUNNER_TEMP/compiler-aot-cross.nupkg"
          BASE="https://api.nuget.org/v3-flatcontainer/$PACKAGE_ID/8.0.23/$PACKAGE_ID.8.0.23.nupkg"
          curl -fLsS --retry 3 "$BASE" -o "$PACK"
          curl -fLsS --compressed --retry 3 "https://api.nuget.org/v3/registration5-gz-semver2/$PACKAGE_ID/8.0.23.json" -o "$PACK.registration.json"
          CATALOG="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); u=d["catalogEntry"]; assert isinstance(u,str) and u.startswith("https://api.nuget.org/v3/catalog0/data/"); print(u)' "$PACK.registration.json")"
          curl -fLsS --compressed --retry 3 "$CATALOG" -o "$PACK.catalog.json"
          CROSS_DIR="$RUNNER_TEMP/compiler-aot-cross"
          python3 - "$PACK" "$PACK.catalog.json" "$CROSS_DIR" <<'PY'
          import base64,hashlib,json,sys,zipfile
          from pathlib import Path
          package,metadata,destination=map(Path,sys.argv[1:])
          catalog=json.loads(metadata.read_text())
          assert catalog['packageHashAlgorithm']=='SHA512'
          assert hashlib.sha512(package.read_bytes()).digest()==base64.b64decode(catalog['packageHash'],validate=True)
          with zipfile.ZipFile(package) as archive:
              assert all('..' not in Path(name).parts and not name.startswith('/') for name in archive.namelist())
              archive.extractall(destination)
          for tool in destination.rglob('mono-aot-cross'):
              tool.chmod(0o755)
          PY
          CROSS="$(find "$CROSS_DIR" -type f -name mono-aot-cross -print -quit)"
          test -n "$CROSS"
          "$CROSS" --version
          CLANG="$ANDROID_HOME/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          JNI="$ROOT/app/src/main/jniLibs/arm64-v8a"
          readelf -Ws "$JNI/libmonosgen-2.0.so" | grep 'mono_aot_register_module' >/dev/null
          python3 "$ROOT/tools/build_compiler_aot.py" \
            --framework "$ROOT/app/src/main/assets/managed" --cross "$CROSS" \
            --clang "$CLANG" --mono "$JNI/libmonosgen-2.0.so" \
            --output "$JNI/libbunnycompileraot.so" --work "$ROOT/build/compiler-aot"
          readelf -h "$JNI/libbunnycompileraot.so" | grep AArch64
          readelf -Ws "$JNI/libbunnycompileraot.so" | grep 'bunny_compiler_aot_module' >/dev/null

      - name: Integrate Terraria runtime
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BUNNY_PRIVATE_BUILD_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/runtime"
          gh release download "$RUNTIME_TAG" --repo "$PRIVATE_INPUTS_REPO" --pattern "$RUNTIME_ASSET" --dir "$RUNNER_TEMP/runtime"
          cd "$RUNNER_TEMP/runtime"
          echo "$RUNTIME_SHA256  $RUNTIME_ASSET" | sha256sum -c -
          mkdir -p extracted
          unzip -q "$RUNTIME_ASSET" -d extracted
          cd "$GITHUB_WORKSPACE"
          JNI="Split/Bunny-Loader/app/src/main/jniLibs/arm64-v8a"
          ASSETS="Split/Bunny-Loader/terraria1456_assets/src/main/assets"
          mkdir -p "$JNI" "$ASSETS/bin"
          cp "$RUNNER_TEMP/runtime/extracted/lib/arm64-v8a/libil2cpp.so" "$JNI/"
          cp "$RUNNER_TEMP/runtime/extracted/lib/arm64-v8a/libunity.so" "$JNI/"
          cp "$RUNNER_TEMP/runtime/extracted/lib/arm64-v8a/libmain.so" "$JNI/"
          cp "$RUNNER_TEMP/runtime/extracted/lib/arm64-v8a/libc++_shared.so" "$JNI/"
          rm -rf "$ASSETS/bin/Data"
          cp -a "$RUNNER_TEMP/runtime/extracted/assets/bin/Data" "$ASSETS/bin/Data"

      - name: Restore stable sprite pack
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BUNNY_PRIVATE_BUILD_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/stable-apk"
          gh release download "$RUNTIME_TAG" --repo "$PRIVATE_INPUTS_REPO" --pattern "BunnyLoader-v0.1.9.1-MusicPrewarm.apk" --dir "$RUNNER_TEMP/stable-apk"
          printf '%s  %s\n' "aaf7c46046e776a966122d7f4e26469ebb72ad2fc21f0c6e57f98189e0c93c00" "$RUNNER_TEMP/stable-apk/BunnyLoader-v0.1.9.1-MusicPrewarm.apk" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/stable-sprites"
          unzip -q "$RUNNER_TEMP/stable-apk/BunnyLoader-v0.1.9.1-MusicPrewarm.apk" "assets/sprites/*" -d "$RUNNER_TEMP/stable-sprites"
          ROOT="Split/Bunny-Loader/_sprites"
