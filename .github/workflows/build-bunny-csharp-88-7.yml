name: Build Bunny CSharp 88.7 Signed APK

on:
  push:
    branches:
      - hotfix/csharp-88-5-sigabrt-logcat-tail
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: bunny-csharp-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.ref != 'refs/heads/feature/csharp-hair-loader-no-apk-20261022' && github.head_ref != 'feature/csharp-hair-loader-no-apk-20261022' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.head.ref == 'codex/csharp-screenfx-v90-29-86' || github.event.pull_request.head.ref == 'codex/csharp-lights-native-graph-v90-29-87' || github.event.pull_request.head.ref == 'codex/csharp-lights-fidelity-v90-29-88' || github.event.pull_request.head.ref == 'codex/csharp-lights-night-hotfix' || github.event.pull_request.head.ref == 'codex/csharp-lights-sdk-settings-split' || github.event.pull_request.head.ref == 'codex/csharp-lights-88-3-prewarm-scene-fidelity' || github.event.pull_request.head.ref == 'hotfix/csharp-88-5-sigabrt-logcat-tail' || github.event.pull_request.head.ref == 'perf/csharp-88-7-lights-invisible-ray-fastpath'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      RUNTIME_TAG: bunny-private-build-inputs-v1
      PRIVATE_INPUTS_REPO: MantovaniDevTrue/Bunnyloader-Csharp-Builds
      RUNTIME_ASSET: BunnyRuntime_Terraria_1.4.5.8.6.zip
      RUNTIME_SHA256: 2eb8d02dea144cb2fff6a27b94cc371e50ffd9aa44ba4dcd123337691a54c0ab

    steps:
      - uses: actions/checkout@v4

      - name: Announce CSharp .83 batch API build
        if: github.ref == 'refs/heads/codex/csharp-native-probe-optin-v90-29-83'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 62 --repo "$GITHUB_REPOSITORY" --body "Build CSharp .83 com 5 novas assinaturas e ExampleMod 0.1.42: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true
      - name: Announce integrated CSharp .82 APK build
        if: github.ref == 'refs/heads/codex/csharp-unified-example-v90-29-82'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 59 --repo "$GITHUB_REPOSITORY" --body "APK CSharp .82: inicio da compilacao e integracao ExampleMod CSharp 0.1.45. Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true
      - name: Announce experimental .71 APK build
        if: github.ref == 'refs/heads/codex/csharp-universal-intpair-v90-29-79'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${GH_TOKEN:-}" ]; then
            gh issue comment 59 --repo "$GITHUB_REPOSITORY" \
              --body "Compilacao APK .79 iniciada: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Commit ${GITHUB_SHA}. A publicacao privada sera confirmada somente apos assinatura e entrega." \
              || echo "::warning::Nao foi possivel avisar a PR sobre inicio da compilacao"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install Android toolchain
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;30.0.16248370" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Stage verified Unity 2021.3.56f2 Android player classes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BUNNY_PRIVATE_BUILD_TOKEN }}
        run: |
          bash Split/Bunny-Loader/tools/android/stage_unity_classes.sh

      - name: Ensure QuickJS
        shell: bash
        run: |
          rm -rf Split/Bunny-Loader/app/src/main/cpp/third_party/quickjs
          git clone --depth 1 --branch v0.17.0 https://github.com/quickjs-ng/quickjs.git Split/Bunny-Loader/app/src/main/cpp/third_party/quickjs

      - name: Configure Maven mirror
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("Split/Bunny-Loader/settings.gradle.kts")
          s = p.read_text()
          s = s.replace("mavenCentral()", 'maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2") }')
          p.write_text(s)
          PY

      - name: Verify signing secret integration contract
        shell: bash
        run: |
          set -euo pipefail
          test -f Split/Bunny-Loader/app/build.gradle.kts
          grep -q 'BUNNY_SIGNING_STORE' Split/Bunny-Loader/app/build.gradle.kts
          grep -q 'BUNNY_SIGNING_PASSWORD' Split/Bunny-Loader/app/build.gradle.kts
          grep -q 'BUNNY_SIGNING_ALIAS' Split/Bunny-Loader/app/build.gradle.kts
          echo 'BUNNY_SECRET_SIGNING_CONTRACT=PASS'

      - name: Verify game-process abort instrumentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          cpp = Path("Split/Bunny-Loader/app/src/main/cpp")
          api = (cpp / "script/api/CSharpPrototypeApi.cpp").read_text()
          native = (cpp / "experiments/csharp/NativeAbortProbe.cpp").read_text()
          assert "native-game-abort-trace.txt" in api
          assert "gameNativePrevious" in api
          assert 'rearmNativeAbortProbe("after-game-mono-probe")' in api
          assert "gameMutexTraceInstalled" in api
          assert "native-game-abort-previous.txt" in native
          assert "std::rename(file.c_str(), previous.c_str())" in native
          print("CSHARP_GAME_CRASH_TRACE_WIRING=PASS")
          PY

      - name: Verify retained crash session diagnostics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("Split/Bunny-Loader")
          boot = (root / "app/src/main/kotlin/dev/bunnyloader/game/BootLog.kt").read_text()
          native = (root / "app/src/main/cpp/experiments/csharp/NativeAbortProbe.cpp").read_text()
          assert "rotateLogcat(ctx)" in boot
          assert "for (generation in 3 downTo 1)" in boot
          assert "for (generation in 0..3)" in boot
          assert "native-game-abort-previous.txt" in boot
          assert "private fun gameCrashTraces(" in boot
          assert 'out.length() >= 120_000L' in boot
          assert 'takeLast(64_000)' in boot
          assert 'LOGCAT_TAIL_ROLLING' in boot
          assert 'out.length() < 60_000' not in boot
          assert 'ApplicationExitInfo.REASON_SIGNALED && info.status == 6' in boot
          assert "emitAbortHeader();" in native
          assert "NATIVE_ABORT_SIGNAL pid=" in native
          print("CSHARP_CRASH_SESSION_RETENTION=PASS")
          PY

      - name: Verify isolated MonoVM modes and early SIGABRT capture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("Split/Bunny-Loader")
          api = (root / "app/src/main/cpp/script/api/CSharpPrototypeApi.cpp").read_text()
          native = (root / "app/src/main/cpp/experiments/csharp/NativeAbortProbe.cpp").read_text()
          log = (root / "app/src/main/kotlin/dev/bunnyloader/game/BootLog.kt").read_text()
          assert all(mode in api for mode in ("MONO_ONLY", "ABORT_ONLY", "FULL_DIAGNOSTICS"))
          assert 'selectedMode != "MONO_ONLY" && selectedMode != "NO_MONO"' in api
          assert 'selectedMode != "PINNED_MONO" && selectedMode != "LIBRARY_ONLY"' in api
          assert 'selectedMode == "FULL_DIAGNOSTICS"' in api
          assert 'gameProbeMode' in api and 'gameModuleMaps' in api
          assert 'ABORT_CRITICAL_V2 pid=' in native
          assert 'emitCriticalAbortSnapshot(signal, info, raw);' in native
          assert 'persistGameNativeModuleMaps' in native
          assert 'native-game-module-maps.txt' in log
          print("CSHARP_MONO_ISOLATION_AND_CRASH_CONTEXT=PASS")
          PY

      - name: Stress test concurrent managed ingress queue
        shell: bash
        run: |
          c++ -std=c++20 -O2 -pthread \
            -I Split/Bunny-Loader/app/src/main/cpp \
            Split/Bunny-Loader/tests/managed_live_ingress_smoke.cpp \
            -o "$RUNNER_TEMP/managed_live_ingress_smoke"
          "$RUNNER_TEMP/managed_live_ingress_smoke"
          echo "CSHARP_MANAGED_INGRESS_FIFO25K_CONCURRENCY=PASS"

      - name: Validate 25k managed callback limit and FIFO64
        shell: bash
        run: |
          python3 Split/Bunny-Loader/tests/run_managed_live_queue.py
          python3 - <<'PY'
          from pathlib import Path
          root = Path("Split/Bunny-Loader/app/src/main/cpp")
          runtime = (root / "experiments/csharp/ManagedRuntime.cpp").read_text()
          header = (root / "experiments/csharp/ManagedLiveEventQueue.h").read_text()
          status = (root / "experiments/csharp/ManagedRuntime.h").read_text()
          api = (root / "script/api/CSharpPrototypeApi.cpp").read_text()
          assert "kEventLimit = 25000" in header
          assert "kCapacity = 64" in header
          assert "g_liveHitQueue.pop(&event)" in runtime
          assert "g_liveHitQueue.push({" in runtime
          assert "g_liveHitQueue.clear();" in runtime
          assert "g_liveHitInFlight" in runtime
          assert "g_liveIngress.push(" in runtime
          assert "g_liveIngress.pop(&event)" in runtime
          assert "g_liveIngress.depth()" in runtime
          assert "ManagedLiveIngressQueue g_liveIngress" in runtime
          live_ingress = runtime.split("void queueManagedLiveEvent(", 1)[1].split("void queueManagedLiveHit(", 1)[0]
          assert "std::try_to_lock" not in live_ingress
          assert "g_liveIngress.dropped()" in runtime
          assert "addManagedCounter(status.dropped, status.lockDrops);" in runtime
          assert "addManagedCounter(status.dropped, g_liveIngress.dropped());" in runtime
          assert "ManagedLiveEventQueue::kEventLimit" in runtime
          assert 'g_liveHitStatus.phase = "draining"' in runtime
          assert 'g_liveHitStatus.phase = "limit-reached"' in runtime
          assert "g_liveHitStatus.queued >= 512" not in runtime
          assert "tick > 512" not in runtime
          for name in ["queueDepth", "maxQueueDepth", "queueCapacity", "eventLimit", "lockDrops", "inFlight"]:
              assert name in status and f'"{name}"' in api
          print("BUNNY_CSHARP_MANAGED_LIVE_QUEUE_LIMITS=PASS")
          PY

      - name: Verify multi-projectile FIFO64 routing and event caps
        shell: bash
        run: |
          set -euo pipefail
          ROOT="Split/Bunny-Loader"
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -I"$ROOT/app/src/main/cpp" \
            "$ROOT/tests/managed_multi_live_ingress_smoke.cpp" \
            -o "$RUNNER_TEMP/managed-multi-live-ingress"
          "$RUNNER_TEMP/managed-multi-live-ingress"
          python3 - <<'PY'
          from pathlib import Path
          root = Path("Split/Bunny-Loader/app/src/main/cpp")
          runtime = (root / "experiments/csharp/ManagedRuntime.cpp").read_text()
          auto = (root / "experiments/csharp/AutoSourceRuntime.cpp").read_text()
          hit = (root / "experiments/csharp/ManagedHitHook.cpp").read_text()
          kill = (root / "experiments/csharp/ManagedKillHook.cpp").read_text()
          api = (root / "script/api/CSharpPrototypeApi.cpp").read_text()
          for token in (
              "enableManagedLiveProjectile", "g_additionalLiveByType",
              "pushAdditional(", "callbackClass", "disarmAdditionalLiveBindings",
              "managedLiveProjectileStatuses", "g_liveIngress.pop(&event)"
          ):
              assert token in runtime, token
          for label, data in (("hit", hit), ("kill", kill)):
              assert "isManagedLiveProjectileBound(type)" in data, label
          assert "enableManagedLiveProjectile(" in auto
          assert "sourceLiveProjectileStatus" in api
          print("BUNNY_CSHARP_MULTI_LIVE_BINDING_GUARDS=PASS")
          PY

      - name: Run Codex managed lifecycle and failure isolation regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 Split/Bunny-Loader/tests/run_managed_lifecycle_regressions.py

      - name: Verify optional CSharp per-projectile profiler and isolation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path("Split/Bunny-Loader/app/src/main/cpp")
          runtime=(root/"experiments/csharp/ManagedRuntime.cpp").read_text()
          header=(root/"experiments/csharp/ManagedRuntime.h").read_text()
          api=(root/"script/api/CSharpPrototypeApi.cpp").read_text()
          assert "struct ManagedLivePerfProjectileStatus" in header
          assert "std::vector<ManagedLivePerfProjectileStatus> projectiles;" in header
          assert "std::array<PerfProjectileCounters, ManagedLiveIngressQueue::kBindingCount> g_perfProjectileCounters{};" in runtime
          assert "const size_t perfSlot = binding ?" in runtime
          assert "event.bindingSlot + 1" in runtime
          assert "auto& projectilePerf = g_perfProjectileCounters[perfSlot];" in runtime
          assert "if (samplePerf)" in runtime
          assert "projectilePerf.callbacks.fetch_add(1" in runtime
          assert "projectilePerf.queueSamples.fetch_add(1" in runtime
          assert "projectilePerf.failures.fetch_add(1" in runtime
          assert "perfPercentileUs(" in runtime
          assert "resetPerfCounters();" in runtime
          assert "result.projectiles.push_back(std::move(item));" in runtime
          assert 'JS_SetPropertyStr(ctx, out, "projectiles", projectiles);' in api
          for symbol in ("callbacksSampled", "hitSamples", "killSamples", "queueWaitAvgUs",
                         "queueWaitMaxUs", "callbackAvgUs", "callbackMaxUs",
                         "callbackP90Us", "callbackCpuAvgUs", "callbackCpuMaxUs",
                         "failures", "enabled"):
              assert f'"{symbol}"' in api
          perf=runtime.split("void queueManagedLiveEvent(", 1)[1].split(
              "void queueManagedLiveHit(", 1)[0]
          assert "g_perfProjectileCounters" not in perf
          assert "std::lock_guard<std::mutex>" not in perf
          print("BUNNY_CSHARP_OPT_IN_PER_PROJECTILE_PROFILER=PASS")
          PY

      - name: Verify optional Mono heap and assembly cache reuse counters
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path("Split/Bunny-Loader/app/src/main/cpp")
          cpp=(root/"experiments/csharp/ManagedRuntime.cpp").read_text()
          hdr=(root/"experiments/csharp/ManagedRuntime.h").read_text()
          api=(root/"script/api/CSharpPrototypeApi.cpp").read_text()
          for symbol in ("mono_gc_get_heap_size", "mono_gc_get_used_size"):
              assert f'resolve<MonoGcSizeFn>("{symbol}")' in cpp
          assert "using MonoGcSizeFn = int64_t (*)();" in cpp
          assert "status.monoGcStatsAvailable = status.monoReady &&" in cpp
          assert "g_api.gcHeapSize && g_api.gcUsedSize;" in cpp
          assert "status.monoGcHeapBytes = g_api.gcHeapSize();" in cpp
          assert "status.monoGcUsedBytes = g_api.gcUsedSize();" in cpp
          assert "g_liveMethodCacheHits" in cpp
          assert "g_liveMethodCacheMisses" in cpp
          assert "g_liveAssemblyOpenAttempts" in cpp
          assert "g_liveAssemblyOpenSuccesses" in cpp
          assert "g_liveAssemblyOpenPaths.insert(assemblyPath)" in cpp
          assert "++g_liveMethodCacheHits;" in cpp
          assert "++g_liveMethodCacheMisses;" in cpp
          assert "int64_t monoGcHeapBytes = 0;" in hdr
          assert "int64_t monoGcUsedBytes = 0;" in hdr
          for field in ("monoGcStatsAvailable", "monoGcHeapBytes",
                        "monoGcUsedBytes", "liveMethodCacheHits",
                        "liveMethodCacheMisses", "liveAssemblyOpenAttempts",
                        "liveAssemblyOpenSuccesses", "distinctLiveOpenedAssemblyPaths"):
              assert f'"{field}"' in api, field
          assert "mono_gc_collect(" not in cpp
          assert "mono_domain_unload(" not in cpp
          print("BUNNY_CSHARP_OPTIONAL_MONO_HEAP_AND_REUSE_TELEMETRY=PASS")
          PY

      - name: Verify CSharp memory snapshot and world lifecycle diagnostics
        shell: bash
        run: |
          set -euo pipefail
          ROOT="Split/Bunny-Loader"
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pthread \
            -I "$ROOT/app/src/main/cpp" \
            "$ROOT/tests/managed_memory_snapshot_smoke.cpp" \
            -o "$RUNNER_TEMP/managed-managed-heap"
          "$RUNNER_TEMP/managed-managed-heap"
          python3 - <<'PY'
          from pathlib import Path
          root=Path("Split/Bunny-Loader/app/src/main/cpp")
          runtime=(root/"experiments/csharp/ManagedRuntime.cpp").read_text()
          auto=(root/"experiments/csharp/AutoSourceRuntime.cpp").read_text()
          api=(root/"script/api/CSharpPrototypeApi.cpp").read_text()
          assert "ManagedMemoryStatus managedMemoryStatus(bool resetBaseline)" in runtime
          assert "readManagedProcMemory()" in runtime
          assert "g_sourceLiveEntries.size()" in runtime
          assert "g_memoryBaselineRssKb" in runtime
          assert "autoWorldLifecycleStatus()" in auto
          assert "g_worldLoads.fetch_add(1" in auto
          assert "g_worldExits.fetch_add(1" in auto
          assert "g_worldRebindSchedules.fetch_add(1" in auto
          assert 'sourceMemoryStatus' in api
          assert 'sourceMemoryBaseline' in api
          assert "JS_NewInt64(ctx, mem.rssKb)" in api
          assert "JS_NewInt32(ctx, mem.cachedAssemblyPaths)" in api
          print("BUNNY_CSHARP_MEMORY_LIFECYCLE_INTEGRATION=PASS")
          PY

      - name: Verify independent per-mod pause and world queue reset
        shell: bash
        run: |
          set -euo pipefail
          ROOT="Split/Bunny-Loader"
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pthread \
            -I "$ROOT/app/src/main/cpp" \
            "$ROOT/tests/managed_live_lifecycle_smoke.cpp" \
            -o "$RUNNER_TEMP/managed-live-lifecycle"
          "$RUNNER_TEMP/managed-live-lifecycle"
          python3 - <<'PY'
          from pathlib import Path
          root=Path("Split/Bunny-Loader/app/src/main/cpp/experiments/csharp")
          runtime=(root/"ManagedRuntime.cpp").read_text()
          ingress=(root/"ManagedLiveIngressQueue.h").read_text()
          auto=(root/"AutoSourceRuntime.cpp").read_text()
          assert "pauseBinding(int bindingSlot, std::atomic<int>& armedType)" in ingress
          assert "g_liveIngress.pauseBinding(i, entry.armedType)" in runtime
          assert "g_liveHitActiveBindingSlot" in runtime
          assert "pauseManagedLiveMod(" in runtime
          assert "g_worldEpoch.fetch_add(1" in auto
          assert "g_worldTransitionMutex" in auto
          assert "scheduleAutoLiveBindings()" in auto
          assert "g_liveBoundEpoch" in auto
          assert "if (context.gameMenu != 1 && context.netMode == 0) {" in auto
          assert "updateManagedNpcBuffDispatcherOnGameThread();" in auto
          assert "pauseManagedLiveHit();" in auto
          assert "bindLiveEventsOnWorld(id, type, work, epoch)" in auto
          assert "g_pendingLiveSpecs = std::move(bindings)" in auto
          assert "g_worldMenuPollFrames" in auto
          assert "resumeManagedLiveMod(" in runtime
          assert "entry.armedType.store(entry.type" in runtime
          api = Path("Split/Bunny-Loader/app/src/main/cpp/script/api/CSharpPrototypeApi.cpp").read_text()
          assert 'sourceLiveModResume' in api
          assert 'CONFIRM_RESUME_MOD' in api
          print("BUNNY_CSHARP_WORLD_EPOCH_AND_MOD_PAUSE_GUARDS=PASS")
          PY

      - name: Validate opt-in 25k MonoVM benchmark guards
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path("Split/Bunny-Loader/app/src/main/cpp")
          runtime=(root/"experiments/csharp/ManagedRuntime.cpp").read_text()
          header=(root/"experiments/csharp/ManagedRuntime.h").read_text()
          api=(root/"script/api/CSharpPrototypeApi.cpp").read_text()
          for token in [
              "managedBenchmarkProducer", "startManagedLiveBenchmark",
              "managedLiveBenchmarkStatus", "stopManagedLiveBenchmark",
              "g_liveHitQueue.push({tick, 18, (tick & 1) == 0})",
              "g_liveHitStatus.processed == ManagedLiveEventQueue::kEventLimit",
              "kBenchmarkTimeout = std::chrono::seconds(120)",
              "kBenchmarkInterval = std::chrono::microseconds(400)",
              "g_liveHitGeneration", "finishBenchmarkErrorLocked",
              'g_liveBenchmark.phase = "completed"',
              '"benchmark-timeout"', '"benchmark-cancelled"',
              "g_liveBenchmarkAttempted"
          ]:
              assert token in runtime, token
          assert "struct ManagedLiveBenchmarkStatus" in header
          assert "CONFIRM_25000_CSHARP_CALLBACKS" in api
          for function in [
              "sourceLiveBenchmarkStart", "sourceLiveBenchmarkStatus",
              "sourceLiveBenchmarkStop"
          ]:
              assert f'"{function}"' in api
          assert "mod.applied && mod.worldReady && mod.netMode == 0" in api
          print("BUNNY_CSHARP_REAL_MANAGED_BENCHMARK_GUARDS=PASS")
          PY

      - name: Verify opt-in gameplay performance telemetry
        shell: bash
        run: |
          python3 Split/Bunny-Loader/tests/run_managed_live_queue.py
          python3 - <<'PY'
          from pathlib import Path
          root=Path("Split/Bunny-Loader/app/src/main/cpp")
          runtime=(root/"experiments/csharp/ManagedRuntime.cpp").read_text()
          header=(root/"experiments/csharp/ManagedRuntime.h").read_text()
          queue=(root/"experiments/csharp/ManagedLiveEventQueue.h").read_text()
          cheats=(root/"menu/Cheats.cpp").read_text()
          api=(root/"script/api/CSharpPrototypeApi.cpp").read_text()
          for token in [
              "g_perfState", "g_perfUpdateBins", "g_perfQueueTotalUs",
              "g_perfCallbackTotalUs", "g_perfLockDropBaseline",
              "noteManagedLivePerfUpdate", "startManagedLivePerf",
              "managedLivePerfStatus", "stopManagedLivePerf",
              "kPerfDurationNs = 15000000000LL",
              "g_perfState.store(1, std::memory_order_release)",
              "g_perfCallbacks.fetch_add(1",
              "const std::string modId = binding ? binding->modId : g_liveHitStatus.modId",
              "const std::string dll = binding ? binding->assemblyPath : g_liveHitAssembly",
              "g_liveHitInFlight = true",
              "g_liveHitInFlight = false"
          ]:
              assert token in runtime, token
          assert "struct ManagedLivePerfStatus" in header
          assert "uint64_t enqueuedAtNs = 0" in queue
          assert "bl::csharp::noteManagedLivePerfUpdate();" in cheats
          for function in ("sourcePerfStart","sourcePerfStatus","sourcePerfStop"):
              assert f'"{function}"' in api
          assert "mod.applied && mod.worldReady && mod.netMode == 0" in api
          assert "g_liveHitType.load(std::memory_order_acquire)" in runtime
          assert "g_liveIngress.push(" in runtime
          assert "g_liveIngress.pop(&event)" in runtime
          assert "g_liveIngress.depth()" in runtime
          assert "ManagedLiveIngressQueue g_liveIngress" in runtime
          live_ingress = runtime.split("void queueManagedLiveEvent(", 1)[1].split("void queueManagedLiveHit(", 1)[0]
          assert "std::try_to_lock" not in live_ingress
          print("CSHARP_GAMEPLAY_PROFILER_AND_LOCK_GUARDS=PASS")
          PY

      - name: Verify real gameplay profiling extensions have safe sampling guards
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path("Split/Bunny-Loader/app/src/main/cpp")
          runtime=(root/"experiments/csharp/ManagedRuntime.cpp").read_text()
          header=(root/"experiments/csharp/ManagedRuntime.h").read_text()
          bridge=(root/"script/api/CSharpPrototypeApi.cpp").read_text()
          projectile=(root/"experiments/csharp/ManagedProjectileHook.cpp").read_text()
          for name in (
              "g_perfCallbackCpuTotalUs", "perfThreadCpuNs",
