          test -s "$APK"
          EXPECTED="84dd410f1054690cfb4bf6a74078c0bd2c92c7ee0ab431b345e0d5c84f353feb"
          echo "$EXPECTED  $APK" | sha256sum -c -
          OUT="$RUNNER_TEMP/bunny-mono-arm64/libmonosgen-2.0.so"
