name: ExampleMod CSharp Buffs and Minion fidelity (no APK)
on:
  push:
    branches: [qa/csharp-world-tree-gore-apk-20261024]
    paths:
      - 'samples/ExampleModCSharp/Playable/content/Content/Buffs/**'
      - 'tests/examplemod_buff_qa/**'
      - 'docs/csharp/examplemod-evidence.json'
      - 'docs/csharp/EXAMPLEMOD_COVERAGE.json'
      - 'docs/csharp/EXAMPLEMOD_COVERAGE.md'
      - '.github/workflows/check-examplemod-buff-qa.yml'
  pull_request:
    paths:
      - 'samples/ExampleModCSharp/Playable/content/Content/Buffs/**'
      - 'tests/examplemod_buff_qa/**'
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test original Playable buff contracts and localization
        run: dotnet run --project tests/examplemod_buff_qa/ExampleModBuffQa.csproj --configuration Release
      - name: Verify native minion refresh and buff slot policy
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -Wno-deprecated-declarations -Iapp/src/main/cpp tests/minion_buff/minion_buff_test.cpp app/src/main/cpp/experiments/csharp/SourceParser.cpp -o "$RUNNER_TEMP/buff-host"
          "$RUNNER_TEMP/buff-host"
      - name: Check pinned ExampleMod behavior evidence
        run: python3 tools/examplemod_coverage.py --check
