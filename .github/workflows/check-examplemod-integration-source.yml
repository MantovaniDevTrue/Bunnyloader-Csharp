name: ExampleMod CSharp integrated source tests — NO APK

on:
  push:
    branches:
      - integration/examplemod-csharp-source-20261022
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: examplemod-integrated-source
  cancel-in-progress: false

jobs:
  source-only:
    name: Managed SDK + source parity (no Android artifacts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check pinned source assets and code-level parity rules
        run: |
          python3 tools/example_completion/test_release_gate.py -v
          python3 tools/example_completion/check_assets.py
          python3 tests/basic_items/tile_parity/check_native_tile_flags.py
      - name: Compile real public Bunny CSharp SDK
        run: dotnet build experiments/csharp/BunnySourceSdk/BunnySourceSdk.csproj -c Release --nologo
      - name: Compile real managed source compiler
        run: dotnet build experiments/csharp/BunnySourceCompiler/BunnySourceCompiler.csproj -c Release --nologo
      - name: Existing native-item SDK regressions
        run: dotnet run --project tests/basic_items/ItemBatch.csproj -c Release
      - name: Source ExampleTile + item
        run: dotnet run --project tests/basic_items/tile_parity/TileParity.csproj -c Release
      - name: Staged placeable-item fidelity without incomplete tiles
        run: dotnet run --project tests/basic_items/placeable_stage/PlaceableStage.csproj -c Release

  native-host:
    name: Native bridge and tile/quest contracts (NO APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check merged native content and MonoVM source syntax
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -Wall -Wextra -Werror -pedantic -fsyntax-only \
            -I app/src/main/cpp -I tests/basic_items/include \
            -I "$JAVA_HOME/include" -I "$JAVA_HOME/include/linux" \
            app/src/main/cpp/experiments/csharp/AutoSourceRuntime.cpp \
            app/src/main/cpp/experiments/csharp/SourceLoader.cpp \
            app/src/main/cpp/experiments/csharp/NativeContent.cpp \
            app/src/main/cpp/experiments/csharp/ManagedRuntime.cpp
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Generate actual CSharp ExampleTile native wire for C++ contract
        run: dotnet run --project tests/basic_items/tile_parity/TileParity.csproj -c Release
      - name: Verify native tile flags against real compiled CSharp ExampleTile
        run: |
          set -euo pipefail
          g++ -std=c++20 -Wall -Wextra -Werror -pedantic -pthread \
            -I app/src/main/cpp tests/world_loaders/tile_flags_test.cpp \
            -o "$RUNNER_TEMP/native_tile_flags"
          "$RUNNER_TEMP/native_tile_flags" build/tile-parity/source-runtime-values.txt
      - name: Verify native wall and animation policies
        run: |
          set -euo pipefail
          for file in \
            tests/world_loaders/wall_runtime_test.cpp \
            tests/world_loaders/tile_animation_test.cpp; do
            exe="$RUNNER_TEMP/$(basename "${file%.cpp}")"
            g++ -std=c++20 -Wall -Wextra -Werror -pedantic -pthread \
              -I app/src/main/cpp -I tests/basic_items/include "$file" -o "$exe"
            "$exe"
          done
      - name: Execute AnglerQuest and CSharp rarity pure-native checks
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -Wall -Wextra -Werror -pedantic -pthread \
            -I app/src/main/cpp tests/angler_quest/quest_registry_test.cpp \
            -o "$RUNNER_TEMP/angler_registry"
          "$RUNNER_TEMP/angler_registry"
          g++ -std=c++20 -Wall -Wextra -Werror -pedantic -pthread \
            -I app/src/main/cpp tests/rarity_loader/native_rarity_color_test.cpp \
            -o "$RUNNER_TEMP/rarity_color"
          "$RUNNER_TEMP/rarity_color"
