name: ExampleMod Tree Gore integration (no APK)
on:
  pull_request:
    paths:
      - 'app/src/main/cpp/content/tiles/**'
      - 'app/src/main/cpp/experiments/csharp/**'
      - 'experiments/csharp/**'
      - 'samples/ExampleModCSharp/**'
      - 'tests/world_loaders/**'
      - 'tests/basic_items/**'
      - 'tools/csharp_contracts/**'
      - '.github/workflows/check-tree-gore-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile real ExampleMod and compare original tree assets
        run: dotnet run --project tests/basic_items/ItemBatch.csproj -c Release
      - name: Tree Gore and tile native policies, lifecycle and table publication
        run: bash tests/world_loaders/run.sh
      - name: Tree native table publication under ASan and UBSan
        run: |
          c++ -std=c++20 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -Iapp/src/main/cpp tests/world_loaders/table_publication_test.cpp -o /tmp/bunny-tree-gore-publication-asan
          /tmp/bunny-tree-gore-publication-asan
      - name: Preserve WorldNet lifecycle
        run: dotnet run --project experiments/csharp/BunnyWorldSystemsSmoke/BunnyWorldSystemsSmoke.csproj -c Release
      - name: Preserve Random and collision QA examples
        run: dotnet run --project tests/examplemod_pre_apk/ExampleModPreApk.csproj -c Release
      - name: Check generated SDK and source kinds
        run: |
          dotnet run --project tools/sdk_reference -c Release -- --check
          python3 tools/csharp_contracts/generate_content_kinds.py
          python3 -m unittest discover -s tools/csharp_contracts -p 'test_*.py' -q
