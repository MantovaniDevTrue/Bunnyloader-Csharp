name: CSharp content loader contract gate

on:
  push:
    paths:
      - 'tools/csharp_contracts/**'
      - 'experiments/csharp/BunnyCsSdk/BunnyContentDeclaration.cs'
      - 'experiments/csharp/BunnyCsSdk/BunnyContentKind.g.cs'
      - 'app/src/main/cpp/experiments/csharp/SourceParser.cpp'
      - 'app/src/main/cpp/experiments/csharp/SourceLoader.cpp'
      - 'app/src/main/cpp/experiments/csharp/SourceContentKinds.generated.h'
      - '.github/workflows/check-csharp-content-contracts.yml'
  pull_request:
    paths:
      - 'tools/csharp_contracts/**'
      - 'experiments/csharp/BunnyCsSdk/BunnyContentDeclaration.cs'
      - 'experiments/csharp/BunnyCsSdk/BunnyContentKind.g.cs'
      - 'app/src/main/cpp/experiments/csharp/SourceParser.cpp'
      - 'app/src/main/cpp/experiments/csharp/SourceLoader.cpp'
      - 'app/src/main/cpp/experiments/csharp/SourceContentKinds.generated.h'
      - '.github/workflows/check-csharp-content-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify all CSharp contract schemas and generated files
        run: |
          python3 -m unittest discover -s tools/csharp_contracts -p 'test_*.py' -v
          python3 tools/csharp_contracts/generate.py
          python3 tools/csharp_contracts/generate_content_kinds.py
      - name: Compile and run native CSharp SourceParser smoke
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -Iapp/src/main/cpp app/src/main/cpp/experiments/csharp/SourceParser.cpp tools/csharp_contracts/content_parser_smoke.cpp -o /tmp/bunny-csharp-content-contract-smoke
          /tmp/bunny-csharp-content-contract-smoke
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build SDK CSharp with stable content category ordinals
        run: dotnet build experiments/csharp/BunnyCsSdk/BunnyCsSdk.csproj -c Release --nologo
      - name: Check ExampleMod CSharp callback overrides
        run: python3 tools/csharp_contracts/verify_managed_callbacks.py
      - name: Validate managed SDK callback signatures by reflection
        run: dotnet run --project tools/csharp_contracts/CallbackContractProbe/CallbackContractProbe.csproj -c Release --no-launch-profile -- tools/csharp_contracts/managed_callbacks.json
      - name: Verify native managed-entity bind result handling
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -Iapp/src/main/cpp tools/csharp_contracts/entity_bind_smoke.cpp -o /tmp/bunny-entity-bind-smoke
          /tmp/bunny-entity-bind-smoke
      - name: Validate projectile collision hook field bindings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('app/src/main/cpp/experiments/csharp/ManagedProjectileHook.cpp').read_text()
          assert 'nativeFieldContract(projectile,"tileCollide"' in source
          assert 'g_tileCollideOffset' in source
          assert 'g_tileCollisionNetMode' in source
          assert 'game.proj.tileCollide' not in source
          PY
      - name: Verify native projectile collision decision
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -Iapp/src/main/cpp tools/csharp_contracts/tile_collision_smoke.cpp -o /tmp/bunny-tile-collision-smoke
          /tmp/bunny-tile-collision-smoke
      - name: Build managed source compiler with collision metadata
        run: dotnet build experiments/csharp/BunnySourceCompiler/BunnySourceCompiler.csproj -c Release --nologo
      - name: Execute compiled BunnyProjectile collision metadata probe
        run: dotnet run --project tools/csharp_contracts/TileCollisionMetadataProbe/TileCollisionMetadataProbe.csproj -c Release --no-launch-profile
      - name: Compile and run managed entity lifecycle callbacks
        run: dotnet run --project tools/csharp_contracts/EntityLifecycleProbe/EntityLifecycleProbe.csproj -c Release --no-launch-profile
