name: CSharp content loader contract gate

on:
  push:
    paths:
      - 'tools/csharp_contracts/**'
      - 'experiments/csharp/BunnyCsSdk/BunnyContentDeclaration.cs'
      - 'experiments/csharp/BunnyCsSdk/BunnyContentKind.g.cs'
      - 'app/src/main/cpp/experiments/csharp/SourceParser.cpp'
      - 'app/src/main/cpp/experiments/csharp/SourceLoader.cpp'
      - 'app/src/main/cpp/experiments/csharp/SourceContentKinds.generated.h'
      - '.github/workflows/check-csharp-content-contracts.yml'
  pull_request:
    paths:
      - 'tools/csharp_contracts/**'
      - 'experiments/csharp/BunnyCsSdk/BunnyContentDeclaration.cs'
      - 'experiments/csharp/BunnyCsSdk/BunnyContentKind.g.cs'
      - 'app/src/main/cpp/experiments/csharp/SourceParser.cpp'
      - 'app/src/main/cpp/experiments/csharp/SourceLoader.cpp'
      - 'app/src/main/cpp/experiments/csharp/SourceContentKinds.generated.h'
      - '.github/workflows/check-csharp-content-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify all CSharp contract schemas and generated files
        run: |
          python3 -m unittest discover -s tools/csharp_contracts -p 'test_*.py' -v
          python3 tools/csharp_contracts/generate.py
          python3 tools/csharp_contracts/generate_content_kinds.py
      - name: Compile and run native CSharp SourceParser smoke
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -Iapp/src/main/cpp app/src/main/cpp/experiments/csharp/SourceParser.cpp tools/csharp_contracts/content_parser_smoke.cpp -o /tmp/bunny-csharp-content-contract-smoke
          /tmp/bunny-csharp-content-contract-smoke
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build SDK CSharp with stable content category ordinals
        run: dotnet build experiments/csharp/BunnyCsSdk/BunnyCsSdk.csproj -c Release --nologo
