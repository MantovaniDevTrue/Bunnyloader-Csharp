name: Check managed callback lifecycle
on:
  push:
    branches: [feat/csharp-summon-lifecycle-v95, feat/csharp-94-owned-summon-damage-lot, feat/csharp-owned-loaders-v93, feat/csharp-owned-recipe-loader-v92, feat/csharp-loader-foundation-v91, feat/csharp-buff-recipes-v90, fix/csharp-90-2-recipegroup-real-instance-abi, fix/csharp-90-3-recipegroup-return-contract, feat/csharp-native-recipe-groups-v89, fix/csharp-88-8-lights-review, codex/lot-a-complete-v90-29, csharp-managed-lifecycle-v79-1-experiment]
  pull_request:
    paths:
      - 'Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/**'
      - 'Split/Bunny-Loader/tests/**'
      - '.github/workflows/check-managed-lifecycle-regressions.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run callback lifecycle and failure isolation tests
        run: python3 Split/Bunny-Loader/tests/run_managed_lifecycle_regressions.py

