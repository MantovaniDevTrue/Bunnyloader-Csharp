name: Check managed callback lifecycle
on:
  push:
    branches: [codex/csharp-v79-lifecycle-foundation]
  pull_request:
    paths:
      - 'Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/**'
      - 'Split/Bunny-Loader/tests/**'
      - '.github/workflows/check-managed-lifecycle-regressions.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run callback lifecycle and failure isolation tests
        run: python3 Split/Bunny-Loader/tests/run_managed_lifecycle_regressions.py
