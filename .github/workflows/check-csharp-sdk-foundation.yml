name: Check CSharp SDK and continuous runtime foundation
on:
  push:
    branches: [feat/csharp-summon-lifecycle-v95, feat/csharp-94-owned-summon-damage-lot, feat/csharp-owned-loaders-v93, feat/csharp-owned-recipe-loader-v92, feat/csharp-loader-foundation-v91, feat/csharp-buff-recipes-v90, fix/csharp-90-2-recipegroup-real-instance-abi, fix/csharp-90-3-recipegroup-return-contract, feat/csharp-native-recipe-groups-v89, fix/csharp-88-8-lights-review, codex/csharp-sdk-runtime-foundation, codex/csharp-lights-fidelity-v90-29-88, codex/csharp-lights-night-hotfix, codex/csharp-lights-sdk-settings-split]
  pull_request:
    paths:
      - 'Split/Bunny-Loader/experiments/csharp/**'
      - 'Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/**'
      - 'Split/Bunny-Loader/samples/StarterModCSharp/**'
      - 'Split/Bunny-Loader/samples/DeclaredContentCSharp/**'
      - 'Split/Bunny-Loader/samples/NativeAccessoryCSharp/**'
      - 'Split/Bunny-Loader/samples/ArmorPoliciesCSharp/**'
      - 'Split/Bunny-Loader/tests/**'
      - 'Split/Bunny-Loader/tools/create_csharp_mod.py'
      - 'Split/Bunny-Loader/tools/sdk_reference/**'
      - 'Split/Bunny-Loader/docs/generated/sdk_public_reference.*'
      - '.github/workflows/check-csharp-sdk-foundation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  managed-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile inherited content, cache corruption and reference invalidation
        working-directory: Split/Bunny-Loader
        run: dotnet run --project tests/sdk_foundation/SdkFoundation.csproj -c Release
      - name: Verify pure CSharp NPC and projectile lifecycle registries
        working-directory: Split/Bunny-Loader
        run: dotnet run --project tests/entity_lifecycle/EntityLifecycle.csproj -c Release
      - name: Verify MonoVM source NPC/projectile AI dispatcher
        working-directory: Split/Bunny-Loader
        run: dotnet run --project tests/entity_source/EntitySource.csproj -c Release
      - name: Recheck existing complete item package and native wire
        working-directory: Split/Bunny-Loader
        run: |
          dotnet run --project tests/basic_items/ItemBatch.csproj -c Release
          bash tests/projectile_policy/run.sh
          python3 tests/basic_items/check_full_wire.py build/basic-items/full-source-runtime-values.txt
          python3 tests/test_csharp_native_defense_policy.py
          python3 tests/run_native_equip_effects.py build/basic-items/full-source-runtime-values.txt build/sdk-foundation/native-accessory-wire.txt
          python3 tests/run_native_armor_policies.py build/basic-items/armor-source-runtime-values.txt
          python3 tests/run_native_item_policies.py build/basic-items/full-source-runtime-values.txt samples/ExampleModCSharp/Playable
          python3 tests/test_csharp_no_javascript_dependency.py
      - name: Verify typed damage hook isolation and language-specific editor help
        working-directory: Split/Bunny-Loader
        run: |
          dotnet run --project tests/hooks/HookBatch.csproj -c Release
          python3 tests/test_csharp_hook_editor_counters.py
      - name: Verify experimental universal hook CSharp API and original lifetime
        working-directory: Split/Bunny-Loader
        run: |
          mkdir -p build/universal-hooks
          g++ -std=c++20 -shared -fPIC tests/universal_hooks/sdk_native_mock.cpp -o build/universal-hooks/libbunny.so
          LD_LIBRARY_PATH="$PWD/build/universal-hooks" dotnet run --project tests/universal_hooks/UniversalHooks.csproj -c Release
      - name: Verify native access API, structs and batched reads
        working-directory: Split/Bunny-Loader
        run: |
          mkdir -p build/native-access
          g++ -std=c++20 -shared -fPIC -I app/src/main/cpp tests/native_access/sdk_mock.cpp -o build/native-access/libbunny.so
          LD_LIBRARY_PATH="$PWD/build/native-access" dotnet run --project tests/native_access/NativeAccess.csproj -c Release
          python3 tools/package_native_access_probe.py build/native-access/NativeAccessProbeCSharp-v0.1.0.bmod
      - name: Build optional desktop starter project
        working-directory: Split/Bunny-Loader
        run: |
          dotnet build samples/StarterModCSharp/StarterMod.csproj -c Release
          dotnet build samples/NativeAccessoryCSharp/NativeAccessory.csproj -c Release
          dotnet build samples/ArmorPoliciesCSharp/ArmorPolicies.csproj -c Release
      - name: Check generated public SDK reference
        working-directory: Split/Bunny-Loader
        run: dotnet run --project tools/sdk_reference/SdkReference.csproj -c Release -- --check
      - name: Verify independent source package and generator
        working-directory: Split/Bunny-Loader
        run: |
          python3 tests/test_create_csharp_mod.py
          python3 tests/test_csharp_independent_mod_loading.py
          python3 samples/ExampleModCSharp/Tests/check_examples.py
  native-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run continuous million-event queue, live dispatch and hurt deadlines
        working-directory: Split/Bunny-Loader
        run: |
          python3 tests/run_csharp_foundation.py
          python3 tests/run_csharp_independent_loading.py
          python3 tests/test_csharp_startup_visual_hotpath.py
          python3 tests/test_csharp_idle_tooltip_and_cache_io.py
      - name: Verify universal void hooks and caller-thread original rendezvous
        working-directory: Split/Bunny-Loader
        run: python3 tests/run_universal_hooks.py
      - name: Verify native access on caller thread and scoped values
        working-directory: Split/Bunny-Loader
        run: python3 tests/run_native_access.py
      - name: Recheck callback lifecycle and fault isolation
        working-directory: Split/Bunny-Loader
        run: python3 tests/run_managed_lifecycle_regressions.py
      - name: Recheck Mono GC transitions and signal ownership
        working-directory: Split/Bunny-Loader
        run: |
          python3 tests/run_managed_pinned_gc.py
          python3 tests/run_managed_signal_ownership.py
