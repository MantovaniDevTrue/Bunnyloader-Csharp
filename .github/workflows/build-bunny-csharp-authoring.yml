name: Build Bunny CSharp-Only Authored Mod

on:
  push:
    branches:
      - bunny-csharp-nativeaot-0.1.10.6-csharp-authoring
    paths:
      - ".github/workflows/build-bunny-csharp-authoring.yml"
      - "Split/Bunny-Loader/experiments/csharp/**"
      - "Split/Bunny-Loader/samples/ExampleCSharpOnlyMod/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install NativeAOT Android toolchain
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;30.0.16248370"

      - name: Build managed CSharp content descriptor
        shell: bash
        run: |
          set -euo pipefail
          MOD="Split/Bunny-Loader/experiments/csharp/ExampleCSharpMod/ExampleCSharpMod.csproj"
          dotnet build "$MOD" -c Release -p:PublishAot=false
          test -s "Split/Bunny-Loader/experiments/csharp/ExampleCSharpMod/bin/Release/net10.0/mod.dll"

      - name: Build external NativeAOT mod
        shell: bash
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/30.0.16248370"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export ANDROID_NDK_ROOT="$NDK"
          export ANDROID_NDK_HOME="$NDK"
          export PATH="$TOOLCHAIN:$PATH"
          PROJECT="Split/Bunny-Loader/experiments/csharp/ExampleCSharpMod/ExampleCSharpMod.csproj"
          dotnet publish "$PROJECT" -c Release -r linux-bionic-arm64 \
              -p:PublishAot=true -p:PublishAotUsingRuntimePack=true \
              -p:DisableUnsupportedError=true
          PUB="$(find Split/Bunny-Loader/experiments/csharp/ExampleCSharpMod/bin/Release -type d -path '*linux-bionic-arm64/publish' | head -n 1)"
          test -n "$PUB"
          MODSO="$(find "$PUB" -maxdepth 1 -type f \( -name 'mod.so' -o -name 'libmod.so' \) | head -n 1)"
          test -n "$MODSO"
          readelf -Ws "$MODSO" | grep -q bunny_mod_abi_version
          readelf -Ws "$MODSO" | grep -q bunny_mod_bind_projectile
          readelf -Ws "$MODSO" | grep -q bunny_mod_bind_npc
          readelf -Ws "$MODSO" | grep -q bunny_mod_npc_combat_tick
          echo "BUNNY_NATIVE_LIBRARY=$MODSO" >> "$GITHUB_ENV"

      - name: Generate Bunny package from CSharp source only
        shell: bash
        run: |
          set -euo pipefail
          S="Split/Bunny-Loader"
          test -z "$(find "$S/samples/ExampleCSharpOnlyMod" -type f -name '*.js' -print -quit)"
          mkdir -p "$RUNNER_TEMP/release"
          dotnet run --project "$S/experiments/csharp/BunnyCsPackager/BunnyCsPackager.csproj" -c Release -- \
            "$S/experiments/csharp/ExampleCSharpMod/bin/Release/net10.0/mod.dll" \
            "$BUNNY_NATIVE_LIBRARY" \
            "$S/samples/ExampleCSharpOnlyMod/Assets" \
            "$RUNNER_TEMP/release/ExampleCSharpMod-v0.1.6.bmod"
          python3 - "$RUNNER_TEMP/release/ExampleCSharpMod-v0.1.6.bmod" <<'PY'
          import json,sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              names=set(z.namelist())
              manifest=json.loads(z.read("manifest.json"))
              assert manifest["version"]=="0.1.6",manifest
              assert manifest["uid"]=="7f1d6115-6c2c-4a86-bb1e-5ca7d9a21f10"
              assert "native/arm64-v8a/libmod.so" in names
              assert "content/main.js" in names
              assert "content/Content/Projectiles/NativeHomingBolt.js" in names
              assert "content/Content/Projectiles/NativeSlimeOrb.js" in names
              assert "content/Content/Items/Weapons/NativeHomingWand.js" in names
              assert "content/Content/Items/Consumables/NativePhaseSlimeBeacon.js" in names
              assert "content/Content/NPCs/NativePhaseSlime.js" in names
              npc=z.read("content/Content/NPCs/NativePhaseSlime.js").decode()
              assert "GetProjectileSource_Item" in npc
              assert "GetSource_FromAI" not in npc
              assert len([p for p in names if p.endswith(".png")])==9
              assert len([p for p in names if p.endswith(".js")])==10
              print("CSHARP_AUTHORING_PACKAGE_VALID=YES")
          PY
          cd "$RUNNER_TEMP/release"
          sha256sum ExampleCSharpMod-v0.1.6.bmod > ExampleCSharpMod-v0.1.6.bmod.sha256

      - name: Publish CSharp-authored mod
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create bunny-csharp-authoring-v1 \
            "$RUNNER_TEMP/release/ExampleCSharpMod-v0.1.6.bmod" \
            "$RUNNER_TEMP/release/ExampleCSharpMod-v0.1.6.bmod.sha256" \
            --repo "${{ github.repository }}" \
            --target "$GITHUB_SHA" \
            --title "ExampleCSharpMod 0.1.6 — CSharp-only authoring" \
            --notes "First C#-only authoring experiment. All item, NPC, projectile and recipe registrations come from ContentDefinition.cs and are compiled to internal Bunny compatibility scripts automatically. NativeAOT gameplay logic and Host API 1 remain unchanged. Use Bunny C# Test APK 0.1.10.5; no APK reinstall needed. JavaScript is generated inside the .bmod, not written by the developer. Runtime gameplay behavior still requires on-device testing, especially NPC combat." \
            --prerelease
