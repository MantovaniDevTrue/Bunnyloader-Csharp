name: CloudLoader CSharp source-only tests (NO APK)

on:
  push:
    branches:
      - feature/csharp-cloudloader-source-only-20261021
    paths:
      - app/src/main/cpp/experiments/csharp/NativeCloudSelection.h
      - app/src/main/cpp/experiments/csharp/NativeCloudRegistry.h
      - app/src/main/cpp/experiments/csharp/NativeCloudAssets.h
      - app/src/main/cpp/experiments/csharp/NativeCloudAssets.cpp
      - app/src/main/cpp/experiments/csharp/NativeCloudManifest.h
      - app/src/main/cpp/experiments/csharp/NativeCloudSpawnLedger.h
      - app/src/main/cpp/experiments/csharp/NativeCloudHookBindings.h
      - app/src/main/cpp/experiments/csharp/NativeCloudHookBindings.cpp
      - app/src/main/cpp/experiments/csharp/NativeCloudHooks.h
      - app/src/main/cpp/experiments/csharp/NativeCloudHooks.cpp
      - app/src/main/cpp/experiments/csharp/NativeCloudRollCoordinator.h
      - app/src/main/cpp/experiments/csharp/NativeCloudWeightWire.h
      - app/src/main/cpp/experiments/csharp/NativeCloudAutoload.h
      - app/src/main/cpp/experiments/csharp/NativeCloudAutoload.cpp
      - app/src/main/cpp/experiments/csharp/NativeCloudIdPlan.h
      - app/src/main/cpp/experiments/csharp/NativeCloudIdProbe.h
      - app/src/main/cpp/experiments/csharp/NativeCloudIdProbe.cpp
      - app/src/main/cpp/experiments/csharp/ManagedRuntime.cpp
      - app/src/main/cpp/experiments/csharp/ManagedRuntime.h
      - tests/cloud_loader/**
      - experiments/csharp/BunnyCsSdk/BunnyCloud.cs
      - experiments/csharp/BunnyCsSdk/BunnyCloudDispatcher.cs
      - app/src/main/cpp/experiments/csharp/SourceParser.cpp
      - app/src/main/cpp/experiments/csharp/SourceLoader.cpp
      - app/src/main/cpp/experiments/csharp/SourceContentIdentity.h
      - experiments/csharp/BunnySourceSdk/BunnySourceSdk.csproj
      - experiments/csharp/BunnySourceCompiler/CompiledAssemblyProbe.cs
      - .github/workflows/check-csharp-cloudloader-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-policy-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET 8 for managed cloud API test (no Android SDK)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Compile and execute managed CSharp cloud examples
        run: dotnet run --project tests/cloud_loader/CloudContractTests.csproj -c Release
      - name: Build integrated source-only BunnySourceSdk project
        run: dotnet build experiments/csharp/BunnySourceSdk/BunnySourceSdk.csproj -c Release
      - name: Cloud runtime must fail closed until Android hooks are installed
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Reason=NativeCloudHooksAndMasksNotInstalled' app/src/main/cpp/experiments/csharp/SourceLoader.cpp
          grep -q 'base == "BunnyCloud"' app/src/main/cpp/experiments/csharp/SourceParser.cpp
          grep -q 'PNGOnly=' app/src/main/cpp/experiments/csharp/SourceLoader.cpp
          grep -q 'appendNativeCloudAutoload' app/src/main/cpp/experiments/csharp/SourceLoader.cpp
      - name: GCC strict regression (no Android SDK or APK)
        run: bash tests/cloud_loader/run_native.sh
      - name: Type-check native Android IL2CPP cloud installer without SDK or APK
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++20 -Wall -Wextra -Werror -pedantic -fsyntax-only \
            -Iapp/src/main/cpp \
            app/src/main/cpp/experiments/csharp/NativeCloudAssets.cpp
          clang++ -std=c++20 -Wall -Wextra -Werror -pedantic -fsyntax-only \
            -Iapp/src/main/cpp \
            app/src/main/cpp/experiments/csharp/NativeCloudHookBindings.cpp
          clang++ -std=c++20 -Wall -Wextra -Werror -pedantic -fsyntax-only \
            -Iapp/src/main/cpp \
            app/src/main/cpp/experiments/csharp/NativeCloudHooks.cpp
          clang++ -std=c++20 -Wall -Wextra -Werror -pedantic -fsyntax-only \
            -Iapp/src/main/cpp \
            app/src/main/cpp/experiments/csharp/NativeCloudIdProbe.cpp
          clang++ -std=c++20 -Wall -Wextra -Werror -pedantic -fsyntax-only \
            -Iapp/src/main/cpp \
            app/src/main/cpp/experiments/csharp/SourceLoader.cpp
          g++ -std=c++20 -Wall -Wextra -Werror -pedantic -fsyntax-only \
            -Iapp/src/main/cpp \
            app/src/main/cpp/experiments/csharp/NativeCloudAssets.cpp
          g++ -std=c++20 -Wall -Wextra -Werror -pedantic -fsyntax-only \
            -Iapp/src/main/cpp \
            app/src/main/cpp/experiments/csharp/NativeCloudHookBindings.cpp
          g++ -std=c++20 -Wall -Wextra -Werror -pedantic -fsyntax-only \
            -Iapp/src/main/cpp \
            app/src/main/cpp/experiments/csharp/NativeCloudHooks.cpp
          g++ -std=c++20 -Wall -Wextra -Werror -pedantic -fsyntax-only \
            -Iapp/src/main/cpp \
            app/src/main/cpp/experiments/csharp/NativeCloudIdProbe.cpp
          g++ -std=c++20 -Wall -Wextra -Werror -pedantic -fsyntax-only \
            -Iapp/src/main/cpp \
            app/src/main/cpp/experiments/csharp/SourceLoader.cpp
      - name: Type-check actual pinned MonoVM runtime (source only)
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++20 -fno-exceptions -fno-rtti -Wall -Wextra -fsyntax-only \
            -Iapp/src/main/cpp \
            app/src/main/cpp/experiments/csharp/ManagedRuntime.cpp
          g++ -std=c++20 -fno-exceptions -fno-rtti -Wall -Wextra -fsyntax-only \
            -Iapp/src/main/cpp \
            app/src/main/cpp/experiments/csharp/ManagedRuntime.cpp
      - name: Clang ASan and UBSan regression
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          for file in tests/cloud_loader/*_test.cpp; do
            extras=()
            if [[ "${file##*/}" == "source_parser_cloud_test.cpp" ]]; then
              extras+=(app/src/main/cpp/experiments/csharp/SourceParser.cpp)
            fi
            if [[ "${file##*/}" == "native_cloud_autoload_test.cpp" ]]; then
              extras+=(app/src/main/cpp/experiments/csharp/NativeCloudAutoload.cpp)
            fi
            clang++ -std=c++20 -g -O1 -Wall -Wextra -Werror -pedantic \
              -fsanitize=address,undefined -fno-omit-frame-pointer \
              -Iapp/src/main/cpp "$file" "${extras[@]}" -o "$tmp/test"
            "$tmp/test"
          done
