# TEMPORARIO (remover antes do merge): publica no PR #181 um resumo da saida
# dos passos que falham, porque os logs de Actions nao sao acessiveis da sessao
# de desenvolvimento.
name: TEMP diagnose PR 181
on:
  push:
    branches: [integrate/globalitem-pr100-20261026]
permissions:
  contents: read
  pull-requests: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Run failing commands and summarize
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          report=/tmp/report.md
          echo "Diagnostico temporario (commit ${GITHUB_SHA:0:8})" > $report
          run() {
            local label="$1"; shift
            "$@" > "/tmp/$label.log" 2>&1
            local rc=$?
            echo "" >> $report
            echo "### $label rc=$rc" >> $report
            if [ $rc -ne 0 ]; then
              echo '```' >> $report
              grep -v "warning CS\|warning NETSDK\|^\s*$" "/tmp/$label.log" | grep -i -B2 -A3 "fail\|error\|exception\|assert\|expected\|missing\|stale\|abort" | head -n 60 | cut -c1-400 >> $report
              echo '--- fim do log ---' >> $report
              grep -v "warning CS\|warning NETSDK\|^\s*$" "/tmp/$label.log" | tail -n 15 | cut -c1-400 >> $report
              echo '```' >> $report
            fi
          }
          run prefix-fixture dotnet build tests/prefix_v89/PrefixFixture/PrefixFixture.csproj -c Release -p:NuGetAudit=false
          run global-fixture dotnet build tests/prefix_v89/GlobalOnlyFixture/GlobalOnlyFixture.csproj -c Release -p:NuGetAudit=false
          run prefix-contract dotnet run --project tests/prefix_v89/PrefixContract.csproj -c Release -p:NuGetAudit=false -- "$(pwd)/tests/prefix_v89/PrefixFixture/bin/Release/net8.0/PrefixFixture.dll" "$(pwd)/tests/prefix_v89/GlobalOnlyFixture/bin/Release/net8.0/GlobalOnlyFixture.dll"
          echo "" >> $report; echo "### prefix-contract tail" >> $report; echo '```' >> $report; tail -n 40 /tmp/prefix-contract.log | cut -c1-400 >> $report; echo '```' >> $report
          run playable-rarity dotnet run --project tests/rarity_loader/PlayableRarity.csproj --configuration Release
          run item-batch dotnet run --project tests/basic_items/ItemBatch.csproj -c Release
          echo "" >> $report; echo "### item-batch falhas" >> $report; echo '```' >> $report
          python3 -c "import json;d=json.load(open('build/basic-items-results.json'));[print(r['id'],'::',r['error'][:700].replace(chr(10),' | ')) for r in d['results'] if r['status']!='pass']" >> $report 2>&1
          echo '```' >> $report
          run full-example dotnet run --project tests/ready_prs/FullExampleRuntime/FullExampleRuntime.csproj -c Release -- samples/ExampleModCSharp/Playable
          run full-wire python3 tests/basic_items/check_full_wire.py build/basic-items/full-source-runtime-values.txt
          run sdk-reference dotnet run --project tools/sdk_reference/SdkReference.csproj -c Release -- --check
          NDK=$(find "${ANDROID_HOME}/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          echo "NDK=$NDK" >> $report
          for src in ManagedPrefixBridge.cpp ManagedPrefixGameplay.cpp SourceLoader.cpp NativeDamageClassHooks.cpp; do
            run arm64-$src "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" --target=aarch64-linux-android26 -std=c++20 -fPIC -O0 -Wall -Wextra -Werror -Iapp/src/main/cpp -c app/src/main/cpp/experiments/csharp/$src -o /tmp/$src.o
          done
          gh pr comment 181 --repo "$GITHUB_REPOSITORY" --body-file $report
          exit 0
