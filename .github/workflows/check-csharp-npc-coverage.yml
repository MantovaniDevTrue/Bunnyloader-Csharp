name: Check CSharp NPC API coverage
on:
  workflow_dispatch:
  push:
    branches:
      - bunny-csharp-source-0.1.10.16.44-npc-coverage
    paths:
      - '.github/workflows/check-csharp-npc-coverage.yml'
      - 'Split/Bunny-Loader/samples/ExampleMod/content/Content/NPCs/**'
      - 'Split/Bunny-Loader/samples/ExampleMod/content/Common/GlobalNPCs/**'
      - 'Split/Bunny-Loader/samples/ExampleModCSharp/**'
      - 'Split/Bunny-Loader/experiments/csharp/BunnyCsSdk/**'
      - 'Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/SourceLoader.cpp'
      - 'Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/NativeContent.cpp'

permissions:
  contents: read

jobs:
  npc-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Verify ExampleModBunny NPC method inventory and CSharp status
        run: |
          cd Split/Bunny-Loader
          python3 samples/ExampleModCSharp/Tests/check_npc_coverage.py
          python3 samples/ExampleModCSharp/Tests/check_npc_coverage.py --json | tee npc-coverage-result.json
      - name: Add results to workflow summary
        if: always()
        run: |
          if test -f Split/Bunny-Loader/npc-coverage-result.json; then
            echo '### NPC API coverage status (.43 reference baseline)' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat Split/Bunny-Loader/npc-coverage-result.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
