name: Build Bunny Loader 0.1.9.6 Private

on:
  push:
    branches:
      - bunny-upstream-latest-icons
    paths:
      - ".github/workflows/build-bunny-stable-v0196-private.yml"
      - "Split/Bunny-Loader/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bunny-stable-v0196
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PRIVATE_REPO: MantovaniDevTrue/Bunnyloader-Csharp-Builds
      INPUT_TAG: bunny-private-build-inputs-v1
      RUNTIME_ASSET: BunnyRuntime_Terraria_1.4.5.8.6.zip
      RUNTIME_SHA256: 2eb8d02dea144cb2fff6a27b94cc371e50ffd9aa44ba4dcd123337691a54c0ab
      SPRITE_APK: BunnyLoader-v0.1.9.1-MusicPrewarm.apk
      SPRITE_APK_SHA256: aaf7c46046e776a966122d7f4e26469ebb72ad2fc21f0c6e57f98189e0c93c00

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;30.0.16248370" "cmake;3.22.1"

      - name: Ensure QuickJS
        shell: bash
        run: |
          set -euo pipefail
          rm -rf Split/Bunny-Loader/app/src/main/cpp/third_party/quickjs
          git clone --depth 1 --branch v0.17.0 https://github.com/quickjs-ng/quickjs.git Split/Bunny-Loader/app/src/main/cpp/third_party/quickjs

      - name: Configure Maven mirror
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("Split/Bunny-Loader/settings.gradle.kts")
          s = p.read_text()
          s = s.replace("mavenCentral()", 'maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2") }')
          p.write_text(s)
          PY

      - name: Download private build inputs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BUNNY_PRIVATE_BUILD_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}"
          test "$(gh api "repos/$PRIVATE_REPO" --jq '.private')" = "true"
          INPUT_DIR="$RUNNER_TEMP/bunny-inputs"
          mkdir -p "$INPUT_DIR"
          gh release download "$INPUT_TAG" --repo "$PRIVATE_REPO" --pattern "$RUNTIME_ASSET" --dir "$INPUT_DIR"
          gh release download "$INPUT_TAG" --repo "$PRIVATE_REPO" --pattern "$SPRITE_APK" --dir "$INPUT_DIR"
          echo "$RUNTIME_SHA256  $INPUT_DIR/$RUNTIME_ASSET" | sha256sum -c -
          echo "$SPRITE_APK_SHA256  $INPUT_DIR/$SPRITE_APK" | sha256sum -c -

      - name: Integrate Terraria runtime
        shell: bash
        run: |
          set -euo pipefail
          INPUT_DIR="$RUNNER_TEMP/bunny-inputs"
          TMP="$RUNNER_TEMP/bunny-runtime"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$INPUT_DIR/$RUNTIME_ASSET" -d "$TMP"
          JNI="Split/Bunny-Loader/app/src/main/jniLibs/arm64-v8a"
          ASSETS="Split/Bunny-Loader/terraria1456_assets/src/main/assets"
          mkdir -p "$JNI" "$ASSETS/bin"
          cp "$TMP/lib/arm64-v8a/libil2cpp.so" "$JNI/"
          cp "$TMP/lib/arm64-v8a/libunity.so" "$JNI/"
          cp "$TMP/lib/arm64-v8a/libmain.so" "$JNI/"
          cp "$TMP/lib/arm64-v8a/libc++_shared.so" "$JNI/"
          rm -rf "$ASSETS/bin/Data"
          cp -a "$TMP/assets/bin/Data" "$ASSETS/bin/Data"

      - name: Restore vanilla sprites
        shell: bash
        run: |
          set -euo pipefail
          INPUT_DIR="$RUNNER_TEMP/bunny-inputs"
          TMP="$RUNNER_TEMP/bunny-sprites"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$INPUT_DIR/$SPRITE_APK" "assets/sprites/*" -d "$TMP"
          ROOT="Split/Bunny-Loader/_sprites"
          rm -rf "$ROOT/item" "$ROOT/npc" "$ROOT/buff"
          mkdir -p "$ROOT"
          cp -a "$TMP/assets/sprites/item" "$ROOT/"
          cp -a "$TMP/assets/sprites/npc" "$ROOT/"
          cp -a "$TMP/assets/sprites/buff" "$ROOT/"

      - name: Rebuild CheatBridge dex
        working-directory: Split/Bunny-Loader
        shell: bash
        run: |
          set -euo pipefail
          OUT=".cheatbridge"
          AJAR="$ANDROID_HOME/platforms/android-34/android.jar"
          D8="$ANDROID_HOME/build-tools/34.0.0/d8"
          rm -rf "$OUT"
          mkdir -p "$OUT/classes"
          javac -source 8 -target 8 -nowarn -encoding UTF-8 -classpath "$AJAR" -d "$OUT/classes" \
            tools/cheatbridge/bunny/CheatBridge.java \
            tools/cheatbridge/bunny/CheatData.java \
            tools/cheatbridge/bunny/DevTools.java
          mapfile -t CLASSES < <(find "$OUT/classes" -name "*.class" -type f)
          "$D8" --release --min-api 26 --lib "$AJAR" --output "$OUT" "${CLASSES[@]}"
          python3 tools/bin2header.py "$OUT/classes.dex" bl_cheatbridge_dex > app/src/main/cpp/menu/CheatBridgeDex.h

      - name: Build with v3 signing
        working-directory: Split/Bunny-Loader
        shell: bash
        env:
          BUNNY_KEYSTORE_B64: ${{ secrets.BUNNY_KEYSTORE_B64 }}
          BUNNY_SIGNING_PASSWORD: ${{ secrets.BUNNY_SIGNING_PASSWORD }}
          BUNNY_SIGNING_ALIAS: ${{ secrets.BUNNY_SIGNING_ALIAS }}
        run: |
          set -euo pipefail
          test -n "${BUNNY_KEYSTORE_B64:-}"
          test -n "${BUNNY_SIGNING_PASSWORD:-}"
          test -n "${BUNNY_SIGNING_ALIAS:-}"
          umask 077
          mkdir -p "$RUNNER_TEMP/bunny-v3"
          export BUNNY_SIGNING_STORE="$RUNNER_TEMP/bunny-v3/bunny-v3.jks"
          trap 'rm -f "$BUNNY_SIGNING_STORE"' EXIT
          printf '%s' "$BUNNY_KEYSTORE_B64" | base64 --decode > "$BUNNY_SIGNING_STORE"
          keytool -list -keystore "$BUNNY_SIGNING_STORE" -storepass:env BUNNY_SIGNING_PASSWORD -alias "$BUNNY_SIGNING_ALIAS" >/dev/null
          unset BUNNY_KEYSTORE_B64
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Validate APK
        shell: bash
        run: |
          set -euo pipefail
          APK="Split/Bunny-Loader/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -c -v 4 "$APK"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libbunny.so"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libil2cpp.so"
          unzip -l "$APK" | grep -q "assets/bin/Data/Managed/Metadata/global-metadata.dat"
          ITEM_SPRITES="$(unzip -l "$APK" | grep -Ec 'assets/sprites/item/[0-9]+[.]png$')"
          NPC_SPRITES="$(unzip -l "$APK" | grep -Ec 'assets/sprites/npc/[0-9]+[.]png$')"
          BUFF_SPRITES="$(unzip -l "$APK" | grep -Ec 'assets/sprites/buff/[0-9]+[.]png$')"
          echo "sprites item=$ITEM_SPRITES npc=$NPC_SPRITES buff=$BUFF_SPRITES"
          test "$ITEM_SPRITES" -ge 6100
          test "$NPC_SPRITES" -ge 697
          test "$BUFF_SPRITES" -ge 400

      - name: Deliver private APK
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BUNNY_PRIVATE_BUILD_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$PRIVATE_REPO" --jq '.private')" = "true"
          TAG="bunny-loader-stable-0.1.9.6"
          OUT="Bunny.Loader.0.1.9.6.apk"
          APK="Split/Bunny-Loader/app/build/outputs/apk/debug/app-debug.apk"
          cp "$APK" "$RUNNER_TEMP/$OUT"
          sha256sum "$RUNNER_TEMP/$OUT" > "$RUNNER_TEMP/$OUT.sha256"
          if gh release view "$TAG" --repo "$PRIVATE_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/$OUT" "$RUNNER_TEMP/$OUT.sha256" --repo "$PRIVATE_REPO" --clobber
            gh release edit "$TAG" --repo "$PRIVATE_REPO" --title "Bunny Loader 0.1.9.6"
          else
            gh release create "$TAG" "$RUNNER_TEMP/$OUT" "$RUNNER_TEMP/$OUT.sha256" \
              --repo "$PRIVATE_REPO" --target main --title "Bunny Loader 0.1.9.6" \
              --notes "Private full APK. Upstream c4a3e918 with native audio optimizations preserved." --prerelease
          fi
          rm -f "$RUNNER_TEMP/$OUT" "$RUNNER_TEMP/$OUT.sha256" "$APK"
