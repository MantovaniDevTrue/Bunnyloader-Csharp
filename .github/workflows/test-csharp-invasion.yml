name: CSharp Invasion Unit Tests (no APK)

on:
  push:
    branches:
      - feat/csharp-example-invasion-20261019
    paths:
      - experiments/csharp/BunnyCsSdk/BunnyInvasion.cs
      - tests/invasion/**
      - .github/workflows/test-csharp-invasion.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invasion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build entire Bunny CSharp SDK
        run: dotnet build experiments/csharp/BunnyCsSdk/BunnyCsSdk.csproj --configuration Release
      - name: Compile and run pure CSharp lifecycle tests
        run: dotnet run --project tests/invasion/Invasion.csproj --configuration Release
      - name: Compile ExampleInvasion source without Android toolchain
        run: dotnet build tests/invasion/SampleCompile.csproj --configuration Release
