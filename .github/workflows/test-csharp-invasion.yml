name: CSharp Invasion Unit Tests (no APK)

on:
  push:
    branches:
      - feat/csharp-example-invasion-20261019
    paths:
      - experiments/csharp/BunnyCsSdk/BunnyInvasion.cs
      - experiments/csharp/BunnyCsSdk/BunnyInvasionWire.cs
      - experiments/csharp/BunnyCsSdk/BunnyInvasionNativeNetwork.cs
      - app/src/main/cpp/experiments/csharp/NativeInvasionNetwork.cpp
      - app/src/main/cpp/experiments/csharp/NativeInvasionNetwork.h
      - experiments/csharp/BunnyCsSdk/BunnyInvasionHud.cs
      - app/src/main/cpp/experiments/csharp/NativeInvasionHud.cpp
      - app/src/main/cpp/experiments/csharp/NativeInvasionHud.h
      - experiments/csharp/BunnyCsSdk/BunnyInvasionNativeRewards.cs
      - app/src/main/cpp/experiments/csharp/NativeInvasionRewards.cpp
      - app/src/main/cpp/experiments/csharp/NativeInvasionRewards.h
      - app/src/main/cpp/experiments/csharp/NativeInvasionNotifications.cpp
      - app/src/main/cpp/experiments/csharp/NativeInvasionNotifications.h
      - experiments/csharp/BunnyCsSdk/BunnyInvasionNotifications.cs
      - experiments/csharp/BunnyCsSdk/BunnyInvasionSpawnPipeline.cs
      - experiments/csharp/BunnyCsSdk/BunnyInvasionSystem.cs
      - experiments/csharp/BunnyCsSdk/BunnyInvasionNativeTransport.cs
      - experiments/csharp/BunnyCsSdk/BunnyNativeItemUse.cs
      - experiments/csharp/BunnyCsSdk/BunnyItem.cs
      - app/src/main/cpp/experiments/csharp/NativeCSharpItemUse.cpp
      - app/src/main/cpp/experiments/csharp/NativeCSharpItemUse.h
      - samples/ExampleModCSharp/Playable/content/Content/Items/Consumables/ExampleInvasionBeacon.cs
      - experiments/csharp/BunnyCsSdk/BunnyEntitySourceDispatcher.cs
      - experiments/csharp/BunnyCsSdk/BunnySourceScriptApi.cs
      - app/src/main/cpp/experiments/csharp/ManagedRuntime.cpp
      - app/src/main/cpp/experiments/csharp/NpcAiHost.cpp
      - app/src/main/cpp/experiments/csharp/WorldAuthority.h
      - app/src/main/cpp/experiments/csharp/NativeInvasionSpawn.h
      - app/src/main/cpp/experiments/csharp/NativeInvasionSpawn.cpp
      - app/src/main/cpp/experiments/csharp/ReliableNpcKill.cpp
      - app/src/main/cpp/experiments/csharp/ReliableNpcKill.h
      - app/src/main/cpp/experiments/csharp/NpcAiHost.cpp
      - app/src/main/cpp/menu/NetRequests.cpp
      - app/src/main/cpp/experiments/csharp/NativeInvasionSpawnSite.cpp
      - app/src/main/cpp/experiments/csharp/NativeInvasionSpawnSite.h
      - app/src/main/cpp/experiments/csharp/NativeInvasionMailbox.cpp
      - app/src/main/cpp/experiments/csharp/InvasionSaveFile.h
      - app/src/main/cpp/experiments/csharp/NativeInvasionPersistence.cpp
      - app/src/main/cpp/experiments/csharp/NativeInvasionPersistence.h
      - app/src/main/cpp/experiments/csharp/NativeInvasionWorldPath.cpp
      - experiments/csharp/BunnyCsSdk/BunnyInvasionWorldPersistence.cs
      - app/src/main/cpp/experiments/csharp/NativeInvasionMailbox.h
      - app/src/main/cpp/experiments/csharp/AutoSourceRuntime.cpp
      - samples/ExampleModCSharp/Playable/content/Content/NPCs/ExampleSlimeNPC.cs
      - samples/ExampleModCSharp/Playable/content/Common/Systems/ExampleInvasion.cs
      - samples/ExampleModCSharp/Playable/content/Common/Systems/ExampleInvasionSystem.cs
      - tests/invasion/**
      - .github/workflows/test-csharp-invasion.yml
  pull_request:
    paths:
      - experiments/csharp/BunnyCsSdk/BunnyItem.cs
      - experiments/csharp/BunnyCsSdk/BunnyEntitySourceDispatcher.cs
      - experiments/csharp/BunnyCsSdk/BunnyUseContext.cs
      - samples/ExampleModCSharp/Playable/content/Content/Items/Consumables/ExampleInvasionBeacon.cs
      - app/src/main/cpp/experiments/csharp/ManagedRuntime.cpp
      - tests/invasion/**
      - .github/workflows/test-csharp-invasion.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invasion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build entire Bunny CSharp SDK
        run: dotnet build experiments/csharp/BunnyCsSdk/BunnyCsSdk.csproj --configuration Release
      - name: Compile and run pure CSharp lifecycle tests
        run: dotnet run --project tests/invasion/Invasion.csproj --configuration Release
      - name: Validate versioned invasion replication packets, late join and client revision
        run: dotnet run --project tests/invasion/net/InvasionNet.csproj --configuration Release
      - name: Verify epoch-bound native spawn pipeline
        run: dotnet run --project tests/invasion/pipeline/Pipeline.csproj --configuration Release
      - name: Compile ExampleInvasion source without Android toolchain
        run: dotnet build tests/invasion/SampleCompile.csproj --configuration Release
      - name: Test actual Bunny NPC dispatcher and ExampleInvasion integration
        run: dotnet run --project tests/invasion/DispatcherIntegration.csproj --configuration Release
      - name: Audit native NPC identity handoff and verified spawn admission
        run: python3 tests/invasion/check_native_identity_bridge.py
      - name: Verify reward drops for completed invasions using original Bunny item API
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -Iapp/src/main/cpp tests/invasion/NativeInvasionRewardsTest.cpp tests/invasion/RewardRuntimeStub.cpp app/src/main/cpp/experiments/csharp/NativeInvasionRewards.cpp -o /tmp/bunny-invasion-rewards
          /tmp/bunny-invasion-rewards
      - name: Test atomic per-world invasion sidecars and session isolation
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -Iapp/src/main/cpp tests/invasion/NativeSaveStoreTest.cpp app/src/main/cpp/experiments/csharp/NativeInvasionPersistence.cpp -o /tmp/bunny-invasion-save
          /tmp/bunny-invasion-save
      - name: Simulate CSharp-to-native-to-CSharp invasion round trip
        run: |
          mkdir -p /tmp/bunny-invasion-test
          g++ -std=c++20 -shared -fPIC -Wall -Wextra -Werror -Iapp/src/main/cpp tests/invasion/NativeMailboxStub.cpp tests/invasion/RewardRuntimeStub.cpp app/src/main/cpp/experiments/csharp/NativeInvasionMailbox.cpp app/src/main/cpp/experiments/csharp/NativeInvasionPersistence.cpp app/src/main/cpp/experiments/csharp/NativeInvasionRewards.cpp -o /tmp/bunny-invasion-test/libbunny.so
          LD_LIBRARY_PATH=/tmp/bunny-invasion-test dotnet run --project tests/invasion/TransportIntegration.csproj --configuration Release
      - name: Simulate simultaneous native invasions and isolated NPC scoring
        run: |
          LD_LIBRARY_PATH=/tmp/bunny-invasion-test dotnet run --project tests/invasion/MultiInvasionIntegration.csproj --configuration Release
      - name: Audit world-ready host and autonomous MonoVM invasion integration
        run: python3 tests/invasion/check_world_host_contract.py
      - name: Verify real Terraria NPC hook authority and kill ingress
        run: python3 tests/invasion/test_npc_hook_contract.py
      - name: Test reliable native NPC death dispatch under queue congestion
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -Iapp/src/main/cpp tests/invasion/ReliableNpcKillTest.cpp app/src/main/cpp/experiments/csharp/ReliableNpcKill.cpp -o /tmp/bunny-invasion-kills
          /tmp/bunny-invasion-kills
      - name: Verify pure native spawn policy and source contracts
        run: |
          python3 tests/invasion/native_spawn_contract.py
          g++ -std=c++17 -Wall -Wextra -Werror tests/invasion/NativeSpawnPolicyTest.cpp -o /tmp/bunny-spawn-policy
          /tmp/bunny-spawn-policy
      - name: Test bounded terrain spawn placement on real Bunny tile layout
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -Iapp/src/main/cpp tests/invasion/NativeSpawnSiteTest.cpp -o /tmp/bunny-invasion-terrain
          /tmp/bunny-invasion-terrain
      - name: Compile Terraria-native tile spawn adapter headers
        run: |
          NDK=$(find "${ANDROID_HOME}/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -n "$NDK"
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang++" -std=c++20 -Wall -Wextra -Werror -Iapp/src/main/cpp -fsyntax-only app/src/main/cpp/experiments/csharp/NativeInvasionSpawnSite.cpp app/src/main/cpp/experiments/csharp/NativeInvasionSpawn.cpp
      - name: Run game-thread native mailbox policy and world epoch tests
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -Iapp/src/main/cpp tests/invasion/NativeMailboxTest.cpp app/src/main/cpp/experiments/csharp/NativeInvasionMailbox.cpp -o /tmp/bunny-invasion-mailbox
          /tmp/bunny-invasion-mailbox
      - name: Syntax-check native invasion host against real Bunny headers
        run: g++ -std=c++20 -Wall -Wextra -Werror -Iapp/src/main/cpp -fsyntax-only app/src/main/cpp/experiments/csharp/NativeInvasionSpawn.cpp app/src/main/cpp/experiments/csharp/NativeInvasionMailbox.cpp
      - name: Syntax-check native MonoVM and Terraria update host integration
        run: |
          NDK=$(find "${ANDROID_HOME}/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -n "$NDK"
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang++" -std=c++20 -Wall -Wextra -Werror -Iapp/src/main/cpp -fsyntax-only app/src/main/cpp/experiments/csharp/ManagedRuntime.cpp app/src/main/cpp/experiments/csharp/AutoSourceRuntime.cpp app/src/main/cpp/experiments/csharp/NpcAiHost.cpp app/src/main/cpp/experiments/csharp/ReliableNpcKill.cpp app/src/main/cpp/menu/NetRequests.cpp
      - name: Audit item-only CSharp mod registration and OnUse dispatch
        run: python3 tests/invasion/check_item_only_contract.py
      - name: Test native multiplayer peer expiry without Android
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror tests/invasion/NativeInvasionPeerPolicyTest.cpp -o /tmp/bunny-invasion-peer-policy
          /tmp/bunny-invasion-peer-policy
      - name: Audit host-to-client world snapshots and late join network state
        run: python3 tests/invasion/check_replication_contract.py
      - name: Audit secure native client-to-server item invocation and dedicated host
        run: python3 tests/invasion/check_multiplayer_contract.py
      - name: Audit opt-in CSharp item-use dispatch and ExampleInvasion invoker
        run: python3 tests/invasion/check_item_use_contract.py
      - name: Syntax-check native CSharp item-use hook with Android NDK
        run: |
          NDK=$(find "${ANDROID_HOME}/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -n "$NDK"
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang++" -std=c++20 -Wall -Wextra -Werror -Iapp/src/main/cpp -fsyntax-only app/src/main/cpp/experiments/csharp/NativeCSharpItemUse.cpp
      - name: Audit native world persistence lifecycle and atomic saves
        run: python3 tests/invasion/check_world_save_contract.py
      - name: Compile Terraria UI-native invasion bar without APK
        run: |
          NDK=$(find "${ANDROID_HOME}/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -n "$NDK"
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang++" -std=c++20 -Wall -Wextra -Werror -Iapp/src/main/cpp -fsyntax-only app/src/main/cpp/experiments/csharp/NativeInvasionHud.cpp
      - name: Verify invasion host-to-client relay with Android NDK
        run: |
          NDK=$(find "${ANDROID_HOME}/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -n "$NDK"
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang++" -std=c++20 -Wall -Wextra -Werror -Iapp/src/main/cpp -fsyntax-only app/src/main/cpp/experiments/csharp/NativeInvasionNetwork.cpp
      - name: Syntax-check native world path and save bridge with Android NDK
        run: |
          NDK=$(find "${ANDROID_HOME}/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -n "$NDK"
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang++" -std=c++20 -Wall -Wextra -Werror -Iapp/src/main/cpp -fsyntax-only app/src/main/cpp/experiments/csharp/NativeInvasionPersistence.cpp app/src/main/cpp/experiments/csharp/NativeInvasionWorldPath.cpp app/src/main/cpp/experiments/csharp/NativeInvasionRewards.cpp app/src/main/cpp/experiments/csharp/NativeInvasionNotifications.cpp
      - name: Validate CSharp NPC world authority in native C++
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/invasion/WorldAuthorityTest.cpp -o /tmp/bunny-invasion-authority
          /tmp/bunny-invasion-authority
