name: CSharp Invasion Unit Tests (no APK)

on:
  push:
    branches:
      - feat/csharp-example-invasion-20261019
    paths:
      - experiments/csharp/BunnyCsSdk/BunnyInvasion.cs
      - app/src/main/cpp/experiments/csharp/NpcAiHost.cpp
      - app/src/main/cpp/experiments/csharp/WorldAuthority.h
      - app/src/main/cpp/experiments/csharp/NativeInvasionSpawn.h
      - app/src/main/cpp/experiments/csharp/NativeInvasionSpawn.cpp
      - samples/ExampleModCSharp/Playable/content/Content/NPCs/ExampleSlimeNPC.cs
      - samples/ExampleModCSharp/Playable/content/Content/Systems/ExampleInvasion.cs
      - tests/invasion/**
      - .github/workflows/test-csharp-invasion.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invasion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build entire Bunny CSharp SDK
        run: dotnet build experiments/csharp/BunnyCsSdk/BunnyCsSdk.csproj --configuration Release
      - name: Compile and run pure CSharp lifecycle tests
        run: dotnet run --project tests/invasion/Invasion.csproj --configuration Release
      - name: Compile ExampleInvasion source without Android toolchain
        run: dotnet build tests/invasion/SampleCompile.csproj --configuration Release
      - name: Test actual Bunny NPC dispatcher and ExampleInvasion integration
        run: dotnet run --project tests/invasion/DispatcherIntegration.csproj --configuration Release
      - name: Verify real Terraria NPC hook authority and kill ingress
        run: python3 tests/invasion/test_npc_hook_contract.py
      - name: Verify pure native spawn policy and source contracts
        run: |
          python3 tests/invasion/native_spawn_contract.py
          g++ -std=c++17 -Wall -Wextra -Werror tests/invasion/NativeSpawnPolicyTest.cpp -o /tmp/bunny-spawn-policy
          /tmp/bunny-spawn-policy
      - name: Syntax-check native invasion host against real Bunny headers
        run: g++ -std=c++20 -Wall -Wextra -Werror -Iapp/src/main/cpp -fsyntax-only app/src/main/cpp/experiments/csharp/NativeInvasionSpawn.cpp
      - name: Validate CSharp NPC world authority in native C++
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/invasion/WorldAuthorityTest.cpp -o /tmp/bunny-invasion-authority
          /tmp/bunny-invasion-authority
