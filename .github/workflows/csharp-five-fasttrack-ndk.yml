name: CSharp Command Gore ARM64 syntax (no APK)

on:
  push:
    branches:
      - integration/csharp-five-loader-fasttrack-20261022
    paths:
      - 'app/src/main/cpp/experiments/csharp/AutoSourceRuntime.cpp'
      - 'app/src/main/cpp/experiments/csharp/ManagedRuntime.cpp'
      - 'app/src/main/cpp/experiments/csharp/SourceLoader.cpp'
      - 'app/src/main/cpp/experiments/csharp/SourceLoader.h'
      - 'app/src/main/cpp/experiments/csharp/SourceParser.cpp'
      - 'app/src/main/cpp/experiments/csharp/ManagedGoreRuntime.cpp'
      - 'app/src/main/cpp/experiments/csharp/ManagedGoreDiscovery.cpp'
      - 'app/src/main/cpp/experiments/csharp/NativeCommandChatHooks.cpp'
      - '.github/workflows/csharp-five-fasttrack-ndk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-cpp-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Select Android ARM64 NDK compiler
        shell: bash
        run: |
          set -euo pipefail
          NDK_HOME="${ANDROID_HOME}/ndk"
          if [ ! -d "$NDK_HOME" ] || [ -z "$(find "$NDK_HOME" -mindepth 1 -maxdepth 1 -type d -print -quit)" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018"
          fi
          find "$NDK_HOME" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1 > "$RUNNER_TEMP/bunny-ndk-path"
      - name: Verify all shared Command Gore native sources for Android ARM64
        shell: bash
        run: |
          set -euo pipefail
          NDK="$(cat "$RUNNER_TEMP/bunny-ndk-path")"
          CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang++"
          test -x "$CXX"
          for file in SourceParser SourceLoader AutoSourceRuntime ManagedRuntime NativeCommandChatHooks ManagedGoreDiscovery ManagedGoreRuntime; do
            echo "::group::ARM64 $file"
            "$CXX" -std=c++20 -fsyntax-only -fexceptions -frtti \
              -D__ANDROID__ -DANDROID -D_GNU_SOURCE \
              -Iapp/src/main/cpp -Iapp/src/main/cpp/third_party/quickjs \
              "app/src/main/cpp/experiments/csharp/$file.cpp"
            echo "::endgroup::"
          done
          test ! -d app/build/outputs/apk
          echo "BUNNY_CSHARP_COMMAND_GORE_ANDROID_SYNTAX=PASS APK=NO"
