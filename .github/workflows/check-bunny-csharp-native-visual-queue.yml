name: Check Bunny CSharp Native Visual Queue

on:
  push:
    branches:
      - feat/csharp-native-recipe-groups-v89
      - feat/csharp-loader-foundation-v91
      - feat/csharp-owned-recipe-loader-v92
      - feat/csharp-94-owned-summon-damage-lot
      - feat/csharp-owned-loaders-v93
      - feat/csharp-summon-lifecycle-v95
      - feat/csharp-buff-recipes-v90
      - fix/csharp-90-2-recipegroup-real-instance-abi
      - fix/csharp-90-3-recipegroup-return-contract
      - fix/csharp-88-8-lights-review
      - codex/lot-a-complete-v90-29
      - codex/example-completion-v90-28
      - codex/native-equips-fix-v90-27-6
      - csharp-visual-effects-v90-27-wip
      - codex/csharp-lights-fidelity-v90-29-88
      - codex/csharp-lights-night-hotfix
      - codex/csharp-lights-sdk-settings-split
  pull_request:
    paths:
      - 'Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/**'
      - 'Split/Bunny-Loader/app/src/main/cpp/script/js/mod/Loaders/PlayerDrawHooks.js'
      - 'Split/Bunny-Loader/app/src/main/cpp/script/js/mod/Loaders/EquipLoader.js'
      - 'Split/Bunny-Loader/tests/**'
      - '.github/workflows/check-bunny-csharp-native-visual-queue.yml'
  workflow_dispatch:

jobs:
  native-visual-queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile native queue test
        run: g++ -std=c++17 -fno-exceptions -Wall -Wextra -Werror -pthread -I Split/Bunny-Loader/app/src/main/cpp Split/Bunny-Loader/tests/managed_visual_queue_test.cpp -o /tmp/managed_visual_queue_test
      - name: Run native queue test
        run: /tmp/managed_visual_queue_test
      - name: Compile native ingress test
        run: g++ -std=c++17 -fno-exceptions -Wall -Wextra -Werror -pthread -I Split/Bunny-Loader/app/src/main/cpp Split/Bunny-Loader/tests/managed_visual_ingress_test.cpp -o /tmp/managed_visual_ingress_test
      - name: Run native ingress test
        run: /tmp/managed_visual_ingress_test
      - name: Compile native drain test
        run: g++ -std=c++17 -fno-exceptions -Wall -Wextra -Werror -pthread -I Split/Bunny-Loader/app/src/main/cpp Split/Bunny-Loader/tests/managed_visual_drain_test.cpp -o /tmp/managed_visual_drain_test
      - name: Run native drain test
        run: /tmp/managed_visual_drain_test
      - name: Compile Mono pump mock test
        run: g++ -std=c++17 -fno-exceptions -Wall -Wextra -Werror -pthread -I Split/Bunny-Loader/app/src/main/cpp Split/Bunny-Loader/tests/managed_visual_mono_pump_test.cpp -o /tmp/managed_visual_mono_pump_test
      - name: Run Mono pump mock test
        run: /tmp/managed_visual_mono_pump_test
      - name: Compile visual state test
        run: g++ -std=c++17 -fno-exceptions -Wall -Wextra -Werror -pthread -I Split/Bunny-Loader/app/src/main/cpp Split/Bunny-Loader/tests/managed_visual_state_test.cpp -o /tmp/managed_visual_state_test
      - name: Run visual state test
        run: /tmp/managed_visual_state_test
      - name: Parse actual ExampleModCSharp accessory visual defaults
        run: |
          g++ -std=c++20 -fno-exceptions -Wall -Wextra -Werror -I Split/Bunny-Loader/app/src/main/cpp \
            Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/SourceParser.cpp \
            Split/Bunny-Loader/tests/csharp_visual_source_parser_test.cpp \
            -o /tmp/csharp_visual_source_parser_test
          /tmp/csharp_visual_source_parser_test \
            Split/Bunny-Loader/samples/ExampleModCSharp/Playable/content/Content/Items/Accessories/ExampleGuardianShieldAccessory.cs \
            Split/Bunny-Loader/samples/ExampleModCSharp/Playable/content/Content/Items/Accessories/ExampleTrailblazerBootsAccessory.cs \
            Split/Bunny-Loader/samples/ExampleModCSharp/Playable/content/Content/Items/Accessories/ExampleMysticWardAccessory.cs


