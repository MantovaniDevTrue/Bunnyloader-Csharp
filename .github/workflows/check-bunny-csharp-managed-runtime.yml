name: Check Bunny CSharp Managed Runtime Bridge

on:
  push:
    branches:
      - bunny-csharp-source-0.1.10.12-managed-runtime
      - bunny-csharp-source-0.1.10.12.1-staged-probe
      - bunny-csharp-source-0.1.10.12.2-crash-checkpoint
      - bunny-csharp-source-0.1.10.12.3-isolated-mono
      - bunny-csharp-source-0.1.10.12.4-runtime-dependencies
      - bunny-csharp-source-0.1.10.14-callback-probe
      - bunny-csharp-source-0.1.10.15-live-projectile-ai
      - bunny-csharp-source-0.1.10.15.1-status-diagnostics
      - bunny-csharp-source-0.1.10.15.2-source-uid-lookup
      - bunny-csharp-source-0.1.10.16-roslyn-worker
      - bunny-csharp-source-0.1.10.16.1-roslyn-checkpoints
    paths:
      - "Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/ManagedRuntime.*"
      - "Split/Bunny-Loader/app/src/main/cpp/experiments/csharp/ManagedProjectileHook.*"
      - "Split/Bunny-Loader/samples/SourceCSharpMod/manifest.json"
      - "Split/Bunny-Loader/samples/SourceCSharpMod/content/main.cs"
      - "Split/Bunny-Loader/tests/managed_*"
      - "Split/Bunny-Loader/experiments/csharp/BunnyManagedProbe/**"
      - ".github/workflows/check-bunny-csharp-managed-runtime.yml"
  workflow_dispatch:

jobs:
  managed-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Compile real managed probe assembly
        run: |
          dotnet build Split/Bunny-Loader/experiments/csharp/BunnyManagedProbe/BunnyManagedProbe.csproj -c Release --nologo
          test -s Split/Bunny-Loader/experiments/csharp/BunnyManagedProbe/bin/Release/net8.0/BunnyManagedProbe.dll
      - name: Compile mock embedding API and native bridge
        run: |
          set -euo pipefail
          ROOT=Split/Bunny-Loader
          CPP="$ROOT/app/src/main/cpp"
          mkdir -p "$RUNNER_TEMP/mono-mock"
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -shared -fPIC \
            "$ROOT/tests/managed_mono_mock.cpp" -o "$RUNNER_TEMP/mono-mock/libmonosgen-2.0.so"
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -I"$CPP" \
            "$CPP/experiments/csharp/ManagedRuntime.cpp" \
            "$ROOT/tests/managed_runtime_smoke.cpp" \
            -ldl -pthread -o "$RUNNER_TEMP/mono-mock/managed_runtime_smoke"
          LD_LIBRARY_PATH="$RUNNER_TEMP/mono-mock" \
            "$RUNNER_TEMP/mono-mock/managed_runtime_smoke" \
            "$ROOT/experiments/csharp/BunnyManagedProbe/bin/Release/net8.0/BunnyManagedProbe.dll"
          PROBE="$ROOT/experiments/csharp/BunnyManagedProbe/bin/Release/net8.0/BunnyManagedProbe.dll"
          set +e
          env LD_LIBRARY_PATH="$RUNNER_TEMP/mono-mock" BUNNY_MONO_SIMULATE_ABORT=1 \
            "$RUNNER_TEMP/mono-mock/managed_runtime_smoke" "$PROBE"
          EXIT_CODE=$?
          set -e
          test "$EXIT_CODE" -eq 86
          grep -q "^phase=initializing-domain$" "$PROBE.checkpoint"
          grep -q "^methodExecuted=0$" "$PROBE.checkpoint"
          rm -f "$PROBE.checkpoint"
          echo "BUNNY_MONO_PERSISTENT_CRASH_CHECKPOINT_PASS=YES"
      - name: Check SourceBolt registration identity
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("Split/Bunny-Loader")
          manifest = json.loads((root / "samples/SourceCSharpMod/manifest.json").read_text())
          source = (root / "samples/SourceCSharpMod/content/main.cs").read_text()
          loader = (root / "app/src/main/cpp/experiments/csharp/SourceLoader.cpp").read_text()
          native = (root / "app/src/main/cpp/experiments/csharp/NativeContent.cpp").read_text()
          hook = (root / "app/src/main/cpp/experiments/csharp/ManagedProjectileHook.cpp").read_text()
          assert 'class SourceBolt : BunnyProjectile' in source
          assert 'NativeRegisterContext ctx{mod.id, mod.dir' in loader
          assert 'def.mod = ctx.modId;' in native
          assert manifest["uid"] in hook
          assert 'modProjectileTypeByName(source.id, "SourceBolt")' in hook
          assert 'modProjectileTypeByName("sourcecsharp"' not in hook
          print("SOURCE_BOLT_UUID_REGISTRATION_MATCH=YES")
          PY
      - name: Mark test scope
        run: |
          echo "CI mock verifies Mono symbol binding and native dispatch, NOT a real Android MonoVM run."
